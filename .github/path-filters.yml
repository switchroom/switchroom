# Shared dorny/paths-filter definitions (external filters file).
#
# Consumed via `filters: .github/path-filters.yml` by:
#   - ci-lint.yml          → key `lint`
#   - ci-tests-core.yml    → key `core`
#   - ci-tests-plugin.yml  → key `plugin`
#   - docker-images.yml    → keys `images`, `hindsight`, `voice`
#
# Why this file exists: the sec WS9-F1 (#1402) security-load-bearing
# path list was copy-pasted across ci-lint / ci-tests-core /
# ci-tests-plugin and had already started to be a drift hazard — a
# path added to one workflow's copy but not the others silently
# re-opens the skip→pass hole WS9-F1 closed. YAML anchors in a single
# shared file keep the list defined once. dorny/paths-filter flattens
# nested arrays, so `- *ws9f1-security` inside a filter list works.
#
# WS9-F1 rationale (see ci-tests-core.yml pre-#-this-PR history):
# profiles/ renders every agent's start.sh + the WS8 tool-safety
# hooks; bin/*-hook.sh + skills/ are baked into the agent image;
# docker/ + workflows are the supply-chain root. Without these a
# profiles/bin/skills/docker/.github-only PR skipped→passed required
# gates with no tests.

ws9f1-security: &ws9f1-security
  - 'profiles/**'
  - 'bin/**'
  - 'skills/**'
  - 'docker/**'
  - '.github/workflows/**'
  # This file gates what runs — a change to it must itself run everything.
  - '.github/path-filters.yml'

lint:
  - '**/*.ts'
  - '**/*.tsx'
  - 'tsconfig.json'
  - 'package.json'
  - 'bun.lock'
  - 'telegram-plugin/package.json'
  - 'telegram-plugin/bun.lock'
  - 'scripts/check-*.mjs'
  - 'scripts/check-bot-api-wrapping.sh'
  # Guard allowlists (check-status-pin-single-path, test-runner-coverage, the
  # hermeticity checks). An allowlist edit is a deliberate loosening of a
  # guard's scope and must re-run that guard, not skip it.
  - 'scripts/check-*-allowlist.txt'
  # The release asset-name contract (#3633): install.sh and the parser +
  # verifier behind check-release-asset-names.mjs. install.sh matched NOTHING
  # here before, so a PR that only edited the installer skipped the very guard
  # that exists to stop it drifting from release.yml.
  - 'install.sh'
  - 'scripts/release-assets.mjs'
  - 'scripts/verify-release-bundle.mjs'
  # The GENERATED secret-pattern table read by the Python write-path redactor.
  # It is produced from telegram-plugin/secret-detect/patterns.ts and byte-
  # compared by check-secret-pattern-parity. A hand-edit here is exactly the
  # fork that guard exists to catch, and it matches no other lint path — so
  # without this line the one PR shape that can silently desync the two
  # redactors is the one that skips the check.
  - 'vendor/hindsight-memory/scripts/lib/secret_patterns.json'
  # Shared TS/Python behaviour vectors: both suites assert the same file.
  - 'vendor/hindsight-memory/scripts/lib/secret_redaction_vectors.json'
  # The pinned-dependency manifest. check-claude-cli-lockstep.mjs asserts its
  # `.claude.cli` equals the CLAUDE_CODE_VERSION pin in BOTH Dockerfiles, and
  # dependencies.json matched nothing else in this filter — so the one PR
  # shape that can silently skew it alone (the phantom fleet-wide CLI-drift
  # shape) is the one that would skip ci-lint and thus skip the only guard
  # that catches it. Same skip→pass hole the install.sh block above closes.
  - 'dependencies.json'
  - '.github/actions/setup-switchroom/**'
  - '.github/workflows/ci-lint.yml'
  - *ws9f1-security

core:
  - 'src/**'
  - 'tests/**'
  - 'telegram-plugin/**/*.ts'
  - 'scripts/build.mjs'
  # tests/release-asset-contract.test.ts drives the real install.sh + the
  # release-bundle verifier — changing either must re-run it. It also SPAWNS
  # check-release-asset-names.mjs and asserts its failure text on every drift
  # case, so that script belongs here too: `scripts/check-*.mjs` is in the
  # `lint` filter ONLY, which would let a PR touching just that script skip
  # the tests covering it — the same skip→pass hole this block closes for
  # install.sh.
  - 'install.sh'
  - 'scripts/release-assets.mjs'
  - 'scripts/verify-release-bundle.mjs'
  - 'scripts/check-release-asset-names.mjs'
  # Agent attribution: tests/agent-attribution-check.test.ts and
  # tests/agent-pr-label.test.ts SPAWN these two scripts and assert their exit
  # codes and failure text. Same reason as check-release-asset-names.mjs above —
  # `scripts/check-*.mjs` is in the `lint` filter only, and agent-pr-label.mjs
  # matches no existing entry at all, so without these a PR editing just one of
  # them would skip the only tests that cover it. (The hook script and the
  # profile/docker templates the tests also read are already covered by the
  # ws9f1-security anchor.)
  - 'scripts/check-agent-attribution-trailers.mjs'
  - 'scripts/agent-pr-label.mjs'
  # tests/changelog-entry-check.test.ts SPAWNS check-changelog-entry.mjs and
  # asserts its exit codes + failure text. Same reason as the two scripts
  # above — `scripts/check-*.mjs` is in the `lint` filter only, so without
  # this a PR editing just this script would skip the tests covering it.
  - 'scripts/check-changelog-entry.mjs'
  - 'vitest.config.ts'
  - 'tsconfig.json'
  - 'package.json'
  - 'bun.lock'
  - 'telegram-plugin/package.json'
  - 'telegram-plugin/bun.lock'
  - '.github/actions/setup-switchroom/**'
  - '.github/workflows/ci-tests-core.yml'
  - *ws9f1-security

plugin:
  - 'telegram-plugin/**'
  - 'package.json'
  - 'bun.lock'
  - 'telegram-plugin/package.json'
  - 'telegram-plugin/bun.lock'
  - '.github/actions/setup-switchroom/**'
  - '.github/workflows/ci-tests-plugin.yml'
  - *ws9f1-security

# docker-images.yml PR gate. Mirrors docker-e2e.yml's image-input list
# (the src/** subtrees whose bundles are baked into images) plus the
# image build inputs themselves. Keep in sync with docker-e2e.yml's
# cache key + filter when image inputs change.
images:
  - 'docker/**'
  - 'src/vault/**'
  - 'src/cli/apply.ts'
  - 'src/agents/compose.ts'
  - 'src/agent-scheduler/**'
  - 'src/auth/broker/**'
  - 'src/host-control/**'
  - 'telegram-plugin/**'
  - 'bin/**'
  - 'profiles/**'
  - 'vendor/hindsight-memory/**'
  - 'package.json'
  - 'bun.lock'
  - 'scripts/build.mjs'
  - '.github/workflows/docker-images.yml'
  - '.github/path-filters.yml'

# hindsight extends upstream vectorize-io/hindsight (not switchroom-base)
# and rarely changes — path-gated even on main pushes.
hindsight:
  - 'docker/Dockerfile.hindsight'
  - 'docker/hindsight-*'
  - 'vendor/hindsight-memory/**'
  - '.github/workflows/docker-images.yml'
  - '.github/path-filters.yml'

# voice FROMs nvidia/cuda (not switchroom-base), bakes no dist — the
# CUDA layers make it the heaviest build, and it almost never changes.
# Path-gated even on main pushes.
voice:
  - 'docker/Dockerfile.voice'
  - 'docker/voice-sidecar/**'
  - '.github/workflows/docker-images.yml'
  - '.github/path-filters.yml'
