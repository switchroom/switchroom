name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Always full validation, without publication.
  schedule:
    # Nightly full regression on main HEAD: the backstop for scoped PR plans and for pushes
    # that reuse an identical-tree PR run, and the only full-matrix run on most days.
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Push only: find the merged PR and its CI run to reuse an identical, proven tree.
      pull-requests: read
      actions: read
    outputs:
      reused: ${{ steps.select.outputs.reused }}
      plan: ${{ steps.select.outputs.plan }}
      runtime: ${{ steps.select.outputs.runtime }}
      linear: ${{ steps.select.outputs.linear }}
      acp: ${{ steps.select.outputs.acp }}
      origin: ${{ steps.select.outputs.origin }}
      input: ${{ steps.select.outputs.input }}
      journey: ${{ steps.select.outputs.journey }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        # Pass event data as quoted arguments, never interpolate it into shell source.
        # On push, a green PR run of the identical tree (current with main, source-checks green)
        # is reused instead of re-testing it; any doubt runs the normal selection.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # Only a push looks anything up; other events never see a token here.
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          python3 scripts/source-ci.py select --event "$GITHUB_EVENT_NAME" \
            --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT" \
            --reuse-repository "$GITHUB_REPOSITORY"

  source-checks:
    needs: [selection, source-tests, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce selected work
        env:
          PLAN: ${{ needs.selection.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/source-ci.py gate --plan "$PLAN" --needs "$RESULTS"

  source-tests:
    needs: selection
    if: needs.selection.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Unit tests
        env:
          PLAN: ${{ needs.selection.outputs.plan }}
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/source-tests"
          "$RUNNER_TEMP/source-tests/bin/python" -m pip install --require-hashes -r release/spdx-validation-requirements.txt
          . "$RUNNER_TEMP/source-tests/bin/activate"
          python3 scripts/source-ci.py units --plan "$PLAN"
      - name: Compose syntax
        env:
          HERMES_FLEET_IMAGE: ghcr.io/example/hermes-fleet@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: python3 scripts/compose.py config -q
      - name: Immutable reference guards
        run: |
          python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --tag hermes-fleet:test \
            --dry-run
          ! python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent:latest \
            --tag hermes-fleet:test \
            --dry-run
      - name: Public tree policy
        run: python3 scripts/verify-public-tree.py

  runtime:
    # One leg per independent real-Agent proof, so the slowest proof (not their sum) sets wall
    # clock. Input, kanban and origin proofs are split into disjoint round-robin test slices whose
    # union is the whole suite. Legs are listed longest first so they start first when runners
    # are contended. The aggregate sees a single `runtime` result: success only if every leg
    # succeeds. fail-fast is off so one run reports every failing proof.
    needs: selection
    if: needs.selection.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: input, shard: 1/3}
          - {lane: input, shard: 2/3}
          - {lane: input, shard: 3/3}
          - {lane: kanban, shard: 1/3}
          - {lane: kanban, shard: 2/3}
          - {lane: kanban, shard: 3/3}
          - {lane: origin, shard: 1/3}
          - {lane: origin, shard: 2/3}
          - {lane: origin, shard: 3/3}
          - {lane: native, shard: ''}
    name: runtime (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    steps:
      - name: Select this leg's proofs
        id: leg
        env:
          LANE: ${{ matrix.lane }}
          LINEAR: ${{ needs.selection.outputs.linear }}
          ACP: ${{ needs.selection.outputs.acp }}
          ORIGIN: ${{ needs.selection.outputs.origin }}
          INPUT: ${{ needs.selection.outputs.input }}
          JOURNEY: ${{ needs.selection.outputs.journey }}
        run: |
          case "$LANE" in
            kanban) selected="$LINEAR" ;;
            origin) selected="$ORIGIN" ;;
            input) selected="$INPUT" ;;
            native) [[ "$ACP" == true || "$JOURNEY" == true ]] && selected=true || selected=false ;;
            *) echo "unknown runtime lane: $LANE" >&2; exit 1 ;;
          esac
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "runtime leg $LANE selected=$selected"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.leg.outputs.selected == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read pinned Agent revision
        if: steps.leg.outputs.selected == 'true'
        id: agent
        run: |
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.leg.outputs.selected == 'true'
        with:
          repository: switchroom/hermes-agent
          ref: ${{ steps.agent.outputs.AGENT_REVISION }}
          path: agent-source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.leg.outputs.selected == 'true'
        with:
          python-version: '3.14.7'
      - name: Prepare real Agent test environment
        if: steps.leg.outputs.selected == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/linear-scenarios"
          "$RUNNER_TEMP/linear-scenarios/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r release/linear-scenario-requirements.txt
      - name: Real Agent Kanban scenarios
        if: matrix.lane == 'kanban' && needs.selection.outputs.linear == 'true'
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/agent-source
          LINEAR_QUARANTINE_RETRIES: ${{ runner.temp }}/quarantine-retries.jsonl
          SHARD: ${{ matrix.shard }}
        run: |
          "$RUNNER_TEMP/linear-scenarios/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$HERMES_AGENT_SRC" --shard "$SHARD"
      - name: Real Agent Claude ACP context resolution
        if: matrix.lane == 'native' && needs.selection.outputs.acp == 'true'
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/agent-source
          LINEAR_QUARANTINE_RETRIES: ${{ runner.temp }}/quarantine-retries.jsonl
        run: |
          "$RUNNER_TEMP/linear-scenarios/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$HERMES_AGENT_SRC" --pattern test_claude_acp_context.py
      - name: Real native worker journeys
        if: matrix.lane == 'native' && needs.selection.outputs.journey == 'true'
        env:
          LINEAR_QUARANTINE_RETRIES: ${{ runner.temp }}/quarantine-retries.jsonl
        run: |
          (cd agent-source && python -m pm.build_env --source . \
            --out "$RUNNER_TEMP/journey-env" --group dev --group test --extra all --ci)
          "$RUNNER_TEMP/journey-env/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-source" --pattern test_linear_native_work_journey.py
          "$RUNNER_TEMP/journey-env/bin/python" scripts/run-linear-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-source" --pattern test_linear_worker_questions.py
      - name: Guarded native origin evidence
        if: matrix.lane == 'origin' && needs.selection.outputs.origin == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -I -S scripts/check-linear-origin-guard.py
          "$RUNNER_TEMP/linear-scenarios/bin/python" -I scripts/run-linear-origin-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-source" --shard "$SHARD"
      - name: Guarded native input against release Core
        if: matrix.lane == 'input' && needs.selection.outputs.input == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          "$RUNNER_TEMP/linear-scenarios/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r tests/native-input-requirements.txt
          "$RUNNER_TEMP/linear-scenarios/bin/python" -I scripts/run-linear-input-scenarios.py \
            --agent-source "$GITHUB_WORKSPACE/agent-source" --shard "$SHARD"
      - name: Keep retried quarantine ids
        if: always() && steps.leg.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quarantine-retries-${{ matrix.lane }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/quarantine-retries.jsonl
          if-no-files-found: ignore
          retention-days: 30

  history-root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract
          # uses `git rev-list --max-parents=0`, which a shallow clone would misreport.
          fetch-depth: 0
      - name: Clean-history root
        run: python3 -m unittest tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract -v
