name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Always full validation, without publication.
  schedule:
    # Nightly full regression on main HEAD: the backstop for scoped PR plans and for pushes
    # that reuse an identical-tree PR run, and the only full-matrix run on most days.
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Push: find the merged PR and its CI run to reuse an identical, proven tree. Pin-only PR:
      # find the Agent repository's fleet-integration run of the pinned revision.
      pull-requests: read
      actions: read
      checks: read
    outputs:
      reused: ${{ steps.select.outputs.reused }}
      plan: ${{ steps.select.outputs.plan }}
      runtime: ${{ steps.select.outputs.runtime }}
      linear: ${{ steps.select.outputs.linear }}
      acp: ${{ steps.select.outputs.acp }}
      origin: ${{ steps.select.outputs.origin }}
      input: ${{ steps.select.outputs.input }}
      journey: ${{ steps.select.outputs.journey }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        # Pass event data as quoted arguments, never interpolate it into shell source.
        # On push, a green PR run of the identical tree (current with main, source-checks green)
        # is reused instead of re-testing it; any doubt runs the normal selection.
        # A pin-only PR (the Agent manifest and plugin UPSTREAM.json records, nothing else) reuses
        # the Agent repository's green fleet-integration push run of the pinned revision for the
        # real-Agent legs when it ran this same switchroom tree; units still run. Any doubt runs all.
        # To reuse that PR on push, recheck its exact Agent run and attempt alongside the PR proof.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED: ${{ github.sha }}
          # Only a push or pull_request looks anything up (read-only); other events see no token.
          GH_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.token || '' }}
        run: |
          python3 scripts/source-ci.py select --event "$GITHUB_EVENT_NAME" \
            --base "$BASE" --head "$HEAD" --tested "$TESTED" --github-output "$GITHUB_OUTPUT" \
            --reuse-repository "$GITHUB_REPOSITORY"

  source-checks:
    needs: [selection, source-tests, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # The PR proof verifies both parents of the checked-out merge result.
          fetch-depth: 2
      - name: Enforce selected work
        env:
          PLAN: ${{ needs.selection.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/source-ci.py gate --plan "$PLAN" --needs "$RESULTS" --record-pr-proof

  source-tests:
    needs: selection
    if: needs.selection.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Unit tests
        env:
          PLAN: ${{ needs.selection.outputs.plan }}
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/source-tests"
          "$RUNNER_TEMP/source-tests/bin/python" -m pip install --require-hashes -r release/spdx-validation-requirements.txt
          . "$RUNNER_TEMP/source-tests/bin/activate"
          python3 scripts/source-ci.py units --plan "$PLAN"
      - name: Compose syntax
        env:
          HERMES_FLEET_IMAGE: ghcr.io/example/hermes-fleet@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: python3 scripts/compose.py config -q
      - name: Immutable reference guards
        run: |
          python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --tag hermes-fleet:test \
            --dry-run
          ! python3 scripts/build-fleet-image.py \
            --agent-image ghcr.io/example/hermes-agent:latest \
            --tag hermes-fleet:test \
            --dry-run
      - name: Public tree policy
        run: python3 scripts/verify-public-tree.py

  runtime:
    # One leg per independent real-Agent proof, so the slowest proof (not their sum) sets wall
    # clock. Input, kanban and origin proofs are split into disjoint round-robin test slices whose
    # union is the whole suite. Legs are listed longest first so they start first when runners
    # are contended. The aggregate sees a single `runtime` result: success only if every leg
    # succeeds. fail-fast is off so one run reports every failing proof.
    needs: selection
    if: needs.selection.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: input, shard: 1/3}
          - {lane: input, shard: 2/3}
          - {lane: input, shard: 3/3}
          - {lane: kanban, shard: 1/3}
          - {lane: kanban, shard: 2/3}
          - {lane: kanban, shard: 3/3}
          - {lane: origin, shard: 1/3}
          - {lane: origin, shard: 2/3}
          - {lane: origin, shard: 3/3}
          - {lane: native, shard: ''}
    name: runtime (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    steps:
      - name: Select this leg's proofs
        id: leg
        env:
          LANE: ${{ matrix.lane }}
          LINEAR: ${{ needs.selection.outputs.linear == 'true' }}
          ACP: ${{ needs.selection.outputs.acp == 'true' }}
          ORIGIN: ${{ needs.selection.outputs.origin == 'true' }}
          INPUT: ${{ needs.selection.outputs.input == 'true' }}
          JOURNEY: ${{ needs.selection.outputs.journey == 'true' }}
        run: |
          proofs=()
          case "$LANE" in
            kanban) [[ "$LINEAR" == true ]] && proofs+=(linear) ;;
            origin) [[ "$ORIGIN" == true ]] && proofs+=(origin) ;;
            input) [[ "$INPUT" == true ]] && proofs+=(input) ;;
            native)
              [[ "$ACP" == true ]] && proofs+=(acp)
              [[ "$JOURNEY" == true ]] && proofs+=(journey) ;;
            *) echo "unknown runtime lane: $LANE" >&2; exit 1 ;;
          esac
          (( ${#proofs[@]} )) && selected=true || selected=false
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "proofs=${proofs[*]}" >> "$GITHUB_OUTPUT"
          echo "runtime leg $LANE selected=$selected proofs=${proofs[*]}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.leg.outputs.selected == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read pinned Agent revision
        if: steps.leg.outputs.selected == 'true'
        id: agent
        run: |
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: steps.leg.outputs.selected == 'true'
        with:
          repository: switchroom/hermes-agent
          ref: ${{ steps.agent.outputs.AGENT_REVISION }}
          path: agent-source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.leg.outputs.selected == 'true'
        with:
          python-version: '3.14.7'
      # The same script runs these legs in the Agent repository's fleet-integration workflow.
      - name: Real-Agent proofs (${{ steps.leg.outputs.proofs }})
        if: steps.leg.outputs.selected == 'true'
        env:
          LANE: ${{ matrix.lane }}
          LINEAR_QUARANTINE_RETRIES: ${{ runner.temp }}/quarantine-retries.jsonl
          SHARD: ${{ matrix.shard }}
          PROOFS: ${{ steps.leg.outputs.proofs }}
        run: |
          # shellcheck disable=SC2086 # PROOFS is a space-separated list of fixed proof names.
          scripts/run-runtime-leg.sh "$LANE" "$SHARD" "$GITHUB_WORKSPACE/agent-source" $PROOFS
      - name: Keep retried quarantine ids
        if: always() && steps.leg.outputs.selected == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quarantine-retries-${{ matrix.lane }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quarantine-retries.jsonl
          if-no-files-found: ignore
          retention-days: 30

  history-root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract
          # uses `git rev-list --max-parents=0`, which a shallow clone would misreport.
          fetch-depth: 0
      - name: Clean-history root
        run: python3 -m unittest tests.test_public_product.PublicProductTests.test_repository_has_no_remote_and_clean_history_contract -v
