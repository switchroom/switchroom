name: docker-images

# Multi-arch build + push for switchroom's container images.
#
# Triggers:
#   - push to main: build all images for linux/amd64 + linux/arm64,
#     push as `:latest` and `:sha-<short>` to
#     ghcr.io/<owner>/switchroom-<image>.
#   - tag push v*: same matrix, push as `:<tag>` ONLY. `:latest` is NOT
#     moved here — release.yml's `images-latest` job promotes
#     `:vX.Y.Z` → `:latest` (via promote.yml) after every release leg is
#     green. See #3685 and the tag-branch comment in merge-base.
#   - pull_request: build only (no push) to validate Dockerfile changes.
#
# Pipelines (perf rework, follows #2807):
#   - build-dist runs `npm run build` ONCE and uploads BOTH build-output
#     trees — `dist/` and `telegram-plugin/dist/` — as the `dist-built`
#     artifact; the dependent image legs download it instead of each
#     rebuilding them (an Actions-minutes saving — legs run in parallel
#     so wall-clock is ~neutral). build-base does NOT consume dist/
#     (Dockerfile.base COPYs nothing from the context), so it builds no
#     dist.
#   - build-base + build-dependents run as a PER-ARCH matrix on NATIVE
#     runners (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) — no
#     QEMU emulation. On PR / merge_group, build-dependents builds FROM
#     the published switchroom-base:latest and does NOT wait on build-base
#     (no data dependency — takes build-base off the PR critical path);
#     the push/tag/dispatch build-dependents-push leg keeps the base
#     dependency because it consumes the freshly-built scratch base tag.
#     Each arch leg pushes a temporary
#     `:sha-<short>-<arch>` tag; the merge-base / merge-dependents jobs
#     then stitch the two arch images into the final multi-arch
#     manifest (`:latest` / `:sha-<short>` / `:vX.Y.Z`) with
#     `docker buildx imagetools create` — a manifest-only operation, no
#     rebuild, no re-export. Registry build caches are per-arch
#     (`:buildcache-<arch>`) so the two legs don't thrash each other.
#   - build-hindsight: extends upstream `vectorize-io/hindsight:latest`,
#     no switchroom-base dependency. Runs in parallel with build-base.
#     Split per-arch on NATIVE runners (amd64 on ubuntu-latest, arm64 on
#     ubuntu-24.04-arm) exactly like base/dependents — no QEMU emulation
#     for the arm64 leg — with merge-hindsight stitching the two per-arch
#     images into the final multi-arch manifest (:latest / :sha-<short> /
#     :vX.Y.Z). Per-arch registry caches (`:buildcache-<arch>`).
#   - build-voice: standalone CUDA image, amd64-only by design (see job
#     comment) — no QEMU, no split.
#
# SBOM/provenance policy (WS9-F3, relaxed — operator-approved): full
# `provenance: mode=max` + `sbom: true` attestation now runs on TAG
# pushes (release artifacts) only. PR / main-push / dispatch builds set
# provenance=false and sbom off — attestation generation + export was a
# large share of every warm build's wall time, and the verification
# story (`switchroom update` pull-side checks) targets release images.
#
# Rebuild avoidance:
#   - main pushes: `retag-unchanged` re-points `:sha-<short>` at the
#     existing `:latest` for path-skipped hindsight / voice.
#   - RELEASE TAGS: `tag-retag-plan` diffs this tag against the previous
#     release tag over each image's declared filter inputs, and
#     `retag-release` re-points the previous release's manifest at
#     `:vX.Y.Z` for any image whose inputs are provably identical.
#     Both verdicts are fail-safe: anything short of proof means BUILD.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Merge queue — the required `images-ok` sentinel must report on the
  # temporary `gh-readonly-queue/main/...` ref or the entry is ejected.
  #
  # merge_group is a VALIDATION event here, exactly like pull_request:
  # build only, never push, never write registry cache, never log in to
  # GHCR, amd64 only. Publication stays on the real push to `main` that
  # follows the merge. This matters because this workflow's "is this a
  # publishing event?" test was historically spelled
  # `github.event_name != 'pull_request'` — which is TRUE on merge_group
  # — so every such site now excludes merge_group explicitly. That
  # invariant is enforced by tests/ci-merge-queue-triggers.test.ts,
  # because none of it is observable on a PR. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual re-trigger. GHA marks a run failed (no auto-retry) when its
  # jobs sit queued past the hosted-runner scheduling window during a
  # capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # once the run is stale. Without a manual entrypoint the only way to
  # republish `:latest` is another push to main. workflow_dispatch
  # gives `gh workflow run docker-images.yml --ref main` as the
  # recovery lever. (#1336 queue-fail surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# workflow_dispatch runs get their own concurrency group (keyed by
# run id) so a busy merge train on main can't cancel a manually
# requested full build — dispatch is the recovery lever for exactly
# the case where push runs keep superseding each other before a
# path-gated image (e.g. hindsight) gets rebuilt (#1336, and observed
# live on 2026-07-05: three successive merges cancelled both the push
# run carrying a hindsight pin bump and the recovery dispatch).
#
# merge_group runs keep the plain `github.ref` group (the queue's own
# `gh-readonly-queue/...` branch — never shared with the PR's
# `refs/pull/<n>/merge`), but are NOT cancellable: a cancelled required
# context ejects the queue entry, and cancelling the `images-ok`
# `if: always()` sentinel is the #3614 orphan-wedge shape.
concurrency:
  group: docker-images-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}

env:
  REGISTRY: ghcr.io
  # Owner is taken from the repo path so a fork builds against the
  # forker's GHCR namespace.
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ─── Path-change filter (sentinel pattern, see ci-lint.yml) ───────
  # PRs that don't touch image inputs skip the whole build matrix —
  # previously EVERY PR paid ~9 image builds. Filters live in
  # .github/path-filters.yml (keys: images / hindsight / voice).
  #
  # Gating policy:
  #   - build-base / build-dependents: PRs gated on `images`; every
  #     non-PR event (main push, tag, dispatch) always builds — we
  #     don't gamble on the release path. (The `images` filter is NOT
  #     complete enough to skip main-push builds: dependents bake
  #     dist/ bundles derived from all of src/, which the filter only
  #     partially covers — see retag-unchanged below for the images
  #     where a filter-driven skip IS sound.)
  #   - build-hindsight / build-voice: also path-gated on MAIN PUSHES
  #     (`hindsight` / `voice` keys) — they extend upstream bases, not
  #     switchroom-base, and rarely change; their filters enumerate
  #     their FULL build input set, so an unchanged filter provably
  #     means an identical image. When skipped on a main push, the
  #     retag-unchanged job re-points `:sha-<short>` at the existing
  #     `:latest` manifest instead of re-building/re-exporting.
  #     workflow_dispatch still always builds them. RELEASE TAGS are
  #     handled by tag-retag-plan / retag-release below, which diff
  #     against the PREVIOUS RELEASE TAG (dorny has no diff base on a
  #     tag push, so the plan job does the diff itself) — an image with
  #     no input change since the last release is retagged, not rebuilt.
  #
  # This job itself skips on tag pushes / workflow_dispatch (dorny has
  # no diff base there); downstream `if:`s use `!cancelled()` so a
  # skipped `changes` doesn't auto-skip the builds on those events.
  #
  # NOTE (required checks): Ruleset 16470166 must require the
  # `images-ok` sentinel below INSTEAD of the individual build jobs —
  # a path-skipped required matrix context would hard-block irrelevant
  # PRs (#1343 lesson). Because only the sentinel is required, the
  # per-arch job renames in this rework don't touch branch protection;
  # keep the sentinel's `needs` list complete when adding jobs.
  changes:
    # merge_group is deliberately absent: a queue ref has no diff base,
    # so this job is SKIPPED there. That is safe — the `images-ok`
    # sentinel treats a skipped `changes` as fine (only failure/cancel is
    # infra breakage), and every downstream `if:` uses `!cancelled()` so a
    # skipped `changes` does not auto-skip them (the same path tag pushes
    # and workflow_dispatch already take).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      images: ${{ steps.filter.outputs.images }}
      hindsight: ${{ steps.filter.outputs.hindsight }}
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: .github/path-filters.yml

  # ─── Release-tag change filter (the tag-path analogue of `changes`) ─
  # `changes` cannot run on a tag push — dorny has no diff base there —
  # so historically EVERY image was rebuilt from scratch at every
  # release tag, including the ones whose build inputs had not moved a
  # byte since the previous release. This job supplies the missing diff
  # base: the PREVIOUS release tag reachable from this one.
  #
  # It emits, per image, exactly one of two verdicts:
  #   `unchanged` — PROVEN identical: the image's full declared input
  #                 set (its key in .github/path-filters.yml) has no
  #                 diff between the previous release tag and this one,
  #                 AND the previous release's manifest is present in
  #                 the registry so `retag-release` has something to
  #                 point at.
  #   `changed`   — everything else.
  #
  # FAIL-SAFE BY CONSTRUCTION. Both verdicts start at `changed` and are
  # only ever promoted to `unchanged` by a positive proof. No previous
  # tag, an unreadable / restructured filter file, a missing `yq`, a git
  # error, a registry hiccup, a skipped or failed instance of THIS job —
  # every one of those leaves the consumer reading something that is not
  # the literal string `unchanged`, and the build gates below are written
  # as `!= 'unchanged'`, so the fallback is always BUILD. Publishing a
  # stale image under a release tag is unrecoverable; a redundant rebuild
  # merely costs minutes.
  #
  # Manifest-only (imagetools inspect, no build) — deliberately NO
  # setup-buildx; see merge-base. Enforced by
  # tests/docker/manifest-jobs-no-buildx.test.ts.
  tag-retag-plan:
    # `github.event_name == 'push'` is not redundant with the ref test:
    # it makes this gate a positive EVENT ALLOWLIST, which is the shape
    # tests/ci-merge-queue-triggers.test.ts uses to prove the GHCR-login
    # step below is unreachable from a queue ref. It also keeps a
    # workflow_dispatch aimed at a tag ref out of here — dispatch always
    # builds, by design.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prev_tag: ${{ steps.plan.outputs.prev_tag }}
      hindsight: ${{ steps.plan.outputs.hindsight }}
      voice: ${{ steps.plan.outputs.voice }}
    steps:
      - name: Checkout (full history + tags — the plan diffs two releases)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # fetch-depth: 0 is required, not defensive: the plan resolves
          # the previous release tag and diffs against it. The default
          # shallow single-commit checkout has neither the tags nor the
          # ancestry to answer that, and every failure there degrades to
          # `changed` — i.e. a silent loss of the whole optimisation.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan per-image release retags
        id: plan
        run: |
          # NOTE: deliberately no `set -e`. Every probe below is allowed
          # to fail; a failure means "cannot prove identical" and leaves
          # the verdict at its `changed` default. `set -e` would turn a
          # transient registry blip into a red release instead.
          set -uo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          HINDSIGHT_VERDICT=changed
          VOICE_VERDICT=changed

          # Previous release tag reachable from this commit. `--merged`
          # keeps it to ancestors (a tag on an unrelated branch is not a
          # valid diff base); version sort picks the highest such tag
          # that is not this one.
          PREV=$(git tag --list 'v*' --sort=-version:refname --merged "${GITHUB_SHA}" \
                   | grep -vFx "$TAG" | head -n1)
          PREV="${PREV:-}"

          # $1 = path-filters.yml key, $2 = the image's own Dockerfile
          # (sanity anchor), $3 = GHCR image short name.
          # Returns 0 ONLY when the image is proven identical.
          plan_image() {
            local key="$1" anchor="$2" name="$3"
            local IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${name}"
            local specs=() line out changed

            while IFS= read -r line; do
              [ -n "$line" ] && specs+=("$line")
            done < <(yq eval ".${key}[]" .github/path-filters.yml 2>/dev/null)

            if [ "${#specs[@]}" -eq 0 ]; then
              echo "::warning title=tag-retag-plan::could not read the '${key}' filter from .github/path-filters.yml — ${name} will be BUILT."
              return 1
            fi
            # The verdict is only sound if the filter key really is the
            # image's FULL input set. Anchor on two entries that must be
            # there: the image's own Dockerfile, and this filter file
            # (a filter edit is itself an input change). If a refactor
            # moves either out of the key, stop trusting the list.
            local spec_list
            spec_list=$(printf '%s\n' "${specs[@]}")
            if ! printf '%s\n' "$spec_list" | grep -qFx "$anchor"; then
              echo "::warning title=tag-retag-plan::filter key '${key}' no longer lists ${anchor} — refusing to trust it; ${name} will be BUILT."
              return 1
            fi
            if ! printf '%s\n' "$spec_list" | grep -qFx '.github/path-filters.yml'; then
              echo "::warning title=tag-retag-plan::filter key '${key}' no longer lists .github/path-filters.yml — refusing to trust it; ${name} will be BUILT."
              return 1
            fi

            changed=$(git diff --name-only "$PREV" "$GITHUB_SHA" -- "${specs[@]}")
            if [ $? -ne 0 ]; then
              echo "::warning title=tag-retag-plan::git diff ${PREV}..${TAG} failed for '${key}' — ${name} will be BUILT."
              return 1
            fi
            if [ -n "$changed" ]; then
              echo "${name}: inputs changed since ${PREV} — BUILD:"
              printf '  %s\n' $changed
              return 1
            fi

            # Inputs identical. The retag still needs the previous
            # release's manifest to exist — if it does not (fresh
            # namespace, pruned tag), there is nothing to point at, so
            # build rather than publish a release with a missing image.
            if ! out=$(docker buildx imagetools inspect "${IMAGE}:${PREV}" 2>&1); then
              echo "::notice title=tag-retag-plan::${IMAGE}:${PREV} is not inspectable — nothing to retag from; ${name} will be BUILT."
              printf '%s\n' "$out"
              return 1
            fi

            echo "${name}: inputs identical to ${PREV} and ${IMAGE}:${PREV} exists — RETAG."
            return 0
          }

          if [ -z "$PREV" ]; then
            echo "::notice title=tag-retag-plan::no previous release tag reachable from ${TAG} — every image will be BUILT."
          else
            echo "planning ${TAG} against previous release ${PREV}"
            if plan_image hindsight docker/Dockerfile.hindsight hindsight; then HINDSIGHT_VERDICT=unchanged; fi
            if plan_image voice     docker/Dockerfile.voice     voice;     then VOICE_VERDICT=unchanged; fi
          fi

          {
            echo "prev_tag=${PREV}"
            echo "hindsight=${HINDSIGHT_VERDICT}"
            echo "voice=${VOICE_VERDICT}"
          } >> "$GITHUB_OUTPUT"
          echo "verdicts: hindsight=${HINDSIGHT_VERDICT} voice=${VOICE_VERDICT} prev_tag=${PREV:-<none>}"

  # ─── Build dist/ once, share with the dependent image legs ────────
  # The dependent images (agent/broker/kernel/hostd/auth-broker/web)
  # each COPY a slice of dist/ into their image. Before this job every
  # matrix leg rebuilt dist/ from scratch (setup-node + frozen bun
  # install + `npm run build`) — identical work, once per leg per arch.
  # Build it ONCE here and hand it to the legs as the `dist-built`
  # artifact. This is an Actions-MINUTES saving, not a wall-clock one:
  # the legs already run in parallel, so the critical path is roughly
  # unchanged, but the redundant per-leg build work collapses into a
  # single job. build-base is deliberately NOT a consumer — its
  # Dockerfile.base COPYs nothing from the context (pure FROM
  # node:22 + apt/npm), so its dist build was dead work and is dropped.
  # Mirrors the build-dist -> dist-built pattern in ci-tests-core.yml.
  build-dist:
    needs: changes
    # Runs whenever any dependent leg will: every non-PR event (push /
    # tag / dispatch / merge_group) plus PRs that touched image inputs.
    # Skipped only on a PR with no image changes — where no leg runs.
    # `!cancelled()` for the SAME reason build-base has it: `changes` is
    # skipped on tag / dispatch / merge_group (no diff base), and without
    # a status expression that skip would propagate and skip build-dist —
    # which would skip the merge_group validation legs AND, on a tag,
    # skip the publish path entirely.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.images == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node (for dist/ bundling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Set up workspace (pinned bun + warm cache + frozen lockfile)
        # Composite action: pinned bun (not `latest` — an unpinned bun
        # release changing under a release build is a flake vector), bun
        # package cache restore, and `bun install --frozen-lockfile`
        # (a bare `bun install` can silently drift from bun.lock).
        uses: ./.github/actions/setup-switchroom

      - name: Build dist/
        env:
          # Arms the mis-stamp guard in scripts/build.mjs: on a tag build this is
          # the tag (e.g. v0.15.56); on non-tag builds it is empty so the guard
          # stays silent and dev builds fall back to package.json.
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-built
          # BOTH build-output trees, not just dist/. `npm run build` emits
          # dist/ AND telegram-plugin/dist/ (scripts/build.mjs shells
          # telegram-plugin/scripts/build.mjs to bundle the plugin's
          # server/gateway/bridge entry points), and Dockerfile.agent COPYs
          # `telegram-plugin/dist`. Both are gitignored (.gitignore's bare
          # `dist/` matches at any depth), so neither is in the leg's
          # checkout — shipping only dist/ makes the agent leg fail with a
          # bare `"/telegram-plugin/dist": not found` from buildx. Any
          # gitignored path a dependent Dockerfile COPYs from MUST be listed
          # here; tests/docker/ci-build-dist-shared.test.ts derives that set
          # from the Dockerfiles and fails if one is missing.
          #
          # Two paths make upload-artifact root the archive at their least
          # common ancestor — the workspace — so entries are `dist/...` and
          # `telegram-plugin/dist/...`. The consumers download with
          # `path: .` to restore that layout verbatim.
          path: |
            dist/
            telegram-plugin/dist/
          # 1-day retention: the artifact is consumed by the image legs
          # that fire within minutes of this job.
          retention-days: 1
          if-no-files-found: error

  build-base:
    needs: changes
    # Non-PR events (main push / tag / dispatch / merge_group): always
    # build. PRs: only when image inputs changed. `!cancelled()` because
    # `changes` is skipped on tag/dispatch/merge_group and a skipped need
    # would otherwise auto-skip this job.
    #
    # merge_group DOES build here — deliberately. `images-ok` is a
    # required context, and if every build job skipped on the queue ref
    # the sentinel would be a rubber stamp that green-lights a merge
    # having compiled nothing. It builds amd64-only and pushes nothing
    # (see the `merge_group` note in the `on:` block).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.images == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # PR validation: amd64 only — PRs don't merge until amd64 is
        # green anyway, and the arm64 artifact is only consumed from
        # main/tag pushes. Non-PR: both arches, each on a NATIVE
        # runner (no QEMU).
        # merge_group is amd64-only for the same reason PRs are: the
        # queue validates buildability and pushes nothing, and the arm64
        # artifact is only ever consumed from a main/tag push.
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed. Keyed on
            # the queue ref's sha because `github.event.pull_request.number`
            # is EMPTY on merge_group — interpolating it would emit the
            # invalid reference `${IMAGE}:pr-` and fail the build.
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds: synthesize a non-pushed tag for build-only mode.
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # Every push path (main / tag / dispatch) pushes ONLY the
            # per-arch scratch tag here; merge-base assigns the real
            # tags (:latest / :sha-<short> / :vX.Y.Z) from the merged
            # multi-arch manifest. Nothing user-facing moves until the
            # merge job runs, so a failed arch leg can't leave a
            # single-arch :latest behind.
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) base ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # Cache via GHCR registry, not type=gha (#1965). The GHA
          # Azure-blob backend restores each layer behind a short-lived
          # SAS token; on the heavy images' large layers that token
          # expired / the blob restore stalled mid-copy and HARD-FAILED
          # the build (fatal "failed to compute cache key: failed to
          # copy"). GHCR registry cache has no SAS token to expire,
          # restores over the same path the images already publish to,
          # and a miss is a non-fatal cold build. cache-to is gated to
          # non-PR events: fork PRs have no GHCR write token, and a
          # failed cache export would break the required build check.
          #
          # Per-arch cache tag (:buildcache-<arch>) so the native-runner
          # legs don't overwrite each other's cache; the legacy mixed
          # :buildcache is kept as a read-only fallback so the first
          # run after this split isn't fully cold.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-base:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-base:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-base:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): signed provenance +
          # SBOM only on tag pushes — release artifacts are what
          # `switchroom update` verifies; attestation on every main/PR
          # build was pure export overhead.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # CACHE_BUST is paired with the `ARG CACHE_BUST` in
          # Dockerfile.base immediately before `npm install -g
          # @anthropic-ai/claude-code@latest`. `github.run_attempt`
          # increments only on `gh run rerun` (fresh pushes start at
          # 1), so original commits hit the buildkit cache for fast
          # builds, while a rerun forces a fresh npm resolve and
          # picks up the current `@latest` from the registry. This
          # is the canonical "give me the newest claude" lever:
          # `gh run rerun <run-id>` → fresh image → `switchroom
          # update` → fleet bumps.
          build-args: |
            CACHE_BUST=${{ github.run_attempt }}

  # Stitch the per-arch base images into the final multi-arch manifest.
  # Manifest-only (`imagetools create`): no rebuild, no layer re-export.
  merge-base:
    needs: build-base
    # merge_group excluded: this job PUBLISHES (:latest / :sha-<short> /
    # :vX.Y.Z) from the per-arch scratch tags. A queue run pushes no
    # scratch tags and must never move a user-facing tag — publication
    # happens on the real push to main after the merge lands.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-base.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately. This job is
      # manifest-only: `docker buildx imagetools inspect|create` are pure
      # registry operations that never touch BuildKit, and the buildx CLI
      # is preinstalled on GitHub-hosted runners with a `default` builder
      # on the `docker` driver. setup-buildx-action defaults to the
      # `docker-container` driver, which boots a BuildKit container by
      # pulling `moby/buildkit:buildx-stable-1` from DOCKER HUB — a hard
      # docker.io dependency (unauthenticated, rate-limited, and outside
      # GHCR) for a capability these jobs never use. That pull is what
      # reddened main twice: run 30138853707 (retag-unchanged,
      # 2026-07-25) and run 29977369227 (promote-to-dev, 2026-07-23),
      # both `ERROR: ... registry-1.docker.io/v2/: ... Client.Timeout
      # exceeded` while "booting buildkit". Dropping the step removes the
      # dependency outright rather than retrying around it.
      #
      # NOTE: the real BUILD jobs (build-base / build-dependents /
      # build-hindsight / build-voice) still set up buildx — they need
      # the docker-container driver for multi-platform + cache export.
      # Only the four manifest-only jobs (merge-base, merge-dependents,
      # retag-unchanged, promote-to-dev) drop it. The same fix applies
      # to promote.yml's `promote` job, which had the identical bug on
      # the RELEASE path.
      #
      # Enforced by tests/docker/manifest-jobs-no-buildx.test.ts: these
      # jobs never run on a PR, so a test is the only thing that stops a
      # future edit from silently re-adding the action and reintroducing
      # a post-merge-only red.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard (#2818 follow-up): a workflow_dispatch
          # on main runs against the tip AT DISPATCH TIME; if main has
          # advanced since, pushing :latest would REGRESS it behind a
          # newer push run's :latest. Skip :latest (keep :sha-<7>) when
          # the checked-out sha is no longer main's tip. Fail-open: if
          # ls-remote can't answer, keep pushing :latest — the guard is
          # a safety net, not a new failure mode for the recovery lever.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # #3685: a tag push publishes the VERSION tag only. Moving
            # :latest here made it follow the TAG PUSH rather than the
            # release's success — docker-images has no dependency on the
            # binary build, the release assets or npm, so a red release
            # still left ghcr.io/switchroom/*:latest on that version.
            # release.yml's `images-latest` job promotes :vX.Y.Z ->
            # :latest through promote.yml once every leg is green. The
            # failure mode is now :latest lagging (recoverable by
            # dispatching promote.yml) instead of :latest leading.
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            # PR C: keep :latest as the canonical install per
            # docs/operators/install.md, BUT also publish :sha-<7> for
            # rollback / promote.yml retagging. (:dev is gated by the
            # smoke-test job and assigned by promote-to-dev — never here.)
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: publish only the per-commit tag; never move
            # :latest from an odd ref or an outdated main sha.
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-dependents:
    # PR / merge_group VALIDATION leg. Each dependent builds FROM the
    # PUBLISHED switchroom-base:latest (see the tags step) — NOT a base
    # built earlier in THIS run — so there is NO data dependency on
    # build-base, and this job deliberately does NOT `needs:` it. That
    # takes build-base's ~31s off the PR / merge-queue critical path:
    # the two now run in parallel instead of serialised. build-base
    # still runs (and is still aggregated by images-ok), so a base
    # Dockerfile regression is still caught here. The push/tag/dispatch
    # leg that DOES consume the freshly-built per-arch scratch base tag
    # is build-dependents-push below — GitHub Actions has no
    # event-conditional `needs:`, so the push-path data dependency is
    # expressed as a separate job rather than a conditional edge.
    needs: [changes, build-dist]
    # PR: only when image inputs changed. merge_group: always — a queue
    # entry that compiled no dependents would make images-ok a rubber
    # stamp. Never push/tag/dispatch — that is build-dependents-push.
    # `needs.build-dist.result == 'success'` gates on the shared dist
    # artifact — with `!cancelled()` replacing the default
    # all-needs-succeeded, a failed build-dist would otherwise let this
    # leg run and fail confusingly at `COPY dist/`.
    if: ${{ !cancelled() && needs.build-dist.result == 'success' && ((github.event_name == 'pull_request' && needs.changes.outputs.images == 'true') || github.event_name == 'merge_group') }}
    strategy:
      fail-fast: false
      matrix:
        # merge_group is amd64-only for the same reason PRs are: the
        # queue validates buildability and pushes nothing, and the arm64
        # artifact is only ever consumed from a main/tag push.
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
        image:
          - { name: agent,        file: docker/Dockerfile.agent }
          - { name: broker,       file: docker/Dockerfile.broker }
          - { name: kernel,       file: docker/Dockerfile.kernel }
          - { name: hostd,        file: docker/Dockerfile.hostd }
          - { name: auth-broker,  file: docker/Dockerfile.auth-broker }
          - { name: web,          file: docker/Dockerfile.web }
          # hindsight is NOT here — it has its own `build-hindsight`
          # job (PR #1310) that runs in parallel with build-base
          # because Dockerfile.hindsight extends upstream
          # `vectorize-io/hindsight:latest`, not switchroom-base.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download dist artifact
        # Built once by build-dist; each Dockerfile COPYs a slice of the
        # build output into its image. `path: .` (NOT `dist/`) because the
        # artifact is rooted at the workspace and carries BOTH build-output
        # trees — `dist/` and `telegram-plugin/dist/`. Unpacking at `.`
        # restores each at its original path, which is where the
        # Dockerfiles' COPY sources resolve under `context: .` below.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-built
          path: .

      - name: Verify build outputs landed
        # Fail HERE, with a readable message, rather than 200 lines later
        # inside buildx. A missing tree surfaces from docker build as a bare
        # `failed to compute cache key: "/telegram-plugin/dist": not found`,
        # which says nothing about the artifact being the culprit — that is
        # exactly how the telegram-plugin/dist omission presented. Keep this
        # list in sync with the upload paths in build-dist.
        run: |
          set -euo pipefail
          missing=0
          for d in dist telegram-plugin/dist; do
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "::error::build output '$d' is missing or empty after downloading the dist-built artifact — check the upload paths in the build-dist job"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Restore exec bits on bundled CLIs
        # upload-artifact stores a zip and strips POSIX exec bits on
        # download; scripts/build.mjs chmods every entry-point bundle
        # 0o755 because the runtime invokes them directly, and a
        # Dockerfile COPY preserves the (now-stripped) source mode. Mirrors
        # ci-tests-core.yml's dist-built consumers.
        run: |
          chmod +x dist/cli/*.js dist/cli/*.mjs 2>/dev/null || true

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + base ref
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image.name }}"
          BASE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation — see build-base for why the PR
            # number can't be used here. Like a PR, the queue's base
            # build pushed no scratch tag, so build FROM published
            # :latest.
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            # On PRs the base wasn't pushed, so depend on the published
            # :latest (multi-arch; buildx resolves the amd64 leg).
            echo "base=${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            # Per-arch scratch tag; merge-dependents assigns the real
            # tags from the merged manifest (see build-base comment).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) ${{ matrix.image.name }} ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base }}
          # GHCR registry cache, not type=gha — #1965. `agent` (Chromium/
          # webkite/playwright, 143MB layers) is the worst hit: its layers
          # outran the GHA Azure-blob SAS token / stalled mid-restore and
          # hard-failed the build, blocking releases. Registry cache has no
          # SAS expiry; a miss degrades to a cold build. cache-to gated to
          # non-PR (fork PRs can't write GHCR; export failure would break
          # the required check). Per-image, per-arch :buildcache-<arch>
          # tag, mode=max; legacy :buildcache kept as read-only fallback
          # for the first post-split run.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.image.name, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  build-dependents-push:
    # push / tag / dispatch leg. Byte-identical build to
    # build-dependents above EXCEPT for gating: this leg DOES consume
    # the freshly-built per-arch scratch base tag
    # (switchroom-base:sha-<short>-<arch>) that build-base pushes, so
    # it MUST wait on build-base — hence `needs: [changes, build-base]`
    # and the explicit base-success check (the push-path data
    # dependency the PR/merge_group leg deliberately drops). Keep the
    # strategy + steps below IN SYNC with build-dependents.
