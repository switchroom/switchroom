        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base }}
          # GHCR registry cache, not type=gha — #1965. `agent` (Chromium/
          # webkite/playwright, 143MB layers) is the worst hit: its layers
          # outran the GHA Azure-blob SAS token / stalled mid-restore and
          # hard-failed the build, blocking releases. Registry cache has no
          # SAS expiry; a miss degrades to a cold build. cache-to gated to
          # non-PR (fork PRs can't write GHCR; export failure would break
          # the required check). Per-image, per-arch :buildcache-<arch>
          # tag, mode=max; legacy :buildcache kept as read-only fallback
          # for the first post-split run.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.image.name, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Stitch the per-arch dependent images into their final multi-arch
  # manifests. Same pattern as merge-base.
  merge-dependents:
    # build-dependents-push (NOT the PR/merge_group build-dependents leg)
    # is what pushes the per-arch scratch tags on a real push, so this
    # publishing job needs THAT leg. On a push the PR/merge_group leg is
    # skipped; needing it here would leave merge-dependents skipped and
    # nothing would ever publish.
    needs: build-dependents-push
    # merge_group excluded — see merge-base. Publication is a push-to-main
    # concern, never a queue-validation concern.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-dependents-push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        image: [agent, broker, kernel, hostd, auth-broker, web]
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-hindsight:
    # Hindsight extends upstream `ghcr.io/vectorize-io/hindsight:latest`
    # rather than `switchroom-base`, so it has no dependency on the
    # base job and runs in parallel. See docker/Dockerfile.hindsight
    # for why we extend instead of running upstream as-is (claude-code
    # provider + claude-agent-sdk + UID pin).
    #
    # Path-gated on PRs AND main pushes (see `changes` header): the
    # hindsight context rarely changes; when it's unchanged on a main
    # push this job skips and retag-unchanged re-points :sha-<short>
    # at the existing :latest manifest. On a RELEASE TAG the equivalent
    # gate is tag-retag-plan's verdict (retag-release does the retag);
    # workflow_dispatch always builds.
    #
    # Split per-arch on NATIVE runners (amd64 on ubuntu-latest, arm64 on
    # ubuntu-24.04-arm), exactly like build-base / build-dependents — no
    # QEMU emulation for the arm64 leg, which used to dominate this job's
    # wall time. Each arch leg pushes a temporary `:sha-<short>-<arch>`
    # scratch tag; merge-hindsight then stitches the two into the final
    # multi-arch manifest. PRs / merge_group build amd64 only (validation,
    # no push).
    #
    # On merge_group this SKIPS (`changes` doesn't run there, so the
    # `hindsight` output is empty). That is not a hole: the hindsight
    # image's real gate is docker-e2e's `hindsight-probe`, which DOES run
    # on merge_group, and the path-aware build + publish still happens on
    # the push to main straight after the merge. Forcing the 6.4GB
    # build onto every queue entry would push the queue past its 60-min
    # check_response_timeout for no added signal.
    #
    # TAG BRANCH: no longer an unconditional build. It is CONJOINED with
    # tag-retag-plan's verdict — `startsWith(refs/tags/) && plan !=
    # 'unchanged'`. The polarity is deliberate and is the highest-risk
    # line in this file: the test is `!= 'unchanged'`, NOT `== 'changed'`,
    # so every value the output can take other than the literal
    # `unchanged` — the empty string from a skipped or failed
    # tag-retag-plan included — BUILDS. Inverting this to `== 'changed'`
    # would make a missing plan silently skip the build and ship the
    # previous release's image under a new version tag.
    # Guarded by tests/docker/ci-tag-retag-unchanged.test.ts.
    needs: [changes, tag-retag-plan]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && needs.tag-retag-plan.outputs.hindsight != 'unchanged') || needs.changes.outputs.hindsight == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # PR / merge_group validation: amd64 only — arm64 is only ever
        # consumed from a main/tag push. Non-PR non-queue: both arches,
        # each on a NATIVE runner (no QEMU).
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-hindsight"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed. Keyed on
            # the queue ref's sha because `github.event.pull_request.number`
            # is EMPTY on merge_group (see build-base).
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds: synthesize a non-pushed tag for build-only mode.
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # Every push path (main / tag / dispatch) pushes ONLY the
            # per-arch scratch tag here; merge-hindsight assigns the real
            # tags (:latest / :sha-<short> / :vX.Y.Z) from the merged
            # multi-arch manifest (see build-base comment).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) hindsight ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.hindsight
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # GHCR registry cache, not type=gha — #1965 (see build-base).
          # Per-arch cache tag (:buildcache-<arch>) so the native-runner
          # legs don't overwrite each other's cache; the legacy mixed
          # :buildcache is kept as a read-only fallback so the first run
          # after this split isn't fully cold.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-hindsight:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Stitch the per-arch hindsight images into the final multi-arch
  # manifest. Manifest-only (`imagetools create`): no rebuild, no layer
  # re-export. Same pattern as merge-base / merge-dependents.
  merge-hindsight:
    needs: build-hindsight
    # merge_group excluded: this job PUBLISHES (:latest / :sha-<short> /
    # :vX.Y.Z) from the per-arch scratch tags. A queue run pushes no
    # scratch tags and must never move a user-facing tag — publication
    # happens on the real push to main after the merge lands.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-hindsight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-hindsight"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: publish only the per-commit tag; never move
            # :latest from an odd ref or an outdated main sha.
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-voice:
    # Voice STT sidecar (PR-B2 follow-up). Like build-hindsight this is a
    # standalone image: Dockerfile.voice FROMs `nvidia/cuda:…-cudnn-runtime`,
    # NOT switchroom-base, so it has no base-job dependency and runs in
    # parallel. It bakes no dist/ (pure-Python faster-whisper server), so
    # there's no Node/Bun build step here.
    #
    # Subscription-honest local GPU STT (vision #3): transcribing inbound
    # voice notes on the operator's own GPU, no third-party STT key, no
    # cloud STT dependency (vision #4, always-available). The image only
    # ships CUDA + cuDNN *runtime* libs + faster-whisper's prebuilt
    # CTranslate2 kernels; model weights are NOT baked (fetched once into
    # the voice-model-cache volume on first boot). See docker/Dockerfile.voice.
    #
    # amd64 ONLY — and deliberately so. faster-whisper rides CTranslate2's
    # prebuilt CUDA kernels, which are published for x86_64 GPU hosts; there
    # is no equivalently-supported aarch64 CUDA wheel, and the fleet's GPU
    # hosts are amd64. Building an arm64 leg would emit an image that can't
    # actually run GPU STT, so we don't (this is the one fleet image that
    # is single-arch by design — every other image is amd64+arm64).
    #
    # Path-gated on PRs AND main pushes like build-hindsight (see the
    # `changes` header): the CUDA layers make voice the heaviest build
    # and its context almost never changes; retag-unchanged covers the
    # skipped-on-main-push case, and tag-retag-plan / retag-release the
    # release-tag case. workflow_dispatch always builds.
    #
    # Skips on merge_group for the same reason as build-hindsight — this
    # is the single heaviest build in the repo and running it per queue
    # entry would blow the queue's 60-min check_response_timeout. The
    # build + publish still runs on the push to main after the merge.
    #
    # TAG BRANCH: conjoined with tag-retag-plan's verdict, same shape and
    # same fail-safe polarity as build-hindsight — `!= 'unchanged'`, so a
    # skipped / failed / absent plan BUILDS. See build-hindsight for the
    # full rationale. Guarded by
    # tests/docker/ci-tag-retag-unchanged.test.ts.
    needs: [changes, tag-retag-plan]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && needs.tag-retag-plan.outputs.voice != 'unchanged') || needs.changes.outputs.voice == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-voice"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed (see
            # build-hindsight's twin branch).
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: sha tag only (see build-hindsight's twin branch).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) voice
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.voice
          # Single-arch: CUDA/CTranslate2 GPU runtime is x86_64-only (see
          # job-level comment). No QEMU/arm64 leg on any event.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # GHCR registry cache, not type=gha — #1965 (see build-base). The
          # CUDA base + faster-whisper pip layer are heavy, so the registry
          # cache materially shortens warm builds. cache-to gated to non-PR
          # (fork PRs have no GHCR write token; an export failure would break
          # the required build check).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-voice:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-voice:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # ─── Skip re-export of unchanged images (main pushes) ─────────────
  # hindsight / voice enumerate their FULL build-input set in
  # .github/path-filters.yml, so "filter says unchanged" provably means
  # "the image content is identical to the previous main build". When
  # their build jobs are path-skipped on a main push, this job re-points
  # `:sha-<short>` at the existing `:latest` manifest with
  # `docker buildx imagetools create` (same no-rebuild pattern as
  # promote-to-dev) — every main commit then has a complete
  # per-commit tag set with zero build/export cost.
  #
  # DELIBERATELY NOT applied to base/dependents: their images bake dist/
  # bundles derived from effectively all of src/, which the `images`
  # filter only partially covers — a filter-driven "unchanged" verdict
  # there would be unsound, and a content-digest scheme short of
  # actually building is exactly the fragile hashing we avoid. Their
  # skip-cost is instead attacked by the native-arm64 split + the
  # attestation relaxation above.
  retag-unchanged:
    needs: changes
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.hindsight != 'true' || needs.changes.outputs.voice != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :latest as :sha-<7> for path-skipped images
        env:
          HINDSIGHT_CHANGED: ${{ needs.changes.outputs.hindsight }}
          VOICE_CHANGED: ${{ needs.changes.outputs.voice }}
        run: |
          set -euo pipefail
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          retag() {
            local name="$1"
            local IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${name}"
            # Tolerate a missing :latest (fresh fork / first-ever run):
            # only a genuine NOT-FOUND is a benign skip; any other
            # inspect error fails loudly (same discipline as
            # promote-to-dev — never mask registry/auth trouble).
            local out
            if out=$(docker buildx imagetools inspect "${IMAGE}:latest" 2>&1); then
              docker buildx imagetools create -t "${IMAGE}:sha-${SHA_SHORT}" "${IMAGE}:latest"
              echo "retagged ${IMAGE}:latest -> ${IMAGE}:sha-${SHA_SHORT} (inputs unchanged this commit)"
            elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found|404|no such manifest|MANIFEST_UNKNOWN'; then
              echo "::notice title=retag-unchanged skipped::${IMAGE}:latest absent (never built in this namespace) — nothing to retag."
            else
              echo "::error title=retag-unchanged failed::inspecting ${IMAGE}:latest failed with a non-absence error (registry/auth/network?)."
              printf '%s\n' "$out"
              exit 1
            fi
          }
          if [ "$HINDSIGHT_CHANGED" != "true" ]; then retag hindsight; fi
          if [ "$VOICE_CHANGED" != "true" ]; then retag voice; fi

  # ─── Skip re-export of unchanged images (RELEASE TAGS) ────────────
  # The tag-path twin of retag-unchanged. For any image tag-retag-plan
  # proved identical to the previous release, re-point that release's
  # manifest at `:vX.Y.Z` with `docker buildx imagetools create` instead
  # of rebuilding it — same manifest-only, no-rebuild, no-re-export
  # pattern as merge-* / retag-unchanged / promote-to-dev.
  #
  # Two independent conditions must BOTH hold per image before anything
  # is retagged, and they are checked again inside the step (not only in
  # the job `if:`) so the per-image decision is never inferred from the
  # job-level OR:
  #   1. tag-retag-plan's verdict for that image is exactly `unchanged`.
  #   2. that image's build job actually SKIPPED. If it ran for any
  #      reason it owns `:vX.Y.Z`, and retagging the previous release
  #      over it would REGRESS the release. We warn and leave it alone.
  #
  # `imagetools create` here is a hard requirement, not best-effort: the
  # plan already verified the source manifest exists, so a failure now is
  # a real failure and must red the run — a release tag with a missing
  # image is worse than a red workflow.
  #
  # Attestations: a retagged index carries the PREVIOUS release's
  # provenance/SBOM manifests (WS9-F3 attests tag builds). That is
  # accurate rather than stale — the bits genuinely were produced by that
  # build — and nothing on the pull side verifies image provenance today
  # (`switchroom update` does no cosign/SLSA check). If that ever
  # changes, this job is the place that has to grow an attestation
  # re-attach step, or hindsight/voice have to drop out of the plan.
  #
  # Manifest-only — deliberately NO setup-buildx; see merge-base.
  # Enforced by tests/docker/manifest-jobs-no-buildx.test.ts.
  retag-release:
    needs: [tag-retag-plan, build-hindsight, build-voice]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.tag-retag-plan.result == 'success' &&
      ((needs.tag-retag-plan.outputs.hindsight == 'unchanged' && needs.build-hindsight.result == 'skipped') ||
       (needs.tag-retag-plan.outputs.voice == 'unchanged' && needs.build-voice.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag previous release manifest as :<tag> for unchanged images
        env:
          PREV_TAG: ${{ needs.tag-retag-plan.outputs.prev_tag }}
          HINDSIGHT_VERDICT: ${{ needs.tag-retag-plan.outputs.hindsight }}
          VOICE_VERDICT: ${{ needs.tag-retag-plan.outputs.voice }}
          HINDSIGHT_BUILD: ${{ needs.build-hindsight.result }}
          VOICE_BUILD: ${{ needs.build-voice.result }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$PREV_TAG" ]; then
            echo "::error title=retag-release::reached with an empty prev_tag — refusing to guess a source manifest."
            exit 1
          fi
          retag() {
            local name="$1" verdict="$2" build="$3"
            local IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${name}"
            if [ "$verdict" != "unchanged" ]; then
              echo "${name}: plan verdict '${verdict}' — built for this release; nothing to retag."
              return 0
            fi
            if [ "$build" != "skipped" ]; then
              echo "::warning title=retag-release::${name} planned as unchanged but build-${name} result is '${build}' — that job owns ${IMAGE}:${TAG}; NOT overwriting it."
              return 0
            fi
            docker buildx imagetools create -t "${IMAGE}:${TAG}" "${IMAGE}:${PREV_TAG}"
            echo "retagged ${IMAGE}:${PREV_TAG} -> ${IMAGE}:${TAG} (inputs identical since ${PREV_TAG})"
          }
          retag hindsight "$HINDSIGHT_VERDICT" "$HINDSIGHT_BUILD"
          retag voice "$VOICE_VERDICT" "$VOICE_BUILD"

  # PR C: smoke test the freshly-pushed :sha-<7> agent image — runs the
  # MCP tools/list harness inside a throwaway container with the
  # channels.telegram.enabled:false fixture (no bot-token needed at
  # boot). Validates every tool's input_schema against Anthropic's
  # tool-use constraints (root type:object, no top-level
  # oneOf/anyOf/allOf). Gates the floating :dev tag below — a failed
  # smoke run leaves :sha-<7> pushed (for rollback) but does NOT
  # promote to :dev. Job timeout 5 min.
  smoke-test:
    # merge-dependents is what creates :sha-<7> now (the per-arch build
    # jobs only push scratch tags).
    needs: [merge-dependents]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Set up workspace (pinned bun + warm cache + frozen lockfile)
        # Composite action — pinned bun + cached `bun install
        # --frozen-lockfile` (was unpinned `latest` + bare `bun install`).
        uses: ./.github/actions/setup-switchroom

      - name: Log in to GHCR (smoke pulls private images)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly-pushed :sha-<7> agent image
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-agent:sha-${SHA_SHORT}"
          docker pull "$IMAGE"
          echo "SMOKE_AGENT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run MCP tools/list smoke test
        env:
          RUN_DOCKER_SMOKE: "1"
        run: npx vitest run tests/docker/mcp-tools-list.smoke.test.ts

  # PR C: promote :sha-<7> → :dev for every image when smoke passes.
  # Matrix-fanout retag using buildx imagetools so we don't rebuild.
  promote-to-dev:
    # `build-hindsight` is intentionally decoupled from the base→
    # build-dependents→smoke-test chain (it extends upstream, builds in
    # parallel). But promote-to-dev's `hindsight` matrix leg retags
    # hindsight's `:sha-<short>`, so it MUST gate on build-hindsight
    # succeeding — otherwise a genuine hindsight build/push failure
    # (job green path not taken) could be misread by the retag step as
    # a benign "image unchanged" skip. With build-hindsight in `needs`,
    # a missing `:sha-<short>` at promote time provably means
    # "build succeeded but context unchanged → nothing pushed", never
    # "build failed".
    # Since the hindsight/voice builds became path-gated on main pushes
    # too, their `needs` result can legitimately be `skipped` here — a
    # skip means "context unchanged this commit"; retag-unchanged (also
    # in `needs`) then re-points :sha-<short> at :latest, so the retag
    # step below normally finds it. Its absence-tolerance is retained
    # for the fresh-namespace edge (no :latest to retag from). This
    # `if:` requires smoke-test SUCCESS but only non-failure
    # (success or skipped) from hindsight/voice/retag-unchanged.
    # merge-base is a producing job too: it creates base:sha-<short> on
    # main pushes (build-base only pushes per-arch scratch tags now),
    # and it never legitimately skips on a main push — so require hard
    # success. Without it, a transient merge-base failure would let the
    # base leg's absence-tolerant branch below misread the missing
    # base:sha-<short> as a benign skip and silently hold base:dev back
    # while the other :dev tags advance.
    # merge-hindsight is hindsight's producing job now (build-hindsight
    # only pushes per-arch scratch tags): it creates hindsight:sha-<short>
    # on the changed path (retag-unchanged covers the skipped path). Gate
    # on both build-hindsight AND merge-hindsight non-failure so a genuine
    # hindsight build/merge failure can't be misread as a benign
    # "unchanged → nothing pushed" skip by the retag step below.
    needs: [smoke-test, merge-base, build-hindsight, merge-hindsight, build-voice, retag-unchanged]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.smoke-test.result == 'success' &&
      needs.merge-base.result == 'success' &&
      needs.build-hindsight.result != 'failure' && needs.build-hindsight.result != 'cancelled' &&
      needs.merge-hindsight.result != 'failure' && needs.merge-hindsight.result != 'cancelled' &&
      needs.build-voice.result != 'failure' && needs.build-voice.result != 'cancelled' &&
      needs.retag-unchanged.result != 'failure' && needs.retag-unchanged.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the merge-dependents matrix + base +
        # hindsight/voice: every image that publishes :sha-<7> on main
        # must be promoted here, or its :dev tag silently stops
        # advancing (web was missing until #2818's follow-up).
        image: [base, agent, broker, kernel, hostd, auth-broker, web, hindsight, voice]
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :sha-<7> as :dev (no rebuild)
        run: |
          set -euo pipefail
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image }}"
          SRC="${IMAGE}:sha-${SHA_SHORT}"
          # An image whose build was path-skipped this commit normally
          # has its `:sha-<short>` created by retag-unchanged above; the
          # absence branch remains for the fresh-namespace edge (no
          # :latest existed to retag from). promote-to-dev `needs` every
          # producing job, so by the time this runs a missing
          # `:sha-<short>` provably means "nothing was ever pushed for
          # this image in this namespace", never "build failed" — the
          # existing `:dev` (if any) is already the last good build →
          # skip.
          #
          # CRITICAL: only skip on a genuine NOT-FOUND. A transient
          # registry/auth/network error from `imagetools inspect` must
          # NOT be misread as "absent" — that would silently stop `:dev`
          # advancing for a CHANGED image (e.g. agent/kernel on a code
          # release). Any non-absence error fails the step loudly.
          if out=$(docker buildx imagetools inspect "$SRC" 2>&1); then
            docker buildx imagetools create -t "${IMAGE}:dev" "$SRC"
            echo "promoted $SRC -> ${IMAGE}:dev"
          elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found|404|no such manifest|MANIFEST_UNKNOWN'; then
            echo "::notice title=promote-to-dev skipped::$SRC absent (nothing pushed for this image). Existing ${IMAGE}:dev retained; nothing to re-promote."
          else
            echo "::error title=promote-to-dev failed::inspecting $SRC failed with a non-absence error (registry/auth/network?) — NOT masking a possibly-real promotion."
            printf '%s\n' "$out"
            exit 1
          fi

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context (see ci-lint.yml header for the
  # pattern). ALWAYS runs and aggregates the path-gated build jobs:
  # pass when every build succeeded OR was legitimately path-skipped;
  # fail when any build/merge/retag failed/cancelled, or when the
  # `changes` filter job itself broke on an event where it gates (can't
  # trust a skip produced by broken infra). Ruleset 16470166 should
  # require `images-ok` as THE single required context for this
  # workflow — keep this `needs` list complete when adding jobs.
  images-ok:
    needs:
      - changes
      - build-dist
      - build-base
      - merge-base
      - build-dependents
      - build-dependents-push
      - merge-dependents
      - build-hindsight
      - merge-hindsight
      - build-voice
      - retag-unchanged
      # Release-tag retag path. Both must be aggregated here or a
      # failure in them is invisible: neither runs on a PR, and
      # `retag-release` is the job that actually publishes hindsight /
      # voice `:vX.Y.Z` when their builds were short-circuited — a
      # silent failure there means a release tag with a missing image.
      - tag-retag-plan
      - retag-release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          # `changes` is intentionally skipped on tag pushes /
          # workflow_dispatch / merge_group (no diff base) — skipped is
          # fine; only a failure/cancel is infra breakage.
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust skip"
            exit 1
          fi
          fail=0
          for pair in \
            "build-dist=${{ needs.build-dist.result }}" \
            "build-base=${{ needs.build-base.result }}" \
            "merge-base=${{ needs.merge-base.result }}" \
            "build-dependents=${{ needs.build-dependents.result }}" \
            "build-dependents-push=${{ needs.build-dependents-push.result }}" \
            "merge-dependents=${{ needs.merge-dependents.result }}" \
            "build-hindsight=${{ needs.build-hindsight.result }}" \
            "merge-hindsight=${{ needs.merge-hindsight.result }}" \
            "build-voice=${{ needs.build-voice.result }}" \
            "retag-unchanged=${{ needs.retag-unchanged.result }}" \
            "tag-retag-plan=${{ needs.tag-retag-plan.result }}" \
            "retag-release=${{ needs.retag-release.result }}"; do
            job="${pair%%=*}"; r="${pair#*=}"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::${job}=${r} — real build failure, blocking"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "changes=$c → pass (builds green or path-skipped)"
