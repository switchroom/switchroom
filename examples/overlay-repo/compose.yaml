name: hermes-fleet-overlay-example

x-hermes-agent: &hermes-agent
  image: ${HERMES_FLEET_IMAGE:?set a digest-pinned Fleet image, for example ghcr.io/example/hermes-fleet@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  restart: unless-stopped
  # Longer than the image's 50 s s6 grace, so the browser can checkpoint its logins on stop.
  stop_grace_period: 60s
  environment:
    HERMES_UID: ${HERMES_UID:-1000}
    HERMES_GID: ${HERMES_GID:-1000}
    TZ: UTC
  command: ["gateway", "run"]

# Read-only mounts for the starter defaults. Sources come from vendor/, which
# scripts/fetch-overlay-vendor.py fills at the commits vendor.lock.json pins:
# the Fleet repository at the image's own revision (skill pack and Fleet
# plugins) and the two third-party plugins. A source that was never fetched
# mounts as an empty directory: that default is absent, the setup check
# (--check-files) reports it, and the agent still starts.
x-starter-mounts:
  # The skill pack goes inside the agent's own skills directory: Hermes walks
  # /opt/data/skills recursively and never reads skills.external_dirs from the
  # managed config.
  - &skill-pack ./vendor/hermes-fleet/skills:/opt/data/skills/switchroom-shared:ro
  - &plugin-linear ./vendor/hermes-fleet/plugins/linear:/opt/hermes/plugins/linear:ro
  - &plugin-kokoro ./vendor/hermes-fleet/plugins/kokoro-voice:/opt/hermes/plugins/kokoro-voice:ro
  - &plugin-perplexity ./vendor/hermes-fleet/plugins/web/perplexity:/opt/hermes/plugins/web/perplexity:ro
  - &plugin-claude-acp ./vendor/hermes-fleet/plugins/model-providers/claude-acp:/opt/hermes/plugins/model-providers/claude-acp:ro
  - &plugin-directsdk ./vendor/hermes-fleet/plugins/claude-subscription-directsdk:/opt/hermes/plugins/model-providers/claude-subscription-directsdk:ro
  - &plugin-connectors ./vendor/hermes-fleet/plugins/claude-account-connectors:/opt/hermes/plugins/claude-account-connectors:ro
  - &plugin-disk-cleanup ./vendor/hermes-fleet/plugins/disk-cleanup:/opt/hermes/plugins/disk-cleanup:ro
  - &plugin-quota ./vendor/hermes-quota-plugin:/opt/data/plugins/quota:ro
  - &plugin-session-reset ./vendor/hermes-session-reset-policy:/opt/data/plugins/hermes-session-reset-policy:ro

# Creates the skill pack's mount point as the agent user before the agent
# starts. Without it, Docker creates /opt/data/skills on a fresh state volume
# as root to hold the read-only pack mount, and the agent can no longer save
# its own skills there. It runs the agent's own image, so the state volume is
# first filled from the same image contents as before, and it only makes one
# directory: no network, no capabilities, read-only root, then it exits.
x-skills-init: &skills-init
  image: ${HERMES_FLEET_IMAGE:?set a digest-pinned Fleet image, for example ghcr.io/example/hermes-fleet@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
  entrypoint: ["mkdir", "-p", "/opt/data/skills/switchroom-shared"]
  command: []
  network_mode: none
  cap_drop: [ALL]
  read_only: true
  restart: "no"

services:
  ops-skills-init:
    <<: *skills-init
    volumes:
      - ops-state:/opt/data

  worker-skills-init:
    <<: *skills-init
    volumes:
      - worker-state:/opt/data

  ops:
    <<: *hermes-agent
    depends_on:
      ops-skills-init:
        condition: service_completed_successfully
    # The env-file fallback for secrets (and the Connect token when you use
    # 1Password Connect). A missing file is fine: each default whose variable
    # is missing turns itself off.
    env_file:
      - path: ./secrets/ops.env
        required: false
    volumes:
      - ops-state:/opt/data
      - ops-workspace:/opt/data/workspace
      - ./managed/ops.yaml:/etc/hermes/config.yaml:ro
      - *skill-pack
      - *plugin-linear
      - *plugin-kokoro
      - *plugin-perplexity
      - *plugin-claude-acp
      - *plugin-directsdk
      - *plugin-connectors
      - *plugin-disk-cleanup
      - *plugin-quota
      - *plugin-session-reset
    networks:
      - ops-network

  worker:
    <<: *hermes-agent
    depends_on:
      worker-skills-init:
        condition: service_completed_successfully
    env_file:
      - path: ./secrets/worker.env
        required: false
    # No Kokoro mount: agents/worker.yaml turns voice off.
    volumes:
      - worker-state:/opt/data
      - worker-workspace:/opt/data/workspace
      - ./managed/worker.yaml:/etc/hermes/config.yaml:ro
      - *skill-pack
      - *plugin-linear
      - *plugin-perplexity
      - *plugin-claude-acp
      - *plugin-directsdk
      - *plugin-connectors
      - *plugin-disk-cleanup
      - *plugin-quota
      - *plugin-session-reset
    networks:
      - worker-network

volumes:
  ops-state:
  ops-workspace:
  worker-state:
  worker-workspace:

networks:
  ops-network:
    driver: bridge
  worker-network:
    driver: bridge
