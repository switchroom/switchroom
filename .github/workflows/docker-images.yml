name: docker-images

# Multi-arch build + push for switchroom's container images.
#
# Triggers:
#   - push to main: build all images for linux/amd64 + linux/arm64,
#     push as `:latest` and `:sha-<short>` to
#     ghcr.io/<owner>/switchroom-<image>.
#   - tag push v*: same matrix, push as `:<tag>` ONLY. `:latest` is NOT
#     moved here — release.yml's `images-latest` job promotes
#     `:vX.Y.Z` → `:latest` (via promote.yml) after every release leg is
#     green. See #3685 and the tag-branch comment in merge-base.
#   - pull_request: build only (no push) to validate Dockerfile changes.
#
# Pipelines (perf rework, follows #2807):
#   - build-base + build-dependents run as a PER-ARCH matrix on NATIVE
#     runners (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) — no
#     QEMU emulation. Each arch leg pushes a temporary
#     `:sha-<short>-<arch>` tag; the merge-base / merge-dependents jobs
#     then stitch the two arch images into the final multi-arch
#     manifest (`:latest` / `:sha-<short>` / `:vX.Y.Z`) with
#     `docker buildx imagetools create` — a manifest-only operation, no
#     rebuild, no re-export. Registry build caches are per-arch
#     (`:buildcache-<arch>`) so the two legs don't thrash each other.
#   - build-hindsight: extends upstream `vectorize-io/hindsight:latest`,
#     no switchroom-base dependency. Runs in parallel with build-base.
#     Split per-arch on NATIVE runners (amd64 on ubuntu-latest, arm64 on
#     ubuntu-24.04-arm) exactly like base/dependents — no QEMU emulation
#     for the arm64 leg — with merge-hindsight stitching the two per-arch
#     images into the final multi-arch manifest (:latest / :sha-<short> /
#     :vX.Y.Z). Per-arch registry caches (`:buildcache-<arch>`).
#   - build-voice: standalone CUDA image, amd64-only by design (see job
#     comment) — no QEMU, no split.
#
# SBOM/provenance policy (WS9-F3, relaxed — operator-approved): full
# `provenance: mode=max` + `sbom: true` attestation now runs on TAG
# pushes (release artifacts) only. PR / main-push / dispatch builds set
# provenance=false and sbom off — attestation generation + export was a
# large share of every warm build's wall time, and the verification
# story (`switchroom update` pull-side checks) targets release images.
#
# This workflow is staged at docs/proposed/docker-images.yml because the
# OAuth token used to land code changes here lacks the `workflow` scope
# GitHub requires for writes under `.github/workflows/`. To activate it,
# an operator with a workflow-scoped token must:
#
#   git mv docs/proposed/docker-images.yml .github/workflows/docker-images.yml
#   git commit -m "ci: enable docker-images workflow"
#   git push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Merge queue — the required `images-ok` sentinel must report on the
  # temporary `gh-readonly-queue/main/...` ref or the entry is ejected.
  #
  # merge_group is a VALIDATION event here, exactly like pull_request:
  # build only, never push, never write registry cache, never log in to
  # GHCR, amd64 only. Publication stays on the real push to `main` that
  # follows the merge. This matters because this workflow's "is this a
  # publishing event?" test was historically spelled
  # `github.event_name != 'pull_request'` — which is TRUE on merge_group
  # — so every such site now excludes merge_group explicitly. That
  # invariant is enforced by tests/ci-merge-queue-triggers.test.ts,
  # because none of it is observable on a PR. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual re-trigger. GHA marks a run failed (no auto-retry) when its
  # jobs sit queued past the hosted-runner scheduling window during a
  # capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # once the run is stale. Without a manual entrypoint the only way to
  # republish `:latest` is another push to main. workflow_dispatch
  # gives `gh workflow run docker-images.yml --ref main` as the
  # recovery lever. (#1336 queue-fail surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# workflow_dispatch runs get their own concurrency group (keyed by
# run id) so a busy merge train on main can't cancel a manually
# requested full build — dispatch is the recovery lever for exactly
# the case where push runs keep superseding each other before a
# path-gated image (e.g. hindsight) gets rebuilt (#1336, and observed
# live on 2026-07-05: three successive merges cancelled both the push
# run carrying a hindsight pin bump and the recovery dispatch).
#
# merge_group runs keep the plain `github.ref` group (the queue's own
# `gh-readonly-queue/...` branch — never shared with the PR's
# `refs/pull/<n>/merge`), but are NOT cancellable: a cancelled required
# context ejects the queue entry, and cancelling the `images-ok`
# `if: always()` sentinel is the #3614 orphan-wedge shape.
concurrency:
  group: docker-images-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}

env:
  REGISTRY: ghcr.io
  # Owner is taken from the repo path so a fork builds against the
  # forker's GHCR namespace.
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ─── Path-change filter (sentinel pattern, see ci-lint.yml) ───────
  # PRs that don't touch image inputs skip the whole build matrix —
  # previously EVERY PR paid ~9 image builds. Filters live in
  # .github/path-filters.yml (keys: images / hindsight / voice).
  #
  # Gating policy:
  #   - build-base / build-dependents: PRs gated on `images`; every
  #     non-PR event (main push, tag, dispatch) always builds — we
  #     don't gamble on the release path. (The `images` filter is NOT
  #     complete enough to skip main-push builds: dependents bake
  #     dist/ bundles derived from all of src/, which the filter only
  #     partially covers — see retag-unchanged below for the images
  #     where a filter-driven skip IS sound.)
  #   - build-hindsight / build-voice: also path-gated on MAIN PUSHES
  #     (`hindsight` / `voice` keys) — they extend upstream bases, not
  #     switchroom-base, and rarely change; their filters enumerate
  #     their FULL build input set, so an unchanged filter provably
  #     means an identical image. When skipped on a main push, the
  #     retag-unchanged job re-points `:sha-<short>` at the existing
  #     `:latest` manifest instead of re-building/re-exporting. Tags +
  #     dispatch still always build them.
  #
  # This job itself skips on tag pushes / workflow_dispatch (dorny has
  # no diff base there); downstream `if:`s use `!cancelled()` so a
  # skipped `changes` doesn't auto-skip the builds on those events.
  #
  # NOTE (required checks): Ruleset 16470166 must require the
  # `images-ok` sentinel below INSTEAD of the individual build jobs —
  # a path-skipped required matrix context would hard-block irrelevant
  # PRs (#1343 lesson). Because only the sentinel is required, the
  # per-arch job renames in this rework don't touch branch protection;
  # keep the sentinel's `needs` list complete when adding jobs.
  changes:
    # merge_group is deliberately absent: a queue ref has no diff base,
    # so this job is SKIPPED there. That is safe — the `images-ok`
    # sentinel treats a skipped `changes` as fine (only failure/cancel is
    # infra breakage), and every downstream `if:` uses `!cancelled()` so a
    # skipped `changes` does not auto-skip them (the same path tag pushes
    # and workflow_dispatch already take).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      images: ${{ steps.filter.outputs.images }}
      hindsight: ${{ steps.filter.outputs.hindsight }}
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: .github/path-filters.yml

  build-base:
    needs: changes
    # Non-PR events (main push / tag / dispatch / merge_group): always
    # build. PRs: only when image inputs changed. `!cancelled()` because
    # `changes` is skipped on tag/dispatch/merge_group and a skipped need
    # would otherwise auto-skip this job.
    #
    # merge_group DOES build here — deliberately. `images-ok` is a
    # required context, and if every build job skipped on the queue ref
    # the sentinel would be a rubber stamp that green-lights a merge
    # having compiled nothing. It builds amd64-only and pushes nothing
    # (see the `merge_group` note in the `on:` block).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.images == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # PR validation: amd64 only — PRs don't merge until amd64 is
        # green anyway, and the arm64 artifact is only consumed from
        # main/tag pushes. Non-PR: both arches, each on a NATIVE
        # runner (no QEMU).
        # merge_group is amd64-only for the same reason PRs are: the
        # queue validates buildability and pushes nothing, and the arm64
        # artifact is only ever consumed from a main/tag push.
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node (for dist/ bundling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Set up workspace (pinned bun + warm cache + frozen lockfile)
        # Composite action: pinned bun (not `latest` — an unpinned bun
        # release changing under a release build is a flake vector), bun
        # package cache restore, and `bun install --frozen-lockfile`
        # (a bare `bun install` can silently drift from bun.lock).
        uses: ./.github/actions/setup-switchroom

      - name: Build dist/
        env:
          # Arms the mis-stamp guard in scripts/build.mjs: on a tag build this is
          # the tag (e.g. v0.15.56); on non-tag builds it is empty so the guard
          # stays silent and dev builds fall back to package.json.
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run build

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed. Keyed on
            # the queue ref's sha because `github.event.pull_request.number`
            # is EMPTY on merge_group — interpolating it would emit the
            # invalid reference `${IMAGE}:pr-` and fail the build.
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds: synthesize a non-pushed tag for build-only mode.
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # Every push path (main / tag / dispatch) pushes ONLY the
            # per-arch scratch tag here; merge-base assigns the real
            # tags (:latest / :sha-<short> / :vX.Y.Z) from the merged
            # multi-arch manifest. Nothing user-facing moves until the
            # merge job runs, so a failed arch leg can't leave a
            # single-arch :latest behind.
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) base ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # Cache via GHCR registry, not type=gha (#1965). The GHA
          # Azure-blob backend restores each layer behind a short-lived
          # SAS token; on the heavy images' large layers that token
          # expired / the blob restore stalled mid-copy and HARD-FAILED
          # the build (fatal "failed to compute cache key: failed to
          # copy"). GHCR registry cache has no SAS token to expire,
          # restores over the same path the images already publish to,
          # and a miss is a non-fatal cold build. cache-to is gated to
          # non-PR events: fork PRs have no GHCR write token, and a
          # failed cache export would break the required build check.
          #
          # Per-arch cache tag (:buildcache-<arch>) so the native-runner
          # legs don't overwrite each other's cache; the legacy mixed
          # :buildcache is kept as a read-only fallback so the first
          # run after this split isn't fully cold.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-base:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-base:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-base:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): signed provenance +
          # SBOM only on tag pushes — release artifacts are what
          # `switchroom update` verifies; attestation on every main/PR
          # build was pure export overhead.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # CACHE_BUST is paired with the `ARG CACHE_BUST` in
          # Dockerfile.base immediately before `npm install -g
          # @anthropic-ai/claude-code@latest`. `github.run_attempt`
          # increments only on `gh run rerun` (fresh pushes start at
          # 1), so original commits hit the buildkit cache for fast
          # builds, while a rerun forces a fresh npm resolve and
          # picks up the current `@latest` from the registry. This
          # is the canonical "give me the newest claude" lever:
          # `gh run rerun <run-id>` → fresh image → `switchroom
          # update` → fleet bumps.
          build-args: |
            CACHE_BUST=${{ github.run_attempt }}

  # Stitch the per-arch base images into the final multi-arch manifest.
  # Manifest-only (`imagetools create`): no rebuild, no layer re-export.
  merge-base:
    needs: build-base
    # merge_group excluded: this job PUBLISHES (:latest / :sha-<short> /
    # :vX.Y.Z) from the per-arch scratch tags. A queue run pushes no
    # scratch tags and must never move a user-facing tag — publication
    # happens on the real push to main after the merge lands.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-base.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately. This job is
      # manifest-only: `docker buildx imagetools inspect|create` are pure
      # registry operations that never touch BuildKit, and the buildx CLI
      # is preinstalled on GitHub-hosted runners with a `default` builder
      # on the `docker` driver. setup-buildx-action defaults to the
      # `docker-container` driver, which boots a BuildKit container by
      # pulling `moby/buildkit:buildx-stable-1` from DOCKER HUB — a hard
      # docker.io dependency (unauthenticated, rate-limited, and outside
      # GHCR) for a capability these jobs never use. That pull is what
      # reddened main twice: run 30138853707 (retag-unchanged,
      # 2026-07-25) and run 29977369227 (promote-to-dev, 2026-07-23),
      # both `ERROR: ... registry-1.docker.io/v2/: ... Client.Timeout
      # exceeded` while "booting buildkit". Dropping the step removes the
      # dependency outright rather than retrying around it.
      #
      # NOTE: the real BUILD jobs (build-base / build-dependents /
      # build-hindsight / build-voice) still set up buildx — they need
      # the docker-container driver for multi-platform + cache export.
      # Only the four manifest-only jobs (merge-base, merge-dependents,
      # retag-unchanged, promote-to-dev) drop it. The same fix applies
      # to promote.yml's `promote` job, which had the identical bug on
      # the RELEASE path.
      #
      # Enforced by tests/docker/manifest-jobs-no-buildx.test.ts: these
      # jobs never run on a PR, so a test is the only thing that stops a
      # future edit from silently re-adding the action and reintroducing
      # a post-merge-only red.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard (#2818 follow-up): a workflow_dispatch
          # on main runs against the tip AT DISPATCH TIME; if main has
          # advanced since, pushing :latest would REGRESS it behind a
          # newer push run's :latest. Skip :latest (keep :sha-<7>) when
          # the checked-out sha is no longer main's tip. Fail-open: if
          # ls-remote can't answer, keep pushing :latest — the guard is
          # a safety net, not a new failure mode for the recovery lever.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # #3685: a tag push publishes the VERSION tag only. Moving
            # :latest here made it follow the TAG PUSH rather than the
            # release's success — docker-images has no dependency on the
            # binary build, the release assets or npm, so a red release
            # still left ghcr.io/switchroom/*:latest on that version.
            # release.yml's `images-latest` job promotes :vX.Y.Z ->
            # :latest through promote.yml once every leg is green. The
            # failure mode is now :latest lagging (recoverable by
            # dispatching promote.yml) instead of :latest leading.
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            # PR C: keep :latest as the canonical install per
            # docs/operators/install.md, BUT also publish :sha-<7> for
            # rollback / promote.yml retagging. (:dev is gated by the
            # smoke-test job and assigned by promote-to-dev — never here.)
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: publish only the per-commit tag; never move
            # :latest from an odd ref or an outdated main sha.
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-dependents:
    # Per-arch dependents FROM the per-arch base scratch tag pushed by
    # build-base — no wait on merge-base (it runs in parallel).
    needs: [changes, build-base]
    # Same gate as build-base, plus an explicit success check on the
    # base build — `!cancelled()` alone would let dependents run past
    # a FAILED base (unlike the default all-needs-succeeded semantics
    # it replaces). merge_group builds here too; see build-base.
    if: ${{ !cancelled() && needs.build-base.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.images == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # merge_group is amd64-only for the same reason PRs are: the
        # queue validates buildability and pushes nothing, and the arm64
        # artifact is only ever consumed from a main/tag push.
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
        image:
          - { name: agent,        file: docker/Dockerfile.agent }
          - { name: broker,       file: docker/Dockerfile.broker }
          - { name: kernel,       file: docker/Dockerfile.kernel }
          - { name: hostd,        file: docker/Dockerfile.hostd }
          - { name: auth-broker,  file: docker/Dockerfile.auth-broker }
          - { name: web,          file: docker/Dockerfile.web }
          # hindsight is NOT here — it has its own `build-hindsight`
          # job (PR #1310) that runs in parallel with build-base
          # because Dockerfile.hindsight extends upstream
          # `vectorize-io/hindsight:latest`, not switchroom-base.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node (for dist/ bundling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Set up workspace (pinned bun + warm cache + frozen lockfile)
        # Composite action: pinned bun (not `latest` — an unpinned bun
        # release changing under a release build is a flake vector), bun
        # package cache restore, and `bun install --frozen-lockfile`
        # (a bare `bun install` can silently drift from bun.lock).
        uses: ./.github/actions/setup-switchroom

      - name: Build dist/
        env:
          # Arms the mis-stamp guard in scripts/build.mjs: on a tag build this is
          # the tag (e.g. v0.15.56); on non-tag builds it is empty so the guard
          # stays silent and dev builds fall back to package.json.
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run build

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + base ref
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image.name }}"
          BASE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-base"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation — see build-base for why the PR
            # number can't be used here. Like a PR, the queue's base
            # build pushed no scratch tag, so build FROM published
            # :latest.
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            # On PRs the base wasn't pushed, so depend on the published
            # :latest (multi-arch; buildx resolves the amd64 leg).
            echo "base=${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            # Per-arch scratch tag; merge-dependents assigns the real
            # tags from the merged manifest (see build-base comment).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) ${{ matrix.image.name }} ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base }}
          # GHCR registry cache, not type=gha — #1965. `agent` (Chromium/
          # webkite/playwright, 143MB layers) is the worst hit: its layers
          # outran the GHA Azure-blob SAS token / stalled mid-restore and
          # hard-failed the build, blocking releases. Registry cache has no
          # SAS expiry; a miss degrades to a cold build. cache-to gated to
          # non-PR (fork PRs can't write GHCR; export failure would break
          # the required check). Per-image, per-arch :buildcache-<arch>
          # tag, mode=max; legacy :buildcache kept as read-only fallback
          # for the first post-split run.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-${{ matrix.image.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-{1}:buildcache-{2},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.image.name, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Stitch the per-arch dependent images into their final multi-arch
  # manifests. Same pattern as merge-base.
  merge-dependents:
    needs: build-dependents
    # merge_group excluded — see merge-base. Publication is a push-to-main
    # concern, never a queue-validation concern.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-dependents.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        image: [agent, broker, kernel, hostd, auth-broker, web]
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-hindsight:
    # Hindsight extends upstream `ghcr.io/vectorize-io/hindsight:latest`
    # rather than `switchroom-base`, so it has no dependency on the
    # base job and runs in parallel. See docker/Dockerfile.hindsight
    # for why we extend instead of running upstream as-is (claude-code
    # provider + claude-agent-sdk + UID pin).
    #
    # Path-gated on PRs AND main pushes (see `changes` header): the
    # hindsight context rarely changes; when it's unchanged on a main
    # push this job skips and retag-unchanged re-points :sha-<short>
    # at the existing :latest manifest. Tags + workflow_dispatch always
    # build.
    #
    # Split per-arch on NATIVE runners (amd64 on ubuntu-latest, arm64 on
    # ubuntu-24.04-arm), exactly like build-base / build-dependents — no
    # QEMU emulation for the arm64 leg, which used to dominate this job's
    # wall time. Each arch leg pushes a temporary `:sha-<short>-<arch>`
    # scratch tag; merge-hindsight then stitches the two into the final
    # multi-arch manifest. PRs / merge_group build amd64 only (validation,
    # no push).
    #
    # On merge_group this SKIPS (`changes` doesn't run there, so the
    # `hindsight` output is empty). That is not a hole: the hindsight
    # image's real gate is docker-e2e's `hindsight-probe`, which DOES run
    # on merge_group, and the path-aware build + publish still happens on
    # the push to main straight after the merge. Forcing the 6.4GB
    # build onto every queue entry would push the queue past its 60-min
    # check_response_timeout for no added signal.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.hindsight == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # PR / merge_group validation: amd64 only — arm64 is only ever
        # consumed from a main/tag push. Non-PR non-queue: both arches,
        # each on a NATIVE runner (no QEMU).
        arch: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-hindsight"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed. Keyed on
            # the queue ref's sha because `github.event.pull_request.number`
            # is EMPTY on merge_group (see build-base).
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR builds: synthesize a non-pushed tag for build-only mode.
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # Every push path (main / tag / dispatch) pushes ONLY the
            # per-arch scratch tag here; merge-hindsight assigns the real
            # tags (:latest / :sha-<short> / :vX.Y.Z) from the merged
            # multi-arch manifest (see build-base comment).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) hindsight ${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.hindsight
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # GHCR registry cache, not type=gha — #1965 (see build-base).
          # Per-arch cache tag (:buildcache-<arch>) so the native-runner
          # legs don't overwrite each other's cache; the legacy mixed
          # :buildcache is kept as a read-only fallback so the first run
          # after this split isn't fully cold.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-hindsight:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner, matrix.arch) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Stitch the per-arch hindsight images into the final multi-arch
  # manifest. Manifest-only (`imagetools create`): no rebuild, no layer
  # re-export. Same pattern as merge-base / merge-dependents.
  merge-hindsight:
    needs: build-hindsight
    # merge_group excluded: this job PUBLISHES (:latest / :sha-<short> /
    # :vX.Y.Z) from the per-arch scratch tags. A queue run pushes no
    # scratch tags and must never move a user-facing tag — publication
    # happens on the real push to main after the merge lands.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.build-hindsight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into multi-arch tags
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-hindsight"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            TAG_ARGS=(-t "${IMAGE}:${TAG_VERSION}")
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            TAG_ARGS=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${SHA_SHORT}")
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: publish only the per-commit tag; never move
            # :latest from an odd ref or an outdated main sha.
            TAG_ARGS=(-t "${IMAGE}:sha-${SHA_SHORT}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA_SHORT}-amd64" \
            "${IMAGE}:sha-${SHA_SHORT}-arm64"

  build-voice:
    # Voice STT sidecar (PR-B2 follow-up). Like build-hindsight this is a
    # standalone image: Dockerfile.voice FROMs `nvidia/cuda:…-cudnn-runtime`,
    # NOT switchroom-base, so it has no base-job dependency and runs in
    # parallel. It bakes no dist/ (pure-Python faster-whisper server), so
    # there's no Node/Bun build step here.
    #
    # Subscription-honest local GPU STT (vision #3): transcribing inbound
    # voice notes on the operator's own GPU, no third-party STT key, no
    # cloud STT dependency (vision #4, always-available). The image only
    # ships CUDA + cuDNN *runtime* libs + faster-whisper's prebuilt
    # CTranslate2 kernels; model weights are NOT baked (fetched once into
    # the voice-model-cache volume on first boot). See docker/Dockerfile.voice.
    #
    # amd64 ONLY — and deliberately so. faster-whisper rides CTranslate2's
    # prebuilt CUDA kernels, which are published for x86_64 GPU hosts; there
    # is no equivalently-supported aarch64 CUDA wheel, and the fleet's GPU
    # hosts are amd64. Building an arm64 leg would emit an image that can't
    # actually run GPU STT, so we don't (this is the one fleet image that
    # is single-arch by design — every other image is amd64+arm64).
    #
    # Path-gated on PRs AND main pushes like build-hindsight (see the
    # `changes` header): the CUDA layers make voice the heaviest build
    # and its context almost never changes; retag-unchanged covers the
    # skipped-on-main-push case. Tags + dispatch always build.
    #
    # Skips on merge_group for the same reason as build-hindsight — this
    # is the single heaviest build in the repo and running it per queue
    # entry would blow the queue's 60-min check_response_timeout. The
    # build + publish still runs on the push to main after the merge.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.voice == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        # Composite action, NOT docker/setup-buildx-action directly (#3815).
        # The docker-container driver boots BuildKit by pulling
        # `moby/buildkit:buildx-stable-1` from DOCKER HUB — unauthenticated,
        # un-retried, and before the GHCR login step below ever runs. 19 of
        # the 21 failed image jobs between 2026-07-16 and 2026-07-27 died
        # exactly there, reddening the required `images-ok` sentinel and
        # ejecting four PRs from the merge queue. The composite warms that
        # image into the runner's local image store behind a bounded,
        # transient-only retry first, which also arms buildx's own
        # "pulling failed, using local image" fallback.
        # Enforced by tests/ci-buildx-warm-pull.test.ts.
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR (push only on main / tags)
        # merge_group excluded: a queue run is validation-only and pushes
        # nothing, so it needs no registry credential.
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-voice"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stale-dispatch guard — see merge-base for rationale.
          PUSH_LATEST=true
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MAIN_TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1 || true)
            if [[ -n "$MAIN_TIP" && "$MAIN_TIP" != "${{ github.sha }}" ]]; then
              PUSH_LATEST=false
              echo "::notice title=stale dispatch::checked-out ${{ github.sha }} is no longer main tip ($MAIN_TIP) — skipping :latest, pushing :sha-${SHA_SHORT} only."
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Version tag only on a tag push — see merge-base (#3685).
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$PUSH_LATEST" == "true" ]]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge-queue validation: build-only, never pushed (see
            # build-hindsight's twin branch).
            echo "tags=${IMAGE}:mq-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # dispatch on a non-main/non-tag ref, or a stale main
            # dispatch: sha tag only (see build-hindsight's twin branch).
            echo "tags=${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main/tag) voice
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.voice
          # Single-arch: CUDA/CTranslate2 GPU runtime is x86_64-only (see
          # job-level comment). No QEMU/arm64 leg on any event.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
          # GHCR registry cache, not type=gha — #1965 (see build-base). The
          # CUDA base + faster-whisper pip layer are heavy, so the registry
          # cache materially shortens warm builds. cache-to gated to non-PR
          # (fork PRs have no GHCR write token; an export failure would break
          # the required build check).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-voice:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/{0}/switchroom-voice:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository_owner) || '' }}
          # sec WS9-F3 (#1418, relaxed per header): attestation on tag
          # pushes only.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # ─── Skip re-export of unchanged images (main pushes) ─────────────
  # hindsight / voice enumerate their FULL build-input set in
  # .github/path-filters.yml, so "filter says unchanged" provably means
  # "the image content is identical to the previous main build". When
  # their build jobs are path-skipped on a main push, this job re-points
  # `:sha-<short>` at the existing `:latest` manifest with
  # `docker buildx imagetools create` (same no-rebuild pattern as
  # promote-to-dev) — every main commit then has a complete
  # per-commit tag set with zero build/export cost.
  #
  # DELIBERATELY NOT applied to base/dependents: their images bake dist/
  # bundles derived from effectively all of src/, which the `images`
  # filter only partially covers — a filter-driven "unchanged" verdict
  # there would be unsound, and a content-digest scheme short of
  # actually building is exactly the fragile hashing we avoid. Their
  # skip-cost is instead attacked by the native-arm64 split + the
  # attestation relaxation above.
  retag-unchanged:
    needs: changes
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.hindsight != 'true' || needs.changes.outputs.voice != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :latest as :sha-<7> for path-skipped images
        env:
          HINDSIGHT_CHANGED: ${{ needs.changes.outputs.hindsight }}
          VOICE_CHANGED: ${{ needs.changes.outputs.voice }}
        run: |
          set -euo pipefail
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          retag() {
            local name="$1"
            local IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${name}"
            # Tolerate a missing :latest (fresh fork / first-ever run):
            # only a genuine NOT-FOUND is a benign skip; any other
            # inspect error fails loudly (same discipline as
            # promote-to-dev — never mask registry/auth trouble).
            local out
            if out=$(docker buildx imagetools inspect "${IMAGE}:latest" 2>&1); then
              docker buildx imagetools create -t "${IMAGE}:sha-${SHA_SHORT}" "${IMAGE}:latest"
              echo "retagged ${IMAGE}:latest -> ${IMAGE}:sha-${SHA_SHORT} (inputs unchanged this commit)"
            elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found|404|no such manifest|MANIFEST_UNKNOWN'; then
              echo "::notice title=retag-unchanged skipped::${IMAGE}:latest absent (never built in this namespace) — nothing to retag."
            else
              echo "::error title=retag-unchanged failed::inspecting ${IMAGE}:latest failed with a non-absence error (registry/auth/network?)."
              printf '%s\n' "$out"
              exit 1
            fi
          }
          if [ "$HINDSIGHT_CHANGED" != "true" ]; then retag hindsight; fi
          if [ "$VOICE_CHANGED" != "true" ]; then retag voice; fi

  # PR C: smoke test the freshly-pushed :sha-<7> agent image — runs the
  # MCP tools/list harness inside a throwaway container with the
  # channels.telegram.enabled:false fixture (no bot-token needed at
  # boot). Validates every tool's input_schema against Anthropic's
  # tool-use constraints (root type:object, no top-level
  # oneOf/anyOf/allOf). Gates the floating :dev tag below — a failed
  # smoke run leaves :sha-<7> pushed (for rollback) but does NOT
  # promote to :dev. Job timeout 5 min.
  smoke-test:
    # merge-dependents is what creates :sha-<7> now (the per-arch build
    # jobs only push scratch tags).
    needs: [merge-dependents]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Set up workspace (pinned bun + warm cache + frozen lockfile)
        # Composite action — pinned bun + cached `bun install
        # --frozen-lockfile` (was unpinned `latest` + bare `bun install`).
        uses: ./.github/actions/setup-switchroom

      - name: Log in to GHCR (smoke pulls private images)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly-pushed :sha-<7> agent image
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-agent:sha-${SHA_SHORT}"
          docker pull "$IMAGE"
          echo "SMOKE_AGENT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run MCP tools/list smoke test
        env:
          RUN_DOCKER_SMOKE: "1"
        run: npx vitest run tests/docker/mcp-tools-list.smoke.test.ts

  # PR C: promote :sha-<7> → :dev for every image when smoke passes.
  # Matrix-fanout retag using buildx imagetools so we don't rebuild.
  promote-to-dev:
    # `build-hindsight` is intentionally decoupled from the base→
    # build-dependents→smoke-test chain (it extends upstream, builds in
    # parallel). But promote-to-dev's `hindsight` matrix leg retags
    # hindsight's `:sha-<short>`, so it MUST gate on build-hindsight
    # succeeding — otherwise a genuine hindsight build/push failure
    # (job green path not taken) could be misread by the retag step as
    # a benign "image unchanged" skip. With build-hindsight in `needs`,
    # a missing `:sha-<short>` at promote time provably means
    # "build succeeded but context unchanged → nothing pushed", never
    # "build failed".
    # Since the hindsight/voice builds became path-gated on main pushes
    # too, their `needs` result can legitimately be `skipped` here — a
    # skip means "context unchanged this commit"; retag-unchanged (also
    # in `needs`) then re-points :sha-<short> at :latest, so the retag
    # step below normally finds it. Its absence-tolerance is retained
    # for the fresh-namespace edge (no :latest to retag from). This
    # `if:` requires smoke-test SUCCESS but only non-failure
    # (success or skipped) from hindsight/voice/retag-unchanged.
    # merge-base is a producing job too: it creates base:sha-<short> on
    # main pushes (build-base only pushes per-arch scratch tags now),
    # and it never legitimately skips on a main push — so require hard
    # success. Without it, a transient merge-base failure would let the
    # base leg's absence-tolerant branch below misread the missing
    # base:sha-<short> as a benign skip and silently hold base:dev back
    # while the other :dev tags advance.
    # merge-hindsight is hindsight's producing job now (build-hindsight
    # only pushes per-arch scratch tags): it creates hindsight:sha-<short>
    # on the changed path (retag-unchanged covers the skipped path). Gate
    # on both build-hindsight AND merge-hindsight non-failure so a genuine
    # hindsight build/merge failure can't be misread as a benign
    # "unchanged → nothing pushed" skip by the retag step below.
    needs: [smoke-test, merge-base, build-hindsight, merge-hindsight, build-voice, retag-unchanged]
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.smoke-test.result == 'success' &&
      needs.merge-base.result == 'success' &&
      needs.build-hindsight.result != 'failure' && needs.build-hindsight.result != 'cancelled' &&
      needs.merge-hindsight.result != 'failure' && needs.merge-hindsight.result != 'cancelled' &&
      needs.build-voice.result != 'failure' && needs.build-voice.result != 'cancelled' &&
      needs.retag-unchanged.result != 'failure' && needs.retag-unchanged.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the merge-dependents matrix + base +
        # hindsight/voice: every image that publishes :sha-<7> on main
        # must be promoted here, or its :dev tag silently stops
        # advancing (web was missing until #2818's follow-up).
        image: [base, agent, broker, kernel, hostd, auth-broker, web, hindsight, voice]
    steps:
      # NO `docker/setup-buildx-action` here, deliberately — manifest-only
      # job; see the full rationale on merge-base above. Enforced by
      # tests/docker/manifest-jobs-no-buildx.test.ts.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag :sha-<7> as :dev (no rebuild)
        run: |
          set -euo pipefail
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/switchroom-${{ matrix.image }}"
          SRC="${IMAGE}:sha-${SHA_SHORT}"
          # An image whose build was path-skipped this commit normally
          # has its `:sha-<short>` created by retag-unchanged above; the
          # absence branch remains for the fresh-namespace edge (no
          # :latest existed to retag from). promote-to-dev `needs` every
          # producing job, so by the time this runs a missing
          # `:sha-<short>` provably means "nothing was ever pushed for
          # this image in this namespace", never "build failed" — the
          # existing `:dev` (if any) is already the last good build →
          # skip.
          #
          # CRITICAL: only skip on a genuine NOT-FOUND. A transient
          # registry/auth/network error from `imagetools inspect` must
          # NOT be misread as "absent" — that would silently stop `:dev`
          # advancing for a CHANGED image (e.g. agent/kernel on a code
          # release). Any non-absence error fails the step loudly.
          if out=$(docker buildx imagetools inspect "$SRC" 2>&1); then
            docker buildx imagetools create -t "${IMAGE}:dev" "$SRC"
            echo "promoted $SRC -> ${IMAGE}:dev"
          elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found|404|no such manifest|MANIFEST_UNKNOWN'; then
            echo "::notice title=promote-to-dev skipped::$SRC absent (nothing pushed for this image). Existing ${IMAGE}:dev retained; nothing to re-promote."
          else
            echo "::error title=promote-to-dev failed::inspecting $SRC failed with a non-absence error (registry/auth/network?) — NOT masking a possibly-real promotion."
            printf '%s\n' "$out"
            exit 1
          fi

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context (see ci-lint.yml header for the
  # pattern). ALWAYS runs and aggregates the path-gated build jobs:
  # pass when every build succeeded OR was legitimately path-skipped;
  # fail when any build/merge/retag failed/cancelled, or when the
  # `changes` filter job itself broke on an event where it gates (can't
  # trust a skip produced by broken infra). Ruleset 16470166 should
  # require `images-ok` as THE single required context for this
  # workflow — keep this `needs` list complete when adding jobs.
  images-ok:
    needs:
      - changes
      - build-base
      - merge-base
      - build-dependents
      - merge-dependents
      - build-hindsight
      - merge-hindsight
      - build-voice
      - retag-unchanged
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          # `changes` is intentionally skipped on tag pushes /
          # workflow_dispatch / merge_group (no diff base) — skipped is
          # fine; only a failure/cancel is infra breakage.
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust skip"
            exit 1
          fi
          fail=0
          for pair in \
            "build-base=${{ needs.build-base.result }}" \
            "merge-base=${{ needs.merge-base.result }}" \
            "build-dependents=${{ needs.build-dependents.result }}" \
            "merge-dependents=${{ needs.merge-dependents.result }}" \
            "build-hindsight=${{ needs.build-hindsight.result }}" \
            "merge-hindsight=${{ needs.merge-hindsight.result }}" \
            "build-voice=${{ needs.build-voice.result }}" \
            "retag-unchanged=${{ needs.retag-unchanged.result }}"; do
            job="${pair%%=*}"; r="${pair#*=}"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::${job}=${r} — real build failure, blocking"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "changes=$c → pass (builds green or path-skipped)"
