name: ci-tests-python

# Python tests for vendored Hindsight scripts. Mirrors Buildkite
# :snake: Python tests (Hindsight scripts). No bun, no node — pure
# python3 stdlib unittest.
#
# Sentinel pattern: see ci-lint.yml header. The real `unittest` job is
# path-gated and legitimately reports `skipped` on unrelated PRs, so it
# cannot be a required check (a skipped required check hard-BLOCKS —
# #1343 / #2237). The always-running `python-ok` sentinel below is the
# context ruleset 16470166 should require for this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue — required contexts must report on the temporary
  # `gh-readonly-queue/main/...` ref. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual recovery lever. GHA marks a run failed (no auto-retry) when
  # its jobs sit queued past the hosted-runner scheduling window during
  # a capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # on the stale run. workflow_dispatch gives `gh workflow run
  # ci-tests-python.yml --ref main` as the re-trigger. (#1336 queue-fail
  # surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue refs get their own group for free — `github.ref` is the
  # `gh-readonly-queue/...` branch, never the PR's `refs/pull/<n>/merge`.
  group: ci-tests-python-${{ github.ref }}
  # NEVER cancel a merge-queue check: a cancelled required context ejects
  # the entry, and cancelling this workflow's `if: always()` sentinel is
  # the #3614 orphan-wedge shape (first observed in THIS workflow).
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # merge_group: no diff base exists on a queue ref, so skip the
      # filter (the job still reports `success`) and run everything.
      # See .github/MERGE-QUEUE.md.
      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        if: github.event_name != 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            relevant:
              - 'vendor/hindsight-memory/scripts/**'
              # The sibling plugin suite. Ran nowhere until #3688, so a PR
              # touching only it started no check at all — see the pytest
              # step in `unittest` below.
              - 'vendor/hindsight-memory/tests/**'
              # The hooks manifest is INPUT to that suite, not just shipped
              # config: `tests/test_manifest.py` reads
              # `<integration root>/hooks/hooks.json` and asserts it parses
              # strictly. Without this line a PR editing only `hooks/`
              # (adding a hook, renaming a matcher) matched no filter, the
              # sentinel skipped `unittest`, and a manifest that no longer
              # matches the shipped hooks could merge green.
              - 'vendor/hindsight-memory/hooks/**'
              - 'docker/voice-sidecar/**'
              - 'docker/litellm-pacer/**'
              # Hindsight server-bump rollout gate (scripts + its self-test).
              - 'scripts/hindsight-rollout-gate/**'
              - '.github/workflows/ci-tests-python.yml'

  unittest:
    needs: changes
    # push / merge_group: always run — both are (candidate) main.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run unittest discover
        working-directory: vendor/hindsight-memory/scripts
        run: python3 -m unittest discover tests/

      # The SIBLING plugin suite (`vendor/hindsight-memory/tests/`). Added by
      # switchroom #3688: until then NO check ran it — the `unittest discover`
      # step above runs `vendor/hindsight-memory/scripts/tests/`, a different
      # directory — and an unrun suite rots into a liability rather than a
      # gate. Proof, found by turning it on:
      # `test_hooks.py::TestRecallHook::test_graceful_on_api_error` had been
      # asserting the pre-#3619 silent-degradation behaviour and was red on
      # `main` (fixed in the same PR).
      #
      # pytest, not `unittest discover`: `tests/conftest.py` is what puts
      # `scripts/` on `sys.path`, the suite uses `monkeypatch`/`tmp_path`
      # fixtures, and `tests/` has no `__init__.py` (discovery refuses it).
      # pytest is the ONLY extra dependency — the suite is otherwise stdlib
      # and needs no network. Same unpinned `pip install -q` shape as
      # ci-evals.yml's `pyyaml`.
      - name: Install pytest (the sibling suite is pytest-only)
        run: pip install -q pytest

      - name: Run vendored plugin tests (pytest)
        working-directory: vendor/hindsight-memory
        run: python3 -m pytest tests/ -q

      # Voice sidecar tests. server.py imports kokoro/misaki lazily, so no ONNX
      # runtime or model is needed — but Stage B token normalisation
      # (docker/voice-sidecar/text_normalize.py) uses num2words for spoken
      # numbers, so the suite is no longer strictly stdlib. Pinned to the same
      # version Dockerfile.voice installs, so CI and the image cannot disagree
      # about number wording.
      - name: Install num2words (voice-sidecar Stage B dependency)
        run: pip install -q "num2words==0.5.14"

      - name: Run voice-sidecar unittests
        working-directory: docker/voice-sidecar
        run: python3 -m unittest discover -s . -p 'test_*.py'

      # Fleet LLM pacer's pure-logic tests (admit / cooldown / fail-open /
      # Retry-After). The test stubs the top-level `litellm` imports via
      # sys.modules, so no litellm / redis pip install is needed here.
      - name: Run litellm-pacer unittests
        working-directory: docker/litellm-pacer
        run: python3 -m unittest discover -s . -p 'test_*.py'

      # Hindsight server-bump rollout gate. Stdlib-only, no network. This
      # suite exists because the gate's first version would have reported a
      # fully-red board on healthy data at rollout time (switchroom#4533
      # comparison B: same code, restored copy, 30/30 cells flagged) and had
      # never been run against a known-good or known-bad input.
      - name: Run hindsight-rollout-gate unittests
        working-directory: scripts/hindsight-rollout-gate
        run: python3 -m unittest discover -s tests -t .

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context (see ci-lint.yml header for the
  # pattern). ALWAYS runs: passes when `unittest` succeeded OR was
  # legitimately path-skipped (PR touching no python), fails on a real
  # test failure/cancellation, and fails when the `changes` filter job
  # itself broke — a broken filter must not read as "nothing relevant
  # changed" and silently disable the gate.
  python-ok:
    needs: [changes, unittest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          r='${{ needs.unittest.result }}'
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust the skip"
            exit 1
          fi
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "::error::unittest=$r — real python test failure, blocking"
            exit 1
          fi
          echo "changes=$c unittest=$r → pass (ran=success, or skipped on irrelevant PR)"
