schema_version: 1
# Allowlisted desired-state keys for fleet-config/*.yaml, with their types.
# This is not /etc/hermes/config.yaml (the managed policy layer).
# Types: str, bool, int, bool|str (either), list[str], list[provider]
# ({provider, model} entries) and dict (a nested mapping with no null values).
# dict[T] is a mapping whose every value, at any depth, is a T (str, bool, int
# or bool|str); dict[T|null] also accepts an explicit null, meaning "no value
# for this" (for example dict[str|null] for a state name that may be unset).
managed_leaves:
  # Overlay declarations for the setup check. Hermes ignores top-level keys
  # that start with an underscore.
  _switchroom.coding_clis: list[str]
  _switchroom.connect_provides: list[str]
  _switchroom.primary_plan: str
  _switchroom.role_plans: dict
  _switchroom.secrets_source: str
  _switchroom.skill_pack: str
  agent.disabled_toolsets: list[str]
  agent.system_prompt: str
  agent.verify_on_stop: bool
  approvals.cron_mode: str
  approvals.mode: str
  approvals.single_query_mode: str
  approvals.unattended_mode: str
  auxiliary.approval.fallback_chain: list[provider]
  auxiliary.approval.model: str
  auxiliary.approval.provider: str
  auxiliary.compression.fallback_chain: list[provider]
  auxiliary.compression.model: str
  auxiliary.compression.provider: str
  auxiliary.group_router.fallback_chain: list[provider]
  auxiliary.group_router.model: str
  auxiliary.group_router.provider: str
  auxiliary.profile_describer.fallback_chain: list[provider]
  auxiliary.profile_describer.model: str
  auxiliary.profile_describer.provider: str
  auxiliary.title_generation.fallback_chain: list[provider]
  auxiliary.title_generation.model: str
  auxiliary.title_generation.provider: str
  delegation.fallback_providers: list[provider]
  delegation.model: str
  delegation.provider: str
  display.busy_input_mode: str
  display.busy_text_mode: str
  fallback_providers: list[provider]
  gateway.multiplex_profiles: bool
  memory.provider: str
  model.default: str
  model.provider: str
  plugins.enabled: list[str]
  plugins.config.disk-cleanup: dict
  plugins.entries.claude-account-connectors.settings: dict
  plugins.entries.linear.settings: dict
  prompt_caching.cache_ttl: str
  session_reset: dict
  stt.enabled: bool
  stt.provider: str
  terminal.cwd: str
  tts.provider: str
  tts.providers.text-only: dict
  voice.auto_tts: bool
  web.search_backend: str
  web.use_gateway: bool
