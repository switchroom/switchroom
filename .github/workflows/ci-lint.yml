name: ci-lint

# Type-check + 3 lint scripts. Mirrors Buildkite step :lock: Type check.
#
# Sentinel pattern (corrects the #1331 if:-skip approach):
#   A skipped *required* status check is NOT success on classic branch
#   protection — it blocks (proven by #1343, a docs-only PR, hard-
#   BLOCKED). So the real work runs in `lint-run` (path-gated, may
#   skip), and the required context `lint` is a SENTINEL job that
#   ALWAYS runs and reports success when lint-run succeeded OR skipped,
#   failure only when lint-run actually failed. Branch protection keeps
#   requiring `lint` — now always-reporting — so doc/CI-only PRs merge
#   without --admin while real lint failures still block.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue. GitHub pushes a temporary `gh-readonly-queue/main/...`
  # ref and waits for the ruleset's required contexts to report ON THAT
  # REF via `merge_group`. Without this trigger the workflow never runs
  # there, `lint` is never produced, and the entry sits in
  # AWAITING_CHECKS until `check_response_timeout_minutes` ejects it.
  # See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual recovery lever. GHA marks a run failed (no auto-retry) when
  # its jobs sit queued past the hosted-runner scheduling window during
  # a capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # on the stale run. workflow_dispatch gives `gh workflow run
  # ci-lint.yml --ref main` as the re-trigger. (#1336 queue-fail
  # surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.ref` on a merge_group run is the queue's own
  # `refs/heads/gh-readonly-queue/main/pr-<n>-<sha>` — distinct from the
  # PR's `refs/pull/<n>/merge` and from `refs/heads/main`, so the queue
  # run can never share a group with (and be cancelled by) the PR run.
  group: ci-lint-${{ github.ref }}
  # NEVER cancel a merge-queue check. A cancelled required context is
  # not success — the queue would eject the entry — and cancelling an
  # `if: always()` sentinel mid-flight is the exact #3614 orphan-wedge
  # shape, which on a queue ref would pin the group for the whole
  # 60-min timeout window.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.lint }}
    steps:
      # merge_group: NO path filtering — see .github/MERGE-QUEUE.md.
      # The job itself still runs (so it reports `success`, not
      # `skipped`, to the sentinel); only the diff is skipped, because a
      # queue ref has no PR base to diff against and a dorny failure
      # here would hard-fail the sentinel and block the queue.
      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        if: github.event_name != 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # Shared external filters file — the sec WS9-F1 (#1402)
          # security-load-bearing path list is defined ONCE there and
          # anchored into each workflow's filter key. See the header of
          # .github/path-filters.yml for the rationale.
          filters: .github/path-filters.yml

  lint-run:
    needs: changes
    # Push to main: always run (don't gamble on main).
    # merge_group: always run — the queue ref IS candidate main, and a
    #   path-skipped job would leave the required `lint` context resting
    #   on nothing.
    # PR: gate on changed paths.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history. `check-agent-attribution-trailers.mjs` (part of
          # `bun lint`) diffs `origin/<base>..HEAD`; under the default
          # depth-1 checkout there is no base ref, so it SKIPs — a silent
          # pass that would make the required `lint` context certify a
          # guarantee it never actually checked.
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Run lint
        # `bun lint` = tsc --noEmit + plugin-references + bot-api-wrapping +
        # bun-test-imports. Same command path as Buildkite.
        #
        # `check-changelog-entry.mjs` (part of `bun lint`) reads the PR body +
        # labels for its escape hatch (`no-changelog` label / `[skip changelog]`
        # token). GITHUB_EVENT_NAME / GITHUB_BASE_REF are set by Actions; the
        # body + labels are not, so surface them here.
        #
        # `github.event.pull_request.*` is EMPTY on push and merge_group, so the
        # `!= 'merge_group'` term states that at the interpolation site rather
        # than leaving it implicit — the same shape docker-images.yml's tag step
        # uses, and what tests/ci-merge-queue-triggers.test.ts requires of any
        # step reading PR-only context. On a queue ref both render '' and the
        # check SKIPs the event outright; on push it diffs an empty range.
        env:
          CHANGELOG_PR_BODY: ${{ github.event_name != 'merge_group' && github.event.pull_request.body || '' }}
          CHANGELOG_PR_LABELS: ${{ github.event_name != 'merge_group' && join(github.event.pull_request.labels.*.name, ' ') || '' }}
        run: bun lint

  # ─── Sentinel ─────────────────────────────────────────────────────
  # The branch-protection-required context. ALWAYS runs (if: always(),
  # no path gate) so it always reports. Pass when lint-run succeeded or
  # was skipped (irrelevant PR); fail only when lint-run truly failed
  # or was cancelled.
  lint:
    needs: [changes, lint-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          r='${{ needs.lint-run.result }}'
          # If the path-filter job itself broke, lint-run is skipped for
          # an infra reason (not "irrelevant PR") — don't false-green.
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust skip"
            exit 1
          fi
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "::error::lint-run=$r — real lint failure, blocking"
            exit 1
          fi
          echo "changes=$c lint-run=$r → pass (ran=success, or skipped on irrelevant PR)"
