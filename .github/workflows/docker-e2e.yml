name: docker-e2e

# CI gate for the docker integration suite (tests/docker/*.test.ts).
# Builds the phase1b-test / phase2a-test / phase2b-test image set
# locally, then runs vitest against tests/docker/. Phase 2c includes
# the op:put round-trip + DAC_OVERRIDE + vault-dir guard cases that
# the v0.7.12 deploy regression (#958) would have caught.
#
# Triggers narrowly so PRs to e.g. docs/ don't pay the docker-build
# cost. The path filter matches the files whose changes can break
# the e2e shape (also the files the image-cache key hashes — keep
# the two lists in sync).
#
# Image-cache strategy (warm vs cold path):
#   - Restore /tmp/switchroom-images.tar via actions/cache, keyed on
#     the Dockerfiles + build-images.sh + every src/** subtree that
#     gets baked into an image. Cache hit → `docker load` → skip the
#     entire ~90s buildx pass.
#   - On miss, run the full build sequence and save the resulting
#     5-image tarball back into the cache. actions/cache auto-uploads
#     in the post step.
#   The cache key intentionally hashes only paths that change image
#   bytes — a doc-only PR (which wouldn't trigger this workflow
#   anyway) would not invalidate. A PR touching src/vault/** does
#   invalidate, which is correct: the broker bundle inside the image
#   needs to be rebuilt.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue — required contexts must report on the temporary
  # `gh-readonly-queue/main/...` ref. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual recovery lever. GHA marks a run failed (no auto-retry) when
  # its jobs sit queued past the hosted-runner scheduling window during
  # a capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # on the stale run. workflow_dispatch gives `gh workflow run
  # docker-e2e.yml --ref main` as the re-trigger. (#1336 queue-fail
  # surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read

# workflow_dispatch runs get their own concurrency group (keyed by
# run id) so pushes to the same ref can't cancel a manually requested
# recovery run — dispatch is the recovery lever advertised above, so
# it must not be cancellable by the very traffic it recovers from
# (same pattern as docker-images.yml, #1336).
#
# merge_group runs keep the plain `github.ref` group (the queue's own
# `gh-readonly-queue/...` branch — never shared with the PR's
# `refs/pull/<n>/merge`), but are NOT cancellable: a cancelled required
# context ejects the queue entry, and cancelling the `e2e-ok`
# `if: always()` sentinel is the #3614 orphan-wedge shape.
concurrency:
  group: docker-e2e-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}

jobs:
  # ─── Path-change filter (sentinel pattern; see ci-lint.yml header) ─
  # This filter job always runs; the real work jobs (`e2e-shard`,
  # `hindsight-probe`) are `if:`-gated on its outputs and report
  # `skipped` on PRs that don't touch the paths they cover.
  #
  # A `skipped` check is NOT success for branch protection — it BLOCKS
  # (proven by #1343, a docs-only PR hard-blocked; same deadlock as
  # #2237). So neither `e2e-shard` nor `hindsight-probe` can be a required
  # context, and in fact neither has ever been in ruleset 16470166.
  # The `e2e-ok` sentinel at the bottom of this file exists for exactly
  # that reason: it ALWAYS runs, so it is the one context here that can
  # safely be marked required, and it converts "path-skipped" into pass
  # while still failing on a real failure/cancellation — including a
  # failure of this `changes` job itself, since a broken path filter
  # would otherwise silently disable the whole gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      hindsight: ${{ steps.filter.outputs.hindsight }}
      hindsightwatch: ${{ steps.filter.outputs.hindsightwatch }}
    steps:
      # merge_group: no diff base exists on a queue ref, so skip the
      # filter (the job still reports `success`, which `e2e-ok` requires)
      # and run everything below. See .github/MERGE-QUEUE.md.
      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        if: github.event_name != 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            relevant:
              - 'src/vault/**'
              - 'src/cli/apply.ts'
              - 'src/agents/compose.ts'
              - 'src/agent-scheduler/**'
              - 'docker/Dockerfile.base'
              - 'docker/Dockerfile.broker'
              - 'docker/Dockerfile.kernel'
              - 'docker/Dockerfile.agent'
              - 'docker/Dockerfile.auth-broker'
              - 'src/auth/broker/**'
              - 'tests/docker/**'
              # tests/docker/hindsight-maintenance.test.ts reads this script
              # with readFileSync and spawns it — neither is an import, so
              # vitest's module-graph tracing (`--changed` in ci-tests-core)
              # cannot reach the suite from a script-only edit. Listed here so
              # the vacuum/reindex/alarm guards actually run for exactly the
              # change they exist to police.
              - 'docker/hindsight-maintenance.sh'
              - '.github/workflows/docker-e2e.yml'
            # The hindsight image is NOT built by build-images.sh — it is the
            # pinned upstream image plus baked patches. It gets its own job
            # (hindsight-probe) and its own filter output.
            #
            # dockerfile-hindsight-bakes.test.ts is listed even though it is a
            # pure grep-on-file suite, because the ordinary `vitest --changed`
            # shards CANNOT reach it from a Dockerfile edit: it loads the
            # Dockerfile with readFileSync, which is not an import, so vitest's
            # module-graph tracing sees no dependency. Verified — touching only
            # docker/Dockerfile.hindsight makes `vitest run --changed` report
            # "No test files found". Without this entry the structural
            # anchor/negative guards would be skipped for exactly the change
            # they exist to police. The hindsight-probe job runs them.
            #
            # hindsight-pg-fsync-probe.test.ts boots the REAL entrypoint in the
            # real image, so its inputs are the entrypoint and the module that
            # supplies its env — both listed, or a PR that turned fsync back off
            # would get no probe run until the merge queue.
            hindsight:
              - 'docker/Dockerfile.hindsight'
              # Every probe runner below drives docker through this helper, so
              # a change to it changes how all of them execute. Listed for the
              # same reason as the Dockerfile: the hindsight-probe job is gated
              # on this filter, not on `vitest --changed`.
              - 'tests/docker/_exec-async.ts'
              - 'docker/hindsight-entrypoint.sh'
              - 'src/setup/hindsight-pg-defaults.ts'
              - 'tests/docker/hindsight-pg-fsync-probe.test.ts'
              - 'tests/docker/hindsight-search-patches.test.ts'
              - 'tests/docker/hindsight-recall-isolation-patches.test.ts'
              - 'tests/docker/hindsight-retry-perturbation-patches.test.ts'
              - 'tests/docker/hindsight-mm-refresh-debounce-patch.test.ts'
              - 'tests/docker/hindsight-pg-search-tokenizer-drift-patch.test.ts'
              - 'tests/docker/hindsight-pg-search-filter-pushdown-patch.test.ts'
              - 'tests/docker/hindsight-text-search-migration-patch.test.ts'
              - 'tests/docker/hindsight-graph-seed-retirement.test.ts'
              - 'tests/docker/hindsight-maxitems-grammar-patch.test.ts'
              - 'src/setup/hindsight-perf-defaults.ts'
              - 'tests/docker/hindsight-reflect-directives-patch.test.ts'
              - 'tests/docker/hindsight-recall-budget-reflect-grounding-patches.test.ts'
              - 'tests/docker/hindsight-reranker-priority-patch.test.ts'
              - 'tests/docker/hindsight-work-conserving-admission-patch.test.ts'
              - 'tests/docker/hindsight-query-analyzer-languages.test.ts'
              - 'tests/docker/hindsight-temporal-offload-patch.test.ts'
              - 'tests/docker/hindsight-metrics-cardinality-patch.test.ts'
              - 'tests/docker/hindsight-graph-maintenance-retry-storm.test.ts'
              - 'tests/docker/hindsight-graph-maintenance-bounded-sweep.test.ts'
              - 'tests/docker/hindsight-graph-maintenance-interval-sweep.test.ts'
              - 'tests/docker/dockerfile-hindsight-bakes.test.ts'
              - '.github/workflows/docker-e2e.yml'
            # hindsight-watch's streak probe (#4620) asserts its OUTCOME
            # against a real PostgreSQL, because the defect lives in SQL and no
            # cheaper layer can see which rows the server actually aggregates.
            # That test `skipIf`s without docker, so the ordinary vitest shards
            # (which have docker but never set the require flag) would let a
            # semantics regression through on the hermetic string pins alone.
            # It gets a job here — the only workflow that already treats a
            # docker-dependent probe as a gate.
            #
            # The whole directory, not a file list: the enumeration already
            # omitted `types.ts`, which the probe imports and the gated test
            # pulls in transitively, so a change there would not have run the
            # gate. A list has to be maintained by whoever next adds a file to
            # the module and silently loses coverage when they don't; the glob
            # cannot drift. It costs at most one extra 34s job on a change to
            # a file the gated test does not read.
            hindsightwatch:
              - 'src/hindsight-watch/**'
              - '.github/workflows/docker-e2e.yml'

  # ─── Sharded docker e2e run ───────────────────────────────────────
  # The tests/docker suite is split across a 3-way matrix so it runs on
  # three free parallel runners instead of one (~8 min of test execution
  # → ~3 min wall clock). Mirrors the ci-tests-core.yml vitest-shard
  # pattern: a matrix job whose contexts (`e2e-shard (1..3)`) are NOT
  # branch-protection-required, aggregated by the always-running `e2e-ok`
  # sentinel below.
  #
  # Isolation across shards is already guaranteed by the suite itself:
  # every test container carries a `switchroom.test=phase*` label and
  # runs under its own compose project, so three shards on three separate
  # runners never collide. Each shard leg does the SAME image
  # build/cache setup the single job did — the warm-tarball cache is
  # keyed on file hashes, so all three shards share one key (first cold
  # build populates it; the rest hit it warm or cold-build in parallel,
  # all free).
  #
  # Sharding is threaded into scripts/ci/docker-snapshot-gate.sh via the
  # VITEST_SHARD env var (e.g. "2/3"); unset, the gate runs the whole
  # suite (the original single-runner path, preserved for other callers).
  e2e-shard:
    needs: changes
    # push / merge_group: always run — both are (candidate) main. On the
    # queue ref this is the job that actually catches a semantic conflict
    # between two individually-green PRs, so it must not be skippable.
    #
    # workflow_dispatch is here because the header advertises `gh workflow
    # run docker-e2e.yml --ref main` as THE recovery lever, and without
    # this term it recovered nothing: `changes` has no diff base on a
    # dispatch, so `relevant` came back false and the whole workflow
    # reported a 3-second green with zero tests run. Verified on run
    # 31131064381 (2026-08-06): e2e + hindsight-probe both `skipped`,
    # `e2e-ok` `success`. A recovery lever that reports success without
    # running is worse than no lever.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Restore image cache (key on Dockerfiles + image-baked sources)
        # The cache stores a single tarball of all 5 images
        # (base, agent, broker, kernel, auth-broker) at phase1b-test.
        # Restore is ~5-10s for a ~500MB tarball; the build it replaces
        # is ~90s. On a hit we skip dist build, buildx setup, and the
        # whole image build sequence.
        id: img-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/switchroom-images.tar
          key: docker-images-${{ hashFiles('docker/Dockerfile.base', 'docker/Dockerfile.broker', 'docker/Dockerfile.kernel', 'docker/Dockerfile.agent', 'docker/Dockerfile.auth-broker', 'tests/docker/build-images.sh', 'src/vault/**', 'src/agents/compose.ts', 'src/agent-scheduler/**', 'src/auth/broker/**', 'src/cli/apply.ts', 'bun.lock', 'telegram-plugin/bun.lock', 'scripts/build.mjs') }}

      - name: Load images from cache (warm path)
        if: steps.img-cache.outputs.cache-hit == 'true'
        run: |
          echo "[cache] hit — loading 5 images from tarball"
          docker load -i /tmp/switchroom-images.tar
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep ':phase1b-test' | sort

      - name: Build dist/ (cold path)
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: bun scripts/build.mjs

      - name: Set up Docker Buildx (cold path)
        # Must use the `docker` driver, NOT the default `docker-container`
        # driver. build-images.sh chains `FROM switchroom/base:phase1b-test`
        # in the agent/broker/kernel Dockerfiles, which only resolves if
        # the base image is in the local docker daemon. docker-container
        # has a separate buildkit cache and won't see `--load`-pushed
        # images on subsequent builds, so the chained `FROM` fails with
        # "pull access denied" against the (non-existent)
        # docker.io/switchroom/base image.
        if: steps.img-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker

      - name: Build phase1b-test images (cold path)
        # Single-arch (amd64) — ubuntu-latest is amd64. Cross-arch
        # validation lives in docker-images.yml.
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: bash tests/docker/build-images.sh

      - name: Save images to cache tarball (cold path)
        # actions/cache auto-uploads /tmp/switchroom-images.tar in the
        # post-job step when cache-hit was false. We just need the file
        # on disk by then.
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          docker save \
            switchroom/base:phase1b-test \
            switchroom/agent:phase1b-test \
            switchroom/broker:phase1b-test \
            switchroom/kernel:phase1b-test \
            switchroom/auth-broker:phase1b-test \
            -o /tmp/switchroom-images.tar
          ls -lh /tmp/switchroom-images.tar

      - name: Tag phase2a-test / phase2b-test aliases
        # tests/docker/phase2c-vault-integration.test.ts looks for
        # broker:phase2a-test and kernel:phase2b-test. Same image bytes
        # as phase1b-test; version suffix is just a hashable name for
        # skip-discipline. Runs in both cache-hit and cache-miss paths.
        run: |
          docker tag switchroom/broker:phase1b-test switchroom/broker:phase2a-test
          docker tag switchroom/kernel:phase1b-test switchroom/kernel:phase2b-test

      - name: Run docker e2e suite (with pre/post snapshot gate)
        # Wraps vitest in a docker-ps pre/post snapshot diff. Catches
        # the case where vitest crashes before afterAll() runs and
        # leaks containers (the recurring `friendly_chatelet` flake —
        # see #1102). Ephemeral GHA runner still benefits: a leak
        # between assertions inside a single run is what this catches.
        #
        # Two GHA-specific fixes that previously kept this suite from
        # running on hosted runners landed alongside this workflow:
        #
        #   1. broker-ipc-race.test.ts:265 — `kernelLookup` defaulted
        #      its `container` arg to `switchroom-${agent}` (the
        #      production container name). On a clean-room runner
        #      that container doesn't exist → every exec returns
        #      exit=1 → 0/45 succeed. The default is now required.
        #
        #   2. _prod-snapshot.ts:27 — the PHASE_TEST_NAME regex only
        #      matched `switchroom-phase<digit>`; it didn't match the
        #      compose-project pattern `phase<digit><letter>-...` used
        #      by broker-ipc-race + per-agent-isolation. Filter now
        #      covers both shapes.
        #
        # VITEST_SHARD threads this matrix leg's shard into the gate's
        # `vitest run` so each of the 3 runners executes a third of the
        # tests/docker suite.
        env:
          VITEST_SHARD: ${{ matrix.shard }}/3
        run: bash scripts/ci/docker-snapshot-gate.sh

      - name: Capture broker / kernel logs on failure
        if: failure()
        run: |
          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"
          for c in $(docker ps -aq --filter label=switchroom.test=phase2c); do
            echo "::group::logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Label-scoped teardown
        if: always()
        run: |
          # Belt-and-braces — afterAll() inside the tests already does
          # this. Strict label filter; never touches anything else on
          # the runner.
          for label in switchroom.test=phase1b switchroom.test=phase2a switchroom.test=phase2b switchroom.test=phase2c; do
            ids=$(docker ps -aq --filter label=$label 2>/dev/null || true)
            if [ -n "$ids" ]; then
              docker rm -f $ids 2>/dev/null || true
            fi
          done

  # ─── Hindsight patch probe (F5: this must NEVER silently skip) ────
  # tests/docker/hindsight-search-patches.test.ts and
  # tests/docker/hindsight-recall-isolation-patches.test.ts are the only
  # behavioural evidence that the patches baked into docker/Dockerfile.hindsight
  # actually change tokenization/error behaviour and recall admission/worker
  # scheduling — changes that reach every live agent's recall. The first
  # previously used
  # `describe.skipIf(!imageOk)` with a deliberate no-pull policy, so on a
  # hosted runner (where the 6.4GB upstream image is never present) it
  # reported green without executing a single assertion.
  #
  # This job pulls the digest-pinned upstream image and sets
  # SWITCHROOM_REQUIRE_HINDSIGHT_PROBE=1, under which the suite treats an
  # unavailable docker/image as a HARD FAILURE. It is a separate job from
  # `e2e-shard` because the pull is large and unrelated to the phase1b image set,
  # and because it must not share that job's disk budget.
  hindsight-probe:
    needs: changes
    # merge_group is included alongside push for the reason stated above:
    # this job exists so the patch probe can NEVER silently skip, and the
    # queue ref is the last gate before those patches reach main. Letting
    # it path-skip on the new candidate-main path would contradict the
    # job's entire purpose. workflow_dispatch: the recovery lever must
    # actually run the probe (see the e2e-shard `if:` above for the run
    # that proved it did not).
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.hindsight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Free disk space (overlapping the structural guards) for the 6.4GB pull
        # The ~101s `sudo rm -rf` of the runner's preinstalled SDK trees used
        # to run SERIALLY before the 6.4GB image pull. Here it is BACKGROUNDED
        # so it overlaps the (disk-free, no-docker) Dockerfile structural
        # guards below instead of blocking: the guards read only
        # docker/Dockerfile.hindsight via readFileSync and touch none of the
        # deleted paths (node/npx are system installs, not under
        # $AGENT_TOOLSDIRECTORY — proven by this deletion already preceding the
        # guards today), so the two are safe to run concurrently. We `wait`
        # for the cleanup to finish and re-print `df` at the END of this step,
        # so disk is provably freed BEFORE the space-hungry pull step that
        # follows — no disk-full race mid-pull. Kept in ONE step on purpose so
        # the background job cannot outlive the step boundary: no cross-step
        # orphan to reap, fully deterministic.
        run: |
          df -h /
          ( sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true ) &
          CLEAN_PID=$!
          # Structural guards, deliberately BEFORE the 6.4GB pull so an
          # anchor/negative-guard regression fails in seconds. These are the
          # only place the exact-once anchors and the withdrawn-patch negative
          # guards are checked, and `vitest --changed` cannot select this file
          # from a Dockerfile edit (readFileSync is not an import) — so if it
          # does not run here, it does not run at all. Its exit status is the
          # step's, so a failing guard still fails the job.
          npx vitest run tests/docker/dockerfile-hindsight-bakes.test.ts
          # Block until the backgrounded cleanup is done so the pull below sees
          # the freed disk. `|| true` because the cleanup already tolerates its
          # own failures (`|| true` inside), and `wait` must not trip `set -e`.
          wait "$CLEAN_PID" || true
          df -h /

      - name: Pull the digest-pinned upstream hindsight image
        # Ref is read from the Dockerfile's FROM line so it can never drift
        # from what the test asserts (the test re-reads the same line). This is
        # the RAW upstream image the reranker probe's RED arm runs against.
        run: |
          ref="$(grep -m1 '^FROM ' docker/Dockerfile.hindsight | awk '{print $2}')"
          echo "pulling $ref"
          docker pull "$ref"
          docker image inspect "$ref" >/dev/null

      - name: Pull the digest-pinned Postgres for the bounded-sweep SQL arm
        # The bounded-sweep probe's SQL arm EXECUTES the shipping sweep
        # statement against a real server — the only executable proof that the
        # hash slice filter PARTITIONS the bank (a substring check cannot tell a
        # partition from a filter that puts every row in slice 0). Same
        # anti-drift rule as above: the ref is read from the test file that
        # asserts it rather than duplicated here. ~120MB alpine, not a second
        # 6.4GB pull. `test -n` so a rename of the constant fails the job loudly
        # instead of silently leaving the arm unpullable (which under
        # SWITCHROOM_REQUIRE_HINDSIGHT_PROBE=1 is a hard failure anyway).
        run: |
          ref="$(grep -oE 'postgres@sha256:[0-9a-f]{64}' \
                 tests/docker/hindsight-graph-maintenance-bounded-sweep.test.ts | head -1)"
          test -n "$ref"
          echo "pulling $ref"
          docker pull "$ref"
          docker image inspect "$ref" >/dev/null

      - name: Set up Docker Buildx (docker driver) for the through-built image
        # The reranker-priority probe's GREEN arm runs against the actual
        # THROUGH-BUILT switchroom-hindsight image, because #3142's anchors and
        # post-conditions depend on three earlier switchroom patches that raw
        # upstream lacks (see hindsight-reranker-priority-patch.test.ts) — the
        # only correct base is the fully-patched source tree, which the shipping
        # image IS. We build it here rather than pull it: build-hindsight (in
        # docker-images.yml) does not push on PRs, and cross-workflow image
        # hand-off is fragile — so, mirroring how the `e2e-shard` job builds its own
        # image set in-job, this job builds the image it needs.
        #
        # `driver: docker` builds straight into the daemon's image store (same
        # rationale as the `e2e-shard` job) so the just-pulled FROM digest resolves
        # locally and the built tag is immediately runnable by `docker run`.
        # BuildKit (via buildx) is REQUIRED for Dockerfile.hindsight: its patch
        # steps are `RUN python3 - <<'PYEOF'` heredocs, which the legacy builder
        # silently no-ops (feeding python empty stdin), leaving every patch
        # unapplied.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker

      - name: Build the through-built hindsight image (reranker GREEN arm)
        # Single-arch (amd64) local build — the reranker probe only exercises
        # the pure-stdlib priority executor, but we build the WHOLE shipping
        # image so the GREEN arm reads the exact bytes that ship, with no
        # in-test re-patching or patch-sequence duplication. A failing patch
        # assert here fails the build (same signal as build-hindsight).
        #
        # cache-from (read-only) reuses the registry build cache that
        # docker-images.yml's build-hindsight pushes — the amd64 leg writes
        # `:buildcache-amd64` (this probe is a single-arch amd64 build), with
        # the legacy mixed `:buildcache` kept as a fallback for the first run
        # after the per-arch split. No cache-to here: this job never publishes
        # cache, it only reads it to skip cold layers (~110s → warm). A miss or
        # an unauthenticated 401/404 is non-fatal (buildx degrades to a cold
        # build), so this is safe on PR / fork runs that can't read GHCR.
        run: |
          docker buildx build --load \
            -f docker/Dockerfile.hindsight \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache-amd64 \
            --cache-from type=registry,ref=ghcr.io/${{ github.repository_owner }}/switchroom-hindsight:buildcache \
            -t switchroom-hindsight:probe \
            .
          docker image inspect switchroom-hindsight:probe >/dev/null

      - name: Run the hindsight patch probe (RED/GREEN, must not skip)
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-search-patches.test.ts

      - name: Run the hindsight recall-isolation probe (RED/GREEN, must not skip)
        # Same contract as the step above, for the admission-split /
        # worker-slot-ceiling / sem-logging patches. A separate step so a
        # failure names which patch family broke, and so the pulled image is
        # reused rather than pulled twice.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-recall-isolation-patches.test.ts

      - name: Run the hindsight retry-perturbation probe (RED/GREEN, must not skip)
        # Same contract again, for the perturbed-JSON-retry patch (#3669).
        # This is the layer the bakes test structurally CANNOT provide:
        # its assertions are unanchored substring matches, so indenting the
        # perturbation under a falsy guard leaves all 24 of them green while
        # the behaviour is gone (measured 2026-07-26 — bakes 24/24 pass,
        # this probe goes red on TEMPERATURES/DISTINCT_RETRY_REQUESTS).
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-retry-perturbation-patches.test.ts

      - name: Run the hindsight MM-refresh-debounce probe (RED/GREEN, must not skip)
        # Same contract again, for the MM-refresh-debounce patch. The bakes
        # test cannot cover the failure that matters here: its assertions are
        # unanchored substring matches, so a helper that exists but is never
        # consulted by the trigger loop (the #3660-class indent-under-a-falsy-
        # guard revert) stays green there while every consolidation round goes
        # back to regenerating every mental model — the measured 1,902
        # refreshes/day loop. Only running the shipping trigger loop and
        # observing which candidates it actually submits catches it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-mm-refresh-debounce-patch.test.ts

      - name: Run the hindsight metrics-cardinality probe (RED/GREEN, must not skip)
        # Same contract again, for the /metrics endpoint-label cardinality patch.
        # The bakes test cannot cover what matters here: it can only see that a
        # regex string is present, not that the resulting `endpoint` label is
        # actually bounded. Only importing the shipping
        # `normalize_http_endpoint` and counting the distinct labels a corpus of
        # REAL document ids produces catches a fix that handles the uuid-leading
        # shape but not the `agent-`-prefixed one — which is exactly the half-fix
        # the unanchored upstream regex already is.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-metrics-cardinality-patch.test.ts

      - name: Run the hindsight graph-maintenance retry-storm probe (RED/GREEN, must not skip)
        # Same contract, for the graph_maintenance retry-storm fix. The bakes
        # test is grep-on-file and cannot see the outcomes that matter here:
        # (a) on Python 3.11 `asyncio.TimeoutError` IS builtin `TimeoutError`,
        # which is an `OSError` SUBCLASS — so an `_is_retryable` whose OSError
        # arm is checked first returns True regardless of `retry_timeouts`,
        # leaving the fix silently inert while every string assertion stays
        # green; (b) that Pass 2's committed orphan count survives a Pass-3
        # retry instead of being clobbered to 0. Only driving the real
        # `retry_with_backoff` / `run_graph_maintenance_job` and counting
        # attempts + reading back the reported counters catches either.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-graph-maintenance-retry-storm.test.ts

      - name: Run the hindsight graph-maintenance bounded-sweep probe (RED/GREEN, must not skip)
        # The bounded-sweep fix, and the ONLY place it is really executed. The
        # bakes test is grep-on-file; the properties that matter are all
        # behavioural — that the caller actually LOOPS, that the cursor strictly
        # ADVANCES, that the shrink retries the SAME cursor, that slice_count is
        # derived from the bank size the job measured (a fixed count would put
        # quiet banks on a weeks-long rotation, since this job is demand-driven,
        # not timed), and that the `_SWEEP_MAX_PAGES` tripwire actually fires.
        #
        # Its SECOND arm executes the shipping sweep statement against the
        # digest-pinned Postgres pulled above: a substring check cannot tell a
        # hash-slice PARTITION from a filter that puts every row in slice 0, and
        # `AND 0 * (...)` was green against the string-only version.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-graph-maintenance-bounded-sweep.test.ts

      - name: Run the hindsight graph-maintenance interval-sweep probe (RED/GREEN, must not skip)
        # The periodic-sweep fix, and the ONLY place it is really executed.
        # Upstream's graph maintenance is enqueue-driven only, so a bank whose
        # graph_maintenance_queue drains stops being swept for ever (klanker:
        # zero attempts for five days, measured 2026-08-13). The properties
        # that matter are all behavioural — that a bank with an EMPTY queue
        # really gets an async_operations row created, that it happens through
        # `force_sweep=True` on the REAL submit method rather than by inserting
        # fake queue rows, that the per-tick cap bounds the wave, and that the
        # tenant id travels with the request context.
        #
        # Its SECOND arm executes the shipping discovery statement against the
        # digest-pinned Postgres pulled above: only a real server can prove the
        # in-flight guard actually skips a bank whose sweep is `processing`
        # (`status IN ('pending')` greps clean and stampedes), and that the
        # jitter term really spreads the wave off #4624's 120s slice clock.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-graph-maintenance-interval-sweep.test.ts

      - name: Run the hindsight pg_search tokenizer-drift probe (RED/GREEN, must not skip)
        # Epic #4474 finding C1. The bakes test can only see that the patch TEXT
        # is present; it cannot see the outcome that matters — that the shipping
        # text_signals migration, handed a live STEMMED ParadeDB index, emits a
        # CREATE INDEX that still carries `stemmer=english`. Upstream emits
        # `(id, text, context, text_signals)` there, silently unstemmed, on a
        # POPULATED table, with no error and no log line. Only running the real
        # `_pg_upgrade()` and reading back the DDL it emits catches that.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-pg-search-tokenizer-drift-patch.test.ts

      - name: Run the hindsight pg_search filter-pushdown probe (RED/GREEN, must not skip)
        # Epic #4474 phase P4 (#4478). The bakes test can only see that the
        # filter-field map and the literal cast are PRESENT in the patched
        # source; it cannot see the outcome that matters — that the two real
        # shipping migrations emit a CREATE INDEX carrying
        # `(bank_id::pdb.literal), (fact_type::pdb.literal)`, on the fresh-install
        # path AND on both rebuild branches. The regression this guards is
        # silent and expensive: without those columns ParadeDB degrades the
        # recall arm's `bank_id`/`fact_type` equality to a post-scoring
        # heap_filter, so every keyword arm scores the whole table (measured
        # 171,517 vs 405 shared buffer hits per arm, 423x) with identical
        # RESULTS — nothing but a plan or a latency chart can tell.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-pg-search-filter-pushdown-patch.test.ts

      - name: Run the hindsight text-search migration-path probe (RED/GREEN, must not skip)
        # #4506. The bakes test can only see that the new guard conditions are
        # PRESENT in the patched source; it cannot see the outcome that matters
        # — that the real shipping `ensure_text_search_extension`, handed a
        # populated table whose text-search INDEX was dropped while
        # `search_vector` survived, REPAIRS it instead of raising. Upstream
        # raises there on every backend including the one already configured
        # ("from pg_textsearch to pg_search" on 801,792 rows, observed), so the
        # database comes up on none of them. The same probe pins the other half:
        # a genuinely lossy pg_search → native switch on populated tables must
        # STILL be refused, and an index-only rebuild must not drop a populated
        # tsvector column. Only running the real function and reading back the
        # DDL it emits can tell those four states apart.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-text-search-migration-patch.test.ts

      - name: Run the hindsight graph-seed RETIREMENT probe (RED/GREEN, must not skip)
        # The v0.8.5 upstream #2968 carry was retired in the v0.8.6 base bump —
        # upstream ships the behaviour natively and exposes
        # HINDSIGHT_API_GRAPH_SEED_MIN_SIMILARITY. This step did NOT go away with
        # it: deleting the only probe that ever asserted the behaviour would
        # leave nobody checking the behaviour SURVIVED the retirement.
        #
        # It now proves the successor mechanism live — that the native seed reuse
        # is present in the pinned image AND that switchroom's explicit floor
        # emission is what the engine resolves. That second half is why the
        # bakes test cannot replace this: a deleted emission still leaves a
        # working image (upstream defaults to 0.3), so only booting the config
        # with an OFF-DEFAULT floor and reading it back can go red on it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-graph-seed-retirement.test.ts

      - name: Run the hindsight maxItems-grammar SUCCESSOR probe (RED/GREEN, must not skip)
        # The consolidation-maxItems-grammar patch was retired in the v0.8.6 base
        # bump in favour of HINDSIGHT_API_LLM_SUPPORTS_MAX_ITEMS. Same reasoning
        # as the step above: the probe stays, re-pointed at the successor.
        #
        # The failure that matters is unchanged and the bakes test still cannot
        # cover it: if the env key stops reaching the container, the schema is
        # once again uncompilable by a local GBNF backend, and every
        # consolidation call on a large bank silently falls over to the metered
        # provider, carrying private corpus text off-host. Only serialising the
        # model out of the running image and reading the emitted maxItems
        # catches that — and the DEFAULT arm is deliberately the RED one, so a
        # probe that stopped configuring anything cannot pass.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-maxitems-grammar-patch.test.ts

      - name: Run the hindsight reflect-directives probe (RED/GREEN, must not skip)
        # Same contract again, for the reflect-directive-isolation patch
        # (switchroom #3967, upstream vectorize-io/hindsight#1269 / #3031).
        # The bakes test cannot cover the failure that matters here: its
        # assertions are unanchored substring matches, so reverting the spliced
        # value to True — a single token — leaves them green while every tagged
        # directive is again silently dropped from synthesis (45% of this
        # fleet's active directives). Only loading real directives out of a real
        # database with the kwargs reflect actually passes, and reading which
        # ones reach directives_applied and the system prompt, catches it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-reflect-directives-patch.test.ts

      - name: Run the hindsight recall-budget/reflect-grounding probe (RED/GREEN, must not skip)
        # Same contract, for the mcp-recall-token-budget and
        # reflect-temperature patches. The bakes test cannot cover the
        # failures that matter here: its assertions are unanchored substring
        # matches, so a helper that exists but is never routed through, or a
        # temperature that is resolved but reaches zero call sites, both stay
        # green there. Only driving the real registered MCP tool (and
        # measuring the tokens it returns) and the shipping module's call
        # sites catches them.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-recall-budget-reflect-grounding-patches.test.ts

      - name: Run the hindsight reranker-foreground-priority probe (RED/GREEN, must not skip)
        # Same contract, for the #3142 reranker-foreground-priority patch (OPEN
        # upstream). The bakes test cannot cover the failure that matters here:
        # its assertions are grep-on-file, so a _PriorityRerankExecutor that
        # exists but orders its queue FIFO (a reverted (priority, seq) key, or a
        # background flag threaded but never consulted) stays green there while
        # interactive reranks are once again starved behind the background
        # fan-out. Only constructing the real pool, occupying its single worker,
        # and observing that queued foreground jobs run before an
        # earlier-submitted background one catches it. The GREEN arm runs
        # against the through-built image built above (SWITCHROOM_HINDSIGHT_
        # BUILT_IMAGE); the RED arm runs against the raw pinned upstream.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
          SWITCHROOM_HINDSIGHT_BUILT_IMAGE: switchroom-hindsight:probe
        run: npx vitest run tests/docker/hindsight-reranker-priority-patch.test.ts

      - name: Run the hindsight work-conserving-admission probe (RED/GREEN, must not skip)
        # Same contract, for the work-conserving recall-admission gate (v2 of
        # the admission split). The bakes test cannot cover the failure that
        # matters here: its assertions are grep-on-file, so a gate whose borrow
        # predicate is inverted, or an admit() call hard-coded to False, stays
        # green there while either the drain crawls at 2/8 of the budget again
        # or background recalls jump the foreground queue. Only saturating a
        # real gate with queued background recalls and timing a foreground
        # admission catches it. TWO RED arms against the raw pinned upstream —
        # bare (no priority) and split-only (not work-conserving, today's
        # shipping behaviour) — plus a patched GREEN arm; the through-built arm
        # (SWITCHROOM_HINDSIGHT_BUILT_IMAGE) additionally asserts the #4212
        # rerank-lane invariants survive the gate.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
          SWITCHROOM_HINDSIGHT_BUILT_IMAGE: switchroom-hindsight:probe
        run: npx vitest run tests/docker/hindsight-work-conserving-admission-patch.test.ts

      - name: Run the hindsight query-analyzer-language probe (RED/GREEN, must not skip)
        # Same contract, for the dateparser language pin. At v0.9.0 upstream
        # #3154 replaced switchroom's #4313 patch with a native knob whose
        # DEFAULT is still the 200+-locale auto-detect, so what buys the ~165x
        # now is switchroom emitting HINDSIGHT_API_QUERY_ANALYZER_LANGUAGES on
        # every host. No grep-on-file test can see that: the emission lives in
        # TypeScript and the cost lives in the image. This probe runs the pinned
        # upstream image with the variable UNSET (RED — no languages= reaches
        # search_dates) and set to the emitted value (GREEN — pinned, still
        # parses), so dropping or demoting the emission reds here.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-query-analyzer-languages.test.ts

      - name: Run the hindsight temporal-offload probe (RED/GREEN, must not skip)
        # Same contract, for the temporal-offload patch (this PR). The bakes
        # test cannot cover the outcome that matters here: its assertions are
        # grep-on-file, so a `run_in_executor` wrapper that exists but is never
        # awaited at the call site — or a char cap wired but never applied —
        # stays green there while temporal extraction again blocks the shared
        # asyncio loop for seconds. Only an asyncio loop-lag probe (max
        # inter-tick gap while a real ≥150ms extraction runs off-loop) catches
        # it. RED applies only #4313 (sync-inline blocks the loop ≈ full parse);
        # GREEN applies #4313 + this block (gap stays tiny, cap bounds cost).
        # Both arms run against the raw pinned upstream image via `docker exec`.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-temporal-offload-patch.test.ts

      - name: Run the embedded-postgres fsync probe (RED/GREEN, must not skip)
        # NOT a patch probe: this one boots the REAL docker/hindsight-entrypoint.sh
        # inside the pinned image and reads `SHOW fsync` off the server it
        # started. pg0 launches postgres with `-F` (fsync OFF), which is how an
        # HNSW index on memory_units silently corrupted on 2026-07-29 after one
        # of the container's 6-20 daily unclean shutdowns — data_checksums
        # cannot see a lost write. The entrypoint overrides it with a trailing
        # `-c fsync=on`, and whether postgres HONOURS that over pg0's earlier
        # `-F` is a property of a pinned third-party binary, not of this repo:
        # every unit-level test stays green if pg0 reorders its argv or starts
        # writing postgresql.conf. Only this step sees it. Both arms run, so a
        # probe that stopped observing the real server cannot pass.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-pg-fsync-probe.test.ts

      - name: Label-scoped teardown
        if: always()
        run: |
          for phase in hindsight-search-patches hindsight-recall-isolation-patches hindsight-retry-perturbation-patches hindsight-mm-refresh-debounce-patch hindsight-pg-search-tokenizer-drift-patch hindsight-pg-search-filter-pushdown-patch hindsight-text-search-migration-patch hindsight-graph-seed-retirement hindsight-maxitems-grammar-patch hindsight-reflect-directives-patch hindsight-recall-budget-reflect-grounding hindsight-reranker-priority-patch hindsight-query-analyzer-languages hindsight-temporal-offload-patch hindsight-graph-maintenance-retry-storm hindsight-graph-maintenance-bounded-sweep hindsight-graph-maintenance-interval-sweep hindsight-pg-fsync-probe; do
            ids=$(docker ps -aq --filter "label=switchroom.test=$phase" 2>/dev/null || true)
            if [ -n "$ids" ]; then docker rm -f $ids 2>/dev/null || true; fi
          done

  # ─── hindsight-watch streak probe against a real PostgreSQL (#4620) ─
  # Cheap by design: no image build, no 6.4GB pull — one throwaway
  # `postgres:16-alpine` (~80MB), booted and torn down by the test
  # itself, on `--network none`.
  #
  # SWITCHROOM_REQUIRE_PG_PROBE=1 is the whole point. Without it the
  # test `skipIf`s when docker is unavailable, which is right on a dev
  # box and useless as a gate: the remaining hermetic assertions in
  # probe.test.ts are TEXT PINS, so a rewrite that preserved the
  # strings while breaking the semantics would pass everywhere. With
  # it, an absent docker or image FAILS the job instead of skipping,
  # so the only assertions in the repo that can fail on the #4620
  # outcome always run.
  #
  # merge_group and push run it unconditionally, same reasoning as
  # hindsight-probe: a job that exists so a probe cannot silently skip
  # must not silently skip on candidate-main. workflow_dispatch is here
  # for the same reason it is on e2e-shard and hindsight-probe: `changes`
  # has no diff base on a dispatch, so `hindsightwatch` comes back false
  # and the advertised recovery lever would exercise no pg probe at all
  # (#4638). The job needs nothing the dispatch path lacks — no service
  # container, no secret, no input; it pulls postgres:16-alpine itself.
  hindsight-watch-pg-probe:
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.hindsightwatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Pull postgres:16-alpine
        # Pulled HERE rather than left to the test: the test deliberately
        # refuses to pull (it must not drag an image onto a dev box), and with
        # SWITCHROOM_REQUIRE_PG_PROBE=1 a cache miss is a hard failure.
        run: |
          docker pull postgres:16-alpine
          docker image inspect postgres:16-alpine >/dev/null

      - name: Streak retention floor, against a real PostgreSQL
        env:
          SWITCHROOM_REQUIRE_PG_PROBE: "1"
        run: npx vitest run src/hindsight-watch/streak-retention-floor.pg.test.ts

      - name: Teardown any orphaned probe container
        if: always()
        run: |
          ids=$(docker ps -aq --filter "name=swr-streak-floor-" 2>/dev/null || true)
          if [ -n "$ids" ]; then docker rm -f $ids 2>/dev/null || true; fi

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context (see ci-lint.yml header for the
  # pattern). ALWAYS runs and aggregates the path-gated jobs above:
  # pass when every one succeeded OR was legitimately path-skipped;
  # fail when any failed/was cancelled, or when the `changes` filter
  # job itself broke (can't trust a skip produced by broken infra).
  # Ruleset 16470166 should require `e2e-ok` as THE single required
  # context for this workflow — the `e2e-shard` matrix legs and
  # `hindsight-probe` themselves cannot be required (they legitimately
  # skip, and a skipped required check hard-blocks: #1343 / #2237, and a
  # matrix leg's context is `e2e-shard (N)`, not a stable name). A single
  # `needs: e2e-shard` here aggregates ALL matrix legs: it is `success`
  # only if every shard succeeded, `failure`/`cancelled` if any did.
  # hindsight-probe in particular exists so the behavioural patch probe
  # can never silently skip; it only actually gates via this sentinel.
  # Keep this `needs` list complete when adding jobs.
  #
  # THREE states, not two (#4619). `e2e-ok` is a REQUIRED context, so it
  # cannot go non-green when the shards path-skip — that would hard-block
  # every docs-only PR (#1343 / #2237 all over again). But "green because
  # nothing ran" and "green because e2e passed" are not the same claim,
  # and reading the first as the second is what got #4619 approved and
  # then EJECTED from the merge queue when `hindsight-probe` failed on the
  # `merge_group` ref it had never run on. So:
  #
  #   ran + passed   → success, "VERIFIED" in the summary
  #   ran + failed   → failure (unchanged)
  #   path-skipped   → success (required-context constraint) but a loud
  #                    `::warning::` annotation + a step summary that says
  #                    NOT VERIFIED HERE and names the queue ref as the
  #                    place it will actually run
  #   skipped when it was supposed to run → FAILURE. A skip is only
  #                    legitimate when the path filter said so; a skip on
  #                    push / merge_group / workflow_dispatch (all
  #                    must-run events) means the gate is broken, not
  #                    satisfied, and that used to read as a pass.
  e2e-ok:
    needs: [changes, e2e-shard, hindsight-probe, hindsight-watch-pg-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          E2E_SHARD: ${{ needs.e2e-shard.result }}
          HINDSIGHT_PROBE: ${{ needs.hindsight-probe.result }}
          HINDSIGHT_WATCH_PG_PROBE: ${{ needs.hindsight-watch-pg-probe.result }}
          # Empty on push / merge_group / workflow_dispatch — the filter
          # steps don't run there. `must_run` covers those events.
          WANT_E2E_SHARD: ${{ needs.changes.outputs.relevant }}
          WANT_HINDSIGHT_PROBE: ${{ needs.changes.outputs.hindsight }}
          WANT_HINDSIGHT_WATCH_PG_PROBE: ${{ needs.changes.outputs.hindsightwatch }}
        run: |
          set -u
          if [ "$CHANGES" = "failure" ] || [ "$CHANGES" = "cancelled" ]; then
            echo "::error::changes=$CHANGES — path-filter infra failed; can't trust the skip"
            exit 1
          fi

          # Events where the work jobs are unconditional (their `if:` has
          # no filter term). A skip on one of these is a broken gate.
          # One set for all three: since #4638 every work job's `if:`
          # carries the same push / merge_group / workflow_dispatch terms
          # (hindsight-watch-pg-probe used to omit workflow_dispatch and
          # needed a separate, weaker `must_run_pg` to excuse the skip).
          # If a job's `if:` ever diverges again, split this back out —
          # the set must be derived from the gate it is judging.
          must_run=0
          case "$EVENT" in
            push|merge_group|workflow_dispatch) must_run=1 ;;
          esac

          fail=0
          verified=0
          unverified=0
          summary=""

          verdict() {
            job="$1"; result="$2"; want="$3"; must="$4"
            case "$result" in
              success)
                verified=$((verified + 1))
                summary="${summary}| \`${job}\` | ${result} | ran and passed |"$'\n'
                ;;
              failure|cancelled)
                echo "::error::${job}=${result} — real e2e failure, blocking"
                fail=1
                summary="${summary}| \`${job}\` | ${result} | FAILED |"$'\n'
                ;;
              skipped)
                if [ "$must" = "1" ] || [ "$want" = "true" ]; then
                  echo "::error title=e2e gate broken::${job} was SKIPPED on a ref where it must run (event=${EVENT}, path-filter=${want:-n/a}) — that is a broken gate, not a satisfied one"
                  fail=1
                  summary="${summary}| \`${job}\` | ${result} | SKIPPED BUT SHOULD HAVE RUN |"$'\n'
                else
                  unverified=$((unverified + 1))
                  echo "::warning title=e2e NOT verified on this ref::${job} was path-skipped, so e2e correctness is UNVERIFIED here — this green means \"not run\", not \"passed\". It runs for real on the merge-queue ref, where a PR can still be ejected (#4619)."
                  summary="${summary}| \`${job}\` | ${result} | path-skipped — **not verified here** |"$'\n'
                fi
                ;;
              *)
                echo "::error::${job}=${result} — unrecognised result, refusing to call it a pass"
                fail=1
                summary="${summary}| \`${job}\` | ${result} | unrecognised |"$'\n'
                ;;
            esac
          }

          verdict e2e-shard "$E2E_SHARD" "$WANT_E2E_SHARD" "$must_run"
          verdict hindsight-probe "$HINDSIGHT_PROBE" "$WANT_HINDSIGHT_PROBE" "$must_run"
          verdict hindsight-watch-pg-probe "$HINDSIGHT_WATCH_PG_PROBE" \
            "$WANT_HINDSIGHT_WATCH_PG_PROBE" "$must_run"

          if [ "$fail" -ne 0 ]; then
            headline="❌ FAILED"
          elif [ "$unverified" -gt 0 ] && [ "$verified" -eq 0 ]; then
            headline="⚪ NOT VERIFIED on this ref (everything path-skipped)"
          elif [ "$unverified" -gt 0 ]; then
            headline="🟡 PARTIALLY VERIFIED on this ref"
          else
            headline="✅ VERIFIED on this ref"
          fi

          {
            echo "### e2e-ok — ${headline}"
            echo ""
            echo "| job | result | meaning |"
            echo "| --- | --- | --- |"
            printf '%s' "$summary"
            echo ""
            if [ "$unverified" -gt 0 ] && [ "$fail" -eq 0 ]; then
              echo "\`e2e-ok\` is a required context and therefore stays green when the"
              echo "path filter skips the work jobs — but **a green here does not mean e2e"
              echo "passed**. The skipped jobs run unconditionally on the \`merge_group\`"
              echo "ref, so a PR merged on this signal can still be ejected from the queue"
              echo "(that is exactly what happened to #4619)."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          echo "event=$EVENT changes=$CHANGES e2e-shard=$E2E_SHARD hindsight-probe=$HINDSIGHT_PROBE hindsight-watch-pg-probe=$HINDSIGHT_WATCH_PG_PROBE → ${headline}"
          [ "$fail" -eq 0 ] || exit 1
