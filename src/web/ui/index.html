<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchroom Fleet</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #22263a;
      --border: #2a2e3e;
      --text: #e1e4ed;
      --text-dim: #8b8fa3;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --blue: #60a5fa;
      --radius: 10px;
      /* Names the mono stack already used inline throughout this file. */
      --mono: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--text-dim); font-weight: 400; }

    .refresh-info {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .agent-card:hover { border-color: #3a3e4e; }

    .card-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.inactive { background: var(--red); }
    .status-dot.auth-warning { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }

    .agent-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .agent-topic {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .card-meta {
      padding: 0 1.25rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .meta-item label {
      color: var(--text-dim);
      opacity: 0.7;
    }

    .meta-item span { color: var(--text); }

    /* Context-headroom gauge (RFC context-headroom-surface). */
    .ctx-gauge { display: inline-flex; align-items: center; gap: 0.4rem; }
    .ctx-text { color: var(--text); font-variant-numeric: tabular-nums; }
    .ctx-bar {
      display: inline-block; width: 48px; height: 6px; border-radius: 3px;
      background: var(--bg-dim, rgba(255,255,255,0.12)); overflow: hidden;
    }
    .ctx-fill { display: block; height: 100%; border-radius: 3px; }

    .scope-toggle {
      cursor: pointer;
      color: var(--text);
      border-bottom: 1px dotted var(--text-dim);
      user-select: none;
    }
    .scope-toggle:hover { color: var(--blue); }
    .scope-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .scope-caret {
      display: inline-block;
      width: 0.9em;
      margin-right: 0.15rem;
      color: var(--text-dim);
      font-size: 0.75em;
    }
    .scope-list {
      list-style: none;
      margin: 0.35rem 0 0;
      padding: 0.5rem 0.75rem;
      width: 100%;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.78rem;
      line-height: 1.5;
    }
    .scope-list li {
      color: var(--text);
      word-break: break-all;
      padding: 0.1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .scope-list li:last-child { border-bottom: none; }

    .card-actions {
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover { background: var(--surface-hover); border-color: #4a4e5e; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.btn-start { color: var(--green); border-color: rgba(52,211,153,0.3); }
    .btn.btn-start:hover { background: rgba(52,211,153,0.1); }
    .btn.btn-stop { color: var(--red); border-color: rgba(248,113,113,0.3); }
    .btn.btn-stop:hover { background: rgba(248,113,113,0.1); }
    .btn.btn-restart { color: var(--blue); border-color: rgba(96,165,250,0.3); }
    .btn.btn-restart:hover { background: rgba(96,165,250,0.1); }

    .card-logs {
      display: none;
      border-top: 1px solid var(--border);
    }

    .card-logs.open { display: block; }

    .logs-header {
      padding: 0.5rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .logs-header button {
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-size: 0.78rem;
    }

    .log-output {
      padding: 0.75rem 1.25rem;
      max-height: 300px;
      overflow-y: auto;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-dim);
      background: rgba(0,0,0,0.2);
    }

    .error-banner {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--red);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    /* ProblemDetail block — an actionable error/degraded state with a
       remediation. Reuses the error-banner palette but in a muted card so it
       reads as "here is what to do", not just "something is broken". */
    .problem {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.28);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .problem.muted {
      background: var(--surface-hover);
      border-color: var(--border);
    }
    .problem-title { font-weight: 600; color: var(--text); }
    .problem.muted .problem-title { color: var(--text); }
    .problem:not(.muted) .problem-title { color: var(--red); }
    .problem-detail { color: var(--text-dim); margin-top: 0.25rem; }
    .problem-remediation { margin-top: 0.55rem; }
    .problem-remediation .rem-label { color: var(--text-dim); display: block; margin-bottom: 0.3rem; }
    .problem-cmd {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .problem-cmd code {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.5rem;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.75rem;
      color: var(--text);
      user-select: all;
      word-break: break-all;
    }
    .problem-copy {
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--blue);
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .problem-copy:hover { background: var(--surface-hover); }
    .problem-remediation a { color: var(--blue); }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--text-dim);
    }

    nav.tabs {
      display: flex;
      gap: 0.25rem;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
    }

    nav.tabs button {
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    nav.tabs button.active {
      color: var(--text);
      border-bottom-color: var(--blue);
    }

    nav.tabs button:hover { color: var(--text); }

    .card-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      font-size: 0.8rem;
    }

    .card-detail.open { display: block; }

    .card-detail h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
      margin-top: 0.75rem;
    }
    .card-detail h4:first-child { margin-top: 0; }

    .chip {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--surface-hover);
      font-size: 0.72rem;
      color: var(--text);
      margin-right: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .chip.missing { color: var(--yellow); border: 1px solid rgba(251,191,36,0.4); background: rgba(251,191,36,0.05); }

    .config-pre {
      background: rgba(0,0,0,0.3);
      padding: 0.6rem;
      border-radius: 6px;
      max-height: 240px;
      overflow: auto;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      white-space: pre;
    }

    table.accounts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.accounts-table th, table.accounts-table td {
      padding: 0.6rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    table.accounts-table th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      font-weight: 500;
    }

    .health-badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
    }
    .health-badge.healthy { color: var(--green); background: rgba(52,211,153,0.12); }
    .health-badge.expired,
    .health-badge.missing-credentials,
    .health-badge.missing-refresh-token { color: var(--red); background: rgba(248,113,113,0.12); }
    .health-badge.quota-exhausted { color: var(--yellow); background: rgba(251,191,36,0.12); }

    .quota-pct { font-variant-numeric: tabular-nums; }
    .quota-pct.high { color: var(--red); }
    .quota-pct.mid { color: var(--yellow); }
    .quota-pct.stale { color: var(--text-dim); font-style: italic; }
    .agent-list { font-size: 0.8rem; color: var(--text-dim); }
    .agent-list.primary { color: var(--text); }
    .usage-pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .usage-pill.primary {
      color: var(--green);
      background: rgba(52,211,153,0.12);
    }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1.25rem; min-width: 320px; max-width: 480px;
    }
    .modal h3 { margin: 0 0 0.75rem 0; }
    .modal label { display: block; font-size: 0.8rem; color: var(--text-dim); margin: 0.5rem 0 0.25rem 0; }
    .modal select, .modal input { width: 100%; padding: 0.4rem; background: rgba(0,0,0,0.3);
      border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
    .modal-actions { margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1rem;
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.85rem; z-index: 200; max-width: 420px;
    }
    .toast.ok { border-color: var(--green); }
    .toast.err { border-color: var(--red); }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .account-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      transition: border-color 0.15s;
    }

    .account-card:hover { border-color: #3a3e4e; }

    .account-card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .account-label {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
    }

    .account-usage {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    @media (max-width: 700px) {
      .accounts-table-wrap { display: none; }
    }

    @media (min-width: 701px) {
      /* The Accounts tab shows a wide-screen TABLE and a mobile card grid,
         hiding the grid on desktop. Scope that hide to #accounts: the
         Connections tab reuses .accounts-grid for its OAuth/Notion cards but
         has NO table fallback, so an unscoped rule blanked every connection
         card on any screen wider than 700px (the cards rendered but were
         display:none, while the empty-state text — not in a grid — still
         showed). */
      #accounts .accounts-grid { display: none; }
    }

    @media (max-width: 600px) {
      header { padding: 1rem; }
      main { padding: 1rem; }
      .agents-grid { grid-template-columns: 1fr; }
      .accounts-grid { grid-template-columns: 1fr; }
      .card-meta { gap: 0.3rem 1rem; }
      nav.tabs { padding: 0 1rem; overflow-x: auto; }
    }

    /* --- Memory tab: banded cards, provenance bars, model relationships --- */
    .mm-band { padding: .55rem 0; border-top: 1px solid var(--border); }
    .mm-band-h { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: .4rem; display: flex; align-items: center; gap: .4rem; }
    .mm-band-h .n { color: var(--text); opacity: .6; }
    .mm-stat-line { color: var(--text); font-size: .9em; line-height: 1.5; }
    .mm-stat-line .dim { color: var(--text-dim); }
    /* stacked provenance bar (segments sized by source-fact composition) */
    .prov-bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--border); margin: .35rem 0 .15rem; }
    .prov-bar > span { display: block; min-width: 2px; }
    .prov-obs { background: var(--blue); }
    .prov-dir { background: var(--green); }
    .prov-der { background: var(--yellow); }
    .prov-legend { font-size: .72rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: .15rem .8rem; margin-top: .3rem; }
    .prov-legend i { width: .6rem; height: .6rem; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: .25rem; }
    /* freshness heat-strip: one cell per model */
    .heat { display: flex; gap: 2px; flex-wrap: wrap; margin-top: .4rem; }
    .heat span { width: 16px; height: 8px; border-radius: 2px; }
    .heat .fresh { background: var(--green); }
    .heat .stale { background: var(--yellow); }
    .heat .cold { background: var(--text-dim); opacity: .45; }
    .heat .corrupt { background: var(--red); }
    /* model rows + cluster (hub→leaf) tree connectors */
    .mm-row { padding: .4rem 0; }
    .mm-row + .mm-row { border-top: 1px solid var(--border); }
    .mm-cluster { border-top: 1px solid var(--border); }
    .mm-cluster .mm-row + .mm-row { border-top: none; }
    .mm-top { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap; }
    .mm-name { font-weight: 600; }
    .mm-meta { font-size: .8em; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
    .mm-why { color: var(--text-dim); font-size: .84em; margin-top: .12rem; }
    .mm-leaf { padding-left: 1.15rem; position: relative; }
    .mm-leaf::before { content: ""; position: absolute; left: .35rem; top: 0; bottom: 0; border-left: 2px solid var(--border); }
    .mm-leaf:last-child::before { bottom: calc(100% - 1.05rem); }
    .mm-leaf::after { content: ""; position: absolute; left: .35rem; top: 1.05rem; width: .5rem; border-top: 2px solid var(--border); }
    /* relationship chips */
    .mm-chips { margin-top: .25rem; font-size: .8em; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
    .mm-chip { background: var(--surface-hover); border: 1px solid var(--border); border-radius: 5px; padding: 0 .35rem; cursor: pointer; color: var(--text); }
    .mm-chip:hover { border-color: var(--blue); }
    .mm-chip.raw { cursor: default; color: var(--text-dim); }
    .mm-chip.muted { background: transparent; border: 1px dashed var(--border); cursor: default; color: var(--text-dim); }
    /* model badges */
    .mm-badge { font-size: .7rem; border: 1px solid var(--border); border-radius: 5px; padding: 0 .3rem; color: var(--text-dim); }
    .mm-badge.stale { color: var(--yellow); border-color: var(--yellow); }
    .mm-badge.corrupt { color: var(--red); border-color: var(--red); }
    .mm-badge.hub { color: var(--blue); border-color: var(--blue); }
    /* flash when a chip scrolls you to its target row */
    @keyframes mmflash { 0% { background: rgba(96,165,250,.28); } 100% { background: transparent; } }
    .mm-flash { animation: mmflash 1.3s ease-out; border-radius: 6px; }
    /* attention band (problems promoted to top of card) */
    .mm-attn { border-left: 3px solid var(--red); padding: .4rem .6rem; margin: .15rem 0 .35rem; background: rgba(248,113,113,.07); border-radius: 0 6px 6px 0; font-size: .86em; }
    .mm-attn.warn { border-left-color: var(--yellow); background: rgba(251,191,36,.06); }
    .mm-actions { display: flex; flex-wrap: wrap; gap: .4rem; }

    /* ==================================================================
       Fleet Health redesign — worst-first triage (.fh-* + related).
       Namespaced; ported from the design handoff mock. Reuses the
       dashboard's existing tokens (+ the new --mono var).
    ================================================================== */
    /* ---------- Page header: owner + scan + L3 summary ---------- */
    .fh-top {
      display: flex; flex-wrap: wrap; align-items: flex-start;
      gap: 1rem 1.5rem; margin-bottom: 1.25rem;
    }
    .fh-summary { flex: 1 1 380px; min-width: 300px; }
    .fh-summary .fh-lede {
      font-size: 1.05rem; color: var(--text); line-height: 1.45; text-wrap: pretty;
    }
    .fh-summary .fh-lede b { color: var(--text); font-weight: 600; }
    .fh-attribution {
      margin-top: 0.55rem; font-size: 0.8rem; color: var(--text-dim);
      font-family: var(--mono); display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem;
    }
    .fh-attribution .k { opacity: 0.7; }
    .fh-attribution .v { color: var(--text); }
    .fh-attribution .sep { color: var(--border); }

    /* fleet posture: how many jobs are rotting vs clean, at a glance */
    .fh-posture {
      flex: 0 0 auto; display: flex; gap: 0.6rem;
    }
    .fh-stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.6rem 0.9rem; min-width: 76px;
    }
    .fh-stat .n { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .fh-stat .l { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-top: 0.15rem; }
    .fh-stat.attn { border-color: rgba(248,113,113,0.35); }
    .fh-stat.attn .n { color: var(--red); }
    .fh-stat.clean .n { color: var(--green); }

    /* ---------- Score explainer (collapsible) ---------- */
    .fh-explain {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 1.25rem; overflow: hidden;
    }
    .fh-explain > summary {
      list-style: none; cursor: pointer; user-select: none;
      padding: 0.7rem 1rem; display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.85rem;
    }
    .fh-explain > summary::-webkit-details-marker { display: none; }
    .fh-explain > summary .caret { color: var(--text-dim); font-size: 0.7rem; transition: transform 0.15s; }
    .fh-explain[open] > summary .caret { transform: rotate(90deg); }
    .fh-explain > summary .formula {
      margin-left: auto; font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    }
    .fh-explain > summary .formula em { color: var(--blue); font-style: normal; }
    .fh-explain-body { padding: 0 1rem 0.9rem; }
    .fh-factors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
    .fh-factor {
      background: var(--surface-hover); border-radius: 8px; padding: 0.6rem 0.7rem;
      border-top: 2px solid var(--fc, var(--border));
    }
    .fh-factor .fn { font-weight: 600; font-size: 0.85rem; }
    .fh-factor .fd { color: var(--text-dim); font-size: 0.76rem; margin-top: 0.2rem; line-height: 1.4; }
    .fh-factor.sev { --fc: var(--red); }
    .fh-factor.freq { --fc: var(--yellow); }
    .fh-factor.reach { --fc: var(--blue); }
    .fh-factor.rec { --fc: var(--green); }

    /* ---------- Section headings ---------- */
    .fh-band {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin: 0 0 0.7rem; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-dim);
    }
    .fh-band .n { color: var(--text); opacity: 0.55; font-variant-numeric: tabular-nums; }
    .fh-band + .fh-band { margin-top: 0; }
    .fh-attention-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.75rem; }

    /* ---------- Triage row (one job spec record) ---------- */
    .fh-rec {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s;
    }
    .fh-rec:hover { border-color: #3a3e4e; }
    .fh-rec.worst { border-color: rgba(248,113,113,0.4); }
    .fh-rec.worst .fh-rec-head::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red);
    }

    .fh-rec-head {
      position: relative; display: grid;
      grid-template-columns: 3.2rem 1fr auto; align-items: center;
      gap: 0.9rem; padding: 0.85rem 1.1rem 0.85rem 1.25rem; cursor: pointer; user-select: none;
    }
    /* rank + score cluster */
    .fh-rank { text-align: center; }
    .fh-rank .score {
      font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums;
      line-height: 1; letter-spacing: -0.02em;
    }
    .fh-rank .rk { font-family: var(--mono); font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.1em; margin-top: 0.15rem; }

    .fh-rec-main { min-width: 0; }
    .fh-rec-title { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .fh-job {
      font-family: var(--mono); font-size: 0.95rem; font-weight: 600; color: var(--text);
      letter-spacing: -0.01em;
    }
    .fh-rec-sub {
      margin-top: 0.28rem; font-size: 0.78rem; color: var(--text-dim);
      display: flex; flex-wrap: wrap; gap: 0.1rem 0.8rem; font-family: var(--mono);
    }
    /* one-line intent: what this job spec promises the operator */
    .fh-desc {
      margin-top: 0.3rem; font-size: 0.82rem; color: var(--text-dim);
      line-height: 1.4; max-width: 62ch; text-wrap: pretty;
    }
    .fh-rec-sub .v { color: var(--text); }
    .fh-rec-sub .sep { color: var(--border); }

    /* score-composition strip — the "why it ranks here" microviz */
    .fh-compose { display: flex; align-items: center; gap: 0.55rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .fh-fpill {
      display: inline-flex; align-items: baseline; gap: 0.28rem;
      font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim);
      background: var(--surface-hover); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.12rem 0.42rem; white-space: nowrap;
    }
    .fh-fpill b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .fh-fpill .lab { opacity: 0.7; }
    .fh-fpill.sev b { color: var(--red); }
    .fh-fpill.freq b { color: var(--yellow); }
    .fh-fpill.reach b { color: var(--blue); }
    .fh-fpill.rec b { color: var(--green); }
    .fh-times { color: var(--border); font-size: 0.7rem; }

    .fh-rec-right { display: flex; align-items: center; gap: 0.75rem; }
    .fh-caret { color: var(--text-dim); font-size: 0.8rem; transition: transform 0.15s; }
    .fh-rec.open .fh-caret { transform: rotate(90deg); }

    /* severity badge */
    .sev-badge {
      display: inline-flex; align-items: center; gap: 0.32rem;
      padding: 0.15rem 0.55rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 500; white-space: nowrap;
    }
    .sev-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
    .sev-badge.s3 { color: var(--red); background: rgba(248,113,113,0.12); }
    .sev-badge.s3 .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .sev-badge.s2 { color: var(--yellow); background: rgba(251,191,36,0.12); }
    .sev-badge.s2 .dot { background: var(--yellow); }
    .sev-badge.s1 { color: var(--blue); background: rgba(96,165,250,0.12); }
    .sev-badge.s1 .dot { background: var(--blue); }

    .issue-count {
      font-size: 0.78rem; color: var(--text-dim); font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .issue-count b { color: var(--text); font-weight: 600; }

    /* ---------- Drill-down: distinct issues ---------- */
    .fh-issues { display: none; border-top: 1px solid var(--border); padding: 0.4rem 1.1rem 0.9rem 1.25rem; }
    .fh-rec.open .fh-issues { display: block; }

    .fh-issue { padding: 0.8rem 0; border-bottom: 1px solid var(--border); }
    .fh-issue:last-child { border-bottom: none; }
    .fh-issue-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

    /* failure-mode taxonomy chip */
    .mode-chip {
      font-family: var(--mono); font-size: 0.72rem; padding: 0.1rem 0.45rem;
      border-radius: 5px; border: 1px solid var(--border); color: var(--text);
      background: var(--surface-hover); white-space: nowrap;
    }
    .mode-chip.s3 { border-color: rgba(248,113,113,0.4); color: var(--red); }
    .mode-chip.s2 { border-color: rgba(251,191,36,0.4); color: var(--yellow); }
    .mode-chip.s1 { border-color: rgba(96,165,250,0.4); color: var(--blue); }

    .status-tag {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.1rem 0.45rem; border-radius: 999px; font-weight: 500;
    }
    .status-tag.open { color: var(--text-dim); border: 1px solid var(--border); }
    .status-tag.verify { color: var(--yellow); background: rgba(251,191,36,0.1); }
    .status-tag.closed { color: var(--green); background: rgba(52,211,153,0.1); }

    .gh-link {
      margin-left: auto; font-family: var(--mono); font-size: 0.74rem;
      color: var(--blue); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.1rem 0.4rem; border-radius: 5px;
    }
    .gh-link:hover { background: var(--surface-hover); }

    .fh-issue-meta {
      margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem;
      font-size: 0.78rem; color: var(--text-dim); font-family: var(--mono);
      align-items: center;
    }
    .fh-issue-meta .v { color: var(--text); }
    /* frequency trend: count + a self-verifying count-drop when resolving */
    .fh-trend { display: inline-flex; align-items: center; gap: 0.3rem; }
    .fh-trend .from { color: var(--text-dim); text-decoration: line-through; opacity: 0.7; }
    .fh-trend .arrow { color: var(--green); }
    .fh-trend .to { color: var(--green); font-weight: 600; }
    .reach-agents { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }
    .reach-agents .ag {
      background: rgba(96,165,250,0.1); color: var(--blue); border-radius: 999px;
      padding: 0.05rem 0.45rem; font-size: 0.72rem;
    }

    /* why it failed: the model-free root-cause read, above the raw artifacts */
    .fh-why {
      font-size: 0.82rem; color: var(--text); line-height: 1.5; text-wrap: pretty;
      background: rgba(248,113,113,0.06); border-left: 2px solid rgba(248,113,113,0.5);
      border-radius: 0 6px 6px 0; padding: 0.5rem 0.7rem; margin-bottom: 0.55rem;
    }
    .fh-why-lab {
      display: block; font-family: var(--mono); font-size: 0.66rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--red); opacity: 0.85; margin-bottom: 0.25rem;
    }

    /* evidence: the hard artifacts (turn_id join-key + log pointer) */
    .fh-evidence { margin-top: 0.55rem; }
    .fh-evidence-h {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-dim); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .fh-evidence-h .tier {
      color: var(--green); border: 1px solid rgba(52,211,153,0.3);
      border-radius: 4px; padding: 0 0.3rem; font-size: 0.62rem; letter-spacing: 0.04em; white-space: nowrap;
    }
    .occ {
      display: grid; grid-template-columns: auto 1fr; gap: 0.5rem 0.75rem; align-items: center;
      background: rgba(0,0,0,0.22); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.4rem 0.6rem; font-family: var(--mono); font-size: 0.73rem;
    }
    .occ + .occ { margin-top: 0.3rem; }
    .occ .occ-agent { color: var(--text); font-weight: 600; }
    .occ .occ-body { min-width: 0; display: flex; flex-wrap: wrap; gap: 0.15rem 0.7rem; align-items: center; }
    .occ .tid { color: var(--yellow); }
    .occ .ptr { color: var(--text-dim); word-break: break-all; }
    .occ .ptr .g { color: var(--text); }
    .occ .more { color: var(--text-dim); font-family: var(--mono); font-size: 0.73rem; padding-left: 0.6rem; }

    /* ---------- Healthy jobs: the quiet majority ---------- */
    .fh-healthy-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.4rem;
    }
    .fh-hc {
      display: flex; align-items: center; gap: 0.55rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.55rem 0.7rem; font-size: 0.8rem;
    }
    .fh-hc .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; align-self: flex-start; margin-top: 0.35rem; }
    .fh-hc-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 0.1rem; }
    .fh-hc .job { font-family: var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fh-hc .hd { font-size: 0.72rem; color: var(--text-dim); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fh-hc .when { margin-left: auto; color: var(--text-dim); font-size: 0.7rem; white-space: nowrap; align-self: flex-start; margin-top: 0.1rem; }

    @media (max-width: 640px) {
      .fh-factors { grid-template-columns: repeat(2, 1fr); }
      .fh-rec-head { grid-template-columns: 2.8rem 1fr; }
      .fh-rec-right { grid-column: 1 / -1; justify-content: flex-start; padding-left: 3.7rem; }
      .fh-explain > summary .formula { display: none; }
    }

    /* ==================================================================
       Summary cockpit redesign (.sm-*). Namespaced; ported from mock.
    ================================================================== */
    /* ---------- cockpit header: posture verdict + freshness ---------- */
    .sm-verdict {
      display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.35rem;
    }
    .sm-verdict .pulse { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .sm-verdict.attn .pulse { background: var(--red); box-shadow: 0 0 10px var(--red); }
    .sm-verdict.ok .pulse { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .sm-verdict h2 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
    .sm-verdict h2 b { color: var(--red); }
    .sm-asof { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 1.1rem; font-family: var(--mono); }

    .sm-band { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 0.6rem; display: flex; align-items: baseline; gap: 0.45rem; }
    .sm-band .n { color: var(--text); opacity: 0.55; }

    /* ---------- attention hero: what needs you, worst-first ---------- */
    .sm-attn-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.6rem; }
    .sm-attn {
      display: flex; align-items: flex-start; gap: 0.7rem; text-align: left;
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-left-width: 3px; border-radius: var(--radius); padding: 0.75rem 0.95rem;
      cursor: pointer; transition: background 0.12s, border-color 0.12s; color: inherit; font: inherit;
    }
    .sm-attn:hover { background: var(--surface-hover); }
    .sm-attn.critical { border-left-color: var(--red); }
    .sm-attn.warn { border-left-color: var(--yellow); }
    .sm-attn.info { border-left-color: var(--blue); }
    .sm-attn .sev {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
      padding: 0.15rem 0.45rem; border-radius: 5px; margin-top: 0.1rem; white-space: nowrap; font-family: var(--mono);
    }
    .sm-attn.critical .sev { color: var(--red); background: rgba(248,113,113,0.12); }
    .sm-attn.warn .sev { color: var(--yellow); background: rgba(251,191,36,0.12); }
    .sm-attn.info .sev { color: var(--blue); background: rgba(96,165,250,0.12); }
    .sm-attn-body { min-width: 0; flex: 1; }
    .sm-attn-title { font-weight: 600; font-size: 0.9rem; }
    .sm-attn-detail { color: var(--text-dim); font-size: 0.82rem; margin-top: 0.15rem; text-wrap: pretty; }
    .sm-attn-go { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.2rem; align-self: center; white-space: nowrap; font-family: var(--mono); }
    .sm-attn:hover .sm-attn-go { color: var(--blue); }
    .sm-attn.calm { border-left-color: var(--green); cursor: default; }
    .sm-attn.calm:hover { background: var(--surface); }

    /* ---------- vitals: the things that actually bite ---------- */
    .sm-vitals { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0.75rem; margin-bottom: 1.6rem; }
    .sm-vcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.95rem 1.1rem; }
    .sm-vcard .vh { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.4rem; }
    .sm-vcard .vh a { margin-left: auto; color: var(--text-dim); font-size: 0.72rem; text-decoration: none; cursor: pointer; }
    .sm-vcard .vh a:hover { color: var(--blue); }

    /* agents posture */
    .sm-agents-n { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
    .sm-agents-n .of { font-size: 1rem; color: var(--text-dim); font-weight: 400; }
    .sm-agents-sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 0.25rem; }
    .sm-dotrow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 0.7rem; }
    .sm-dotrow .d { width: 12px; height: 12px; border-radius: 3px; }
    .sm-dotrow .d.up { background: var(--green); }
    .sm-dotrow .d.down { background: var(--red); }
    .sm-dotrow .d.warn { background: var(--yellow); }

    /* quota gauges (shared with Accounts tab) */
    .sm-quota-acct { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.55rem; }
    .sm-quota-acct b { color: var(--text); font-family: var(--mono); }
    .gauge { margin-bottom: 0.55rem; }
    .gauge:last-child { margin-bottom: 0; }
    .gauge-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; margin-bottom: 0.22rem; }
    .gauge-top .lab { color: var(--text-dim); }
    .gauge-top .val { font-variant-numeric: tabular-nums; font-weight: 600; font-family: var(--mono); }
    .gauge-track { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .gauge-fill { height: 100%; border-radius: 4px; }
    .val.lo, .gauge-fill.lo { color: var(--green); }
    .gauge-fill.lo { background: var(--green); }
    .val.mid { color: var(--yellow); }
    .gauge-fill.mid { background: var(--yellow); }
    .val.hi { color: var(--red); }
    .gauge-fill.hi { background: var(--red); }
    .val.na { color: var(--text-dim); }
    .gauge-reset { font-size: 0.7rem; color: var(--text-dim); margin-left: 0.4rem; font-weight: 400; }
    .gauge.stale .val, .gauge.stale .gauge-fill { opacity: 0.5; }

    /* ---------- services rail: quiet infra, compact ---------- */
    .sm-services { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.5rem; }
    .sm-svc { display: flex; align-items: center; gap: 0.6rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem; }
    .sm-svc .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sm-svc .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .sm-svc .dot.bad { background: var(--red); }
    .sm-svc .dot.idle { background: var(--text-dim); }
    .sm-svc-text { min-width: 0; }
    .sm-svc-name { font-size: 0.85rem; font-weight: 600; }
    .sm-svc-meta { font-size: 0.72rem; color: var(--text-dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (max-width: 640px) {
      .sm-vitals { grid-template-columns: 1fr; }
    }

    /* ==================================================================
       Accounts quota-triage redesign (.ac-* / .acct-*). Namespaced;
       ported from mock. Reuses the shared .gauge-* rules above.
    ================================================================== */
    /* ---------- top control bar ---------- */
    .ac-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .ac-bar .hint { font-size: 0.78rem; color: var(--text-dim); }
    .ac-posture { display: flex; gap: 0.6rem; margin-left: auto; }
    .ac-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 0.85rem; text-align: center; min-width: 70px; }
    .ac-stat .n { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .ac-stat .l { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
    .ac-stat.attn { border-color: rgba(248,113,113,0.35); }
    .ac-stat.attn .n { color: var(--red); }
    .ac-stat.clean .n { color: var(--green); }

    .ac-band { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 0.7rem; display: flex; align-items: baseline; gap: 0.45rem; }
    .ac-band .n { color: var(--text); opacity: 0.55; }
    .ac-list { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.75rem; }

    /* ---------- account row ---------- */
    .acct {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem 1.15rem; position: relative; overflow: hidden; transition: border-color 0.15s;
    }
    .acct:hover { border-color: #3a3e4e; }
    .acct.worst { border-color: rgba(248,113,113,0.4); }
    .acct.worst::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); }

    .acct-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .acct-label { font-family: var(--mono); font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
    .acct-fleet { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--blue); border: 1px solid rgba(96,165,250,0.4); border-radius: 5px; padding: 0.08rem 0.4rem; }
    /* health-badge: additive to the existing base rule — the redesign
       gives the badge a leading dot, so switch to inline-flex + gap and
       add the .missing / .exhausted variants the mock uses. */
    .health-badge { display: inline-flex; align-items: center; gap: 0.3rem; }
    .health-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
    .health-badge.healthy .dot { background: var(--green); }
    .health-badge.expired, .health-badge.missing { color: var(--red); background: rgba(248,113,113,0.12); }
    .health-badge.expired .dot, .health-badge.missing .dot { background: var(--red); }
    .health-badge.exhausted { color: var(--yellow); background: rgba(251,191,36,0.12); }
    .health-badge.exhausted .dot { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .acct-actions { margin-left: auto; display: flex; gap: 0.4rem; }

    /* exhaustion / expiry callout */
    .acct-alert {
      margin-top: 0.7rem; font-size: 0.82rem; line-height: 1.45;
      border-radius: 0 6px 6px 0; padding: 0.5rem 0.7rem;
    }
    .acct-alert .lab { display: block; font-family: var(--mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.2rem; }
    .acct-alert.crit { background: rgba(248,113,113,0.07); border-left: 2px solid var(--red); }
    .acct-alert.crit .lab { color: var(--red); }
    .acct-alert.warn { background: rgba(251,191,36,0.06); border-left: 2px solid var(--yellow); }
    .acct-alert.warn .lab { color: var(--yellow); }

    /* quota gauges */
    .acct-quota { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1.4rem; margin-top: 0.8rem; }

    /* footer meta: blast radius + secondary facts */
    .acct-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 1.3rem; margin-top: 0.85rem; padding-top: 0.7rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--text-dim); }
    .acct-foot .k { opacity: 0.7; font-family: var(--mono); font-size: 0.72rem; }
    .used-by { display: inline-flex; gap: 0.25rem; flex-wrap: wrap; }
    .used-by .ag { background: rgba(96,165,250,0.1); color: var(--blue); border-radius: 999px; padding: 0.05rem 0.5rem; font-size: 0.74rem; }
    .used-by .none { color: var(--text-dim); font-style: italic; }
    .acct-foot .probed { font-family: var(--mono); }
    .acct-foot .probed .src { opacity: 0.7; }

    @media (max-width: 640px) {
      .acct-quota { grid-template-columns: 1fr; }
      .ac-posture { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Switchroom <span>Fleet</span></h1>
    <div class="refresh-info">Refreshes every 10s</div>
  </header>
  <nav class="tabs">
    <button id="tab-summary" class="active" onclick="switchTab('summary')">Summary</button>
    <button id="tab-agents" onclick="switchTab('agents')">Agents</button>
    <button id="tab-accounts" onclick="switchTab('accounts')">Accounts</button>
    <button id="tab-system" onclick="switchTab('system')">System</button>
    <button id="tab-memory" onclick="switchTab('memory')">Memory</button>
    <button id="tab-connections" onclick="switchTab('connections')">Connections</button>
    <button id="tab-schedule" onclick="switchTab('schedule')">Schedule</button>
    <button id="tab-approvals" onclick="switchTab('approvals')">Approvals</button>
    <button id="tab-fleet-health" onclick="switchTab('fleet-health')">Fleet Health</button>
  </nav>
  <main>
    <div id="error"></div>
    <div id="summary" class="loading">Loading summary…</div>
    <div id="agents" style="display:none" class="loading">Loading agents...</div>
    <div id="accounts" style="display:none"></div>
    <div id="system" style="display:none"></div>
    <div id="memory" style="display:none"></div>
    <div id="connections" style="display:none"></div>
    <div id="schedule" style="display:none"></div>
    <div id="approvals" style="display:none"></div>
    <div id="fleet-health" style="display:none"></div>
  </main>

  <script>
    const API = window.location.origin;
    const TOKEN = new URLSearchParams(window.location.search).get('token');
    let agents = [];
    let openLogs = new Set();
    let openDetails = new Set();
    let agentDetails = {};
    let accounts = [];
    // The broker's current fleet-active account label, stashed by fetchSummary
    // (there's no fleet-active flag on /api/accounts). Drives the Accounts tab's
    // "fleet-active" pill; null until Summary has loaded at least once.
    let fleetActiveLabel = null;
    let ws = null;

    function authHeaders() {
      const h = {};
      if (TOKEN) h['Authorization'] = `Bearer ${TOKEN}`;
      return h;
    }

    // Tolerate a single transient failure on the 10s auto-refresh: one blip
    // (e.g. the web container restarting) shouldn't flash a scary error over a
    // healthy dashboard. Only surface the error after two in a row.
    let agentFetchFails = 0;
    async function fetchAgents() {
      try {
        const res = await fetch(`${API}/api/agents`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        agents = await res.json();
        render();
        agentFetchFails = 0;
        clearError();
      } catch (err) {
        if (++agentFetchFails >= 2) showError(`Failed to fetch agents: ${err.message}`);
      }
    }

    async function fetchAccounts() {
      try {
        const res = await fetch(`${API}/api/accounts`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        accounts = await res.json();
        renderAccounts();
        clearError();
      } catch (err) {
        showError(`Failed to fetch accounts: ${err.message}`);
      }
    }

    async function fetchAgentDetail(name) {
      try {
        const [accRes, subRes, cfgRes, turnsRes] = await Promise.all([
          fetch(`${API}/api/agents/${encodeURIComponent(name)}/accounts`, { headers: authHeaders() }),
          fetch(`${API}/api/agents/${encodeURIComponent(name)}/subagents`, { headers: authHeaders() }),
          fetch(`${API}/api/agents/${encodeURIComponent(name)}/config`, { headers: authHeaders() }),
          // Recent turns — resilient: a failure leaves turns null and the
          // other sections still render (see renderAgentDetailInner).
          fetch(`${API}/api/agents/${encodeURIComponent(name)}/turns?limit=10`, { headers: authHeaders() }),
        ]);
        // The /turns success response is a BARE Turn[] array (same
        // convention as /accounts + /subagents above); only the error
        // path sends { ok:false, error }. So read the array directly —
        // null on a non-ok response / malformed payload.
        let turns = null;
        if (turnsRes.ok) {
          try {
            const body = await turnsRes.json();
            turns = Array.isArray(body) ? body : null;
          } catch { turns = null; }
        }
        agentDetails[name] = {
          accounts: accRes.ok ? await accRes.json() : null,
          subagents: subRes.ok ? await subRes.json() : null,
          config: cfgRes.ok ? await cfgRes.json() : null,
          turns,
        };
        render();
      } catch (err) {
        showError(`Failed to load detail for ${name}: ${err.message}`);
      }
    }

    async function fetchSystemHealth() {
      try {
        const res = await fetch(`${API}/api/system-health`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderSystemHealth(await res.json());
        clearError();
      } catch (err) {
        showError(`Failed to fetch system health: ${err.message}`);
      }
    }

    async function fetchMemoryHealth() {
      try {
        const res = await fetch(`${API}/api/memory-health`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderMemoryHealth(await res.json());
        clearError();
      } catch (err) {
        showError(`Failed to fetch memory health: ${err.message}`);
      }
    }

    function renderMemoryHealth(m) {
      const container = document.getElementById('memory');
      if (!m.reachable) {
        container.innerHTML = renderProblem(problemFor('hindsight-down', { url: m.url }));
        return;
      }
      const banks = m.banks || [];
      const statusDot = (s) => `<span class="status-dot ${s === 'ok' ? 'active' : s === 'warn' ? 'auth-warning' : 'inactive'}" style="display:inline-block;vertical-align:middle"></span>`;
      const fmtDay = (iso) => iso ? iso.slice(0, 10) : '—';
      const fmtAge = (iso) => {
        if (!iso) return '';
        const d = (Date.now() - Date.parse(iso)) / 86400000;
        if (isNaN(d)) return '';
        return d < 1 ? 'today' : `${Math.round(d)}d ago`;
      };
      const fmtNum = (n) => (n || 0).toLocaleString();
      const fmtK = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n || 0));
      const isStaleTs = (iso) => iso && (Date.now() - Date.parse(iso)) > 7 * 86400000;
      const hasUserProfile = (b) => (b.mentalModels || []).some(mm =>
        /^user[- ]?profile$/i.test(String(mm.name || '')));
      // JSON for a single-quoted onclick attribute (escapeHtml covers ' & < > ").
      const attrJson = (v) => escapeHtml(JSON.stringify(v));
      // Fold hindsight's fact types into 3 provenance buckets: observations,
      // directives/other facts, and derived-from-other-models.
      const provSegments = (counts) => {
        const c = counts || {};
        const obs = c.observation || 0;
        const models = c['mental-models'] || 0;
        let other = 0;
        for (const [k, v] of Object.entries(c)) {
          if (k !== 'observation' && k !== 'mental-models') other += v || 0;
        }
        return { obs, other, models, total: obs + other + models };
      };
      const provBar = (counts, h) => {
        const s = provSegments(counts);
        if (s.total === 0) return '';
        const seg = (n, cls) => n > 0 ? `<span class="${cls}" style="flex:${n}" title="${n}"></span>` : '';
        return `<div class="prov-bar"${h ? ` style="height:${h}px"` : ''}>${seg(s.obs, 'prov-obs')}${seg(s.other, 'prov-dir')}${seg(s.models, 'prov-der')}</div>`;
      };

      // --- "How memory works" explainer + shared provenance legend ---
      const totals = banks.reduce((a, b) => {
        a.docs += b.totalDocuments || 0;
        a.facts += b.totalFacts || 0;
        a.models += (b.mentalModels || []).length;
        return a;
      }, { docs: 0, facts: 0, models: 0 });
      const stage = (label, count, desc) => `<div style="flex:1 1 140px;min-width:130px;background:var(--surface-hover);border-radius:8px;padding:.6rem .7rem">
        <div style="font-weight:600">${escapeHtml(label)}${count !== '' ? ` <span style="color:var(--blue)">${count}</span>` : ''}</div>
        <div style="color:var(--text-dim);font-size:.78em;margin-top:.25rem;line-height:1.35">${escapeHtml(desc)}</div>
      </div>`;
      const arrow = `<div style="display:flex;align-items:center;color:var(--text-dim);font-size:1.1em">→</div>`;
      const legend = `<div class="prov-legend">
        <span style="color:var(--text)">Source mix:</span>
        <span><i class="prov-obs"></i>observations</span>
        <span><i class="prov-dir"></i>directives &amp; facts</span>
        <span><i class="prov-der"></i>from other models</span>
      </div>`;
      const explainer = `<div class="agent-card" style="margin-bottom:1rem">
        <div class="card-header" style="cursor:default">
          <span class="agent-name">How memory works</span>
          <span style="color:var(--text-dim);font-size:.85em;margin-left:.5rem">${banks.length} bank${banks.length === 1 ? '' : 's'} · hindsight</span>
        </div>
        <div style="padding:0 1.25rem 1rem">
          <div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:.5rem;margin:.2rem 0 .7rem">
            ${stage('Conversations', fmtNum(totals.docs), 'Every agent turn is retained verbatim as a document.')}
            ${arrow}
            ${stage('Facts', fmtNum(totals.facts), "Hindsight extracts durable facts from each conversation — on its OWN model, never the agent's quota.")}
            ${arrow}
            ${stage('Mental models', fmtNum(totals.models), 'Facts (and other models) are synthesized into named models, each answering one recall question.')}
            ${arrow}
            ${stage('Recall', '', 'On each turn the agent pulls the relevant models back into context — it never re-reads raw history.')}
          </div>
          <div style="color:var(--text-dim);font-size:.85em">A <span style="color:var(--blue)">hub</span> model synthesizes other models (the <span style="color:var(--text)">draws on</span> links); a <span style="color:var(--yellow)">stale</span> or empty model means the agent is reasoning from an out-of-date picture. The bars below show each model's source mix.</div>
          ${legend}
        </div>
      </div>`;

      const cards = banks.map((b, bi) => {
        const bankJs = attrJson(b.bank);
        const models = b.mentalModels || [];
        const corrupt = new Set(b.corruptedMentalModelNames || []);
        const byId = new Map(models.map(mm => [mm.id, mm]));
        // model→model edges, self-references and dangling ids filtered for hub-ness
        const edgesOf = (mm) => (mm.derivedFromModelIds || []).filter(id => id && id !== mm.id);
        const anyEdges = models.some(mm => edgesOf(mm).length > 0);
        const hubs = models.filter(mm => edgesOf(mm).length > 0);

        const freshRank = (mm) => corrupt.has(mm.name) ? 2 : isStaleTs(mm.lastRefreshedAt || mm.createdAt) ? 1 : 0;
        const tsMs = (mm) => { const ts = mm.lastRefreshedAt || mm.createdAt; return ts ? Date.parse(ts) : 0; };
        const freshCmp = (a, c) => freshRank(a) - freshRank(c) || tsMs(c) - tsMs(a);

        // One model row. isLeaf indents it under a hub with a tree connector.
        const modelRow = (mm, opts) => {
          opts = opts || {};
          const ts = mm.lastRefreshedAt || mm.createdAt;
          const stale = isStaleTs(ts);
          const corr = corrupt.has(mm.name);
          const isHub = edgesOf(mm).length > 0;
          const safe = (s) => String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
          const detailId = `memdetail-${bi}-${safe(mm.id)}`;
          const rowId = `mmrow-${bi}-${safe(mm.id)}`;
          const idJs = attrJson(mm.id);
          const meta = [fmtK(mm.contentLength) + 'c', mm.refreshMode, fmtAge(ts) || 'never'].filter(Boolean).join(' · ');
          const badges = [
            isHub ? `<span class="mm-badge hub" title="synthesizes other models">hub</span>` : '',
            corr ? `<span class="mm-badge corrupt">corrupted</span>` : (stale ? `<span class="mm-badge stale">stale</span>` : ''),
          ].join('');
          let chips = '';
          if (isHub) {
            const items = edgesOf(mm).map(id => {
              const t = byId.get(id);
              return t
                ? `<span class="mm-chip" onclick='focusModel(${bi}, ${attrJson(t.id)})'>${escapeHtml(t.name)}</span>`
                : `<span class="mm-chip raw" title="not a model in this bank">${escapeHtml(id)}</span>`;
            });
            const s = provSegments(mm.basedOnCounts);
            if (s.obs + s.other > 0) items.push(`<span class="mm-chip muted" title="also synthesized from raw facts">+ raw facts</span>`);
            chips = `<div class="mm-chips"><span>draws on:</span>${items.join('')}</div>`;
          }
          const why = mm.sourceQuery
            ? `<div class="mm-why">answers: “${escapeHtml(mm.sourceQuery)}”</div>`
            : '';
          return `<div class="mm-row${opts.leaf ? ' mm-leaf' : ''}" id="${rowId}">
            <div class="mm-top"><span class="mm-name">${escapeHtml(mm.name)}</span>${badges}<span class="mm-meta">${escapeHtml(meta)}</span></div>
            ${why}
            ${provBar(mm.basedOnCounts)}
            ${chips}
            <div style="margin-top:.3rem"><button class="btn" type="button" style="padding:.1rem .5rem;font-size:.78em" onclick='memViewModel(${bankJs}, ${idJs}, "${detailId}", this)'>view content</button></div>
            <div id="${detailId}" style="display:none;margin-top:.4rem"></div>
          </div>`;
        };

        // Order: each hub followed by its leaves (a cluster), then orphans
        // freshest-first. No edges anywhere → a flat freshness-ordered list
        // (no spine, no chips) — the common, calm case.
        const rendered = new Set();
        const blocks = [];
        if (anyEdges) {
          for (const hub of hubs) {
            if (rendered.has(hub.id)) continue;
            rendered.add(hub.id);
            let cluster = modelRow(hub, {});
            for (const id of edgesOf(hub)) {
              const leaf = byId.get(id);
              if (!leaf || rendered.has(leaf.id)) continue;
              rendered.add(leaf.id);
              cluster += modelRow(leaf, { leaf: true });
            }
            blocks.push(`<div class="mm-cluster">${cluster}</div>`);
          }
        }
        const orphans = models.filter(mm => !rendered.has(mm.id)).sort(freshCmp);
        for (const o of orphans) blocks.push(modelRow(o, {}));
        const modelsHtml = blocks.join('');

        // Attention band — problems promoted to the top of the card.
        const warnLines = [];
        if ((b.corruptedMentalModelNames || []).length > 0) {
          warnLines.push(`corrupted: ${escapeHtml(b.corruptedMentalModelNames.join(', '))} — content is an LLM failure message; refresh once quota recovers`);
        }
        if (b.recentUnextractedCount > 0) {
          warnLines.push(`${b.recentUnextractedCount} recent conversation(s) stored but NOT extracted (oldest ${fmtDay(b.oldestUnextractedAt)}) — invisible to recall until reprocessed`);
        }
        const attn = warnLines.length
          ? `<div class="mm-attn ${b.status === 'fail' ? '' : 'warn'}">${warnLines.map(w => `<div>⚠ ${w}</div>`).join('')}</div>`
          : '';

        // Bank-summary band: dense stat line + aggregate source-mix bar + freshness heat-strip.
        const agg = {};
        for (const mm of models) for (const [k, v] of Object.entries(mm.basedOnCounts || {})) agg[k] = (agg[k] || 0) + (v || 0);
        const statLine = `${fmtNum(b.totalDocuments)} <span class="dim">conversations</span> · ${fmtNum(b.totalFacts)} <span class="dim">facts</span> · <span class="dim">latest</span> ${fmtDay(b.newestDocumentAt)}${fmtAge(b.newestDocumentAt) ? ` <span class="dim">(${fmtAge(b.newestDocumentAt)})</span>` : ''} · ${models.length} <span class="dim">model${models.length === 1 ? '' : 's'}</span>${b.staleMentalModelCount ? ` <span style="color:var(--yellow)">(${b.staleMentalModelCount} stale)</span>` : ''}`;
        const heatCell = (mm) => {
          const ts = mm.lastRefreshedAt || mm.createdAt;
          const age = ts ? (Date.now() - Date.parse(ts)) / 86400000 : null;
          const cls = corrupt.has(mm.name) ? 'corrupt' : age === null ? 'cold' : age > 7 ? 'stale' : 'fresh';
          return `<span class="${cls}" title="${escapeHtml(mm.name)} — ${fmtAge(ts) || 'never refreshed'}"></span>`;
        };
        const heat = models.length ? `<div class="heat" title="freshness, one cell per model">${models.map(heatCell).join('')}</div>` : '';
        const aggBar = provBar(agg, 9);

        // Mental-models band header — count + a hub-summary when relationships exist.
        const mmHeader = `Mental models <span class="n">${models.length}</span>` +
          (anyEdges ? `<span class="mm-badge hub" style="margin-left:auto">${hubs.length} synthesize${hubs.length === 1 ? 's' : ''} others</span>` : '');

        // --- Remediation buttons (unchanged behaviour) ---
        const buttons = [];
        if (b.recentUnextractedCount > 0) {
          const n = Math.min(b.recentUnextractedCount, (b.unextractedDocIds || []).length) || b.recentUnextractedCount;
          buttons.push(`<button class="btn" type="button" onclick='memReprocess(${bankJs}, this)'>Reprocess ${n} doc${n === 1 ? '' : 's'}</button>`);
        }
        const affectedIds = new Set();
        for (const name of (b.corruptedMentalModelNames || [])) {
          const mm = models.find(x => x.name === name);
          if (mm && mm.id) affectedIds.add(mm.id);
        }
        for (const mm of models) {
          if (isStaleTs(mm.lastRefreshedAt || mm.createdAt) && mm.id) affectedIds.add(mm.id);
        }
        for (const mm of models) {
          if (!affectedIds.has(mm.id)) continue;
          const idJs = attrJson(mm.id), nameJs = attrJson(mm.name);
          buttons.push(`<button class="btn" type="button" onclick='memRefreshModel(${bankJs}, ${idJs}, ${nameJs}, this)'>Refresh ${escapeHtml(mm.name)}</button>`);
        }
        if (b.totalDocuments > 0 && !hasUserProfile(b)) {
          buttons.push(`<button class="btn" type="button" onclick='memBuildProfile(${bankJs}, this)'>Build profile</button>`);
        }
        const actionsBand = buttons.length
          ? `<div class="mm-band"><div class="mm-band-h">Actions</div><div class="mm-actions">${buttons.join('')}</div></div>`
          : '';

        return `<div class="agent-card">
          <div class="card-header" style="cursor:default">
            ${statusDot(b.status)}<span class="agent-name">${escapeHtml(b.bank)}</span>
            <span style="color:var(--text-dim);font-size:.85em;margin-left:.5rem">${b.kind === 'profile' ? '<em>profile bank</em>' : escapeHtml((b.agents || []).join(', '))}</span>
          </div>
          <div style="padding:0 1.25rem 1rem">
            <div style="color:var(--text-dim);margin:.1rem 0 .3rem">${escapeHtml(b.statusDetail || '')}</div>
            ${attn}
            <div class="mm-band" style="border-top:none">
              <div class="mm-band-h">Bank summary</div>
              <div class="mm-stat-line">${statLine}</div>
              ${aggBar}
              ${heat}
            </div>
            <div class="mm-band">
              <div class="mm-band-h">${mmHeader}</div>
              ${modelsHtml || '<div style="color:var(--text-dim);font-size:.85em">No mental models yet — facts are still accumulating.</div>'}
            </div>
            ${actionsBand}
          </div>
        </div>`;
      }).join('');
      container.innerHTML = explainer + `<div class="agents-grid">${cards || '<div style="color:var(--text-dim)">No agent banks configured.</div>'}</div>`;
    }

    // Chip-as-cross-link: scroll to the named model's row in the same card
    // and flash it. Pure DOM — no graph canvas. `bi` is the bank index, `id`
    // the target model id (must match modelRow's id sanitization exactly).
    function focusModel(bi, id) {
      const rowId = `mmrow-${bi}-${String(id).replace(/[^a-zA-Z0-9_-]/g, '_')}`;
      const el = document.getElementById(rowId);
      if (!el) return;
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      el.classList.remove('mm-flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('mm-flash');
    }

    // --- Memory remediation actions ---
    // Each pokes a hindsight REST/MCP endpoint via the web's POST routes.
    // Hindsight does the LLM extraction on its OWN claude-code provider;
    // the dashboard never calls a model. A confirm() gates each because
    // it consumes subscription quota (low-risk, but explicit).
    const REM_CONFIRM = 'This triggers memory re-processing on the subscription. Continue?';

    // `label` names the action for the failure toast; `successMsg(data)`
    // builds the success toast from the response body.
    async function memRemediate(btn, url, payload, working, label, successMsg) {
      if (!confirm(REM_CONFIRM)) return;
      const orig = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = working; }
      try {
        const res = await fetch(`${API}${url}`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          showToast(`${label} failed: ${data.error || `HTTP ${res.status}`}`, false);
        } else {
          showToast(successMsg(data), true);
        }
      } catch (err) {
        showToast(`${label} failed: ${err.message}`, false);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = orig; }
        fetchMemoryHealth();
      }
    }

    function memReprocess(bank, btn) {
      memRemediate(btn, '/api/memory/reprocess', { bank }, 'Reprocessing…', 'Reprocess',
        (d) => `Reprocess triggered (${d.triggered ?? 0} doc${(d.triggered ?? 0) === 1 ? '' : 's'}${d.failed ? `, ${d.failed} failed` : ''})`);
    }
    function memRefreshModel(bank, modelId, name, btn) {
      memRemediate(btn, '/api/memory/refresh-model', { bank, modelId }, 'Refreshing…', 'Refresh',
        () => `Refresh triggered for ${name}`);
    }
    function memBuildProfile(bank, btn) {
      memRemediate(btn, '/api/memory/build-profile', { bank }, 'Building…', 'Build profile',
        () => 'Profile build triggered');
    }

    // --- View one mental model's full content + provenance ---
    // Lazy: the memory-health list carries only summaries (name/why/age) so
    // it stays light across many banks; the full text is pulled on demand
    // when the operator clicks "view". Pure READ of hindsight's REST — no
    // model call, no quota. Re-click toggles collapse (content cached after
    // the first load).
    async function memViewModel(bank, id, detailId, btn) {
      const el = document.getElementById(detailId);
      if (!el) return;
      if (el.dataset.open === '1') {
        el.style.display = 'none';
        el.dataset.open = '0';
        if (btn) btn.textContent = 'view';
        return;
      }
      el.style.display = 'block';
      el.dataset.open = '1';
      if (btn) btn.textContent = 'hide';
      if (el.dataset.loaded === '1') return;
      el.innerHTML = '<div style="color:var(--text-dim);font-size:.85em">Loading…</div>';
      try {
        const res = await fetch(`${API}/api/memory/model?bank=${encodeURIComponent(bank)}&id=${encodeURIComponent(id)}`, { headers: authHeaders() });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.model) {
          el.innerHTML = `<div style="color:var(--red);font-size:.85em">Couldn't load model: ${escapeHtml(data.error || ('HTTP ' + res.status))}</div>`;
          return;
        }
        el.innerHTML = renderModelDetail(data.model);
        el.dataset.loaded = '1';
      } catch (err) {
        el.innerHTML = `<div style="color:var(--red);font-size:.85em">Couldn't load model: ${escapeHtml(err.message)}</div>`;
      }
    }

    // The "why + how" of a single model: where it came from (provenance) and
    // the full content the agent actually recalls.
    function renderModelDetail(model) {
      const prov = Object.entries(model.basedOnCounts || {})
        .filter(([, n]) => n > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([type, n]) => `${n} ${escapeHtml(type.replace(/-/g, ' '))}`)
        .join(' · ');
      const provLine = (model.totalSourceFacts || 0) > 0
        ? `<div style="color:var(--text-dim);font-size:.82em;margin-bottom:.4rem">Synthesized from ${model.totalSourceFacts} source fact${model.totalSourceFacts === 1 ? '' : 's'}: ${prov}</div>`
        : `<div style="color:var(--text-dim);font-size:.82em;margin-bottom:.4rem">No source facts recorded — likely a seed or manually set value.</div>`;
      const content = (model.content || '').trim();
      const body = content
        ? `<pre style="white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem;max-height:340px;overflow:auto;font-size:.82em;line-height:1.45;margin:0">${escapeHtml(content)}</pre>`
        : `<div style="color:var(--yellow);font-size:.85em">This model has no content — it's empty, so the agent recalls nothing from it.</div>`;
      return provLine + body;
    }

    async function fetchConnections(opts) {
      opts = opts || {};
      const attempt = opts.attempt || 0;
      // Distinguish a FAILED fetch from a genuinely-empty result. The old
      // `safe` collapsed both to []/{}, so a transient broker/web blip
      // rendered identically to "nothing configured" — and because this tab
      // fetches only on open (NOT the 10s fleet poll), a one-time failure
      // stuck until a manual re-click. Track ok per fetch so renderConnections
      // can show an honest "couldn't load" state, and self-heal with bounded
      // retries. (A single endpoint failing still renders the others.)
      const safe = (p, fallback) => p
        .then(r => r.ok ? r.json().then(d => ({ ok: true, data: d })) : { ok: false, data: fallback })
        .catch(() => ({ ok: false, data: fallback }));
      try {
        const [g, ms, n, li, ag] = await Promise.all([
          safe(fetch(`${API}/api/google-accounts`, { headers: authHeaders() }), []),
          safe(fetch(`${API}/api/microsoft-accounts`, { headers: authHeaders() }), []),
          safe(fetch(`${API}/api/notion-workspace`, { headers: authHeaders() }), { configured: false, databases: [] }),
          safe(fetch(`${API}/api/linear-agents`, { headers: authHeaders() }), { configured: false, agents: [] }),
          safe(fetch(`${API}/api/agents`, { headers: authHeaders() }), []),
        ]);
        // Notion + Linear legitimately report unconfigured — not a failure. The
        // OAuth providers + the agent list are the ones whose failure must not
        // read as "empty".
        const fetchFailed = !g.ok || !ms.ok || !ag.ok;
        renderConnections({
          google: g.data, microsoft: ms.data, notion: n.data, linear: li.data,
          agentNames: (ag.data || []).map(a => a.name).sort(),
          googleFailed: !g.ok, microsoftFailed: !ms.ok, linearFailed: !li.ok, fetchFailed,
        });
        clearError();
        // Self-heal a transient blip without a manual re-click. Bounded
        // backoff (3s, 6s, 9s); stops the instant a fetch succeeds.
        if (fetchFailed && attempt < 3) {
          setTimeout(() => fetchConnections({ attempt: attempt + 1 }), 3000 * (attempt + 1));
        }
      } catch (err) {
        showError(`Failed to fetch connections: ${err.message}`);
      }
    }

    // Toggle an agent's access to an account. POSTs a proposal → hostd
    // raises a Telegram Allow/Deny card → we poll the outcome. Nothing
    // changes until the operator taps Allow on their phone (the leash).
    async function toggleAccess(provider, account, agent, enable, btnId) {
      const btn = document.getElementById(btnId);
      const setLabel = (txt, dim) => { if (btn) { btn.textContent = txt; btn.style.opacity = dim ? '.6' : '1'; } };
      setLabel('proposing…', true);
      try {
        const res = await fetch(`${API}/api/connections/access`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider, account, agent, action: enable ? 'enable' : 'disable' }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { setLabel('error', false); showError(data.error || `HTTP ${res.status}`); return; }
        if (data.changed === false) { setLabel(enable ? 'enabled' : 'disabled', false); return; }
        if (!data.requestId) { setLabel('done', false); fetchConnections(); return; }
        setLabel('check Telegram → approve', true);
        // Poll the approval outcome (operator has up to ~10 min to tap).
        const started = Date.now();
        const poll = async () => {
          const sres = await fetch(`${API}/api/connections/access/${encodeURIComponent(data.requestId)}`, { headers: authHeaders() });
          const s = sres.ok ? await sres.json() : { state: 'error', reason: `HTTP ${sres.status}` };
          if (s.state === 'pending') {
            if (Date.now() - started > 11 * 60 * 1000) { setLabel('timed out', false); return; }
            setTimeout(poll, 2500);
            return;
          }
          if (s.state === 'applied') {
            setLabel('✓ approved', false);
            showError('');
            // Restart suggestion: the agent loads the MCP at boot.
            if (s.restartAgent && confirm(`Approved. Restart ${s.restartAgent} now so it picks up the change?`)) {
              await fetch(`${API}/api/agents/${encodeURIComponent(s.restartAgent)}/restart`, { method: 'POST', headers: authHeaders() }).catch(() => {});
            }
            fetchConnections();
          } else if (s.state === 'denied') {
            setLabel('denied', false);
          } else {
            setLabel('error', false);
            showError(s.reason || 'proposal failed');
          }
        };
        setTimeout(poll, 2000);
      } catch (err) {
        setLabel('error', false);
        showError(err.message);
      }
    }

    // Guards a second click from starting a second device-code flow (each
    // start makes Microsoft send a sign-in email → the "2 emails" bug).
    let msConnecting = false;

    // The set of Microsoft account emails currently known to the broker.
    // Used as a resilience baseline: the connect status lives only in the web
    // process's memory, so if that process restarts mid-connect the status
    // reads 'unknown' even when the token WAS stored. Diffing this list tells
    // us the account really connected regardless of the lost status.
    async function fetchMicrosoftAccountEmails() {
      try {
        const r = await fetch(`${API}/api/microsoft-accounts`, { headers: authHeaders() });
        if (!r.ok) return new Set();
        const list = await r.json();
        return new Set((list || []).filter(a => a.brokerKnown).map(a => String(a.account).toLowerCase()));
      } catch { return new Set(); }
    }

    // Start an in-browser Microsoft connect: show the device code + link,
    // then poll until the operator completes sign-in on Microsoft's site.
    async function connectMicrosoft() {
      if (msConnecting) return;              // double-submit guard
      msConnecting = true;
      const btn = document.getElementById('ms-connect-btn');
      if (btn) btn.disabled = true;
      const done = () => { msConnecting = false; const b = document.getElementById('ms-connect-btn'); if (b) b.disabled = false; };
      const card = document.getElementById('ms-connect-card');
      const show = (html) => { if (card) card.innerHTML = html; };
      show('<div class="loading" style="padding:.8rem">Starting…</div>');
      // Snapshot already-connected accounts BEFORE starting, for the
      // restart-resilient terminal check below.
      const before = await fetchMicrosoftAccountEmails();
      try {
        const res = await fetch(`${API}/api/connections/microsoft/connect`, { method: 'POST', headers: authHeaders() });
        const data = await res.json();
        if (!res.ok || !data.ok) { show(''); showError(data.error || `HTTP ${res.status}`); done(); return; }
        const url = data.verificationUri, code = data.userCode;
        show(`<div class="account-card" style="border-color:var(--accent)">
            <div class="account-card-header"><div class="account-label">Connect a Microsoft account</div></div>
            <div style="padding:.3rem 0;line-height:1.7">
              1. Open <a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="color:var(--accent)">${escapeHtml(url)}</a><br>
              2. Enter code: <code style="font-size:1.15rem;letter-spacing:.08em">${escapeHtml(code)}</code><br>
              3. Approve the requested permissions (Mail, Calendar, Files).
            </div>
            <div id="ms-connect-status" style="color:var(--text-dim);margin-top:.3rem">Waiting for sign-in… (this card expires in ~15 min)</div>
          </div>`);
        const statusEl = () => document.getElementById('ms-connect-status');
        const deadline = Date.now() + ((data.expiresInSec || 900) * 1000 + 30000);
        const showConnected = (label) => {
          show(`<div class="loading" style="padding:.8rem;color:var(--green)">✓ Connected ${escapeHtml(label)}. Use the access toggles below to grant an agent.</div>`);
          fetchConnections();
        };
        // On any non-'connected' terminal state ('failed' or 'unknown'),
        // re-check the broker's actual account list before declaring failure:
        // a new account appearing means the connect really succeeded (e.g. the
        // status was lost to a web restart). Only error if nothing new landed.
        // Limitations (acceptable — the in-memory 'connected' state is the
        // primary signal; this is only the lost-status fallback): a concurrent
        // connect of a DIFFERENT account in another tab/CLI could be mistaken
        // for this one; and re-connecting an ALREADY-known account (token
        // refresh) shows no new account so falls through to the error.
        const settleNonConnected = async (reason) => {
          const after = await fetchMicrosoftAccountEmails();
          const fresh = [...after].find(a => !before.has(a));
          if (fresh) { showConnected(fresh); } else { show(''); showError(reason || 'connect failed'); }
          done();
        };
        const poll = async () => {
          let s;
          try {
            const sres = await fetch(`${API}/api/connections/microsoft/connect/${encodeURIComponent(data.requestId)}`, { headers: authHeaders() });
            s = sres.ok ? await sres.json() : { state: 'failed', reason: `HTTP ${sres.status}` };
          } catch {
            // Transient fetch failure — most likely the web process restarting
            // mid-connect (the exact case this flow must survive). Don't die
            // (that would strand msConnecting=true and lock the button): keep
            // polling until the device-code deadline, then settle via the
            // broker re-check (which recovers a token stored before the restart).
            if (Date.now() > deadline) { await settleNonConnected('connection lost'); return; }
            setTimeout(poll, 3000);
            return;
          }
          if (s.state === 'pending') {
            if (Date.now() > deadline) { const e = statusEl(); if (e) e.textContent = 'Expired — click Connect to try again.'; done(); return; }
            setTimeout(poll, 3000);
            return;
          }
          if (s.state === 'connected') {
            showConnected(`${s.account} (${s.accountType})`);
            done();
          } else {
            await settleNonConnected(s.reason);
          }
        };
        setTimeout(poll, 3000);
      } catch (err) {
        show('');
        showError(err.message);
        done();
      }
    }

    async function fetchSchedule() {
      try {
        const res = await fetch(`${API}/api/schedule`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
