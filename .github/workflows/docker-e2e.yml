name: docker-e2e

# CI gate for the docker integration suite (tests/docker/*.test.ts).
# Builds the phase1b-test / phase2a-test / phase2b-test image set
# locally, then runs vitest against tests/docker/. Phase 2c includes
# the op:put round-trip + DAC_OVERRIDE + vault-dir guard cases that
# the v0.7.12 deploy regression (#958) would have caught.
#
# Triggers narrowly so PRs to e.g. docs/ don't pay the docker-build
# cost. The path filter matches the files whose changes can break
# the e2e shape (also the files the image-cache key hashes — keep
# the two lists in sync).
#
# Image-cache strategy (warm vs cold path):
#   - Restore /tmp/switchroom-images.tar via actions/cache, keyed on
#     the Dockerfiles + build-images.sh + every src/** subtree that
#     gets baked into an image. Cache hit → `docker load` → skip the
#     entire ~90s buildx pass.
#   - On miss, run the full build sequence and save the resulting
#     5-image tarball back into the cache. actions/cache auto-uploads
#     in the post step.
#   The cache key intentionally hashes only paths that change image
#   bytes — a doc-only PR (which wouldn't trigger this workflow
#   anyway) would not invalidate. A PR touching src/vault/** does
#   invalidate, which is correct: the broker bundle inside the image
#   needs to be rebuilt.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue — required contexts must report on the temporary
  # `gh-readonly-queue/main/...` ref. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual recovery lever. GHA marks a run failed (no auto-retry) when
  # its jobs sit queued past the hosted-runner scheduling window during
  # a capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # on the stale run. workflow_dispatch gives `gh workflow run
  # docker-e2e.yml --ref main` as the re-trigger. (#1336 queue-fail
  # surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read

# workflow_dispatch runs get their own concurrency group (keyed by
# run id) so pushes to the same ref can't cancel a manually requested
# recovery run — dispatch is the recovery lever advertised above, so
# it must not be cancellable by the very traffic it recovers from
# (same pattern as docker-images.yml, #1336).
#
# merge_group runs keep the plain `github.ref` group (the queue's own
# `gh-readonly-queue/...` branch — never shared with the PR's
# `refs/pull/<n>/merge`), but are NOT cancellable: a cancelled required
# context ejects the queue entry, and cancelling the `e2e-ok`
# `if: always()` sentinel is the #3614 orphan-wedge shape.
concurrency:
  group: docker-e2e-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}

jobs:
  # ─── Path-change filter (sentinel pattern; see ci-lint.yml header) ─
  # This filter job always runs; the real work jobs (`e2e`,
  # `hindsight-probe`) are `if:`-gated on its outputs and report
  # `skipped` on PRs that don't touch the paths they cover.
  #
  # A `skipped` check is NOT success for branch protection — it BLOCKS
  # (proven by #1343, a docs-only PR hard-blocked; same deadlock as
  # #2237). So neither `e2e` nor `hindsight-probe` can be a required
  # context, and in fact neither has ever been in ruleset 16470166.
  # The `e2e-ok` sentinel at the bottom of this file exists for exactly
  # that reason: it ALWAYS runs, so it is the one context here that can
  # safely be marked required, and it converts "path-skipped" into pass
  # while still failing on a real failure/cancellation — including a
  # failure of this `changes` job itself, since a broken path filter
  # would otherwise silently disable the whole gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      hindsight: ${{ steps.filter.outputs.hindsight }}
    steps:
      # merge_group: no diff base exists on a queue ref, so skip the
      # filter (the job still reports `success`, which `e2e-ok` requires)
      # and run everything below. See .github/MERGE-QUEUE.md.
      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        if: github.event_name != 'merge_group'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            relevant:
              - 'src/vault/**'
              - 'src/cli/apply.ts'
              - 'src/agents/compose.ts'
              - 'src/agent-scheduler/**'
              - 'docker/Dockerfile.base'
              - 'docker/Dockerfile.broker'
              - 'docker/Dockerfile.kernel'
              - 'docker/Dockerfile.agent'
              - 'docker/Dockerfile.auth-broker'
              - 'src/auth/broker/**'
              - 'tests/docker/**'
              - '.github/workflows/docker-e2e.yml'
            # The hindsight image is NOT built by build-images.sh — it is the
            # pinned upstream image plus baked patches. It gets its own job
            # (hindsight-probe) and its own filter output.
            #
            # dockerfile-hindsight-bakes.test.ts is listed even though it is a
            # pure grep-on-file suite, because the ordinary `vitest --changed`
            # shards CANNOT reach it from a Dockerfile edit: it loads the
            # Dockerfile with readFileSync, which is not an import, so vitest's
            # module-graph tracing sees no dependency. Verified — touching only
            # docker/Dockerfile.hindsight makes `vitest run --changed` report
            # "No test files found". Without this entry the structural
            # anchor/negative guards would be skipped for exactly the change
            # they exist to police. The hindsight-probe job runs them.
            #
            # hindsight-pg-fsync-probe.test.ts boots the REAL entrypoint in the
            # real image, so its inputs are the entrypoint and the module that
            # supplies its env — both listed, or a PR that turned fsync back off
            # would get no probe run until the merge queue.
            hindsight:
              - 'docker/Dockerfile.hindsight'
              - 'docker/hindsight-entrypoint.sh'
              - 'src/setup/hindsight-pg-defaults.ts'
              - 'tests/docker/hindsight-pg-fsync-probe.test.ts'
              - 'tests/docker/hindsight-search-patches.test.ts'
              - 'tests/docker/hindsight-recall-isolation-patches.test.ts'
              - 'tests/docker/hindsight-retry-perturbation-patches.test.ts'
              - 'tests/docker/hindsight-mm-refresh-debounce-patch.test.ts'
              - 'tests/docker/hindsight-graph-seed-retirement.test.ts'
              - 'tests/docker/hindsight-maxitems-grammar-patch.test.ts'
              - 'src/setup/hindsight-perf-defaults.ts'
              - 'tests/docker/hindsight-reflect-directives-patch.test.ts'
              - 'tests/docker/hindsight-recall-budget-reflect-grounding-patches.test.ts'
              - 'tests/docker/hindsight-reranker-priority-patch.test.ts'
              - 'tests/docker/hindsight-work-conserving-admission-patch.test.ts'
              - 'tests/docker/hindsight-temporal-language-patch.test.ts'
              - 'tests/docker/hindsight-temporal-offload-patch.test.ts'
              - 'tests/docker/dockerfile-hindsight-bakes.test.ts'
              - '.github/workflows/docker-e2e.yml'

  e2e:
    needs: changes
    # push / merge_group: always run — both are (candidate) main. On the
    # queue ref this is the job that actually catches a semantic conflict
    # between two individually-green PRs, so it must not be skippable.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Restore image cache (key on Dockerfiles + image-baked sources)
        # The cache stores a single tarball of all 5 images
        # (base, agent, broker, kernel, auth-broker) at phase1b-test.
        # Restore is ~5-10s for a ~500MB tarball; the build it replaces
        # is ~90s. On a hit we skip dist build, buildx setup, and the
        # whole image build sequence.
        id: img-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/switchroom-images.tar
          key: docker-images-${{ hashFiles('docker/Dockerfile.base', 'docker/Dockerfile.broker', 'docker/Dockerfile.kernel', 'docker/Dockerfile.agent', 'docker/Dockerfile.auth-broker', 'tests/docker/build-images.sh', 'src/vault/**', 'src/agents/compose.ts', 'src/agent-scheduler/**', 'src/auth/broker/**', 'src/cli/apply.ts', 'bun.lock', 'telegram-plugin/bun.lock', 'scripts/build.mjs') }}

      - name: Load images from cache (warm path)
        if: steps.img-cache.outputs.cache-hit == 'true'
        run: |
          echo "[cache] hit — loading 5 images from tarball"
          docker load -i /tmp/switchroom-images.tar
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep ':phase1b-test' | sort

      - name: Build dist/ (cold path)
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: bun scripts/build.mjs

      - name: Set up Docker Buildx (cold path)
        # Must use the `docker` driver, NOT the default `docker-container`
        # driver. build-images.sh chains `FROM switchroom/base:phase1b-test`
        # in the agent/broker/kernel Dockerfiles, which only resolves if
        # the base image is in the local docker daemon. docker-container
        # has a separate buildkit cache and won't see `--load`-pushed
        # images on subsequent builds, so the chained `FROM` fails with
        # "pull access denied" against the (non-existent)
        # docker.io/switchroom/base image.
        if: steps.img-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker

      - name: Build phase1b-test images (cold path)
        # Single-arch (amd64) — ubuntu-latest is amd64. Cross-arch
        # validation lives in docker-images.yml.
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: bash tests/docker/build-images.sh

      - name: Save images to cache tarball (cold path)
        # actions/cache auto-uploads /tmp/switchroom-images.tar in the
        # post-job step when cache-hit was false. We just need the file
        # on disk by then.
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          docker save \
            switchroom/base:phase1b-test \
            switchroom/agent:phase1b-test \
            switchroom/broker:phase1b-test \
            switchroom/kernel:phase1b-test \
            switchroom/auth-broker:phase1b-test \
            -o /tmp/switchroom-images.tar
          ls -lh /tmp/switchroom-images.tar

      - name: Tag phase2a-test / phase2b-test aliases
        # tests/docker/phase2c-vault-integration.test.ts looks for
        # broker:phase2a-test and kernel:phase2b-test. Same image bytes
        # as phase1b-test; version suffix is just a hashable name for
        # skip-discipline. Runs in both cache-hit and cache-miss paths.
        run: |
          docker tag switchroom/broker:phase1b-test switchroom/broker:phase2a-test
          docker tag switchroom/kernel:phase1b-test switchroom/kernel:phase2b-test

      - name: Run docker e2e suite (with pre/post snapshot gate)
        # Wraps vitest in a docker-ps pre/post snapshot diff. Catches
        # the case where vitest crashes before afterAll() runs and
        # leaks containers (the recurring `friendly_chatelet` flake —
        # see #1102). Ephemeral GHA runner still benefits: a leak
        # between assertions inside a single run is what this catches.
        #
        # Two GHA-specific fixes that previously kept this suite from
        # running on hosted runners landed alongside this workflow:
        #
        #   1. broker-ipc-race.test.ts:265 — `kernelLookup` defaulted
        #      its `container` arg to `switchroom-${agent}` (the
        #      production container name). On a clean-room runner
        #      that container doesn't exist → every exec returns
        #      exit=1 → 0/45 succeed. The default is now required.
        #
        #   2. _prod-snapshot.ts:27 — the PHASE_TEST_NAME regex only
        #      matched `switchroom-phase<digit>`; it didn't match the
        #      compose-project pattern `phase<digit><letter>-...` used
        #      by broker-ipc-race + per-agent-isolation. Filter now
        #      covers both shapes.
        run: bash scripts/ci/docker-snapshot-gate.sh

      - name: Capture broker / kernel logs on failure
        if: failure()
        run: |
          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"
          for c in $(docker ps -aq --filter label=switchroom.test=phase2c); do
            echo "::group::logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Label-scoped teardown
        if: always()
        run: |
          # Belt-and-braces — afterAll() inside the tests already does
          # this. Strict label filter; never touches anything else on
          # the runner.
          for label in switchroom.test=phase1b switchroom.test=phase2a switchroom.test=phase2b switchroom.test=phase2c; do
            ids=$(docker ps -aq --filter label=$label 2>/dev/null || true)
            if [ -n "$ids" ]; then
              docker rm -f $ids 2>/dev/null || true
            fi
          done

  # ─── Hindsight patch probe (F5: this must NEVER silently skip) ────
  # tests/docker/hindsight-search-patches.test.ts and
  # tests/docker/hindsight-recall-isolation-patches.test.ts are the only
  # behavioural evidence that the patches baked into docker/Dockerfile.hindsight
  # actually change tokenization/error behaviour and recall admission/worker
  # scheduling — changes that reach every live agent's recall. The first
  # previously used
  # `describe.skipIf(!imageOk)` with a deliberate no-pull policy, so on a
  # hosted runner (where the 6.4GB upstream image is never present) it
  # reported green without executing a single assertion.
  #
  # This job pulls the digest-pinned upstream image and sets
  # SWITCHROOM_REQUIRE_HINDSIGHT_PROBE=1, under which the suite treats an
  # unavailable docker/image as a HARD FAILURE. It is a separate job from
  # `e2e` because the pull is large and unrelated to the phase1b image set,
  # and because it must not share that job's disk budget.
  hindsight-probe:
    needs: changes
    # merge_group is included alongside push for the reason stated above:
    # this job exists so the patch probe can NEVER silently skip, and the
    # queue ref is the last gate before those patches reach main. Letting
    # it path-skip on the new candidate-main path would contradict the
    # job's entire purpose.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.hindsight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Free disk space for the 6.4GB upstream image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Run the Dockerfile structural guards
        # Cheap (no docker), and deliberately BEFORE the 6.4GB pull so an
        # anchor/negative-guard regression fails in seconds. These are the
        # only place the exact-once anchors and the withdrawn-patch negative
        # guards are checked, and `vitest --changed` cannot select this file
        # from a Dockerfile edit (readFileSync is not an import) — so if it
        # does not run here, it does not run at all.
        run: npx vitest run tests/docker/dockerfile-hindsight-bakes.test.ts

      - name: Pull the digest-pinned upstream hindsight image
        # Ref is read from the Dockerfile's FROM line so it can never drift
        # from what the test asserts (the test re-reads the same line). This is
        # the RAW upstream image the reranker probe's RED arm runs against.
        run: |
          ref="$(grep -m1 '^FROM ' docker/Dockerfile.hindsight | awk '{print $2}')"
          echo "pulling $ref"
          docker pull "$ref"
          docker image inspect "$ref" >/dev/null

      - name: Set up Docker Buildx (docker driver) for the through-built image
        # The reranker-priority probe's GREEN arm runs against the actual
        # THROUGH-BUILT switchroom-hindsight image, because #3142's anchors and
        # post-conditions depend on three earlier switchroom patches that raw
        # upstream lacks (see hindsight-reranker-priority-patch.test.ts) — the
        # only correct base is the fully-patched source tree, which the shipping
        # image IS. We build it here rather than pull it: build-hindsight (in
        # docker-images.yml) does not push on PRs, and cross-workflow image
        # hand-off is fragile — so, mirroring how the `e2e` job builds its own
        # image set in-job, this job builds the image it needs.
        #
        # `driver: docker` builds straight into the daemon's image store (same
        # rationale as the `e2e` job) so the just-pulled FROM digest resolves
        # locally and the built tag is immediately runnable by `docker run`.
        # BuildKit (via buildx) is REQUIRED for Dockerfile.hindsight: its patch
        # steps are `RUN python3 - <<'PYEOF'` heredocs, which the legacy builder
        # silently no-ops (feeding python empty stdin), leaving every patch
        # unapplied.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          driver: docker

      - name: Build the through-built hindsight image (reranker GREEN arm)
        # Single-arch (amd64) local build — the reranker probe only exercises
        # the pure-stdlib priority executor, but we build the WHOLE shipping
        # image so the GREEN arm reads the exact bytes that ship, with no
        # in-test re-patching or patch-sequence duplication. A failing patch
        # assert here fails the build (same signal as build-hindsight).
        run: |
          docker buildx build --load \
            -f docker/Dockerfile.hindsight \
            -t switchroom-hindsight:probe \
            .
          docker image inspect switchroom-hindsight:probe >/dev/null

      - name: Run the hindsight patch probe (RED/GREEN, must not skip)
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-search-patches.test.ts

      - name: Run the hindsight recall-isolation probe (RED/GREEN, must not skip)
        # Same contract as the step above, for the admission-split /
        # worker-slot-ceiling / sem-logging patches. A separate step so a
        # failure names which patch family broke, and so the pulled image is
        # reused rather than pulled twice.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-recall-isolation-patches.test.ts

      - name: Run the hindsight retry-perturbation probe (RED/GREEN, must not skip)
        # Same contract again, for the perturbed-JSON-retry patch (#3669).
        # This is the layer the bakes test structurally CANNOT provide:
        # its assertions are unanchored substring matches, so indenting the
        # perturbation under a falsy guard leaves all 24 of them green while
        # the behaviour is gone (measured 2026-07-26 — bakes 24/24 pass,
        # this probe goes red on TEMPERATURES/DISTINCT_RETRY_REQUESTS).
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-retry-perturbation-patches.test.ts

      - name: Run the hindsight MM-refresh-debounce probe (RED/GREEN, must not skip)
        # Same contract again, for the MM-refresh-debounce patch. The bakes
        # test cannot cover the failure that matters here: its assertions are
        # unanchored substring matches, so a helper that exists but is never
        # consulted by the trigger loop (the #3660-class indent-under-a-falsy-
        # guard revert) stays green there while every consolidation round goes
        # back to regenerating every mental model — the measured 1,902
        # refreshes/day loop. Only running the shipping trigger loop and
        # observing which candidates it actually submits catches it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-mm-refresh-debounce-patch.test.ts

      - name: Run the hindsight graph-seed RETIREMENT probe (RED/GREEN, must not skip)
        # The v0.8.5 upstream #2968 carry was retired in the v0.8.6 base bump —
        # upstream ships the behaviour natively and exposes
        # HINDSIGHT_API_GRAPH_SEED_MIN_SIMILARITY. This step did NOT go away with
        # it: deleting the only probe that ever asserted the behaviour would
        # leave nobody checking the behaviour SURVIVED the retirement.
        #
        # It now proves the successor mechanism live — that the native seed reuse
        # is present in the pinned image AND that switchroom's explicit floor
        # emission is what the engine resolves. That second half is why the
        # bakes test cannot replace this: a deleted emission still leaves a
        # working image (upstream defaults to 0.3), so only booting the config
        # with an OFF-DEFAULT floor and reading it back can go red on it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-graph-seed-retirement.test.ts

      - name: Run the hindsight maxItems-grammar SUCCESSOR probe (RED/GREEN, must not skip)
        # The consolidation-maxItems-grammar patch was retired in the v0.8.6 base
        # bump in favour of HINDSIGHT_API_LLM_SUPPORTS_MAX_ITEMS. Same reasoning
        # as the step above: the probe stays, re-pointed at the successor.
        #
        # The failure that matters is unchanged and the bakes test still cannot
        # cover it: if the env key stops reaching the container, the schema is
        # once again uncompilable by a local GBNF backend, and every
        # consolidation call on a large bank silently falls over to the metered
        # provider, carrying private corpus text off-host. Only serialising the
        # model out of the running image and reading the emitted maxItems
        # catches that — and the DEFAULT arm is deliberately the RED one, so a
        # probe that stopped configuring anything cannot pass.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-maxitems-grammar-patch.test.ts

      - name: Run the hindsight reflect-directives probe (RED/GREEN, must not skip)
        # Same contract again, for the reflect-directive-isolation patch
        # (switchroom #3967, upstream vectorize-io/hindsight#1269 / #3031).
        # The bakes test cannot cover the failure that matters here: its
        # assertions are unanchored substring matches, so reverting the spliced
        # value to True — a single token — leaves them green while every tagged
        # directive is again silently dropped from synthesis (45% of this
        # fleet's active directives). Only loading real directives out of a real
        # database with the kwargs reflect actually passes, and reading which
        # ones reach directives_applied and the system prompt, catches it.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-reflect-directives-patch.test.ts

      - name: Run the hindsight recall-budget/reflect-grounding probe (RED/GREEN, must not skip)
        # Same contract, for the mcp-recall-token-budget and
        # reflect-temperature patches. The bakes test cannot cover the
        # failures that matter here: its assertions are unanchored substring
        # matches, so a helper that exists but is never routed through, or a
        # temperature that is resolved but reaches zero call sites, both stay
        # green there. Only driving the real registered MCP tool (and
        # measuring the tokens it returns) and the shipping module's call
        # sites catches them.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-recall-budget-reflect-grounding-patches.test.ts

      - name: Run the hindsight reranker-foreground-priority probe (RED/GREEN, must not skip)
        # Same contract, for the #3142 reranker-foreground-priority patch (OPEN
        # upstream). The bakes test cannot cover the failure that matters here:
        # its assertions are grep-on-file, so a _PriorityRerankExecutor that
        # exists but orders its queue FIFO (a reverted (priority, seq) key, or a
        # background flag threaded but never consulted) stays green there while
        # interactive reranks are once again starved behind the background
        # fan-out. Only constructing the real pool, occupying its single worker,
        # and observing that queued foreground jobs run before an
        # earlier-submitted background one catches it. The GREEN arm runs
        # against the through-built image built above (SWITCHROOM_HINDSIGHT_
        # BUILT_IMAGE); the RED arm runs against the raw pinned upstream.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
          SWITCHROOM_HINDSIGHT_BUILT_IMAGE: switchroom-hindsight:probe
        run: npx vitest run tests/docker/hindsight-reranker-priority-patch.test.ts

      - name: Run the hindsight work-conserving-admission probe (RED/GREEN, must not skip)
        # Same contract, for the work-conserving recall-admission gate (v2 of
        # the admission split). The bakes test cannot cover the failure that
        # matters here: its assertions are grep-on-file, so a gate whose borrow
        # predicate is inverted, or an admit() call hard-coded to False, stays
        # green there while either the drain crawls at 2/8 of the budget again
        # or background recalls jump the foreground queue. Only saturating a
        # real gate with queued background recalls and timing a foreground
        # admission catches it. TWO RED arms against the raw pinned upstream —
        # bare (no priority) and split-only (not work-conserving, today's
        # shipping behaviour) — plus a patched GREEN arm; the through-built arm
        # (SWITCHROOM_HINDSIGHT_BUILT_IMAGE) additionally asserts the #4212
        # rerank-lane invariants survive the gate.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
          SWITCHROOM_HINDSIGHT_BUILT_IMAGE: switchroom-hindsight:probe
        run: npx vitest run tests/docker/hindsight-work-conserving-admission-patch.test.ts

      - name: Run the hindsight temporal-language probe (RED/GREEN, must not skip)
        # Same contract, for the #4313 dateparser language-pin patch. The bakes
        # test cannot cover the failure that matters here: its assertions are
        # grep-on-file, so reverting the `languages=` pin on the search_dates
        # call stays green there while every recall again auto-detects across
        # 200+ locales inline on the shared asyncio loop. Only capturing the
        # real search_dates call's kwargs (and confirming English extraction
        # still parses under the pin) catches it. Runs against the raw pinned
        # upstream image, applying the patch block by `docker exec`.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-temporal-language-patch.test.ts

      - name: Run the hindsight temporal-offload probe (RED/GREEN, must not skip)
        # Same contract, for the temporal-offload patch (this PR). The bakes
        # test cannot cover the outcome that matters here: its assertions are
        # grep-on-file, so a `run_in_executor` wrapper that exists but is never
        # awaited at the call site — or a char cap wired but never applied —
        # stays green there while temporal extraction again blocks the shared
        # asyncio loop for seconds. Only an asyncio loop-lag probe (max
        # inter-tick gap while a real ≥150ms extraction runs off-loop) catches
        # it. RED applies only #4313 (sync-inline blocks the loop ≈ full parse);
        # GREEN applies #4313 + this block (gap stays tiny, cap bounds cost).
        # Both arms run against the raw pinned upstream image via `docker exec`.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-temporal-offload-patch.test.ts

      - name: Run the embedded-postgres fsync probe (RED/GREEN, must not skip)
        # NOT a patch probe: this one boots the REAL docker/hindsight-entrypoint.sh
        # inside the pinned image and reads `SHOW fsync` off the server it
        # started. pg0 launches postgres with `-F` (fsync OFF), which is how an
        # HNSW index on memory_units silently corrupted on 2026-07-29 after one
        # of the container's 6-20 daily unclean shutdowns — data_checksums
        # cannot see a lost write. The entrypoint overrides it with a trailing
        # `-c fsync=on`, and whether postgres HONOURS that over pg0's earlier
        # `-F` is a property of a pinned third-party binary, not of this repo:
        # every unit-level test stays green if pg0 reorders its argv or starts
        # writing postgresql.conf. Only this step sees it. Both arms run, so a
        # probe that stopped observing the real server cannot pass.
        env:
          SWITCHROOM_REQUIRE_HINDSIGHT_PROBE: "1"
        run: npx vitest run tests/docker/hindsight-pg-fsync-probe.test.ts

      - name: Label-scoped teardown
        if: always()
        run: |
          for phase in hindsight-search-patches hindsight-recall-isolation-patches hindsight-retry-perturbation-patches hindsight-mm-refresh-debounce-patch hindsight-graph-seed-retirement hindsight-maxitems-grammar-patch hindsight-reflect-directives-patch hindsight-recall-budget-reflect-grounding hindsight-reranker-priority-patch hindsight-temporal-language-patch hindsight-temporal-offload-patch hindsight-pg-fsync-probe; do
            ids=$(docker ps -aq --filter "label=switchroom.test=$phase" 2>/dev/null || true)
            if [ -n "$ids" ]; then docker rm -f $ids 2>/dev/null || true; fi
          done

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context (see ci-lint.yml header for the
  # pattern). ALWAYS runs and aggregates the path-gated jobs above:
  # pass when every one succeeded OR was legitimately path-skipped;
  # fail when any failed/was cancelled, or when the `changes` filter
  # job itself broke (can't trust a skip produced by broken infra).
  # Ruleset 16470166 should require `e2e-ok` as THE single required
  # context for this workflow — `e2e` and `hindsight-probe` themselves
  # cannot be required (they legitimately skip, and a skipped required
  # check hard-blocks: #1343 / #2237). hindsight-probe in particular
  # exists so the behavioural patch probe can never silently skip; it
  # only actually gates via this sentinel. Keep this `needs` list
  # complete when adding jobs.
  e2e-ok:
    needs: [changes, e2e, hindsight-probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust the skip"
            exit 1
          fi
          fail=0
          for pair in \
            "e2e=${{ needs.e2e.result }}" \
            "hindsight-probe=${{ needs.hindsight-probe.result }}"; do
            job="${pair%%=*}"; r="${pair#*=}"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::${job}=${r} — real e2e failure, blocking"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "changes=$c → pass (e2e jobs green or path-skipped)"
