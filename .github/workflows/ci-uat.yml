name: ci-uat

# UAT fuzz — drives a real mtcute MTProto user session against the
# live test-harness bot in a real supergroup. Mirrors Buildkite
# pipeline.uat.yml.
#
# Why a self-hosted runner?
#   The harness needs surfaces that DON'T exist on hosted runners:
#   the test-harness container, the vault, the broker, and a real
#   mtcute driver session string that must never land on shared
#   ephemeral infrastructure. The `uat-host` self-hosted runner is
#   tagged on the box that already runs test-harness + the broker.
#
# OPERATOR FAILURE MODE — "queued forever":
#   If no self-hosted runner is registered with the `uat-host` label,
#   this job sits queued indefinitely until the workflow's timeout
#   fires (see timeout-minutes below). GHA shows "Waiting for a
#   runner to pick up this job" — there is no built-in "queue empty"
#   signal that auto-fails. Mitigations:
#     - timeout-minutes bounds the wait (35 min, same as BK soft cap).
#     - This workflow is gated on a repo variable `UAT_GATE_ENABLED`
#       (mirrors BK's SWITCHROOM_UAT_GATE_ENABLED). When the operator
#       hasn't yet provisioned the self-hosted runner, leave the var
#       unset and the workflow no-ops.
#     - The self-skip block at the top of the job exits 0 if any of
#       the 4 Telegram secrets are missing, so an env reset that
#       rotates secrets out without replacement won't wedge the queue.
#   Long-term, monitor runner registration via repo Settings →
#   Actions → Runners; a missing `uat-host` runner is the canonical
#   "queued forever" cause.
#
# PR-from-fork: secrets unavailable, same fallback as ci-evals — the
# job exits 0 cleanly with a notice.

on:
  pull_request:
    branches: [main]
    # NO paths filter: the workflow must run on EVERY PR so the required
    # `uat-gate` SENTINEL always reports a status. A path-gated required check
    # deadlocks any PR that doesn't touch the listed paths (a release PR only
    # bumps package.json) — the context is never produced and the merge blocks
    # forever (#2237 → release v0.14.91 stuck). The HEAVY, runner-bound UAT is
    # still path-gated, now via the `changes` job below, so docs/docker/release
    # PRs don't spin up the self-hosted runner.
  push:
    branches: [main]
    # Same path scope as the PR trigger — a docs/docker/scripts merge must not
    # spin up the (slow, runner-bound) UAT. Pre-fix the push trigger had NO
    # paths filter, so every main merge ran the 35-min fuzz suite and
    # timeout-cancelled, tying up the single uat-host runner.
    paths:
      - "telegram-plugin/**"
      - "src/agents/**"
      - "telegram-plugin/uat/**"
      - "vitest.uat.config.ts"
      - ".github/workflows/ci-uat.yml"
  schedule:
    # Nightly thorough fuzz pass (the uat-fuzz job below is schedule/dispatch-only).
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Sequential — Telegram's per-bot rate limits are global; two parallel
# UAT runs interleave inbounds on the same chat. NOT cancel-in-progress
# (a fresh push must let the running job complete to release the
# test-harness singleton cleanly).
concurrency:
  group: ci-uat-${{ github.ref }}
  cancel-in-progress: false

# The UAT splits into two jobs that share the single uat-host runner:
#
#   uat-gate  — FAST, deterministic round-trips (a real inbound→reply turn +
#               rapid-fire no-drop). ~minutes. This is the required-check
#               candidate: it's the behavioural signal a CLI bump (or any
#               change) needs without the runner-bound 35-min fuzz pool. Runs on
#               PR + push (path-scoped) + dispatch.
#   uat-fuzz  — THOROUGH probabilistic fuzz pool + the restart vision scenario.
#               Too slow to gate (the full pool exceeds a 35-min budget), so it
#               is schedule/dispatch-ONLY and NON-required. Catches the broader
#               regression surface nightly.
jobs:
  # ─── Path-change filter (sentinel pattern) ────────────────────────
  # The heavy UAT only runs when a behavioural path changed; the
  # always-running `uat-gate` sentinel (below) reports the
  # branch-protection-required context regardless. Mirrors ci-tests-plugin.yml.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          # The same behavioural surface the old workflow-level path filter
          # gated on (a UAT round-trip only needs re-running when the
          # plugin / agent-scaffold / UAT scenarios / setup change).
          filters: |
            relevant:
              - 'telegram-plugin/**'
              - 'src/agents/**'
              - 'telegram-plugin/uat/**'
              - 'vitest.uat.config.ts'
              - '.github/actions/setup-switchroom/**'
              - '.github/workflows/ci-uat.yml'

  uat-gate-run:
    # The heavy, runner-bound UAT round-trips. Gated on BOTH a behavioural path
    # change AND the repo opt-in var, so docs/docker/release merges don't spin
    # up the slow self-hosted runner (the operator intent the workflow-level
    # path filter used to enforce). NOT the required context — the always-on
    # `uat-gate` sentinel below is.
    needs: changes
    if: vars.UAT_GATE_ENABLED == 'true' && needs.changes.outputs.relevant == 'true'
    runs-on: [self-hosted, uat-host]
    timeout-minutes: 18
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_UAT_DRIVER_SESSION: ${{ secrets.TELEGRAM_UAT_DRIVER_SESSION }}
      TELEGRAM_TEST_BOT_USERNAME: ${{ secrets.TELEGRAM_TEST_BOT_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Secrets gate
        id: secrets
        run: |
          if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" || -z "${TELEGRAM_UAT_DRIVER_SESSION:-}" || -z "${TELEGRAM_TEST_BOT_USERNAME:-}" ]]; then
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::UAT gate skipped: one or more TELEGRAM_* secrets missing (expected for fork PRs)."
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Set up workspace
        if: steps.secrets.outputs.ok == 'true'
        uses: ./.github/actions/setup-switchroom
      - name: Round-trip — warm-cache trivial DM (a real inbound→reply turn)
        if: steps.secrets.outputs.ok == 'true'
        # The core behavioural signal: a real message → a real reply. Catches a
        # CLI-bump regression that breaks turn delivery / injection (e.g. the
        # 2.1.166 cross-session-messaging hardening) — which the build/flag
        # checks are blind to.
        working-directory: telegram-plugin
        run: bun run test:uat jtbd-fast-trivial-dm
      - name: Reliable-delivery — rapid-fire no-drop
        if: steps.secrets.outputs.ok == 'true'
        # Back-to-back inbounds at the turn boundary, each must get its own
        # reply — the deliver-until-acked regression gate (#2089). Driver-only,
        # deterministic, fast.
        working-directory: telegram-plugin
        run: bun run test:uat inbound-no-drop

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context. ALWAYS runs (ubuntu-latest, no
  # path/var gate) so the required `uat-gate` check is always reported:
  # passes when the heavy run succeeded OR was legitimately skipped (non-UAT
  # PR, or the opt-in var is off / no runner), fails only on a real UAT
  # failure or path-filter infra failure. Mirrors ci-tests-plugin.yml's
  # `bun-test` sentinel (fixes the #2237 path-gated-required-check deadlock).
  uat-gate:
    needs: [changes, uat-gate-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          r='${{ needs.uat-gate-run.result }}'
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust the skip"
            exit 1
          fi
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "::error::uat-gate-run=$r — real UAT failure, blocking"
            exit 1
          fi
          echo "changes=$c uat-gate-run=$r → pass (ran=success, or skipped: non-UAT PR / gate off)"

  uat-fuzz:
    # Thorough probabilistic pool — too slow to gate, so schedule/dispatch-ONLY
    # and non-required. (Each fuzz scenario is a real ~10-30s round-trip; the
    # full pool exceeds a 35-min job budget on the single runner.)
    if: >-
      vars.UAT_GATE_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, uat-host]
    timeout-minutes: 50
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_UAT_DRIVER_SESSION: ${{ secrets.TELEGRAM_UAT_DRIVER_SESSION }}
      TELEGRAM_TEST_BOT_USERNAME: ${{ secrets.TELEGRAM_TEST_BOT_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Secrets gate
        id: secrets
        run: |
          if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" || -z "${TELEGRAM_UAT_DRIVER_SESSION:-}" || -z "${TELEGRAM_TEST_BOT_USERNAME:-}" ]]; then
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::UAT fuzz skipped: TELEGRAM_* secrets missing."
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Set up workspace
        if: steps.secrets.outputs.ok == 'true'
        uses: ./.github/actions/setup-switchroom
      - name: UAT fuzz (scoped to fuzz-*.test.ts)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: telegram-plugin
        run: bun run test:uat fuzz-
      - name: UAT JTBD vision — restart (operator-host only; self-skips without sudo)
        if: steps.secrets.outputs.ok == 'true'
        # Shells `switchroom agent restart` (mutating) — self-skips via
        # canShellSudo() on the sandboxed runner. Catches post-restart wedges
        # on the operator host.
        working-directory: telegram-plugin
        run: bun run test:uat jtbd-always-on-after-restart
