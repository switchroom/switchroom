        renderSchedule(await res.json());
        clearError();
      } catch (err) {
        showError(`Failed to fetch schedule: ${err.message}`);
      }
    }

    async function fetchApprovals() {
      // Fetch the kernel decision ledger AND the standing capability grants
      // in parallel, INDEPENDENTLY: a failure of one must not blank the
      // other (mirror the resilient `safe` pattern in fetchConnections).
      // Standing grants (the broker grants DB) are the section that's
      // actually useful — the kernel ledger is honestly empty on most
      // installs.
      const safe = (p, fallback) =>
        p.then(r => r.ok ? r.json() : fallback).catch(() => fallback);
      try {
        const [blocked, approvals, grants] = await Promise.all([
          // Blocked approvals lead the tab — an agent held with no way to ask
          // is the only thing here that is actively costing the operator.
          safe(fetch(`${API}/api/blocked-approvals`, { headers: authHeaders() }), []),
          safe(fetch(`${API}/api/approvals`, { headers: authHeaders() }), null),
          safe(fetch(`${API}/api/grants`, { headers: authHeaders() }),
            { reachable: false, grants: [], error: 'Failed to fetch standing grants.' }),
        ]);
        renderApprovals(blocked, approvals, grants);
        clearError();
      } catch (err) {
        showError(`Failed to fetch approvals: ${err.message}`);
      }
    }

    async function fetchFleetHealth() {
      try {
        const res = await fetch(`${API}/api/fleet-health`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderFleetHealth(await res.json());
        clearError();
      } catch (err) {
        showError(`Failed to fetch fleet health: ${err.message}`);
      }
    }

    // Fleet Health — the 23 job specs ranked worst-first by priority_score
    // (severity × frequency × reach × recency). Each spec drills down to its
    // distinct issues; each issue links to its occurrences (turn_ids + log
    // pointers) and its GitHub issue. Empty state when no owner agent is
    // assigned yet (feature inert). Design: reference/rfcs/fleet-health.md.
    function renderFleetHealth(data) {
      const el = document.getElementById('fleet-health');

      if (!data || data.empty) {
        el.innerHTML =
          `<div class="loading" style="color:var(--text-dim)">${escapeHtml((data && data.reason) || 'No fleet-health ledger yet.')}</div>`;
        return;
      }

      // Fleet-health timestamps are ISO strings on the wire; formatTimestamp
      // wants epoch ms, so parse first. Date.parse(null/undefined) → NaN →
      // formatTimestamp returns "—", preserving the mock's "no value" behaviour.
      const rel = (iso) => formatTimestamp(Date.parse(iso));
      const SEV_LABEL = { 3: 'severe', 2: 'moderate', 1: 'minor', 0: 'clear' };
      const scoreColor = (s) => s >= 15 ? 'var(--red)' : s >= 8 ? 'var(--yellow)' : s > 0 ? 'var(--blue)' : 'var(--text-dim)';
      // `factors` mirrors the read-model scoring inputs but isn't always on the
      // wire; derive per the RFC when absent (see reference/rfcs/fleet-health.md).
      const factorsFor = (iss) => {
        if (iss.factors) return iss.factors;
        const ms = Date.parse(iss.recency);
        let rec = 0.1;
        if (!isNaN(ms)) {
          const ageDays = (Date.now() - ms) / 86400000;
          rec = ageDays <= 1 ? 1.0 : Math.max(0.1, 1.0 - (ageDays / 30) * 0.9);
        }
        return {
          freq: Math.log10(1 + (iss.frequency || 0)),
          reach: (iss.reach || []).length,
          rec,
        };
      };

      // `last_deep_dive` is a PER-RECORD field, not a top-level payload field —
      // derive the fleet's most-recent deep-dive as the max across records.
      const lastDeepDiveMs = data.records.reduce((acc, r) => {
        const t = Date.parse(r.last_deep_dive);
        return isNaN(t) ? acc : Math.max(acc, t);
      }, NaN);

      const attention = data.records.filter((r) => r.open_issue_count > 0);
      const healthy = data.records.filter((r) => r.open_issue_count === 0);
      // `issues` is not coerced server-side (only `priority_score` is), so a
      // record with open_issue_count > 0 but missing/undefined `issues` would
      // throw on deref and blank the whole tab — guard to [] at every read.
      const issuesOf = (r) => Array.isArray(r.issues) ? r.issues : [];
      const worstSev = (r) => Math.max(0, ...issuesOf(r).filter(i => i.status !== 'closed').map(i => i.severity));

      // ---- page header: L3 summary + attribution + posture stats ----
      const top = `
        <div class="fh-top">
          <div class="fh-summary">
            <div class="fh-lede">${data.summary ? escapeHtml(data.summary) : 'No synthesis yet.'}</div>
            <div class="fh-attribution">
              <span><span class="k">owner</span> <span class="v">@${escapeHtml(data.owner_agent || 'unassigned')}</span></span>
              <span class="sep">·</span>
              <span><span class="k">last scan</span> <span class="v">${rel(data.generated_at)}</span></span>
              <span class="sep">·</span>
              <span><span class="k">last deep-dive</span> <span class="v">${formatTimestamp(lastDeepDiveMs)}</span></span>
              <span class="sep">·</span>
              <span><span class="k">jobs tracked</span> <span class="v">${data.records.length}</span></span>
            </div>
          </div>
          <div class="fh-posture">
            <div class="fh-stat attn"><div class="n">${attention.length}</div><div class="l">need attention</div></div>
            <div class="fh-stat clean"><div class="n">${healthy.length}</div><div class="l">clean</div></div>
          </div>
        </div>`;

      // ---- score explainer (why the ranking is trustworthy) ----
      const explain = `
        <details class="fh-explain">
          <summary>
            <span class="caret">▶</span>
            <span>How the ranking works — impact, not raw event count</span>
            <span class="formula">priority = <em>severity</em> × <em>frequency</em> × <em>reach</em> × <em>recency</em></span>
          </summary>
          <div class="fh-explain-body">
            <div class="fh-factors">
              <div class="fh-factor sev"><div class="fn">Severity <span style="color:var(--text-dim);font-weight:400">1–3</span></div><div class="fd">Did the wrong thing or nothing while reporting success = 3. From the failure-mode taxonomy, not a guess.</div></div>
              <div class="fh-factor freq"><div class="fn">Frequency</div><div class="fd">log₁₀(1 + count) over the 30-day window — 282 vs 20 is a real gap without swamping the rest.</div></div>
              <div class="fh-factor reach"><div class="fn">Reach</div><div class="fd">Distinct agents hit. A fleet-wide failure outranks a one-agent quirk.</div></div>
              <div class="fh-factor rec"><div class="fn">Recency</div><div class="fd">1.0 within 24h, decaying to 0.1 at the window edge. A fixed issue sinks; this is what closes the loop.</div></div>
            </div>
            <div style="margin-top:0.7rem;font-size:0.78rem;color:var(--text-dim)">Every factor comes from the model-free nightly sensor — no model judgment enters the score. Evidence is <span style="color:var(--green)">hard-artifact</span> (a structured turns.jsonl record or a precise gateway signature), independently verifiable by the turn id.</div>
          </div>
        </details>`;

      // ---- attention list ----
      const rows = attention.map((r, idx) => {
        const recIssues = issuesOf(r);
        const sev = worstSev(r);
        const worst = idx === 0 ? ' worst' : '';
        // drive the composition strip off the worst OPEN issue
        const lead = recIssues.filter(i => i.status !== 'closed')
          .sort((a, b) => b.severity - a.severity || b.frequency - a.frequency)[0] || recIssues[0];
        // `lead` can be undefined when open_issue_count > 0 but the issues
        // array is empty/absent — skip the composition strip rather than throw.
        const f = lead ? factorsFor(lead) : null;
        const compose = lead && f ? `
          <div class="fh-compose" title="priority = severity × frequency × reach × recency">
            <span class="fh-fpill sev"><b>${Number(lead.severity)}</b><span class="lab">sev</span></span>
            <span class="fh-times">×</span>
            <span class="fh-fpill freq"><b>${f.freq.toFixed(2)}</b><span class="lab">freq · ${Number(lead.frequency)}</span></span>
            <span class="fh-times">×</span>
            <span class="fh-fpill reach"><b>${f.reach}</b><span class="lab">reach</span></span>
            <span class="fh-times">×</span>
            <span class="fh-fpill rec"><b>${f.rec.toFixed(1)}</b><span class="lab">recency</span></span>
          </div>` : '';

        const issues = recIssues.map((iss) => {
          // Ledger numerics are not coerced server-side; normalize before
          // interpolating so a non-numeric value can't leak into markup.
          const occTotal = Number(iss.occ_total ?? iss.frequency ?? (iss.occurrences || []).length) || 0;
          const freqFrom = iss.freq_from != null ? Number(iss.freq_from) : null;
          const trend = freqFrom != null
            ? `<span class="fh-trend"><span class="from">${freqFrom}</span><span class="arrow">→</span><span class="to">${occTotal}</span></span> <span style="opacity:.6">since fix</span>`
            : `<span class="v">${occTotal}</span> in window`;
          const occ = (iss.occurrences || []).map((o) => `
            <div class="occ">
              <span class="occ-agent">${escapeHtml(o.agent)}</span>
              <div class="occ-body">
                <span class="tid">${escapeHtml(o.turn_id)}</span>
                <span class="ptr">${escapeHtml(o.log_pointer || '').replace(/^([^:]+):/, '<span class="g">$1</span>:')}</span>
              </div>
            </div>`).join('');
          const remaining = occTotal - (iss.occurrences || []).length;
          const more = remaining > 0 ? `<div class="more">+${remaining} more occurrence${remaining === 1 ? '' : 's'} joined by turn id</div>` : '';
          const statusCls = iss.status === 'resolved-pending-verify' ? 'verify' : iss.status === 'closed' ? 'closed' : 'open';
          const statusTxt = iss.status === 'resolved-pending-verify' ? 'verifying' : (iss.status || 'open');
          const ghLink = iss.gh_issue != null
            ? `<a class="gh-link" href="https://github.com/switchroom/switchroom/issues/${encodeURIComponent(iss.gh_issue)}" target="_blank" rel="noopener">#${escapeHtml(String(iss.gh_issue))} ↗</a>`
            : '';
          return `
            <div class="fh-issue">
              <div class="fh-issue-top">
                <span class="mode-chip s${Number(iss.severity) || 0}">${escapeHtml(iss.failure_mode)}</span>
                <span class="status-tag ${statusCls}">${escapeHtml(statusTxt)}</span>
                ${ghLink}
              </div>
              <div class="fh-issue-meta">
                <span><span class="k" style="opacity:.7">freq</span> ${trend}</span>
                <span><span class="k" style="opacity:.7">reach</span> <span class="reach-agents">${(iss.reach || []).map(a => `<span class="ag">${escapeHtml(a)}</span>`).join('')}</span></span>
                <span><span class="k" style="opacity:.7">latest</span> <span class="v">${rel(iss.recency)}</span></span>
              </div>
              <div class="fh-evidence">
                <div class="fh-evidence-h">evidence <span class="tier">hard-artifact</span></div>
                ${iss.detail ? `<div class="fh-why"><span class="fh-why-lab">why it failed</span>${escapeHtml(iss.detail)}</div>` : ''}
                ${occ}${more}
              </div>
            </div>`;
        }).join('');

        return `
          <div class="fh-rec${worst}" data-open="0">
            <div class="fh-rec-head" onclick="this.parentNode.classList.toggle('open')">
              <div class="fh-rank">
                <div class="score" style="color:${scoreColor(r.priority_score)}">${r.priority_score.toFixed(1)}</div>
                <div class="rk">#${String(idx + 1).padStart(2, '0')}</div>
              </div>
              <div class="fh-rec-main">
                <div class="fh-rec-title">
                  <span class="fh-job">${escapeHtml(r.job_spec)}</span>
                </div>
                <div class="fh-rec-sub">
                  <span><span class="k" style="opacity:.7">scanned</span> <span class="v">${rel(r.last_scanned)}</span></span>
                  <span class="sep">·</span>
                  <span><span class="k" style="opacity:.7">deep-dive</span> <span class="v">${rel(r.last_deep_dive)}</span></span>
                </div>
                ${compose}
              </div>
              <div class="fh-rec-right">
                <span class="sev-badge s${sev}"><span class="dot"></span>${SEV_LABEL[sev]}</span>
                <span class="issue-count"><b>${r.open_issue_count}</b> open</span>
                <span class="fh-caret">▶</span>
              </div>
            </div>
            <div class="fh-issues">${issues}</div>
          </div>`;
      }).join('');

      // ---- healthy strip ----
      const healthyCards = healthy.map((r) => `
        <div class="fh-hc" title="${escapeHtml(r.job_spec)}">
          <span class="dot"></span>
          <div class="fh-hc-text">
            <span class="job">${escapeHtml(r.job_spec)}</span>
          </div>
          <span class="when">${rel(r.last_scanned)}</span>
        </div>`).join('');

      el.innerHTML = `
        ${top}
        ${explain}
        <div class="fh-band">Needs attention <span class="n">${attention.length}</span> · ranked worst-first</div>
        <div class="fh-attention-list">${rows}</div>
        <div class="fh-band">Clean <span class="n">${healthy.length}</span> · scanned, no open issues</div>
        <div class="fh-healthy-grid">${healthyCards}</div>`;

      // Open the worst offender by default so the operator lands on the evidence.
      el.querySelector('.fh-rec.worst')?.classList.add('open');
    }

    // Canonical tab list — kept in sync with the nav buttons above and with
    // SPA_TAB_ROUTES in src/web/server.ts (the server serves the SPA shell for
    // these paths so a reload/deep-link doesn't 404).
    const TAB_NAMES = ['summary', 'agents', 'accounts', 'system', 'memory', 'connections', 'schedule', 'approvals', 'fleet-health'];

    // Derive the active tab from the URL path (`/connections` → 'connections',
    // '/' → 'summary'). Unknown paths fall back to summary.
    function tabFromPath() {
      const name = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
      return TAB_NAMES.includes(name) ? name : 'summary';
    }

    // opts.push === false suppresses the history push — used when the switch is
    // itself driven by navigation (initial load, back/forward) so we don't
    // double-stack history entries.
    function switchTab(tab, opts) {
      if (!TAB_NAMES.includes(tab)) tab = 'summary';
      for (const t of TAB_NAMES) {
        document.getElementById(`tab-${t}`).classList.toggle('active', tab === t);
        document.getElementById(t).style.display = tab === t ? '' : 'none';
      }
      // Mirror the tab into the URL path so reload/deep-link/back-forward all
      // land here. Summary canonicalises to '/'.
      if (!opts || opts.push !== false) {
        const path = tab === 'summary' ? '/' : '/' + tab;
        if (location.pathname !== path) history.pushState({ tab }, '', path);
      }
      if (tab === 'summary') fetchSummary();
      if (tab === 'accounts') fetchAccounts();
      if (tab === 'system') fetchSystemHealth();
      if (tab === 'memory') fetchMemoryHealth();
      if (tab === 'connections') fetchConnections();
      if (tab === 'schedule') fetchSchedule();
      if (tab === 'approvals') fetchApprovals();
      if (tab === 'fleet-health') fetchFleetHealth();
    }

    // Back/forward: restore the tab from the history entry (or the path).
    window.addEventListener('popstate', (e) => {
      switchTab((e.state && e.state.tab) || tabFromPath(), { push: false });
    });

    // Fleet overview — ONE round-trip to the server-side aggregate
    // (/api/summary), which pulls each part through the same per-tab
    // cache so a Summary open warms the tabs and they can never disagree.
    // Each tile still degrades independently: the server nulls any part
    // whose producer threw, and a whole-fetch failure leaves the prior
    // render in place.
    async function fetchSummary() {
      const el = document.getElementById('summary');
      let summary;
      try {
        const r = await fetch(`${API}/api/summary`, { headers: authHeaders() });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        summary = await r.json();
      } catch (err) {
        // Degraded: keep whatever's already rendered (don't blank the
        // tab on a transient blip) and surface the error.
        el.classList.remove('loading');
        showError(`Failed to fetch summary: ${err.message}`);
        return;
      }
      const ag = summary.agents, sys = summary.systemHealth,
            appr = summary.approvals, sched = summary.schedule,
            accts = summary.accounts;
      clearError();
      el.classList.remove('loading');

      // Stash the broker's fleet-active account label so the Accounts tab can
      // flag it (there's no fleet-active flag on /api/accounts itself).
      if (sys && sys.broker && sys.broker.active) fleetActiveLabel = sys.broker.active;

      const agList = Array.isArray(ag) ? ag : [];
      const up = agList.filter(a => a.active === 'active').length;
      const attnItems = Array.isArray(summary.attention) ? summary.attention : [];
      const crit = attnItems.filter(a => a.severity === 'critical').length;
      const warn = attnItems.filter(a => a.severity === 'warn').length;
      const attnCount = attnItems.length;

      // ---- posture verdict ----
      const verdict = attnCount === 0
        ? `<div class="sm-verdict ok"><span class="pulse"></span><h2>Fleet is healthy</h2></div>`
        : `<div class="sm-verdict attn"><span class="pulse"></span><h2><b>${crit || attnCount}</b> ${crit ? 'critical' : 'item' + (attnCount === 1 ? '' : 's')}${crit && warn ? ` · ${warn} warning${warn === 1 ? '' : 's'}` : ''} need${(crit || attnCount) === 1 ? 's' : ''} you</h2></div>`;
      const acctCount = (sys && sys.broker && sys.broker.accounts != null) ? sys.broker.accounts : '—';
      const asOfVal = (typeof summary.dataAsOf === 'number' && summary.dataAsOf > 0)
        ? formatTimestamp(summary.dataAsOf) : '—';
      const asOf = `<div class="sm-asof">data as of ${escapeHtml(asOfVal)} · ${agList.length} agents · ${escapeHtml(String(acctCount))} accounts</div>`;

      // ---- attention hero (renderAttention builds the worst-first list) ----
      const attnHtml = renderAttention(attnItems);

      // ---- vitals: agents + quota ----
      const dots = agList.map(a => `<span class="d ${a.active === 'active' ? 'up' : 'down'}" title="${escapeHtml(a.name)} — ${escapeHtml(a.active)}"></span>`).join('');
      const down = agList.length - up;
      const agentsCard = `
        <div class="sm-vcard">
          <div class="vh">Agents <a onclick="switchTab('agents')">agents →</a></div>
          <div class="sm-agents-n">${up}<span class="of"> / ${agList.length}</span> <span class="of">active</span></div>
          <div class="sm-agents-sub">${down === 0 ? 'all running' : `${down} down — ${agList.filter(a => a.active !== 'active').map(a => escapeHtml(a.name)).join(', ')}`}</div>
          <div class="sm-dotrow">${dots}</div>
        </div>`;

      // Quota — worst probed account, computed client-side from the accounts
      // payload (same Math.max(5h,7d) worst-across-accounts as the old tile).
      const qband = (p) => p >= 90 ? 'hi' : p >= 70 ? 'mid' : 'lo';
      const accts2 = Array.isArray(accts) ? accts : [];
      const usedAccts = accts2.filter(a => a.quotaUsage);
      let quotaCard;
      if (accts2.length === 0) {
        quotaCard = `<div class="sm-vcard"><div class="vh">Quota headroom <a onclick="switchTab('accounts')">accounts →</a></div><div class="sm-quota-acct">unavailable</div></div>`;
      } else if (usedAccts.length === 0) {
        quotaCard = `<div class="sm-vcard"><div class="vh">Quota headroom <a onclick="switchTab('accounts')">accounts →</a></div><div class="sm-quota-acct">not probed yet — see accounts tab</div></div>`;
      } else {
        const pk = (a) => a.quota && a.quota.exhausted ? 1000 : Math.max(a.quotaUsage.fiveHourPct, a.quotaUsage.sevenDayPct);
        const worst = usedAccts.slice().sort((a, b) => pk(b) - pk(a))[0];
        const q = {
          label: worst.label,
          fiveHourPct: worst.quotaUsage.fiveHourPct,
          sevenDayPct: worst.quotaUsage.sevenDayPct,
          exhausted: !!(worst.quota && worst.quota.exhausted),
          exhaustedUntil: (worst.quota && worst.quota.exhausted_until) || null,
        };
        const gauge = (lab, pct, reset) => {
          const b = qband(pct);
          return `<div class="gauge">
            <div class="gauge-top"><span class="lab">${lab}${reset ? `<span class="gauge-reset">resets ${escapeHtml(formatTimestamp(reset))}</span>` : ''}</span><span class="val ${b}">${Math.round(pct)}%</span></div>
            <div class="gauge-track"><span class="gauge-fill ${b}" style="width:${Math.min(100, pct)}%"></span></div>
          </div>`;
        };
        quotaCard = `
          <div class="sm-vcard">
            <div class="vh">Quota headroom <a onclick="switchTab('accounts')">accounts →</a></div>
            <div class="sm-quota-acct">worst account · <b>${escapeHtml(q.label || '—')}</b>${q.exhausted ? ` · <span style="color:var(--red)">exhausted</span>` : ''}</div>
            ${gauge('5-hour window', q.fiveHourPct ?? 0, q.exhausted ? q.exhaustedUntil : null)}
            ${gauge('7-day window', q.sevenDayPct ?? 0, null)}
          </div>`;
      }

      // ---- services rail ----
      const svc = (name, ok, meta, idle) => `
        <div class="sm-svc"><span class="dot ${idle ? 'idle' : ok ? 'ok' : 'bad'}"></span>
          <div class="sm-svc-text"><div class="sm-svc-name">${escapeHtml(name)}</div><div class="sm-svc-meta">${meta}</div></div></div>`;
      const b = (sys && sys.broker) || {}, hs = (sys && sys.hindsight) || {}, hd = (sys && sys.hostd) || {};
      // Approvals active grants — same non-revoked/non-expired count the old
      // tile used (the payload carries `decisions`, not a pre-derived count).
      const apprReachable = !!(appr && appr.reachable !== false);
      const apprDecisions = (appr && appr.decisions) || [];
      const activeGrants = apprDecisions.filter(x => !x.revoked_at && !(x.ttl_expires_at && x.ttl_expires_at < Date.now())).length;
      // Agents HELD on an approval that couldn't be delivered to Telegram.
      // Surfaced twice on purpose: as critical rows in "Needs attention"
      // above (server-derived), and as a count here — a blocked agent must be
      // visible on the default tab without drilling in (#3084).
      const blockedAppr = Array.isArray(summary.blockedApprovals) ? summary.blockedApprovals : [];
      const schedEntries = (sched && Array.isArray(sched.entries)) ? sched.entries : [];
      const schedAgents = new Set(schedEntries.map(e => e.agent)).size;
      const services = [
        svc('auth-broker', !!b.reachable, b.reachable ? `active ${escapeHtml(b.active || '—')} · ${b.accounts ?? '?'} accts` : 'unreachable'),
        svc('hindsight', !!hs.running, hs.running ? `${escapeHtml(hs.model || '?')} · ${hs.mcpStateless ? 'stateless' : 'stateful'}` : 'not running'),
        svc('hostd', !!hd.auditLogPresent, hd.auditLogPresent ? `${(hd.recent || []).length} recent verbs` : 'no audit log'),
        svc('schedule', schedEntries.length > 0, `${schedEntries.length} crons · ${schedAgents} agents`),
        // A blocked agent makes this service NOT ok, however reachable the
        // kernel is — the leash is jammed and someone is waiting on Ken.
        svc('approvals', apprReachable && blockedAppr.length === 0,
          blockedAppr.length > 0
            ? `<b>${blockedAppr.length} agent${blockedAppr.length === 1 ? '' : 's'} blocked</b> — ${escapeHtml(blockedAppr.map(b => b.agent).join(', '))}`
            : apprReachable ? `${activeGrants} active grants · none blocked` : 'unreachable'),
      ].join('');

      el.innerHTML = `
        ${verdict}${asOf}
        <div class="sm-band">Needs attention <span class="n">${attnCount}</span> · worst-first</div>
        <div class="sm-attn-list">${attnHtml}</div>
        <div class="sm-band">Fleet vitals</div>
        <div class="sm-vitals">${agentsCard}${quotaCard}</div>
        <div class="sm-band">Services <span class="n">${blockedAppr.length > 0 ? `${blockedAppr.length} blocked on approval` : 'all nominal'}</span></div>
        <div class="sm-services">${services}</div>`;
    }

    // "Needs attention" triage strip — the FIRST block on the Summary tab.
    // The server derives `attention: AttentionItem[]` (severity-sorted,
    // capped) from the parts the summary already carries; each item is
    // clickable → switchTab(item.tab). Reuses the .problem styling
    // (red title for critical/warn, muted for info). Empty → a calm
    // "nothing needs attention" line. Every interpolated value is escaped.
    function renderAttention(items) {
      if (!Array.isArray(items) || items.length === 0) {
        return `<button class="sm-attn calm"><span class="sev" style="color:var(--green);background:rgba(52,211,153,.12)">clear</span><div class="sm-attn-body"><div class="sm-attn-title">Nothing needs attention</div><div class="sm-attn-detail">Every job spec, account, and service is within tolerance.</div></div></button>`;
      }
      const rank = { critical: 0, warn: 1, info: 2 };
      const sorted = items.slice().sort((a, b) => (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9));
      return sorted.map((it) => {
        const sev = (it && it.severity) || 'info';
        const tab = String((it && it.tab) || 'summary');
        // Whole row clickable → jump to the tab to act on it.
        return `
          <button class="sm-attn ${escapeHtml(sev)}" onclick="switchTab('${escapeHtml(tab)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('${escapeHtml(tab)}')}">
            <span class="sev">${escapeHtml(sev)}</span>
            <div class="sm-attn-body">
              <div class="sm-attn-title">${escapeHtml((it && it.title) || 'Attention')}</div>
              ${it && it.detail ? `<div class="sm-attn-detail">${escapeHtml(it.detail)}</div>` : ''}
            </div>
            <span class="sm-attn-go">${escapeHtml(tab)} →</span>
          </button>`;
      }).join('');
    }

    function showError(msg) {
      document.getElementById('error').innerHTML =
        `<div class="error-banner">${escapeHtml(msg)}</div>`;
    }

    function clearError() {
      document.getElementById('error').innerHTML = '';
    }

    function escapeHtml(s) {
      // Must cover attribute context too: values are interpolated into
      // both text nodes AND title="..." attributes. The old
      // textContent→innerHTML trick escapes &<> but NOT quotes, so an
      // agent-authored string like `" onmouseover="x` could break out
      // of a title= attribute. Escape the full set explicitly.
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // ───────────────────────────────────────────────────────────────────
    // ProblemDetail — actionable error/degraded rendering.
    //
    // A ProblemDetail is `{ title, detail?, remediation? }` where
    // `remediation = { kind, label, value }` and kind ∈
    // 'command' | 'link' | 'telegram' | 'none'. renderProblem() turns it into
    // a styled block; problemFor() is a small catalog mapping a KNOWN
    // condition → a ProblemDetail (with the next-step command baked in).
    //
    // XSS: every server-derived string (title/detail/error text) goes through
    // escapeHtml. Remediation `value` for 'command' is always a static
    // literal from the catalog, but it's escaped anyway for defence in depth.
    // ───────────────────────────────────────────────────────────────────

    // Copy a command to the clipboard. Degrades gracefully where the
    // Clipboard API is unavailable (insecure context / old browser): the
    // <code> is `user-select:all` so the operator can still copy by hand.
    function copyProblemCmd(btn) {
      const text = btn && btn.getAttribute('data-copy');
      if (text == null) return;
      const flash = (label) => {
        const prev = btn.textContent;
        btn.textContent = label;
        setTimeout(() => { btn.textContent = prev; }, 1200);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => flash('Copied'), () => flash('Copy failed'));
        } else {
          flash('Select & copy');
        }
      } catch {
        flash('Select & copy');
      }
    }

    // Allowlist link schemes for remediation hrefs. escapeHtml prevents
    // attribute breakout but NOT a `javascript:`/`data:` scheme; today no
    // catalog entry uses a server-derived href, but guard it so a future
    // `link`/`telegram` remediation can never become an injection vector.
    function safeHref(url) {
      const u = String(url || '').trim();
      return /^(https?:|tg:|mailto:)/i.test(u) ? u : '#';
    }

    function renderProblem(problem) {
      if (!problem) return '';
      const muted = problem.muted ? ' muted' : '';
      const title = `<div class="problem-title">${escapeHtml(problem.title || 'Problem')}</div>`;
      const detail = problem.detail
        ? `<div class="problem-detail">${escapeHtml(problem.detail)}</div>`
        : '';
      let rem = '';
      const r = problem.remediation;
      if (r && r.kind && r.kind !== 'none') {
        if (r.kind === 'command') {
          const cmd = escapeHtml(r.value || '');
          // data-copy holds the RAW (unescaped) command for clipboard write;
          // attribute context is still escaped via escapeHtml so the value
          // can't break out of the attribute.
          rem = `<div class="problem-remediation">
            ${r.label ? `<span class="rem-label">${escapeHtml(r.label)}</span>` : ''}
            <span class="problem-cmd"><code>${cmd}</code><button class="problem-copy" type="button" data-copy="${escapeHtml(r.value || '')}" onclick="copyProblemCmd(this)">Copy</button></span>
          </div>`;
        } else if (r.kind === 'link') {
          rem = `<div class="problem-remediation">
            <a href="${escapeHtml(safeHref(r.value))}" target="_blank" rel="noopener">${escapeHtml(r.label || r.value || 'Open')}</a>
          </div>`;
        } else if (r.kind === 'telegram') {
          const note = r.value
            ? `<a href="${escapeHtml(safeHref(r.value))}" target="_blank" rel="noopener">${escapeHtml(r.label || 'Act in Telegram')}</a>`
            : escapeHtml(r.label || 'Act from Telegram (no model call is made from the dashboard).');
          rem = `<div class="problem-remediation">${note}</div>`;
        }
      } else if (r && r.label) {
        // kind:'none' but a label hint was supplied (e.g. a "Refresh" nudge).
        rem = `<div class="problem-remediation"><span class="rem-label">${escapeHtml(r.label)}</span></div>`;
      }
      return `<div class="problem${muted}">${title}${detail}${rem}</div>`;
    }

    // Catalog: known condition → ProblemDetail. Keep small + readable. Error
    // strings are pattern-matched defensively (case-insensitive, optional).
    function problemFor(kind, ctx) {
      ctx = ctx || {};
      switch (kind) {
        case 'hindsight-down':
          return {
            title: 'Hindsight (agent memory) is not serving',
            detail: (ctx.url ? `${ctx.url} is not responding. ` : '') +
              'Agent memory — recall, retain, mental models — is down until it recovers.',
            remediation: {
              kind: 'command',
              label: 'Run on the host:',
              value: 'switchroom memory setup --stop && switchroom memory setup',
            },
          };
        case 'broker-socket-absent':
          return {
            title: 'Auth-broker socket not mounted into the dashboard',
            detail: (ctx.error ? `${ctx.error} ` : '') +
              'The web container has no broker socket — re-mount it so the dashboard can read live account state.',
            remediation: {
              kind: 'command',
              label: 'Re-mount on the host:',
              value: 'switchroom web install',
            },
          };
        case 'broker-down':
          return {
            title: 'Auth-broker unreachable',
            detail: (ctx.error ? `${ctx.error} ` : '') +
              'The socket is present but the broker is not answering.',
            remediation: {
              kind: 'command',
              label: 'Check broker status on the host:',
              value: 'switchroom vault broker status',
            },
          };
        case 'hostd-no-audit':
          return {
            muted: true,
            title: 'hostd has handled no privileged verbs yet',
            detail: 'This is informational — the audit log is empty because no privileged operation has run, not because hostd is broken.',
            remediation: { kind: 'none' },
          };
        case 'schedule-degraded':
          return {
            title: 'Schedule view is incomplete',
            detail: ctx.reason
              ? `${ctx.reason} Showing the base-config-only view (per-agent cascade overrides may be missing).`
              : 'hostd is unreachable — showing the base-config-only view (per-agent cascade overrides may be missing).',
            remediation: {
              kind: 'command',
              label: 'Diagnose on the host:',
              value: 'switchroom doctor',
            },
          };
        case 'approvals-socket-absent':
          return {
            title: 'Approval-kernel operator socket not present',
            detail: (ctx.error ? `${ctx.error} ` : '') +
              'The dashboard has no operator socket to read the approval ledger — re-apply to (re)create it.',
            remediation: {
              kind: 'command',
              label: 'Run on the host:',
              value: 'switchroom apply',
            },
          };
        case 'approvals-kernel-down':
          return {
            title: 'Approval-kernel unreachable',
            detail: (ctx.error ? `${ctx.error} ` : '') +
              'The kernel socket is present but the kernel is not answering.',
            remediation: {
              kind: 'command',
              label: 'Check the singletons on the host:',
              value: 'docker compose -p switchroom ps',
            },
          };
        case 'grants-unreachable':
          return {
            title: 'Standing capability grants unavailable',
            detail: (ctx.error ? `${ctx.error} ` : '') +
              'The vault-broker (which owns the grants DB) is not host-reachable, so the operator\'s standing grants can\'t be listed.',
            remediation: {
              kind: 'command',
              label: 'Check broker status on the host:',
              value: 'switchroom vault broker status',
            },
          };
        case 'connections-degraded':
          return {
            muted: true,
            title: 'Live broker data unavailable — showing configured accounts only',
            detail: 'These accounts are from the config; the broker did not return live slot state, so connection status may be stale.',
            remediation: { kind: 'none', label: 'Refresh the tab once the broker is reachable to see live status.' },
          };
        case 'connections-unreachable':
          return {
            title: "Couldn't load live connection data — retrying",
            detail: 'The dashboard could not reach the account data source (the broker or web container may be restarting). ' +
              'This is NOT "no accounts configured" — your connected accounts are unchanged. ' +
              'Auto-retrying; the tab fills in once it recovers.',
            remediation: { kind: 'none', label: 'Or refresh the page if it persists.' },
          };
        default:
          return { title: String(kind || 'Problem'), remediation: { kind: 'none' } };
      }
    }

    // Classify an auth-broker error string into the right catalog condition.
    // "socket file not found" / ENOENT / "no such file" ⇒ socket not mounted;
    // anything else (connection refused, etc.) ⇒ broker is down.
    function brokerProblem(error) {
      return /not found|enoent|no such file/i.test(String(error || ''))
        ? problemFor('broker-socket-absent', { error })
        : problemFor('broker-down', { error });
    }

    // Classify an approvals error string. "operator socket not present" /
    // operatorUid ⇒ socket absent (apply); otherwise kernel is down.
    function approvalsProblem(error) {
      return /not present|operatoruid/i.test(String(error || ''))
        ? problemFor('approvals-socket-absent', { error })
        : problemFor('approvals-kernel-down', { error });
    }

    function statusClass(agent) {
      if (agent.active === 'active') {
        if (agent.auth && agent.auth.expiresAt) {
          const remaining = agent.auth.expiresAt - Date.now();
          if (remaining > 0 && remaining < 60 * 60 * 1000) return 'auth-warning';
        }
        return 'active';
      }
      return 'inactive';
    }

    // Context-headroom gauge (RFC context-headroom-surface): occupancy/cap
    // with a fill bar, amber when tight (≥80%). '—' when no snapshot yet.
    function fmtTok(n) {
      return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);
    }
    function formatContext(ctx) {
      if (!ctx || ctx.state === 'unknown' || typeof ctx.occupancy !== 'number') {
        return '<span style="color:var(--text-dim)">—</span>';
      }
      if (ctx.cap == null || ctx.pct == null) {
        return `<span>${fmtTok(ctx.occupancy)} <span style="color:var(--text-dim)">(no cap)</span></span>`;
      }
      const pct = Math.max(0, Math.min(1, ctx.pct));
      const tight = ctx.state === 'tight';
      const col = tight ? 'var(--amber, #d99)' : 'var(--green)';
      return `<span class="ctx-gauge" title="${fmtTok(ctx.occupancy)} / ${fmtTok(ctx.cap)} tokens — ${Math.round(pct * 100)}% of cap${tight ? ' (tight — /compact near)' : ''}">`
        + `<span class="ctx-text">${fmtTok(ctx.occupancy)}/${fmtTok(ctx.cap)} (${Math.round(pct * 100)}%)</span>`
        + `<span class="ctx-bar"><span class="ctx-fill" style="width:${(pct * 100).toFixed(0)}%;background:${col}"></span></span>`
        + `</span>`;
    }

    function formatUptime(timestamp) {
      if (!timestamp) return '--';
      const d = new Date(timestamp);
      if (isNaN(d.getTime())) return timestamp;
      const diff = Date.now() - d.getTime();
      if (diff < 0) return 'just now';
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ${mins % 60}m`;
      const days = Math.floor(hrs / 24);
      return `${days}d ${hrs % 24}h`;
    }

    function render() {
      const container = document.getElementById('agents');
      if (agents.length === 0) {
        container.innerHTML = '<div class="loading">No agents yet. Run <code>switchroom agent create &lt;name&gt; --profile &lt;profile&gt;</code> to add one.</div>';
        return;
      }

      // Worst-first posture strip + sort — not-active (down) or auth-failed
      // agents are the ones that need attention; surface them first.
      const needsAttention = (a) => a.active !== 'active' || a.auth.authenticated === false;
      const attnAgents = agents.filter(needsAttention);
      const cleanAgents = agents.filter(a => !needsAttention(a));
      const posture = `
        <div class="ac-posture" style="grid-column:1/-1;margin:0 0 0.4rem;justify-content:flex-start">
          <span class="ac-stat attn"><span class="n">${attnAgents.length}</span><span class="l">need attention</span></span>
          <span class="ac-stat clean"><span class="n">${cleanAgents.length}</span><span class="l">running clean</span></span>
        </div>`;
      const sortedAgents = attnAgents.concat(cleanAgents);

      container.className = 'agents-grid';
      container.innerHTML = posture + sortedAgents.map(a => `
        <div class="agent-card" data-agent="${escapeHtml(a.name)}">
          <div class="card-header" onclick="toggleLogs('${escapeHtml(a.name)}')">
            <div class="status-dot ${statusClass(a)}" title="${escapeHtml(a.active)} · bridge heartbeat (not a claude-liveness signal)"></div>
            <div class="agent-name">${escapeHtml(a.name)}</div>
            <div class="agent-topic">${a.topic_emoji ? escapeHtml(a.topic_emoji) + ' ' : ''}${escapeHtml(a.topic_name)}</div>
          </div>
          <div class="card-meta">
            <div class="meta-item"><label>Status </label><span>${escapeHtml(a.active)}</span></div>
            <div class="meta-item"><label>Uptime </label><span>${formatUptime(a.uptime)}</span></div>
            <div class="meta-item"><label>Mem </label><span>${a.memory || '--'}</span></div>
            <div class="meta-item"><label>Last turn </label><span>${a.lastTurnAt ? formatTimestamp(a.lastTurnAt) : '—'}</span></div>
            <div class="meta-item meta-context"><label>Context </label>${formatContext(a.context)}</div>
            <div class="meta-item"><label>Profile </label><span>${escapeHtml(a.extends)}</span></div>
            <div class="meta-item"><label>Auth </label><span>${a.auth.authenticated ? '✓' : '✗'}</span></div>
            <div class="meta-item"><label>Account </label><span>${a.primaryAccount ? escapeHtml(a.primaryAccount) : '<span style="color:var(--text-dim)">default</span>'}</span></div>
            <div class="meta-item"><label>Collection </label><span>${escapeHtml(a.memoryCollection)}</span></div>
          </div>
          <div class="card-actions">
            <button class="btn btn-start" onclick="agentAction('${escapeHtml(a.name)}','start')" ${a.active === 'active' ? 'disabled' : ''}>Start</button>
            <button class="btn btn-stop" onclick="agentAction('${escapeHtml(a.name)}','stop')" ${a.active !== 'active' ? 'disabled' : ''}>Stop</button>
            <button class="btn btn-restart" onclick="agentAction('${escapeHtml(a.name)}','restart')" ${a.active !== 'active' ? 'disabled' : ''}>Restart</button>
            <button class="btn" onclick="toggleDetails('${escapeHtml(a.name)}')">${openDetails.has(a.name) ? 'Hide' : 'Details'}</button>
          </div>
          <div class="card-detail ${openDetails.has(a.name) ? 'open' : ''}" id="detail-${escapeHtml(a.name)}">
            ${renderAgentDetail(a.name)}
          </div>
          <div class="card-logs ${openLogs.has(a.name) ? 'open' : ''}" id="logs-${escapeHtml(a.name)}">
            <div class="logs-header">
              <span>Logs</span>
              <button onclick="loadLogs('${escapeHtml(a.name)}')">Refresh</button>
            </div>
            <div class="log-output" id="log-output-${escapeHtml(a.name)}">Click to load logs...</div>
          </div>
        </div>
      `).join('');
    }

    function renderAgentDetail(name) {
      // Wrapped so a single malformed detail can NEVER throw into render()'s
      // agents.map and blank the whole grid. (The accounts.assigned crash this
      // replaces did exactly that: it read a field the API renamed to
      // {active, details} post-RFC-H, threw a TypeError on every open panel,
      // and aborted the map → the entire Agents tab went blank on each poll.)
      try {
        return renderAgentDetailInner(name);
      } catch (err) {
        return `<div style="color:var(--red)">Detail render failed: ${escapeHtml((err && err.message) || String(err))}</div>`;
      }
    }

    function renderAgentDetailInner(name) {
      const d = agentDetails[name];
      if (!d) return '<div style="color:var(--text-dim)">Loading…</div>';
      const accounts = d.accounts;
      const subagents = d.subagents;
      const config = d.config;

      // handleGetAgentAccounts returns { active: string|null, details: AccountInfo[] }
      // — the single bound account (fleet-active or per-agent auth.override),
      // NOT the pre-RFC-H assigned[] list.
      let accountsHtml;
      const activeLabel = accounts && accounts.active;
      if (!activeLabel) {
        accountsHtml = '<div style="color:var(--text-dim)">No per-agent account override — uses the fleet-active account.</div>';
      } else {
        const info = (accounts.details || []).find(x => x && x.label === activeLabel);
        if (!info) {
          accountsHtml = `<span class="chip missing" title="bound account not found in ~/.switchroom/accounts/">${escapeHtml(activeLabel)} · missing</span>`;
        } else {
          accountsHtml = `<span class="chip"><span class="health-badge ${escapeHtml(info.health)}" style="margin-right:0.4rem">${escapeHtml(info.health)}</span>${escapeHtml(activeLabel)} · bound</span>`;
        }
      }

      let subHtml;
      if (!subagents || subagents.length === 0) {
        subHtml = '<div style="color:var(--text-dim)">No sub-agents tracked.</div>';
      } else {
        subHtml = subagents.map(s => `<span class="chip">${escapeHtml(s.name || s.id || '?')}${s.status ? ' · ' + escapeHtml(s.status) : ''}</span>`).join('');
      }

      // Recent turns — each Turn carries `started_at` (unix ms),
      // `ended_at` (null while in-flight), and `user_prompt_preview` (the
      // first ~200 chars of the user message). We render the start time,
      // an ended/in-flight status, and a truncated prompt. A null `turns`
      // (fetch failed) renders nothing different from "no turns" — the
      // other sections are unaffected either way.
      const turns = d.turns;
      let turnsHtml;
      if (!Array.isArray(turns) || turns.length === 0) {
        turnsHtml = '<div style="color:var(--text-dim)">No turns recorded.</div>';
      } else {
        turnsHtml = turns.map(t => {
          const when = escapeHtml(formatTimestamp(t.started_at));
          const status = t.ended_at ? 'ended' : 'in-flight';
          const raw = (t.user_prompt_preview || '').replace(/\s+/g, ' ').trim();
          const summary = raw
            ? escapeHtml(raw.length > 80 ? raw.slice(0, 80) + '…' : raw)
            : '<span style="color:var(--text-dim)">(no prompt)</span>';
          return `<div style="margin-bottom:.4rem">
            <span style="color:var(--text-dim);font-size:.8rem">${when} · ${escapeHtml(status)}</span><br>
            <span>${summary}</span>
          </div>`;
        }).join('');
      }

      const configText = config ? JSON.stringify(config, null, 2) : '(unavailable)';

      return `
        <h4>Account</h4>${accountsHtml}
        <h4>Sub-agents</h4>${subHtml}
        <h4>Recent turns</h4>${turnsHtml}
        <h4>Resolved config</h4><pre class="config-pre">${escapeHtml(configText)}</pre>
      `;
    }

    function renderAccounts() {
      const el = document.getElementById('accounts');
      if (!accounts || accounts.length === 0) {
        el.innerHTML = '<div class="loading">No accounts. Run <code>switchroom auth account add &lt;label&gt;</code>.</div>';
        return;
      }
      // Worst-first quota triage. RFC-H shape: the API returns `usedBy`
      // (agents bound via the fleet-active account or a per-agent override),
      // a broker `quota` AccountState ({exhausted, exhausted_until,
      // threshold_violations}), `quotaUsage` (5h/7d + reset/capturedAt ms),
      // `quotaUsageSource`, `quotaStale`, `health`, and `expiresAt` (ms).
      // Timestamps are already epoch-ms on the wire, so formatTimestamp
      // takes them directly (the mock's relTime maps to formatTimestamp).
      const qband = (p) => p == null ? 'na' : p >= 90 ? 'hi' : p >= 70 ? 'mid' : 'lo';
      // health → badge bucket (exhausted always wins). Server sends
      // "missing-credentials"/"missing-refresh-token" → collapse to "missing".
      const healthBucket = (a) => {
        if (a.quota && a.quota.exhausted) return 'exhausted';
        const h = a.health || '';
        if (h === 'expired') return 'expired';
        if (h.indexOf('missing') === 0) return 'missing';
        return 'healthy';
      };
      const isExpiredish = (a) => a.health === 'expired' || (a.health || '').indexOf('missing') === 0;
      // higher = more urgent → sorts to top
      const pressure = (a) => {
        if (a.quota && a.quota.exhausted) return 100 + ((a.quotaUsage && a.quotaUsage.fiveHourPct) || 0);
        // expired-but-unused isn't more urgent than a near-limit account that's
        // actively serving agents — rank it below live quota pressure.
        if (isExpiredish(a)) return (a.usedBy && a.usedBy.length ? 95 : 80);
        const u = a.quotaUsage;
        return u ? Math.max(u.fiveHourPct, u.sevenDayPct) : -1;
      };
      const needsAttention = (a) => (a.quota && a.quota.exhausted) || isExpiredish(a)
        || (a.quotaUsage && Math.max(a.quotaUsage.fiveHourPct, a.quotaUsage.sevenDayPct) >= 85);

      const gauge = (lab, pct, reset, stale) => {
        const b = qband(pct);
        const val = pct == null ? '—' : Math.round(pct) + '%';
        return `<div class="gauge ${stale ? 'stale' : ''}">
          <div class="gauge-top"><span class="lab">${lab}${reset && pct != null ? `<span class="gauge-reset">resets ${escapeHtml(formatTimestamp(reset))}</span>` : ''}</span><span class="val ${b}">${val}${stale ? ' ·stale' : ''}</span></div>
          <div class="gauge-track"><span class="gauge-fill ${b}" style="width:${pct == null ? 0 : Math.min(100, pct)}%"></span></div>
        </div>`;
      };

      const sorted = accounts.slice().sort((a, b) => pressure(b) - pressure(a));
      const attention = sorted.filter(needsAttention);
      const clean = sorted.filter(a => !needsAttention(a));

      const card = (a, worst) => {
        const hb = healthBucket(a);
        const hlabel = (a.quota && a.quota.exhausted) ? 'quota-exhausted' : (a.health || 'healthy');
        const fleetActive = fleetActiveLabel != null && a.label === fleetActiveLabel;
        const usedBy = a.usedBy || [];
        // alert callout
        let alert = '';
        if (a.quota && a.quota.exhausted) {
          alert = `<div class="acct-alert crit"><span class="lab">quota exhausted</span>5-hour window is spent — bound agents' next turns will fail until it resets <b>${escapeHtml(formatTimestamp(a.quota.exhausted_until))}</b> (${escapeHtml(usedBy.join(', ')) || 'no agents bound'}).</div>`;
        } else if (isExpiredish(a)) {
          alert = `<div class="acct-alert crit"><span class="lab">token expired</span>Re-auth needed — <code>switchroom auth account refresh ${escapeHtml(a.label)}</code>.${usedBy.length ? '' : ' No agents are currently bound, so nothing is failing yet.'}</div>`;
        } else if (a.quotaUsage && Math.max(a.quotaUsage.fiveHourPct, a.quotaUsage.sevenDayPct) >= 85) {
          alert = `<div class="acct-alert warn"><span class="lab">approaching limit</span>7-day window at ${Math.round(a.quotaUsage.sevenDayPct)}% — expect throttling for ${escapeHtml(usedBy.join(', ')) || 'bound agents'} soon.</div>`;
        }

        const u = a.quotaUsage;
        const quota = u
          ? `<div class="acct-quota">
               ${gauge('5-hour', u.fiveHourPct, u.fiveHourResetAt, a.quotaStale)}
               ${gauge('7-day', u.sevenDayPct, u.sevenDayResetAt, a.quotaStale)}
             </div>`
          : `<div class="acct-quota"><div style="grid-column:1/-1;font-size:.8rem;color:var(--text-dim)">Quota not probed${isExpiredish(a) ? ' — token expired' : ''}. <span style="color:var(--blue);cursor:pointer" onclick="refreshQuota('${escapeHtml(a.label)}', true)">↻ probe now</span></div></div>`;

        const usedByHtml = usedBy.length
          ? `<span class="used-by">${usedBy.map(n => `<span class="ag">${escapeHtml(n)}</span>`).join('')}</span>`
          : `<span class="used-by"><span class="none">unused</span></span>`;
        const probed = (u && u.capturedAt)
          ? `<span class="probed">${escapeHtml(formatTimestamp(u.capturedAt))} <span class="src">${a.quotaUsageSource === 'broker-cache' ? '(cache, free)' : '(live probe)'}</span></span>`
          : `<span class="probed">never</span>`;
        const viol = (a.quota && a.quota.threshold_violations)
          ? `<span style="color:var(--yellow)">${a.quota.threshold_violations}</span>` : '0';

        return `
          <div class="acct ${worst ? 'worst' : ''}">
            <div class="acct-head">
              <span class="acct-label">${escapeHtml(a.label)}</span>
              ${fleetActive ? `<span class="acct-fleet">fleet-active</span>` : ''}
              <span class="health-badge ${hb}"><span class="dot"></span>${escapeHtml(hlabel)}</span>
              <span class="acct-actions">
                <button class="btn" title="Probe live quota now (billed Anthropic call)" onclick="refreshQuota('${escapeHtml(a.label)}', true)">↻ Probe</button>
                ${fleetActive ? '' : `<button class="btn" onclick="openPromoteModal('${escapeHtml(a.label)}')">Make fleet-active…</button>`}
              </span>
            </div>
            ${alert}
            ${quota}
            <div class="acct-foot">
              <span><span class="k">used by</span> ${usedByHtml}</span>
              <span><span class="k">probed</span> ${probed}</span>
              <span><span class="k">threshold viols</span> ${viol}</span>
              <span><span class="k">token expires</span> ${escapeHtml(formatTimestamp(a.expiresAt))}</span>
            </div>
          </div>`;
      };

      el.innerHTML = `
        <div class="ac-bar">
          <button class="btn" onclick="refreshQuota(null, true)">↻ Refresh all quota</button>
          <span class="hint">5h/7d usage is cached (≤10 min); ↻ forces a live probe — one billed call per account.</span>
          <span class="ac-posture">
            <span class="ac-stat attn"><span class="n">${attention.length}</span><span class="l">need attention</span></span>
            <span class="ac-stat clean"><span class="n">${clean.length}</span><span class="l">healthy</span></span>
          </span>
        </div>
        ${attention.length ? `<div class="ac-band">Needs attention <span class="n">${attention.length}</span> · worst-first</div>
          <div class="ac-list">${attention.map((a, i) => card(a, i === 0)).join('')}</div>` : ''}
        <div class="ac-band">Healthy <span class="n">${clean.length}</span> · within tolerance</div>
        <div class="ac-list">${clean.map(a => card(a, false)).join('') || '<div style="color:var(--text-dim);font-size:.85rem">No healthy accounts.</div>'}</div>`;
    }

    // Refresh cached quota. label=null → all accounts. force=true →
    // bypass the server's 10-min TTL (the per-account / "all" buttons).
    async function refreshQuota(label, force) {
      try {
        showToast(label ? `Probing ${label}…` : 'Probing all accounts…', true);
        const res = await fetch(`${API}/api/accounts/quota/refresh`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify(label ? { labels: [label], force: !!force } : { force: !!force }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showToast(`Quota probe failed: ${data.error || `HTTP ${res.status}`}`, false);
        } else {
          showToast('Quota updated', true);
        }
        fetchAccounts(); // re-pull; handleGetAccounts now serves the fresh cache
      } catch (err) {
        showToast(`Quota probe failed: ${err.message}`, false);
      }
    }

    function renderSystemHealth(h) {
      const container = document.getElementById('system');
      const b = h.broker || {};
      const hs = h.hindsight || {};
      const hd = h.hostd || {};

      const dot = (ok) => `<span class="status-dot ${ok ? 'active' : 'inactive'}" style="display:inline-block;vertical-align:middle"></span>`;
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;

      const brokerBody = b.reachable
        ? `<div class="card-meta" style="padding:0">
             <div class="meta-item"><label>Fleet-active </label><span>${escapeHtml(b.active || '—')}</span></div>
             <div class="meta-item"><label>Accounts </label><span>${b.accounts ?? '—'}</span></div>
             <div class="meta-item"><label>Agents </label><span>${b.agents ?? '—'}</span></div>
             <div class="meta-item"><label>Consumers </label><span>${b.consumers ?? '—'}</span></div>
           </div>`
        : renderProblem(brokerProblem(b.error));

      const statelessCell = hs.mcpStateless == null
        ? dim('unknown')
        : hs.mcpStateless ? 'stateless' : '<span style="color:var(--yellow)">stateful</span>';
      const hindsightMeta = `
        <div class="card-meta" style="padding:0">
          <div class="meta-item"><label>Container </label><span>${hs.containerStatus ? escapeHtml(hs.containerStatus) : dim('absent')}</span></div>
          <div class="meta-item"><label>Model </label><span>${hs.model ? escapeHtml(hs.model) : dim('unknown')}</span></div>
          <div class="meta-item"><label>Provider </label><span>${hs.provider ? escapeHtml(hs.provider) : dim('unknown')}</span></div>
          <div class="meta-item"><label>MCP </label><span>${statelessCell}</span></div>
        </div>`;
      // When hindsight isn't serving, lead with the actionable remediation,
      // then still show the (now-stale) container/model meta beneath it.
      const hindsightBody = hs.running === false
        ? renderProblem(problemFor('hindsight-down', {})) + hindsightMeta
        : hindsightMeta;

      let hostdBody;
      if (!hd.auditLogPresent) {
        // A genuine read error stays a red dim line; the benign "empty audit
        // log" case is an informational ProblemDetail (not an error state).
        hostdBody = hd.error
          ? `<div style="color:var(--red)">${escapeHtml('audit log error: ' + hd.error)}</div>`
          : renderProblem(problemFor('hostd-no-audit', {}));
      } else if (!hd.recent || hd.recent.length === 0) {
        hostdBody = dim('audit log present, no entries');
      } else {
        // Tri-state, not a binary ok/!ok — async mutations log a `started`
        // row (exit_code null) that is NOT a failure; painting it red made the
        // panel a wall of false-alarm red. Map: error/non-zero exit → red,
        // denied → grey, started/in-flight → blue, completed+exit0 → green.
        const verbStatus = (e) => {
          if (e.result === 'denied') return { cls: 'denied', dotStyle: 'background:var(--text-dim)', label: 'denied' };
          if (e.result === 'error' || (e.exit_code != null && e.exit_code !== 0))
            return { cls: 'err', dotStyle: 'background:var(--red)', label: e.result || 'error' };
          if (e.result === 'started' || e.exit_code == null)
            return { cls: 'started', dotStyle: 'background:var(--blue);box-shadow:0 0 6px var(--blue)', label: e.result || 'in progress' };
          return { cls: 'ok', dotStyle: 'background:var(--green);box-shadow:0 0 6px var(--green)', label: e.result || 'ok' };
        };
        const rows = hd.recent.slice().reverse().map(e => {
          const caller = e.caller && e.caller.kind === 'agent' ? escapeHtml(e.caller.name) : 'operator';
          const st = verbStatus(e);
          // The one diagnostic field — stderr_tail/error — was previously
          // dropped, making EROFS/reconcile failures unreadable. Surface it.
          const detail = e.stderr_tail || e.error;
          const detailRow = (st.cls === 'err' || st.cls === 'denied') && detail
            ? `<tr><td colspan="4" style="color:var(--red);font-size:.72rem;white-space:pre-wrap;word-break:break-word;padding-top:0">${escapeHtml(String(detail).slice(0, 400))}</td></tr>`
            : '';
          return `<tr>
            <td><span class="status-dot" style="display:inline-block;vertical-align:middle;${st.dotStyle}"></span> ${escapeHtml(e.op || '?')}</td>
            <td>${caller}</td>
            <td>${escapeHtml(st.label)}${e.exit_code != null ? ` (${e.exit_code})` : ''}</td>
            <td>${escapeHtml(shortTs(e.ts))}</td>
          </tr>${detailRow}`;
        }).join('');
        hostdBody = `<table class="accounts-table" style="margin-top:0.5rem">
          <thead><tr><th>Verb</th><th>Caller</th><th>Result</th><th>When</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      }

      // Subtle freshness hint: the cached object carries `stale:true` when
      // it's being served past its TTL while a background refresh runs.
      const updating = h.stale
        ? `<span style="color:var(--text-dim);font-size:.7rem;margin-left:.4rem">(updating…)</span>`
        : '';

      // Worst-first posture strip — same "attention vs clean" pattern as
      // Fleet Health / Accounts. hostd counts as attention when the audit
      // log is missing/erroring OR any recent verb actually failed (not
      // the benign in-flight "started" state).
      const hostdHasFailure = !!(hd.recent && hd.recent.some(e =>
        e.result === 'error' || (e.exit_code != null && e.exit_code !== 0)));
      const services = [
        { key: 'broker', ok: !!b.reachable, name: 'auth-broker', dotOk: b.reachable,
          html: `<div class="agent-card"><div class="card-header" style="cursor:default">${dot(b.reachable)}<span class="agent-name">auth-broker</span></div><div style="padding:0 1.25rem 1rem">${brokerBody}</div></div>` },
        { key: 'hindsight', ok: hs.running !== false, name: 'hindsight', dotOk: hs.running,
          html: `<div class="agent-card"><div class="card-header" style="cursor:default">${dot(hs.running)}<span class="agent-name">hindsight</span></div><div style="padding:0 1.25rem 1rem">${hindsightBody}</div></div>` },
      ];
      const attnCount = services.filter(s => !s.ok).length + (hd.auditLogPresent && !hostdHasFailure ? 0 : 1);
      const cleanCount = services.length + 1 - attnCount;
      const posture = `
        <div class="ac-posture" style="margin:0 0 0.6rem;justify-content:flex-start">
          <span class="ac-stat attn"><span class="n">${attnCount}</span><span class="l">need attention</span></span>
          <span class="ac-stat clean"><span class="n">${cleanCount}</span><span class="l">clean</span></span>
        </div>`;
      // Sort the service cards worst-first (down services surface before
      // healthy ones) — the hostd card stays pinned below since it's a
      // wider table, not part of the two-up grid.
      const servicesSorted = services.slice().sort((a, b2) => (a.ok === b2.ok) ? 0 : a.ok ? 1 : -1);

      container.innerHTML = `
        ${updating ? `<div style="margin-bottom:.4rem">System health ${updating}</div>` : ''}
        ${posture}
        <div class="agents-grid">
          ${servicesSorted.map(s => s.html).join('')}
        </div>
        <div class="agent-card" style="margin-top:1rem"><div class="card-header" style="cursor:default">
          ${dot(hd.auditLogPresent)}<span class="agent-name">hostd — recent privileged verbs</span></div>
          <div style="padding:0 1.25rem 1rem">${hostdBody}</div></div>`;
    }

    function shortTs(ts) {
      if (!ts) return '—';
      // 2026-05-15T04:15:13.465Z → 2026-05-15 04:15:13
      return String(ts).replace('T', ' ').replace(/\.\d+Z?$/, '').replace(/Z$/, '');
    }

    const _dimC = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;

    let _accessBtnSeq = 0;
    let _scopeSeq = 0;

    // One OAuth-account card (Google or Microsoft — same shape; Microsoft
    // adds an account-type pill). When agentNames is supplied, renders a
    // per-agent "manage access" row (enable/disable → Telegram approval).
    function renderOAuthAccountCard(a, opts) {
      const provider = (opts && opts.provider) || '';
      const agentNames = (opts && opts.agentNames) || [];
      // expiresAt is the SHORT-LIVED access-token expiry, NOT connection
      // health. For a broker-known slot the refresh token keeps it alive, so a
      // past value means "lazily refreshes on next use" — rendering it as
      // "Expires 23d ago" made healthy connected accounts look broken (the
      // "connections aren't accurate" complaint). Don't alarm on it.
      const expires = !a.expiresAt
        ? _dimC('—')
        : (a.brokerKnown && a.expiresAt < Date.now())
          ? '<span style="color:var(--text-dim)">auto-refreshes</span>'
          : formatTimestamp(a.expiresAt);
      const known = a.brokerKnown
        ? '<span class="usage-pill primary">connected</span>'
        : '<span style="color:var(--yellow)">config-only (no broker slot)</span>';
      const acl = (a.enabledFor && a.enabledFor.length)
        ? a.enabledFor.map(escapeHtml).join(', ')
        : _dimC('no agents enabled');
      const typePill = (opts && opts.showType && a.accountType)
        ? `<span class="usage-pill" style="margin-left:.4rem">${escapeHtml(a.accountType)}</span>`
        : '';
      const enabledSet = new Set(a.enabledFor || []);
      const manage = (agentNames.length && provider)
        ? `<div class="account-usage" style="margin-top:.5rem">
             <label style="color:var(--text-dim);opacity:.7;display:block;margin-bottom:.3rem">Manage access (approve on Telegram):</label>
             ${agentNames.map(name => {
               const on = enabledSet.has(name);
               const btnId = `acc-${++_accessBtnSeq}`;
               const accJs = JSON.stringify(a.account), nameJs = JSON.stringify(name), provJs = JSON.stringify(provider);
               return `<button id="${btnId}" class="usage-pill ${on ? 'primary' : ''}" style="margin:.15rem;cursor:pointer;border:none"
                 onclick='toggleAccess(${provJs}, ${accJs}, ${nameJs}, ${!on}, "${btnId}")'>${on ? '✓ ' : '+ '}${escapeHtml(name)}</button>`;
             }).join('')}
           </div>`
        : '';
      // Scope: clickable "N scope(s)" that expands a full-width list of the
      // individual scopes below the meta row (the old version hid them in a
      // title tooltip only). The list is a sibling block after .card-meta so
      // it isn't squished inside the flex-wrapped meta-items.
      const scopeList = a.scope ? a.scope.split(/\s+/).filter(Boolean) : [];
      let scopeCount, scopeBlock = '';
      if (scopeList.length) {
        const sid = `scopes-${++_scopeSeq}`;
        scopeCount = `<span class="scope-toggle" id="${sid}-t" role="button" tabindex="0" aria-expanded="false" aria-controls="${sid}"
            onclick="toggleScopes('${sid}')"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleScopes('${sid}');}"
          ><span class="scope-caret">▸</span>${escapeHtml(scopeList.length + ' scope' + (scopeList.length === 1 ? '' : 's'))}</span>`;
        scopeBlock = `<ul class="scope-list" id="${sid}" hidden>${
          scopeList.map(s => `<li title="${escapeHtml(s)}">${escapeHtml(s)}</li>`).join('')
        }</ul>`;
      } else {
        scopeCount = _dimC('—');
      }
      return `
      <div class="account-card">
        <div class="account-card-header">
          <div class="account-label">${escapeHtml(a.account)}${typePill}</div>
          <span style="margin-left:auto">${known}</span>
        </div>
        <div class="account-usage"><label style="color:var(--text-dim);opacity:.7">Enabled for: </label>${acl}</div>
        <div class="card-meta" style="padding:0">
          <div class="meta-item"><label>Expires </label><span>${expires}</span></div>
          <div class="meta-item"><label>Scope </label><span>${scopeCount}</span></div>
          <div class="meta-item"><label>Client </label><span>${a.clientId ? escapeHtml(a.clientId.slice(0, 16) + '…') : _dimC('—')}</span></div>
        </div>
        ${scopeBlock}
        ${manage}
      </div>`;
    }

    function _connectionSection(title, emptyHtml, cardsHtml) {
      return `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">${title}</h3>
          ${cardsHtml ? `<div class="accounts-grid">${cardsHtml}</div>` : `<div class="loading" style="padding:.8rem">${emptyHtml}</div>`}
        </div>`;
    }

    // Unified external-connections view: Google + Microsoft accounts and
    // the Notion workspace, each showing which agents have access.
    function renderConnections(data) {
      const container = document.getElementById('connections');
      const google = data.google || [];
      const microsoft = data.microsoft || [];
      const notion = data.notion || { configured: false, databases: [] };
      const linear = data.linear || { configured: false, agents: [] };
      const agentNames = data.agentNames || [];

      // Worst-first: a config-only account (no live broker slot — never
      // actually connected) is the real "needs attention" signal here. A
      // brokerKnown account past its (short-lived) access-token expiry is
      // NOT broken — it auto-refreshes on next use via the refresh token —
      // so it must NOT be sorted/flagged as an attention item (matches the
      // "don't alarm on auto-refresh" fix in renderOAuthAccountCard above).
      const isConnBroken = (a) => a.brokerKnown === false;
      const worstFirst = (list) => list.slice().sort((a, b) => (isConnBroken(a) === isConnBroken(b)) ? 0 : isConnBroken(a) ? -1 : 1);
      const googleSorted = worstFirst(google);
      const microsoftSorted = worstFirst(microsoft);
      const oauthAttn = google.filter(isConnBroken).length + microsoft.filter(isConnBroken).length;
      const oauthClean = (google.length + microsoft.length) - oauthAttn;
      const posture = (google.length + microsoft.length) > 0
        ? `<div class="ac-posture" style="margin:0 0 1rem;justify-content:flex-start">
             <span class="ac-stat attn"><span class="n">${oauthAttn}</span><span class="l">need attention</span></span>
             <span class="ac-stat clean"><span class="n">${oauthClean}</span><span class="l">connected</span></span>
           </div>`
        : '';

      // When a provider's fetch FAILED (not genuinely empty), its empty-state
      // must say "couldn't load", never "none configured" — otherwise a
      // transient blip reads as "you have no accounts".
      const googleSection = _connectionSection(
        'Google',
        data.googleFailed
          ? "Couldn't load Google accounts — the data source was unreachable (retrying)."
          : 'No Google accounts. Add one under <code>google_accounts:</code> and run <code>switchroom auth google account add</code>.',
        googleSorted.map(a => renderOAuthAccountCard(a, { showType: false, provider: 'google', agentNames })).join(''),
      );

      const msCards = microsoftSorted.map(a => renderOAuthAccountCard(a, { showType: true, provider: 'microsoft', agentNames })).join('');
      const msEmpty = data.microsoftFailed
        ? "Couldn't load Microsoft accounts — the data source was unreachable (retrying)."
        : 'No Microsoft accounts yet — click <b>Connect a Microsoft account</b> above (or <code>/connect microsoft</code> from Telegram).';
      const microsoftSection = `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">
            Microsoft 365
            <button id="ms-connect-btn" onclick="connectMicrosoft()" class="usage-pill primary" style="margin-left:.6rem;cursor:pointer;border:none;text-transform:none;font-weight:600">+ Connect a Microsoft account</button>
          </h3>
          <div id="ms-connect-card"></div>
          ${msCards
            ? `<div class="accounts-grid">${msCards}</div>`
            : `<div class="loading" style="padding:.8rem">${msEmpty}</div>`}
        </div>`;

      let notionCards = '';
      if (notion.configured) {
        notionCards = (notion.databases || []).map(db => {
          const acl = (db.enabledFor && db.enabledFor.length)
            ? db.enabledFor.map(escapeHtml).join(', ')
            : _dimC('no agents enabled');
          return `
          <div class="account-card">
            <div class="account-card-header">
              <div class="account-label">${escapeHtml(db.name)}</div>
              <span style="margin-left:auto" class="usage-pill">database</span>
            </div>
            <div class="account-usage"><label style="color:var(--text-dim);opacity:.7">Enabled for: </label>${acl}</div>
            <div class="card-meta" style="padding:0">
              <div class="meta-item"><label>DB id </label><span>${escapeHtml(db.id.slice(0, 12))}…</span></div>
            </div>
          </div>`;
        }).join('');
      }
      const notionTitle = 'Notion' + (notion.configured && notion.vaultKey ? ` <span style="text-transform:none;font-weight:400">· token <code>${escapeHtml(notion.vaultKey)}</code></span>` : '');
      const fullAccessBanner = (notion.fullAccessAgents && notion.fullAccessAgents.length)
        ? `<div style="margin:0 0 .6rem;font-size:.85rem;color:var(--text-dim)">Full access (all databases): ${notion.fullAccessAgents.map(escapeHtml).join(', ')}</div>`
        : '';
      const notionBody = notionCards
        ? `<div class="accounts-grid">${notionCards}</div>`
        : `<div class="loading" style="padding:.8rem">${notion.configured
            ? 'Notion configured but no databases declared. Add them under <code>notion_workspace.databases:</code>.'
            : 'Notion not configured. See <code>docs/notion-integration.md</code>.'}</div>`;
      const notionSection = `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">${notionTitle}</h3>
          ${fullAccessBanner}${notionBody}
        </div>`;

      // Linear — first-class OAuth app actors (config-only; the web tier never
      // reads the per-agent vault, so no token/expiry is shown — and never the
      // secret). One card per agent with linear_agent.enabled.
      const linearCards = (linear.agents || []).map(a => {
        const meta = [];
        if (a.workspaceId) meta.push(`<div class="meta-item"><label>Workspace </label><span>${escapeHtml(a.workspaceId)}</span></div>`);
        if (a.defaultTeamId) meta.push(`<div class="meta-item"><label>Default team </label><span>${escapeHtml(a.defaultTeamId)}</span></div>`);
        if (a.tokenVaultKey) meta.push(`<div class="meta-item"><label>Token </label><span><code>${escapeHtml(a.tokenVaultKey)}</code></span></div>`);
        return `
        <div class="account-card">
          <div class="account-card-header">
            <div class="account-label">${escapeHtml(a.agent)}</div>
            <span style="margin-left:auto" class="usage-pill primary">OAuth agent</span>
          </div>
          <div class="card-meta" style="padding:0">${meta.join('') || _dimC('—')}</div>
        </div>`;
      }).join('');
      const linearNote = (linear.agents && linear.agents.length)
        ? `<div style="margin:0 0 .6rem;font-size:.85rem;color:var(--text-dim)">Connected as Linear <b>OAuth app actors</b> — each appears in the workspace as its own actor (not a personal API token for MCP).</div>`
        : '';
      const linearBody = linearCards
        ? `<div class="accounts-grid">${linearCards}</div>`
        : `<div class="loading" style="padding:.8rem">${data.linearFailed
            ? "Couldn't load Linear agents — the data source was unreachable (retrying)."
            : 'No Linear agents connected. Run <code>switchroom linear-agent setup --agent &lt;name&gt;</code> to connect one as a Linear OAuth app actor.'}</div>`;
      const linearSection = `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">Linear</h3>
          ${linearNote}${linearBody}
        </div>`;

      // Tab-level degraded banner: when every OAuth account (Google +
      // Microsoft) is config-only (no live broker slot) and there's at least
      // one, the broker data is unavailable — surface that ABOVE the sections
      // without blanking the config-only cards.
      const oauth = [...google, ...microsoft];
      const allConfigOnly = oauth.length > 0 && oauth.every(a => a.brokerKnown === false);
      const degradedBanner = allConfigOnly
        ? renderProblem(problemFor('connections-degraded', {}))
        : '';

      // A failed fetch must NOT masquerade as "nothing configured" — lead
      // with an honest banner so the operator knows the empty look is a
      // load failure (auto-retrying), not an absence of accounts.
      const unreachableBanner = data.fetchFailed
        ? renderProblem(problemFor('connections-unreachable', {}))
        : '';

      container.innerHTML = unreachableBanner + degradedBanner + posture + googleSection + microsoftSection + notionSection + linearSection;
    }

    function renderSchedule(data) {
      const container = document.getElementById('schedule');
      const entries = (data && data.entries) || [];
      const recent = (data && data.recentByAgent) || {};
      const degraded = !!(data && data.degraded);
      const truncated = !!(data && data.truncated);
      // Degraded banner: hostd is unreachable, so this is the base-config-only
      // view (per-agent cascade overrides may be absent). Render it ABOVE the
      // cards — never instead of them — so the operator sees both the
      // incompleteness AND whatever entries we DO have.
      const degradedBanner = degraded
        ? renderProblem(problemFor('schedule-degraded', { reason: data && data.reason }))
        : '';
      const truncatedNote = truncated
        ? '<div style="font-size:.78rem;color:var(--text-dim);margin-bottom:.75rem">(some entries trimmed to fit)</div>'
        : '';
      if (entries.length === 0) {
        // A bare "No schedule entries" is misleading when hostd is just down —
        // show the actionable degraded banner instead.
        container.innerHTML = degraded
          ? degradedBanner
          : '<div class="loading">No <code>schedule:</code> entries in any agent\'s cascade-resolved config.</div>';
        return;
      }
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;
      // Group entries by agent. Agents sorted by name; within an agent the
      // entries keep their cascade-given order (defaults → profile → agent →
      // overlays), which is the order the operator/agent declared them.
      const byAgent = {};
      for (const e of entries) (byAgent[e.agent] ||= []).push(e);

      // One self-contained block per cron: title (or cron expr as fallback
      // heading) + badges, the prompt, then THIS cron's recent fires right
      // below it. Fires are matched to a cron by promptKey — both the entry
      // and each DispatchResult carry the same stable SHA. (Edge: two
