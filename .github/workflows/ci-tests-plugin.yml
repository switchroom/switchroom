name: ci-tests-plugin

# Bun test suite for telegram-plugin/ (bun-runtime-only tests that vitest
# can't load).
#
# Skip-as-pass pattern (#1320 followup): see ci-lint.yml header.
#
# Workspace install discipline: we do NOT `cd telegram-plugin && bun install`.
# telegram-plugin is a bun workspace of the root, and the root install via
# the composite action already brings in its deps via the hoisted node_modules.
# A per-package install creates a shadow `@mtcute/node` that breaks
# vi.mock-based driver tests — see the long comment block in
# .github/actions/setup-switchroom/action.yml for the full diagnosis.
# Tests run against the hoisted root install.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Merge queue — required contexts must report on the temporary
  # `gh-readonly-queue/main/...` ref. See .github/MERGE-QUEUE.md.
  merge_group:
  # Manual recovery lever. GHA marks a run failed (no auto-retry) when
  # its jobs sit queued past the hosted-runner scheduling window during
  # a capacity blip; `gh run rerun` then refuses ("cannot be retried")
  # on the stale run. workflow_dispatch gives `gh workflow run
  # ci-tests-plugin.yml --ref main` as the re-trigger. (#1336 queue-fail
  # surfaced this gap.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue refs get their own group for free — `github.ref` is the
  # `gh-readonly-queue/...` branch, never the PR's `refs/pull/<n>/merge`.
  group: ci-tests-plugin-${{ github.ref }}
  # NEVER cancel a merge-queue check (ejects the entry; #3614 wedge shape).
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      relevant: ${{ steps.filter.outputs.plugin }}
    steps:
      # merge_group: no diff base exists on a queue ref, so skip the
      # filter (the job still reports `success`) and run everything.
      # See .github/MERGE-QUEUE.md.
      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Filter changed paths
        if: github.event_name != 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # Shared external filters file — the sec WS9-F1 (#1402)
          # security-load-bearing path list is defined ONCE there and
          # anchored into each workflow's filter key. See the header of
          # .github/path-filters.yml for the rationale.
          filters: .github/path-filters.yml

  bun-test-run:
    needs: changes
    # push / merge_group: always run — both are (candidate) main.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Was 8 (single attempt). The hang-watchdog wrapper (scripts/bun-test-ci.sh)
    # retries a wedged run up to BUN_TEST_MAX_ATTEMPTS times; a healthy run is
    # ~50s on the 2-vCPU runner, so 15 min covers up to 3 attempts (each capped
    # at BUN_TEST_ATTEMPT_TIMEOUT=180s) plus checkout/install overhead.
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: "123456:stub-for-tests"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-switchroom

      - name: Bun test (telegram-plugin)
        # Runs the same explicit dir list as Buildkite (bun test with no
        # args recurses into uat/scenarios/, which need live creds) through
        # a hang-watchdog wrapper. The wrapper kills + retries a run wedged
        # by the pre-existing Bun fs.watch deadlock in the subagent-watcher
        # tests, but passes REAL assertion failures straight through without
        # retry. See scripts/bun-test-ci.sh for the full rationale. The test
        # arg list lives in that script — keep the two in sync.
        working-directory: telegram-plugin
        run: ./scripts/bun-test-ci.sh

  # ─── Sentinel ─────────────────────────────────────────────────────
  # Branch-protection-required context. ALWAYS runs so it always
  # reports. See ci-lint.yml for the rationale (corrects #1331's
  # if:-skip approach that blocked docs-only PRs, e.g. #1343).
  bun-test:
    needs: [changes, bun-test-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verdict
        run: |
          c='${{ needs.changes.result }}'
          r='${{ needs.bun-test-run.result }}'
          if [ "$c" = "failure" ] || [ "$c" = "cancelled" ]; then
            echo "::error::changes=$c — path-filter infra failed; can't trust skip"
            exit 1
          fi
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "::error::bun-test-run=$r — real test failure, blocking"
            exit 1
          fi
          echo "changes=$c bun-test-run=$r → pass (ran=success, or skipped on irrelevant PR)"
