name: Fleet Image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact selected main commit to GHCR (re-run; every main push publishes automatically)
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read # inspect CI for the exact selected commit; publication fails closed without it

concurrency:
  # Per-SHA on main: a push publication is never cancelled by a later push or a dispatch re-run.
  group: fleet-image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/switchroom/switchroom
  TEST_IMAGE: ghcr.io/switchroom/switchroom:sha-${{ github.sha }}
  ONEPASSWORD_CLI_IMAGE: docker.io/1password/op@sha256:b0d7eebcb09bdc9d5862af91533e1851c968d4f969270c906f5da8c574f87e93
  CLAUDE_CODE_VERSION: "2.1.325"
  CLAUDE_AGENT_ACP_VERSION: "0.112.0"
  CODEX_VERSION: "0.172.0"
  GROK_VERSION: "1.0.92"
  CLAUDE_ACP_PLUGIN_SOURCE: https://github.com/mvdbastos/hermes-acp-agents
  CLAUDE_ACP_PLUGIN_REVISION: 0526610a3945cc376ac517b63ca358a5b838a2fc
  # Scanner pins match the versions the previously used anchore/sbom-action v0.24.2 and
  # aquasecurity/trivy-action v0.36.0 installed, so scan results are unchanged.
  SYFT_VERSION: v1.51.1
  TRIVY_VERSION: v0.70.0
  # The built candidate is exported once and shared by Syft and Trivy (scripts/scan-fleet-image.py).
  CANDIDATE_ARCHIVE: ${{ github.workspace }}/.scan/fleet-image.tar
  SBOM_STATE: ${{ github.workspace }}/.scan/sbom-state

jobs:
  scope:
    # First, cheap job: did this event change anything the image is built from? Docs-only and
    # test-only commits skip the bake. The required preflight job checks that decision explicitly.
    # Manual dispatches and any range git cannot resolve (new branch, force push) fail open to
    # "run"; see scripts/fleet-image-change-scope.py.
    if: >-
      github.repository == 'switchroom/switchroom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout with history for the changed range
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Match changed paths against the Fleet image input set
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/fleet-image-change-scope.py \
            --event "$GITHUB_EVENT_NAME" \
            --base "$BASE" \
            --head "$HEAD" \
            --github-output "$GITHUB_OUTPUT"

  preflight_bake:
    # PR and manual bakes never publish. A same-repository PR bake whose merge tree equals its head
    # tree pushes its candidate to a run-unique fleet-pr-stage-* ref that nothing deploys; once every
    # gate below has passed it uploads a staged.json binding that digest, the tree and the build
    # inputs. Main publish uses it only as build cache and Trivy layer cache for the same tree and
    # still builds, scans and attests its own candidate (scripts/promote-fleet-image.py).
    # Fork PRs get a read-only token, so they never stage. Pushes to main skip preflight.
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.outputs.image == 'true' || needs.scope.result == 'failure') &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true')) &&
      github.repository == 'switchroom/switchroom'
    # Pinned: ubuntu-latest moved to 26.04, whose containerd image store breaks the
    # docker-save config binding that scripts/scan-fleet-image.py enforces.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # fleet-pr-stage-* build cache only; same-repository PRs only (see above)
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate immutable Agent handoff
        id: agent
        run: |
          set -euo pipefail
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR to pull the pinned Agent parent
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        # Build straight into the runner's Docker engine. The docker-container driver re-pulled the
        # multi-GB parent inside BuildKit (~30s), tarred and re-imported the result for load: true
        # (35-75s) and exported every parent layer to the GHA cache (34-200s/run) to save ~8s of npm ci.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Set up Python for SPDX schema validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install pinned Trivy
        # setup-trivy's installer downloads from get.trivy.dev, which returns NXDOMAIN
        # (2026-11-04), and github.com/.../releases/download returned HTTP 504 for long
        # stretches (2026-11-08). Fetch the exact release asset through GitHub's REST asset
        # API (release URL as fallback) and use it only after its pinned size and sha256
        # match; bump the asset ID, size and TRIVY_SHA256 together with TRIVY_VERSION.
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_ASSET_ID: "398381981"
          TRIVY_SIZE: "47748408"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          version="${TRIVY_VERSION#v}"
          if [ "$version" != "0.70.0" ]; then
            echo "TRIVY_SHA256 is pinned for 0.70.0; update it with TRIVY_VERSION" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$dir"
          bash scripts/fetch-pinned-release-asset.sh \
            aquasecurity/trivy "$TRIVY_ASSET_ID" "$TRIVY_SIZE" "$TRIVY_SHA256" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            "$RUNNER_TEMP/trivy.tgz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"
          # Outside the build context; the layer-analysis cache (fanal) is staged from PR to main.
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
          "$dir/trivy" --version

      - name: Install pinned Syft
        # The same Syft archive anchore/sbom-action/download-syft v0.24.2 installed, fetched
        # the same way as Trivy above and verified against its pinned size and sha256.
        id: syft
        env:
          GH_TOKEN: ${{ github.token }}
          SYFT_ASSET_ID: "532610151"
          SYFT_SIZE: "29203595"
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          version="${SYFT_VERSION#v}"
          if [ "$version" != "1.51.1" ]; then
            echo "SYFT_SHA256 is pinned for 1.51.1; update it with SYFT_VERSION" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/syft-bin"
          mkdir -p "$dir"
          bash scripts/fetch-pinned-release-asset.sh \
            anchore/syft "$SYFT_ASSET_ID" "$SYFT_SIZE" "$SYFT_SHA256" \
            "https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_linux_amd64.tar.gz" \
            "$RUNNER_TEMP/syft.tgz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$dir" syft
          chmod 0755 "$dir/syft"
          "$dir/syft" version
          echo "cmd=$dir/syft" >> "$GITHUB_OUTPUT"

      - name: Pull exact Agent parent and prefetch scan tooling
        # The multi-GB parent pull is network-bound; the Trivy database download and the hashed
        # SPDX validator install ride alongside it. Every background job is waited on and fails closed.
        run: |
          set -euo pipefail
          docker pull "$AGENT_IMAGE" & agent_pull=$!
          docker pull "$ONEPASSWORD_CLI_IMAGE" & op_pull=$!
          python3 scripts/scan-fleet-image.py prefetch-db & trivy_db=$!
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement release/spdx-validation-requirements.txt & pip_install=$!
          wait "$agent_pull"
          wait "$op_pull"
          wait "$trivy_db"
          wait "$pip_install"

      - name: Build Fleet child without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          # Inline cache metadata lets main reuse these layers when it builds the same tree.
          cache-to: type=inline
          build-args: |
            AGENT_IMAGE=${{ steps.agent.outputs.AGENT_IMAGE }}
            ONEPASSWORD_CLI_IMAGE=${{ env.ONEPASSWORD_CLI_IMAGE }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_AGENT_ACP_VERSION=${{ env.CLAUDE_AGENT_ACP_VERSION }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            GROK_VERSION=${{ env.GROK_VERSION }}
            CLAUDE_ACP_PLUGIN_SOURCE=${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
            CLAUDE_ACP_PLUGIN_REVISION=${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          # BuildKit secret, mounted only for the Dockerfile's GH CLI fetch (REST asset API
          # route) and never written to a layer, build arg or provenance.
          secrets: |
            github_token=${{ github.token }}

      - name: Verify inherited runtime and provenance
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
          EXPECTED_AGENT_IMAGE: ${{ env.AGENT_IMAGE }}
          EXPECTED_AGENT_REPOSITORY: ${{ env.AGENT_REPOSITORY }}
          EXPECTED_AGENT_REVISION: ${{ env.AGENT_REVISION }}
          EXPECTED_ONEPASSWORD_CLI_IMAGE: ${{ env.ONEPASSWORD_CLI_IMAGE }}
          EXPECTED_CLAUDE_CODE_VERSION: ${{ env.CLAUDE_CODE_VERSION }}
          EXPECTED_CLAUDE_AGENT_ACP_VERSION: ${{ env.CLAUDE_AGENT_ACP_VERSION }}
          EXPECTED_CODEX_VERSION: ${{ env.CODEX_VERSION }}
          EXPECTED_GROK_VERSION: ${{ env.GROK_VERSION }}
          EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE: ${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
          EXPECTED_CLAUDE_ACP_PLUGIN_REVISION: ${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
        run: |
          set -euo pipefail
          python3 scripts/verify-inherited-runtime-config.py
          docker run --rm \
            --env EXPECTED_REVISION \
            --env EXPECTED_IMAGE_IDENTITY \
            --env EXPECTED_AGENT_IMAGE \
            --env EXPECTED_AGENT_REPOSITORY \
            --env EXPECTED_AGENT_REVISION \
            --env EXPECTED_ONEPASSWORD_CLI_IMAGE \
            --env EXPECTED_CLAUDE_CODE_VERSION \
            --env EXPECTED_CLAUDE_AGENT_ACP_VERSION \
            --env EXPECTED_CODEX_VERSION \
            --env EXPECTED_GROK_VERSION \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_REVISION \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import importlib.util
          import json, os, pathlib, pwd, shutil, subprocess, sys
          marker = json.loads(pathlib.Path("/etc/hermes/image-provenance.json").read_text(encoding="utf-8"))
          fleet = json.loads(pathlib.Path("/etc/hermes-fleet/image-provenance.json").read_text(encoding="utf-8"))
          assert marker["revision"] == os.environ["EXPECTED_AGENT_REVISION"], marker
          assert marker["image"] == os.environ["EXPECTED_AGENT_REPOSITORY"], marker
          assert marker["version"] == metadata.version("hermes-agent"), marker
          assert fleet["revision"] == os.environ["EXPECTED_REVISION"], fleet
          assert fleet["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], fleet
          assert fleet["parent_agent_image"] == os.environ["EXPECTED_AGENT_IMAGE"], fleet
          assert fleet["onepassword_cli_image"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"], fleet
          assert fleet["claude_code_version"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"], fleet
          assert fleet["claude_agent_acp_version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], fleet
          assert fleet["codex_version"] == os.environ["EXPECTED_CODEX_VERSION"], fleet
          assert fleet["grok_version"] == os.environ["EXPECTED_GROK_VERSION"], fleet
          assert fleet["claude_acp_plugin_source"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"], fleet
          assert fleet["claude_acp_plugin_revision"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"], fleet
          assert os.environ["HERMES_FLEET_GIT_SHA"] == os.environ["EXPECTED_REVISION"]
          assert os.environ["HERMES_FLEET_IMAGE_IDENTITY"] == os.environ["EXPECTED_IMAGE_IDENTITY"]
          assert os.environ["HERMES_FLEET_AGENT_IMAGE"] == os.environ["EXPECTED_AGENT_IMAGE"]
          assert os.environ["HERMES_FLEET_ONEPASSWORD_CLI_IMAGE"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"]
          assert os.environ["HERMES_FLEET_CLAUDE_CODE_VERSION"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_AGENT_ACP_VERSION"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"]
          assert os.environ["HERMES_FLEET_CODEX_VERSION"] == os.environ["EXPECTED_CODEX_VERSION"]
          assert os.environ["HERMES_FLEET_GROK_VERSION"] == os.environ["EXPECTED_GROK_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_SOURCE"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_REVISION"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"]
          assert subprocess.check_output(["/usr/local/bin/op", "--version"], text=True).strip() == "2.42.0"
          assert subprocess.check_output(["/usr/local/bin/claude", "--version"], text=True).strip() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"] + " (Claude Code)"
          assert subprocess.check_output(["/usr/local/bin/codex", "--version"], text=True).strip() == "codex-cli " + os.environ["EXPECTED_CODEX_VERSION"]
          assert subprocess.check_output(["/usr/local/bin/grok", "--version"], text=True).split()[1] == os.environ["EXPECTED_GROK_VERSION"]
          adapter = json.loads(pathlib.Path("/opt/coding-clis/node_modules/@agentclientprotocol/claude-agent-acp/package.json").read_text(encoding="utf-8"))
          assert adapter["version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], adapter
          assert pathlib.Path("/usr/local/bin/claude-agent-acp").is_file()
          assert os.environ["CLAUDE_CODE_EXECUTABLE"] == "/opt/coding-clis/node_modules/.bin/claude"
          from hermes_cli.plugins import PluginContext
          assert callable(PluginContext.register_profile_service)
          assert not pathlib.Path("/opt/hermes/plugins/linear-agent").exists()
          assert not pathlib.Path("/opt/hermes/plugins/model-providers/claude-acp").exists()
          assert not pathlib.Path("/opt/hermes/plugins/web/perplexity").exists()
          assert not pathlib.Path("/opt/hermes/plugins/kokoro-voice").exists()
          assert not pathlib.Path("/opt/hermes/plugins/browser-handoff").exists()
          assert not pathlib.Path("/opt/hermes/plugins/readonly-source").exists()
          assert pathlib.Path("/usr/local/bin/hermes-claude-acp-subscription").is_file()
          assert pathlib.Path("/opt/hermes/bin/tooling-policy-hook").is_file()
          assert pwd.getpwnam("hermes").pw_uid == 1000
          assert subprocess.check_output(["gh", "--version"], text=True).split()[2] == "2.105.0"
          assert metadata.version("honcho-ai") == "2.9.0"
          subprocess.check_call(["/opt/hermes/.venv/bin/python", "/opt/hermes-fleet/bin/verify-honcho-runtime.py"])
          subprocess.check_call(["/opt/hermes/.venv/bin/python", "/opt/hermes-fleet/bin/verify-honcho-plugin-core-seams.py", "/opt/hermes/plugins/memory/honcho", "/opt/hermes"])
          assert shutil.which("codex")
          assert shutil.which("grok")
          assert shutil.which("opencode")
          assert not pathlib.Path("/var/run/docker.sock").exists()
          assert pathlib.Path("/opt/hermes-fleet/contracts/image.json").is_file()
          '
          docker run --rm --network none --env EXPECTED_CLAUDE_CODE_VERSION \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/plugins/model-providers/claude-acp,dst=/opt/hermes/plugins/model-providers/claude-acp,readonly" \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("acp_runtime_review", "/opt/hermes/plugins/model-providers/claude-acp/client.py")
          acp_review = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(acp_review)
          assert acp_review.assert_reviewed_claude_code_version() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert acp_review.claude_code_session_options(set())["allowDangerouslySkipPermissions"] is False
          '
          docker run --rm --network none "$TEST_IMAGE" python3 -c 'import os; assert os.getuid() != 0'
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version

      - name: Headed Camoufox smoke (UID 1000, fleet seccomp, no-new-privileges)
        # One local page, headed on a private Xvnc display, through the supervised service runner,
        # with no network: pinned + attested build, loopback-only service with an access key,
        # snapshot, screenshot, a real window on the display, and the SIGTERM cookie checkpoint.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/camoufox-smoke"
          mkdir -p "$out"
          chmod 0777 "$out"
          docker run --rm --network none --user 1000:1000 \
            --security-opt no-new-privileges \
            --security-opt seccomp=security/chromium-seccomp.json \
            --shm-size 1g \
            --mount "type=bind,src=$out,dst=/smoke" \
            --entrypoint python3 "$TEST_IMAGE" \
            /opt/hermes-fleet/bin/verify-camoufox-runtime.py --out /smoke

      - name: Upload Camoufox smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: camoufox-smoke-${{ github.sha }}-${{ github.job }}
          path: ${{ runner.temp }}/camoufox-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Export built candidate and start SBOM generation
        # One docker-save of the candidate, bound to its local config ID. Syft runs detached from
        # here on (its status is collected fail-closed below) while Trivy scans the same archive.
        id: export
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py export \
            --image "$TEST_IMAGE" \
            --archive "$CANDIDATE_ARCHIVE" \
            --github-output "$GITHUB_OUTPUT"
          python3 scripts/scan-fleet-image.py start-sbom \
            --syft "$SYFT" \
            --archive "$CANDIDATE_ARCHIVE" \
            --output fleet-image.spdx.json \
            --state "$SBOM_STATE"

      - name: Start staging push of the PR candidate
        # Best effort and never consumed unless the gates below pass and record it: overlaps Trivy
        # and Syft. Refuses (notice, no push) when the merge tree differs from the PR head tree.
        id: stage_push
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_IMAGE: ${{ env.IMAGE_REPOSITORY }}:fleet-pr-stage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/promote-fleet-image.py start-push \
            --image "$TEST_IMAGE" \
            --staging-image "$STAGING_IMAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --state "$RUNNER_TEMP/stage-push"

      - name: Scan critical image vulnerabilities
        # CRITICAL, fixed-only vulnerability scan of the exported archive with the prefetched database.
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py trivy \
            --archive "$CANDIDATE_ARCHIVE" \
            --output trivy-image.json

      - name: Enforce critical findings and scoped VEX policy
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "$TEST_IMAGE" /usr/local/bin/op > op-vex.bin
          test -s op-vex.bin
          python3 scripts/verify-trivy-vex.py \
            --trivy trivy-image.json \
            --policy release/vex-exceptions.json \
            --binary op-vex.bin \
            --component-image "$ONEPASSWORD_CLI_IMAGE" \
            --output vex-evaluation.json

      - name: Collect SBOM and validate full and compact SPDX 2.3 documents
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py wait-sbom \
            --output fleet-image.spdx.json \
            --state "$SBOM_STATE"
          python3 scripts/compact-spdx-sbom.py \
            --input fleet-image.spdx.json \
            --output fleet-image.attestation.spdx.json \
            --max-bytes 16777216
          python3 scripts/validate-spdx-schema.py \
            --schema release/spdx-2.3-schema.json \
            fleet-image.spdx.json \
            fleet-image.attestation.spdx.json

      - name: Record staged candidate for main
        # Only reached when every gate above passed. Binds the pushed digest to the scanned config,
        # the tree and the build inputs, and packages Trivy's layer-analysis cache.
        id: stage
        if: steps.stage_push.outcome == 'success'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_IMAGE: ${{ env.IMAGE_REPOSITORY }}:fleet-pr-stage-${{ github.run_id }}-${{ github.run_attempt }}
          SCANNED_CONFIG_ID: ${{ steps.export.outputs.config-id }}
          AGENT_IMAGE: ${{ steps.agent.outputs.AGENT_IMAGE }}
        run: |
          set -euo pipefail
          python3 scripts/promote-fleet-image.py record \
            --state "$RUNNER_TEMP/stage-push" \
            --repository "$IMAGE_REPOSITORY" \
            --staging-image "$STAGING_IMAGE" \
            --config-id "$SCANNED_CONFIG_ID" \
            --source-sha "$GITHUB_SHA" \
            --head-sha "$HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trivy-cache-dir "$TRIVY_CACHE_DIR" \
            --output-dir "$RUNNER_TEMP/staged"

      - name: Upload staged candidate record
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-staged-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/staged
          if-no-files-found: error
          retention-days: 7

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-evidence-${{ github.sha }}
          path: |
            fleet-image.spdx.json
            fleet-image.attestation.spdx.json
            trivy-image.json
            vex-evaluation.json
            release/vex-exceptions.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    # Required PR context: a successful explicit no-image decision permits a skipped bake;
    # image changes require the full bake to have succeeded. Scope and bake errors fail closed.
    needs: [scope, preflight_bake]
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true')) &&
      github.repository == 'switchroom/switchroom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require applicable preflight result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          IMAGE: ${{ needs.scope.outputs.image }}
          BAKE_RESULT: ${{ needs.preflight_bake.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "scope did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi
          case "$IMAGE" in
            true)
              if [[ "$BAKE_RESULT" != success ]]; then
                echo "image input requires successful preflight bake; got $BAKE_RESULT" >&2
                exit 1
              fi
              echo "image input: preflight bake succeeded"
              ;;
            false)
              if [[ "$BAKE_RESULT" != skipped ]]; then
                echo "no-image decision expected skipped preflight bake; got $BAKE_RESULT" >&2
                exit 1
              fi
              echo "no image input: preflight bake correctly skipped"
              ;;
            *)
              echo "scope returned invalid image decision: $IMAGE" >&2
              exit 1
              ;;
          esac

  publish:
    # Every push to main that touches the image input set publishes once its exact-SHA CI run is
    # green; dispatch with publish=true re-runs it for any main commit. A push whose scope job
    # found no image inputs skips publication: the latest published digest is still the correct
    # image for that commit (see docs/image-release.md, "Skipped publications").
    needs: scope
    if: >-
      !cancelled() &&
      (needs.scope.outputs.image == 'true' || needs.scope.result == 'failure') &&
      github.repository == 'switchroom/switchroom' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'))
    # Pinned: ubuntu-latest moved to 26.04, whose containerd image store breaks the
    # docker-save config binding that scripts/scan-fleet-image.py enforces.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: fleet-image-publish
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Revalidate immutable Agent handoff
        run: |
          set -euo pipefail
          python3 scripts/read-agent-image-manifest.py \
            --manifest release/agent-image-manifest.json \
            --github-env "$GITHUB_ENV"

      - name: Log in to GHCR
        # Needed before the build to pull the pinned Agent parent; nothing is written to the
        # registry until the exact main CI gate below has passed.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        # Build straight into the runner's Docker engine. The docker-container driver re-pulled the
        # multi-GB parent inside BuildKit (~30s), tarred and re-imported the result for load: true
        # (35-75s) and exported every parent layer to the GHA cache (34-200s/run) to save ~8s of npm ci.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Set up Python for SPDX schema validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install pinned Trivy
        # setup-trivy's installer downloads from get.trivy.dev, which returns NXDOMAIN
        # (2026-11-04), and github.com/.../releases/download returned HTTP 504 for long
        # stretches (2026-11-08). Fetch the exact release asset through GitHub's REST asset
        # API (release URL as fallback) and use it only after its pinned size and sha256
        # match; bump the asset ID, size and TRIVY_SHA256 together with TRIVY_VERSION.
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_ASSET_ID: "398381981"
          TRIVY_SIZE: "47748408"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          version="${TRIVY_VERSION#v}"
          if [ "$version" != "0.70.0" ]; then
            echo "TRIVY_SHA256 is pinned for 0.70.0; update it with TRIVY_VERSION" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/trivy-bin"
          mkdir -p "$dir"
          bash scripts/fetch-pinned-release-asset.sh \
            aquasecurity/trivy "$TRIVY_ASSET_ID" "$TRIVY_SIZE" "$TRIVY_SHA256" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            "$RUNNER_TEMP/trivy.tgz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"
          # Outside the build context; the layer-analysis cache (fanal) is staged from PR to main.
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
          "$dir/trivy" --version

      - name: Install pinned Syft
        # The same Syft archive anchore/sbom-action/download-syft v0.24.2 installed, fetched
        # the same way as Trivy above and verified against its pinned size and sha256.
        id: syft
        env:
          GH_TOKEN: ${{ github.token }}
          SYFT_ASSET_ID: "532610151"
          SYFT_SIZE: "29203595"
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          version="${SYFT_VERSION#v}"
          if [ "$version" != "1.51.1" ]; then
            echo "SYFT_SHA256 is pinned for 1.51.1; update it with SYFT_VERSION" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/syft-bin"
          mkdir -p "$dir"
          bash scripts/fetch-pinned-release-asset.sh \
            anchore/syft "$SYFT_ASSET_ID" "$SYFT_SIZE" "$SYFT_SHA256" \
            "https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_linux_amd64.tar.gz" \
            "$RUNNER_TEMP/syft.tgz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$dir" syft
          chmod 0755 "$dir/syft"
          "$dir/syft" version
          echo "cmd=$dir/syft" >> "$GITHUB_OUTPUT"

      - name: Locate tree-identical PR stage
        # Fail open: anything short of a verified same-tree, same-inputs, all-gates-green PR stage
        # reports found=false and the candidate is built from scratch. Seeds Trivy's layer cache.
        id: stage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/promote-fleet-image.py locate \
            --repository "$GITHUB_REPOSITORY" \
            --image-repository "$IMAGE_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --before "$BEFORE" \
            --trivy-cache-dir "$TRIVY_CACHE_DIR" \
            --workdir "$RUNNER_TEMP" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pull exact Agent parent and prefetch scan tooling
        # The multi-GB parent pull is network-bound; the Trivy database download and the hashed
        # SPDX validator install ride alongside it. Every background job is waited on and fails closed,
        # except the optional PR stage pull, which only warms the build cache.
        env:
          STAGED_REF: ${{ steps.stage.outputs.found == 'true' && steps.stage.outputs.ref || '' }}
        run: |
          set -euo pipefail
          staged_pull=""
          if [ -n "$STAGED_REF" ]; then docker pull "$STAGED_REF" & staged_pull=$!; fi
          docker pull "$AGENT_IMAGE" & agent_pull=$!
          docker pull "$ONEPASSWORD_CLI_IMAGE" & op_pull=$!
          python3 scripts/scan-fleet-image.py prefetch-db & trivy_db=$!
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement release/spdx-validation-requirements.txt & pip_install=$!
          wait "$agent_pull"
          wait "$op_pull"
          wait "$trivy_db"
          wait "$pip_install"
          if [ -n "$staged_pull" ]; then
            wait "$staged_pull" || echo "::warning::PR stage pull failed; the build falls back to its own layers"
          fi

      - name: Build exact publish candidate reusing the PR stage as cache
        # Same Dockerfile, context and build args; only the FLEET_GIT_SHA-stamped tail misses the
        # cache. Any failure falls through to the from-scratch build below.
        id: build_cached
        if: steps.stage.outputs.found == 'true'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=registry,ref=${{ steps.stage.outputs.ref }}
          build-args: |
            AGENT_IMAGE=${{ env.AGENT_IMAGE }}
            ONEPASSWORD_CLI_IMAGE=${{ env.ONEPASSWORD_CLI_IMAGE }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_AGENT_ACP_VERSION=${{ env.CLAUDE_AGENT_ACP_VERSION }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            GROK_VERSION=${{ env.GROK_VERSION }}
            CLAUDE_ACP_PLUGIN_SOURCE=${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
            CLAUDE_ACP_PLUGIN_REVISION=${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          secrets: |
            github_token=${{ github.token }}

      - name: Build and scan exact publish candidate
        if: steps.stage.outputs.found != 'true' || steps.build_cached.outcome != 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            AGENT_IMAGE=${{ env.AGENT_IMAGE }}
            ONEPASSWORD_CLI_IMAGE=${{ env.ONEPASSWORD_CLI_IMAGE }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLAUDE_AGENT_ACP_VERSION=${{ env.CLAUDE_AGENT_ACP_VERSION }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            GROK_VERSION=${{ env.GROK_VERSION }}
            CLAUDE_ACP_PLUGIN_SOURCE=${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
            CLAUDE_ACP_PLUGIN_REVISION=${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_IMAGE_IDENTITY=${{ env.IMAGE_REPOSITORY }}
          # BuildKit secret, mounted only for the Dockerfile's GH CLI fetch (REST asset API
          # route) and never written to a layer, build arg or provenance.
          secrets: |
            github_token=${{ github.token }}

      - name: Verify exact scanned candidate runtime and provenance
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_IMAGE_IDENTITY: ${{ env.IMAGE_REPOSITORY }}
          EXPECTED_AGENT_IMAGE: ${{ env.AGENT_IMAGE }}
          EXPECTED_AGENT_REPOSITORY: ${{ env.AGENT_REPOSITORY }}
          EXPECTED_AGENT_REVISION: ${{ env.AGENT_REVISION }}
          EXPECTED_ONEPASSWORD_CLI_IMAGE: ${{ env.ONEPASSWORD_CLI_IMAGE }}
          EXPECTED_CLAUDE_CODE_VERSION: ${{ env.CLAUDE_CODE_VERSION }}
          EXPECTED_CLAUDE_AGENT_ACP_VERSION: ${{ env.CLAUDE_AGENT_ACP_VERSION }}
          EXPECTED_CODEX_VERSION: ${{ env.CODEX_VERSION }}
          EXPECTED_GROK_VERSION: ${{ env.GROK_VERSION }}
          EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE: ${{ env.CLAUDE_ACP_PLUGIN_SOURCE }}
          EXPECTED_CLAUDE_ACP_PLUGIN_REVISION: ${{ env.CLAUDE_ACP_PLUGIN_REVISION }}
        run: |
          set -euo pipefail
          python3 scripts/verify-inherited-runtime-config.py
          docker run --rm \
            --env EXPECTED_REVISION \
            --env EXPECTED_IMAGE_IDENTITY \
            --env EXPECTED_AGENT_IMAGE \
            --env EXPECTED_AGENT_REPOSITORY \
            --env EXPECTED_AGENT_REVISION \
            --env EXPECTED_ONEPASSWORD_CLI_IMAGE \
            --env EXPECTED_CLAUDE_CODE_VERSION \
            --env EXPECTED_CLAUDE_AGENT_ACP_VERSION \
            --env EXPECTED_CODEX_VERSION \
            --env EXPECTED_GROK_VERSION \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE \
            --env EXPECTED_CLAUDE_ACP_PLUGIN_REVISION \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.metadata as metadata
          import importlib.util
          import json, os, pathlib, pwd, shutil, subprocess, sys
          marker = json.loads(pathlib.Path("/etc/hermes/image-provenance.json").read_text(encoding="utf-8"))
          fleet = json.loads(pathlib.Path("/etc/hermes-fleet/image-provenance.json").read_text(encoding="utf-8"))
          assert marker["revision"] == os.environ["EXPECTED_AGENT_REVISION"], marker
          assert marker["image"] == os.environ["EXPECTED_AGENT_REPOSITORY"], marker
          assert marker["version"] == metadata.version("hermes-agent"), marker
          assert fleet["revision"] == os.environ["EXPECTED_REVISION"], fleet
          assert fleet["image"] == os.environ["EXPECTED_IMAGE_IDENTITY"], fleet
          assert fleet["parent_agent_image"] == os.environ["EXPECTED_AGENT_IMAGE"], fleet
          assert fleet["onepassword_cli_image"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"], fleet
          assert fleet["claude_code_version"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"], fleet
          assert fleet["claude_agent_acp_version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], fleet
          assert fleet["codex_version"] == os.environ["EXPECTED_CODEX_VERSION"], fleet
          assert fleet["grok_version"] == os.environ["EXPECTED_GROK_VERSION"], fleet
          assert fleet["claude_acp_plugin_source"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"], fleet
          assert fleet["claude_acp_plugin_revision"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"], fleet
          assert os.environ["HERMES_FLEET_GIT_SHA"] == os.environ["EXPECTED_REVISION"]
          assert os.environ["HERMES_FLEET_IMAGE_IDENTITY"] == os.environ["EXPECTED_IMAGE_IDENTITY"]
          assert os.environ["HERMES_FLEET_AGENT_IMAGE"] == os.environ["EXPECTED_AGENT_IMAGE"]
          assert os.environ["HERMES_FLEET_ONEPASSWORD_CLI_IMAGE"] == os.environ["EXPECTED_ONEPASSWORD_CLI_IMAGE"]
          assert os.environ["HERMES_FLEET_CLAUDE_CODE_VERSION"] == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_AGENT_ACP_VERSION"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"]
          assert os.environ["HERMES_FLEET_CODEX_VERSION"] == os.environ["EXPECTED_CODEX_VERSION"]
          assert os.environ["HERMES_FLEET_GROK_VERSION"] == os.environ["EXPECTED_GROK_VERSION"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_SOURCE"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_SOURCE"]
          assert os.environ["HERMES_FLEET_CLAUDE_ACP_PLUGIN_REVISION"] == os.environ["EXPECTED_CLAUDE_ACP_PLUGIN_REVISION"]
          assert subprocess.check_output(["/usr/local/bin/op", "--version"], text=True).strip() == "2.42.0"
          assert subprocess.check_output(["/usr/local/bin/claude", "--version"], text=True).strip() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"] + " (Claude Code)"
          assert subprocess.check_output(["/usr/local/bin/codex", "--version"], text=True).strip() == "codex-cli " + os.environ["EXPECTED_CODEX_VERSION"]
          assert subprocess.check_output(["/usr/local/bin/grok", "--version"], text=True).split()[1] == os.environ["EXPECTED_GROK_VERSION"]
          adapter = json.loads(pathlib.Path("/opt/coding-clis/node_modules/@agentclientprotocol/claude-agent-acp/package.json").read_text(encoding="utf-8"))
          assert adapter["version"] == os.environ["EXPECTED_CLAUDE_AGENT_ACP_VERSION"], adapter
          assert pathlib.Path("/usr/local/bin/claude-agent-acp").is_file()
          assert os.environ["CLAUDE_CODE_EXECUTABLE"] == "/opt/coding-clis/node_modules/.bin/claude"
          from hermes_cli.plugins import PluginContext
          assert callable(PluginContext.register_profile_service)
          assert not pathlib.Path("/opt/hermes/plugins/linear-agent").exists()
          assert not pathlib.Path("/opt/hermes/plugins/model-providers/claude-acp").exists()
          assert not pathlib.Path("/opt/hermes/plugins/web/perplexity").exists()
          assert not pathlib.Path("/opt/hermes/plugins/kokoro-voice").exists()
          assert not pathlib.Path("/opt/hermes/plugins/browser-handoff").exists()
          assert not pathlib.Path("/opt/hermes/plugins/readonly-source").exists()
          assert pathlib.Path("/usr/local/bin/hermes-claude-acp-subscription").is_file()
          assert pathlib.Path("/opt/hermes/bin/tooling-policy-hook").is_file()
          assert pwd.getpwnam("hermes").pw_uid == 1000
          assert subprocess.check_output(["gh", "--version"], text=True).split()[2] == "2.105.0"
          assert metadata.version("honcho-ai") == "2.9.0"
          subprocess.check_call(["/opt/hermes/.venv/bin/python", "/opt/hermes-fleet/bin/verify-honcho-runtime.py"])
          subprocess.check_call(["/opt/hermes/.venv/bin/python", "/opt/hermes-fleet/bin/verify-honcho-plugin-core-seams.py", "/opt/hermes/plugins/memory/honcho", "/opt/hermes"])
          assert shutil.which("codex")
          assert shutil.which("grok")
          assert shutil.which("opencode")
          assert not pathlib.Path("/var/run/docker.sock").exists()
          '
          docker run --rm --network none --env EXPECTED_CLAUDE_CODE_VERSION \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/plugins/model-providers/claude-acp,dst=/opt/hermes/plugins/model-providers/claude-acp,readonly" \
            --entrypoint python3 "$TEST_IMAGE" -c '
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("acp_runtime_review", "/opt/hermes/plugins/model-providers/claude-acp/client.py")
          acp_review = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(acp_review)
          assert acp_review.assert_reviewed_claude_code_version() == os.environ["EXPECTED_CLAUDE_CODE_VERSION"]
          assert acp_review.claude_code_session_options(set())["allowDangerouslySkipPermissions"] is False
          '
          docker run --rm --network none "$TEST_IMAGE" python3 -c 'import os; assert os.getuid() != 0'
          docker run --rm --entrypoint hermes "$TEST_IMAGE" --version

      - name: Headed Camoufox smoke (UID 1000, fleet seccomp, no-new-privileges)
        # One local page, headed on a private Xvnc display, through the supervised service runner,
        # with no network: pinned + attested build, loopback-only service with an access key,
        # snapshot, screenshot, a real window on the display, and the SIGTERM cookie checkpoint.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/camoufox-smoke"
          mkdir -p "$out"
          chmod 0777 "$out"
          docker run --rm --network none --user 1000:1000 \
            --security-opt no-new-privileges \
            --security-opt seccomp=security/chromium-seccomp.json \
            --shm-size 1g \
            --mount "type=bind,src=$out,dst=/smoke" \
            --entrypoint python3 "$TEST_IMAGE" \
            /opt/hermes-fleet/bin/verify-camoufox-runtime.py --out /smoke

      - name: Upload Camoufox smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: camoufox-smoke-${{ github.sha }}-${{ github.job }}
          path: ${{ runner.temp }}/camoufox-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Export scanned publish candidate and start SBOM generation
        # One docker-save of the candidate, bound to its local config ID. Syft runs detached from
        # here on (its status is collected fail-closed below) while Trivy scans the same archive.
        id: export
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py export \
            --image "$TEST_IMAGE" \
            --archive "$CANDIDATE_ARCHIVE" \
            --github-output "$GITHUB_OUTPUT"
          python3 scripts/scan-fleet-image.py start-sbom \
            --syft "$SYFT" \
            --archive "$CANDIDATE_ARCHIVE" \
            --output fleet-image.spdx.json \
            --state "$SBOM_STATE"

      - name: Scan critical image vulnerabilities
        # CRITICAL, fixed-only vulnerability scan of the exported archive with the prefetched database.
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py trivy \
            --archive "$CANDIDATE_ARCHIVE" \
            --output trivy-image.json

      - name: Revalidate scoped VEX decision before publication
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat "$TEST_IMAGE" /usr/local/bin/op > op-vex-publish.bin
          test -s op-vex-publish.bin
          python3 scripts/verify-trivy-vex.py \
            --trivy trivy-image.json \
            --policy release/vex-exceptions.json \
            --binary op-vex-publish.bin \
            --component-image "$ONEPASSWORD_CLI_IMAGE" \
            --output vex-publish-evaluation.json

      - name: Verify exact main CI gate
        # Last step before the first registry write: build and scans above overlap the CI run for
        # this exact SHA, then publication waits for that run and fails closed unless it succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-exact-main-ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "ci.yml" \
            --sha "$GITHUB_SHA" \
            --workflow-path ".github/workflows/ci.yml" \
            --wait \
            --timeout-minutes 30 \
            --interval-seconds 20

      - name: Push unique staging candidate and capture pushed digest
        # Runs while the detached SBOM generation is still reading the exported archive; both
        # describe the same local image config, which the remote manifest check binds to the push.
        id: publish
        env:
          STAGING_IMAGE: ${{ env.IMAGE_REPOSITORY }}:fleet-stage-${{ github.run_id }}-${{ github.run_attempt }}
          SCANNED_CONFIG_ID: ${{ steps.export.outputs.config-id }}
        run: |
          set -euo pipefail
          local_config_digest=$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")
          test -n "$local_config_digest"
          test "$local_config_digest" = "$SCANNED_CONFIG_ID" || {
            printf '%s\n' 'local image config does not match the exported and scanned archive' >&2
            exit 1
          }
          docker tag "$TEST_IMAGE" "$STAGING_IMAGE"
          push_output=$(docker push "$STAGING_IMAGE")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | python3 scripts/extract-pushed-image-digest.py)
          test -n "$digest"
          immutable_ref="$IMAGE_REPOSITORY@$digest"
          printf 'digest=%s\nimmutable_ref=%s\nlocal-config-digest=%s\nstaging-image=%s\n' \
            "$digest" "$immutable_ref" "$local_config_digest" "$STAGING_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify remote immutable manifest identity
        env:
          IMMUTABLE_REF: ${{ steps.publish.outputs.immutable_ref }}
          LOCAL_CONFIG_DIGEST: ${{ steps.publish.outputs.local-config-digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMMUTABLE_REF" > remote-manifest.json
          remote_config_digest=$(python3 -c '
          import json
          manifest = json.load(open("remote-manifest.json", encoding="utf-8"))
          digest = manifest.get("config", {}).get("digest")
          assert isinstance(digest, str) and digest.startswith("sha256:"), manifest
          print(digest)
          ')
          test -n "$remote_config_digest"
          test "$remote_config_digest" = "$LOCAL_CONFIG_DIGEST" || {
            printf '%s\n' 'remote manifest config does not match scanned candidate' >&2
            exit 1
          }
          printf 'remote-config-digest=%s\n' "$remote_config_digest" >> "$GITHUB_OUTPUT"

      - name: Collect SBOM and validate full and compact SPDX 2.3 documents
        run: |
          set -euo pipefail
          python3 scripts/scan-fleet-image.py wait-sbom \
            --output fleet-image.spdx.json \
            --state "$SBOM_STATE"
          python3 scripts/compact-spdx-sbom.py \
            --input fleet-image.spdx.json \
            --output fleet-image.attestation.spdx.json \
            --max-bytes 16777216
          python3 scripts/validate-spdx-schema.py \
            --schema release/spdx-2.3-schema.json \
            fleet-image.spdx.json \
            fleet-image.attestation.spdx.json

      - name: Promote immutable staging digest
        # Only after the SBOM of the scanned config has been validated; the staging ref is
        # run/attempt-unique and is never consumed by anything.
        env:
          IMMUTABLE_REF: ${{ steps.publish.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_REPOSITORY:sha-${{ github.sha }}" \
            "$IMMUTABLE_REF"

      - name: Verify promoted SHA tag resolves to staged digest
        env:
          SHA_TAG: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          STAGED_DIGEST: ${{ steps.publish.outputs.digest }}
        # GHCR tag writes are eventually consistent: a read straight after imagetools create
        # can answer "not found" or a previous attempt's digest. Wait (bounded) for the tag to
        # converge; the verdict is still exact equality with the staged digest.
        run: |
          set -euo pipefail
          promoted_digest=""
          for attempt in $(seq 1 12); do
            promoted_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$SHA_TAG" 2>/dev/null) || promoted_digest=""
            if [ "$promoted_digest" = "$STAGED_DIGEST" ]; then
              break
            fi
            printf 'attempt %s: SHA tag resolves to %s, waiting for registry\n' "$attempt" "${promoted_digest:-nothing}"
            sleep 5
          done
          test -n "$promoted_digest"
          test "$promoted_digest" = "$STAGED_DIGEST" || {
            printf '%s\n' 'promoted SHA tag does not resolve to staged digest' >&2
            exit 1
          }

      - name: Emit exact Fleet handoff manifest
        run: |
          set -euo pipefail
          python3 scripts/emit-fleet-image-manifest.py \
            --repository "$IMAGE_REPOSITORY" \
            --revision "${{ github.sha }}" \
            --digest "${{ steps.publish.outputs.digest }}" \
            --agent-manifest release/agent-image-manifest.json \
            --output fleet-image-handoff.json

      - name: Attest published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest published SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: fleet-image.attestation.spdx.json
          push-to-registry: true

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-publication-evidence-${{ github.sha }}
          path: |
            fleet-image.spdx.json
            fleet-image.attestation.spdx.json
            trivy-image.json
            vex-publish-evaluation.json
            remote-manifest.json
            release/vex-exceptions.json
          retention-days: 30

      - name: Upload private House handoff manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-image-handoff-${{ github.sha }}
          path: fleet-image-handoff.json
          if-no-files-found: error
          retention-days: 90
