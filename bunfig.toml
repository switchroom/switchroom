# bun test configuration.
#
# The ONLY thing here is the state-dir hermeticity preload — bun's counterpart
# to vitest's `test.setupFiles`. Without it the guard would cover one runner
# only: a `bun test` file that reaches the gateway's turn-record writer (or
# runtime-metrics / analytics) with no state-dir env set writes into
# `/state/agent`, which inside an agent container is a LIVE agent's
# bind-mounted state dir. That is the exact leak the guard exists to close, so
# it must not depend on which runner a test happens to use.
#
# bun reads the bunfig.toml in its CWD (not an ancestor's), and this repo runs
# `bun test` from two directories — the repo root (`npm run test:bun`) and
# `telegram-plugin/` (CI's `bun-test-run`, via scripts/bun-test-ci.sh). Hence
# the sibling `telegram-plugin/bunfig.toml`. Both are pinned by
# `npm run lint:agent-state-dir-hermeticity`.
#
# `preload` paths are resolved relative to this file.
[test]
preload = ["./tests/vitest-setup/agent-state-dir-guard.mjs"]
