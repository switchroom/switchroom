      // other sections are unaffected either way.
      const turns = d.turns;
      let turnsHtml;
      if (!Array.isArray(turns) || turns.length === 0) {
        turnsHtml = '<div style="color:var(--text-dim)">No turns recorded.</div>';
      } else {
        turnsHtml = turns.map(t => {
          const when = escapeHtml(formatTimestamp(t.started_at));
          const status = t.ended_at ? 'ended' : 'in-flight';
          const raw = (t.user_prompt_preview || '').replace(/\s+/g, ' ').trim();
          const summary = raw
            ? escapeHtml(raw.length > 80 ? raw.slice(0, 80) + '…' : raw)
            : '<span style="color:var(--text-dim)">(no prompt)</span>';
          return `<div style="margin-bottom:.4rem">
            <span style="color:var(--text-dim);font-size:.8rem">${when} · ${escapeHtml(status)}</span><br>
            <span>${summary}</span>
          </div>`;
        }).join('');
      }

      const configText = config ? JSON.stringify(config, null, 2) : '(unavailable)';

      return `
        <h4>Account</h4>${accountsHtml}
        <h4>Sub-agents</h4>${subHtml}
        <h4>Recent turns</h4>${turnsHtml}
        <h4>Resolved config</h4><pre class="config-pre">${escapeHtml(configText)}</pre>
      `;
    }

    function renderAccounts() {
      const container = document.getElementById('accounts');
      if (!accounts || accounts.length === 0) {
        container.innerHTML = '<div class="loading">No accounts. Run <code>switchroom auth account add &lt;label&gt;</code>.</div>';
        return;
      }
      // RFC-H shape: the API returns `usedBy` (agents bound via the
      // fleet-active account or a per-agent override) and a broker
      // `quota` AccountState ({exhausted, exhausted_until,
      // threshold_violations, last_refreshed_at}). The pre-RFC-H
      // primaryFor/fallbackFor lists and quota.fiveHourPct utilization
      // fields no longer exist on the wire.
      // usage % cell: live 5h/7d utilization from the last cached
      // probe (cost-gated — see refreshQuota). null → "—" + a per-
      // account ↻ that force-probes. quotaStale → value shown muted
      // with ↻ to refresh. When `resetAt` is provided we append a
      // muted "resets in Xh" line so the operator can see WHEN the
      // window rolls over without hovering for a tooltip — matches
      // anthropic-ratelimit-unified-{5h,7d}-reset headers exposed by
      // the broker probe (src/auth/quota.ts:97-98).
      const pctCell = (pct, label, stale, resetAt) => {
        if (pct == null) return '<span style="color:var(--text-dim)">—</span>';
        let cls = 'quota-pct';
        if (pct >= 90) cls += ' high';
        else if (pct >= 70) cls += ' mid';
        const v = `${Math.round(pct)}%`;
        const reset = resetAt
          ? `<div style="font-size:.72rem;color:var(--text-dim);font-weight:normal;margin-top:.1rem">resets ${formatTimestamp(resetAt)}</div>`
          : '';
        const pctSpan = stale
          ? `<span class="${cls}" title="stale — click ↻" style="opacity:.55">${v}</span>`
          : `<span class="${cls}">${v}</span>`;
        return reset ? `<div>${pctSpan}${reset}</div>` : pctSpan;
      };
      const enriched = accounts.map(a => {
        const q = a.quota || null;
        const u = a.quotaUsage || null;
        const exhausted = q ? !!q.exhausted : null;
        return {
          a,
          usedBy: a.usedBy || [],
          fiveH: pctCell(u ? u.fiveHourPct : null, '5h', a.quotaStale, u ? u.fiveHourResetAt : null),
          sevenD: pctCell(u ? u.sevenDayPct : null, '7d', a.quotaStale, u ? u.sevenDayResetAt : null),
          captured: u && u.capturedAt
            ? `${formatTimestamp(u.capturedAt)}${a.quotaUsageSource === 'broker-cache' ? '<div style="font-size:.7rem;color:var(--text-dim)">broker cache (free)</div>' : ''}`
            : '<span style="color:var(--text-dim)">never</span>',
          exhaustedCell: q == null
            ? '<span style="color:var(--text-dim)">broker offline</span>'
            : exhausted
              ? `<span class="quota-pct high">exhausted${q.exhausted_until ? ' → ' + formatTimestamp(q.exhausted_until) : ''}</span>`
              : '<span class="quota-pct">ok</span>',
          violations: q && q.threshold_violations
            ? `<span class="quota-pct mid">${q.threshold_violations}</span>`
            : '<span style="color:var(--text-dim)">0</span>',
          expires: formatTimestamp(a.expiresAt),
        };
      });
      const refreshBtn = (label) =>
        `<button class="btn" title="Probe live quota now (billed Anthropic call)" onclick="refreshQuota('${escapeHtml(label)}', true)">↻</button>`;
      const rows = enriched.map(e => {
        const { a, usedBy, fiveH, sevenD, captured, exhaustedCell, violations, expires } = e;
        return `
        <tr>
          <td>${escapeHtml(a.label)}</td>
          <td><span class="health-badge ${escapeHtml(a.health)}">${escapeHtml(a.health)}</span></td>
          <td>${renderUsedByCell(usedBy)}</td>
          <td>${fiveH}</td>
          <td>${sevenD}</td>
          <td title="quota probed at">${captured}</td>
          <td>${exhaustedCell}</td>
          <td>${violations}</td>
          <td>${expires}</td>
          <td>${refreshBtn(a.label)} <button class="btn" onclick="openPromoteModal('${escapeHtml(a.label)}')">Make fleet-active…</button></td>
        </tr>
      `;
      }).join('');
      const cards = enriched.map(e => {
        const { a, usedBy, fiveH, sevenD, captured, exhaustedCell, violations, expires } = e;
        return `
        <div class="account-card">
          <div class="account-card-header">
            <div class="account-label">${escapeHtml(a.label)}</div>
            <span class="health-badge ${escapeHtml(a.health)}" style="margin-left:auto">${escapeHtml(a.health)}</span>
          </div>
          <div class="account-usage">${renderUsedByCell(usedBy)}</div>
          <div class="card-meta" style="padding:0">
            <div class="meta-item"><label>5h usage </label><span>${fiveH}</span></div>
            <div class="meta-item"><label>7d usage </label><span>${sevenD}</span></div>
            <div class="meta-item"><label>Probed </label><span>${captured}</span></div>
            <div class="meta-item"><label>Quota </label><span>${exhaustedCell}</span></div>
            <div class="meta-item"><label>Threshold viols </label><span>${violations}</span></div>
            <div class="meta-item"><label>Expires </label><span>${expires}</span></div>
          </div>
          <div style="margin-top:0.75rem">
            ${refreshBtn(a.label)}
            <button class="btn" onclick="openPromoteModal('${escapeHtml(a.label)}')">Make fleet-active…</button>
          </div>
        </div>
      `;
      }).join('');
      container.innerHTML = `
        <div style="margin-bottom:0.6rem;display:flex;align-items:center;gap:0.75rem">
          <button class="btn" onclick="refreshQuota(null, true)">↻ Refresh all quota</button>
          <span style="font-size:0.78rem;color:var(--text-dim)">
            5h/7d usage is cached (≤10 min); ↻ forces a live probe (one billed Anthropic call per account).
          </span>
        </div>
        <div class="accounts-table-wrap">
          <table class="accounts-table">
            <thead><tr>
              <th>Label</th><th>Health</th><th>Used by</th>
              <th>5h&nbsp;%</th><th>7d&nbsp;%</th><th>Probed</th>
              <th>Quota</th><th>Threshold viols</th><th>Expires</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="accounts-grid">${cards}</div>
      `;
    }

    // Refresh cached quota. label=null → all accounts. force=true →
    // bypass the server's 10-min TTL (the per-account / "all" buttons).
    async function refreshQuota(label, force) {
      try {
        showToast(label ? `Probing ${label}…` : 'Probing all accounts…', true);
        const res = await fetch(`${API}/api/accounts/quota/refresh`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify(label ? { labels: [label], force: !!force } : { force: !!force }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showToast(`Quota probe failed: ${data.error || `HTTP ${res.status}`}`, false);
        } else {
          showToast('Quota updated', true);
        }
        fetchAccounts(); // re-pull; handleGetAccounts now serves the fresh cache
      } catch (err) {
        showToast(`Quota probe failed: ${err.message}`, false);
      }
    }

    function renderUsedByCell(usedBy) {
      // RFC-H: a single fleet-active account plus optional per-agent
      // overrides. `usedBy` is the flat list of agents currently bound
      // to this account (either via fleet-active or an override). No
      // more primary/fallback split — binding is singular post-RFC-H.
      if (!usedBy || usedBy.length === 0) {
        return '<span style="color:var(--text-dim)">unused</span>';
      }
      const MAX_INLINE = 4;
      const title = `bound: ${usedBy.join(', ')}`;
      const shown = usedBy.length <= MAX_INLINE
        ? usedBy.map(escapeHtml).join(', ')
        : `${usedBy.slice(0, MAX_INLINE).map(escapeHtml).join(', ')} +${usedBy.length - MAX_INLINE}`;
      return `<span class="usage-pill primary" title="${escapeHtml(title)}">${shown}</span>`;
    }

    function renderSystemHealth(h) {
      const container = document.getElementById('system');
      const b = h.broker || {};
      const hs = h.hindsight || {};
      const hd = h.hostd || {};

      const dot = (ok) => `<span class="status-dot ${ok ? 'active' : 'inactive'}" style="display:inline-block;vertical-align:middle"></span>`;
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;

      const brokerBody = b.reachable
        ? `<div class="card-meta" style="padding:0">
             <div class="meta-item"><label>Fleet-active </label><span>${escapeHtml(b.active || '—')}</span></div>
             <div class="meta-item"><label>Accounts </label><span>${b.accounts ?? '—'}</span></div>
             <div class="meta-item"><label>Agents </label><span>${b.agents ?? '—'}</span></div>
             <div class="meta-item"><label>Consumers </label><span>${b.consumers ?? '—'}</span></div>
           </div>`
        : renderProblem(brokerProblem(b.error));

      const statelessCell = hs.mcpStateless == null
        ? dim('unknown')
        : hs.mcpStateless ? 'stateless' : '<span style="color:var(--yellow)">stateful</span>';
      const hindsightMeta = `
        <div class="card-meta" style="padding:0">
          <div class="meta-item"><label>Container </label><span>${hs.containerStatus ? escapeHtml(hs.containerStatus) : dim('absent')}</span></div>
          <div class="meta-item"><label>Model </label><span>${hs.model ? escapeHtml(hs.model) : dim('unknown')}</span></div>
          <div class="meta-item"><label>Provider </label><span>${hs.provider ? escapeHtml(hs.provider) : dim('unknown')}</span></div>
          <div class="meta-item"><label>MCP </label><span>${statelessCell}</span></div>
        </div>`;
      // When hindsight isn't serving, lead with the actionable remediation,
      // then still show the (now-stale) container/model meta beneath it.
      const hindsightBody = hs.running === false
        ? renderProblem(problemFor('hindsight-down', {})) + hindsightMeta
        : hindsightMeta;

      let hostdBody;
      if (!hd.auditLogPresent) {
        // A genuine read error stays a red dim line; the benign "empty audit
        // log" case is an informational ProblemDetail (not an error state).
        hostdBody = hd.error
          ? `<div style="color:var(--red)">${escapeHtml('audit log error: ' + hd.error)}</div>`
          : renderProblem(problemFor('hostd-no-audit', {}));
      } else if (!hd.recent || hd.recent.length === 0) {
        hostdBody = dim('audit log present, no entries');
      } else {
        // Tri-state, not a binary ok/!ok — async mutations log a `started`
        // row (exit_code null) that is NOT a failure; painting it red made the
        // panel a wall of false-alarm red. Map: error/non-zero exit → red,
        // denied → grey, started/in-flight → blue, completed+exit0 → green.
        const verbStatus = (e) => {
          if (e.result === 'denied') return { cls: 'denied', dotStyle: 'background:var(--text-dim)', label: 'denied' };
          if (e.result === 'error' || (e.exit_code != null && e.exit_code !== 0))
            return { cls: 'err', dotStyle: 'background:var(--red)', label: e.result || 'error' };
          if (e.result === 'started' || e.exit_code == null)
            return { cls: 'started', dotStyle: 'background:var(--blue);box-shadow:0 0 6px var(--blue)', label: e.result || 'in progress' };
          return { cls: 'ok', dotStyle: 'background:var(--green);box-shadow:0 0 6px var(--green)', label: e.result || 'ok' };
        };
        const rows = hd.recent.slice().reverse().map(e => {
          const caller = e.caller && e.caller.kind === 'agent' ? escapeHtml(e.caller.name) : 'operator';
          const st = verbStatus(e);
          // The one diagnostic field — stderr_tail/error — was previously
          // dropped, making EROFS/reconcile failures unreadable. Surface it.
          const detail = e.stderr_tail || e.error;
          const detailRow = (st.cls === 'err' || st.cls === 'denied') && detail
            ? `<tr><td colspan="4" style="color:var(--red);font-size:.72rem;white-space:pre-wrap;word-break:break-word;padding-top:0">${escapeHtml(String(detail).slice(0, 400))}</td></tr>`
            : '';
          return `<tr>
            <td><span class="status-dot" style="display:inline-block;vertical-align:middle;${st.dotStyle}"></span> ${escapeHtml(e.op || '?')}</td>
            <td>${caller}</td>
            <td>${escapeHtml(st.label)}${e.exit_code != null ? ` (${e.exit_code})` : ''}</td>
            <td>${escapeHtml(shortTs(e.ts))}</td>
          </tr>${detailRow}`;
        }).join('');
        hostdBody = `<table class="accounts-table" style="margin-top:0.5rem">
          <thead><tr><th>Verb</th><th>Caller</th><th>Result</th><th>When</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      }

      // Subtle freshness hint: the cached object carries `stale:true` when
      // it's being served past its TTL while a background refresh runs.
      const updating = h.stale
        ? `<span style="color:var(--text-dim);font-size:.7rem;margin-left:.4rem">(updating…)</span>`
        : '';
      container.innerHTML = `
        ${updating ? `<div style="margin-bottom:.4rem">System health ${updating}</div>` : ''}
        <div class="agents-grid">
          <div class="agent-card"><div class="card-header" style="cursor:default">
            ${dot(b.reachable)}<span class="agent-name">auth-broker</span></div>
            <div style="padding:0 1.25rem 1rem">${brokerBody}</div></div>
          <div class="agent-card"><div class="card-header" style="cursor:default">
            ${dot(hs.running)}<span class="agent-name">hindsight</span></div>
            <div style="padding:0 1.25rem 1rem">${hindsightBody}</div></div>
        </div>
        <div class="agent-card" style="margin-top:1rem"><div class="card-header" style="cursor:default">
          ${dot(hd.auditLogPresent)}<span class="agent-name">hostd — recent privileged verbs</span></div>
          <div style="padding:0 1.25rem 1rem">${hostdBody}</div></div>`;
    }

    function shortTs(ts) {
      if (!ts) return '—';
      // 2026-05-15T04:15:13.465Z → 2026-05-15 04:15:13
      return String(ts).replace('T', ' ').replace(/\.\d+Z?$/, '').replace(/Z$/, '');
    }

    const _dimC = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;

    let _accessBtnSeq = 0;
    let _scopeSeq = 0;

    // One OAuth-account card (Google or Microsoft — same shape; Microsoft
    // adds an account-type pill). When agentNames is supplied, renders a
    // per-agent "manage access" row (enable/disable → Telegram approval).
    function renderOAuthAccountCard(a, opts) {
      const provider = (opts && opts.provider) || '';
      const agentNames = (opts && opts.agentNames) || [];
      // expiresAt is the SHORT-LIVED access-token expiry, NOT connection
      // health. For a broker-known slot the refresh token keeps it alive, so a
      // past value means "lazily refreshes on next use" — rendering it as
      // "Expires 23d ago" made healthy connected accounts look broken (the
      // "connections aren't accurate" complaint). Don't alarm on it.
      const expires = !a.expiresAt
        ? _dimC('—')
        : (a.brokerKnown && a.expiresAt < Date.now())
          ? '<span style="color:var(--text-dim)">auto-refreshes</span>'
          : formatTimestamp(a.expiresAt);
      const known = a.brokerKnown
        ? '<span class="usage-pill primary">connected</span>'
        : '<span style="color:var(--yellow)">config-only (no broker slot)</span>';
      const acl = (a.enabledFor && a.enabledFor.length)
        ? a.enabledFor.map(escapeHtml).join(', ')
        : _dimC('no agents enabled');
      const typePill = (opts && opts.showType && a.accountType)
        ? `<span class="usage-pill" style="margin-left:.4rem">${escapeHtml(a.accountType)}</span>`
        : '';
      const enabledSet = new Set(a.enabledFor || []);
      const manage = (agentNames.length && provider)
        ? `<div class="account-usage" style="margin-top:.5rem">
             <label style="color:var(--text-dim);opacity:.7;display:block;margin-bottom:.3rem">Manage access (approve on Telegram):</label>
             ${agentNames.map(name => {
               const on = enabledSet.has(name);
               const btnId = `acc-${++_accessBtnSeq}`;
               const accJs = JSON.stringify(a.account), nameJs = JSON.stringify(name), provJs = JSON.stringify(provider);
               return `<button id="${btnId}" class="usage-pill ${on ? 'primary' : ''}" style="margin:.15rem;cursor:pointer;border:none"
                 onclick='toggleAccess(${provJs}, ${accJs}, ${nameJs}, ${!on}, "${btnId}")'>${on ? '✓ ' : '+ '}${escapeHtml(name)}</button>`;
             }).join('')}
           </div>`
        : '';
      // Scope: clickable "N scope(s)" that expands a full-width list of the
      // individual scopes below the meta row (the old version hid them in a
      // title tooltip only). The list is a sibling block after .card-meta so
      // it isn't squished inside the flex-wrapped meta-items.
      const scopeList = a.scope ? a.scope.split(/\s+/).filter(Boolean) : [];
      let scopeCount, scopeBlock = '';
      if (scopeList.length) {
        const sid = `scopes-${++_scopeSeq}`;
        scopeCount = `<span class="scope-toggle" id="${sid}-t" role="button" tabindex="0" aria-expanded="false" aria-controls="${sid}"
            onclick="toggleScopes('${sid}')"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleScopes('${sid}');}"
          ><span class="scope-caret">▸</span>${escapeHtml(scopeList.length + ' scope' + (scopeList.length === 1 ? '' : 's'))}</span>`;
        scopeBlock = `<ul class="scope-list" id="${sid}" hidden>${
          scopeList.map(s => `<li title="${escapeHtml(s)}">${escapeHtml(s)}</li>`).join('')
        }</ul>`;
      } else {
        scopeCount = _dimC('—');
      }
      return `
      <div class="account-card">
        <div class="account-card-header">
          <div class="account-label">${escapeHtml(a.account)}${typePill}</div>
          <span style="margin-left:auto">${known}</span>
        </div>
        <div class="account-usage"><label style="color:var(--text-dim);opacity:.7">Enabled for: </label>${acl}</div>
        <div class="card-meta" style="padding:0">
          <div class="meta-item"><label>Expires </label><span>${expires}</span></div>
          <div class="meta-item"><label>Scope </label><span>${scopeCount}</span></div>
          <div class="meta-item"><label>Client </label><span>${a.clientId ? escapeHtml(a.clientId.slice(0, 16) + '…') : _dimC('—')}</span></div>
        </div>
        ${scopeBlock}
        ${manage}
      </div>`;
    }

    function _connectionSection(title, emptyHtml, cardsHtml) {
      return `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">${title}</h3>
          ${cardsHtml ? `<div class="accounts-grid">${cardsHtml}</div>` : `<div class="loading" style="padding:.8rem">${emptyHtml}</div>`}
        </div>`;
    }

    // Unified external-connections view: Google + Microsoft accounts and
    // the Notion workspace, each showing which agents have access.
    function renderConnections(data) {
      const container = document.getElementById('connections');
      const google = data.google || [];
      const microsoft = data.microsoft || [];
      const notion = data.notion || { configured: false, databases: [] };
      const agentNames = data.agentNames || [];

      // When a provider's fetch FAILED (not genuinely empty), its empty-state
      // must say "couldn't load", never "none configured" — otherwise a
      // transient blip reads as "you have no accounts".
      const googleSection = _connectionSection(
        'Google',
        data.googleFailed
          ? "Couldn't load Google accounts — the data source was unreachable (retrying)."
          : 'No Google accounts. Add one under <code>google_accounts:</code> and run <code>switchroom auth google account add</code>.',
        google.map(a => renderOAuthAccountCard(a, { showType: false, provider: 'google', agentNames })).join(''),
      );

      const msCards = microsoft.map(a => renderOAuthAccountCard(a, { showType: true, provider: 'microsoft', agentNames })).join('');
      const msEmpty = data.microsoftFailed
        ? "Couldn't load Microsoft accounts — the data source was unreachable (retrying)."
        : 'No Microsoft accounts yet — click <b>Connect a Microsoft account</b> above (or <code>/connect microsoft</code> from Telegram).';
      const microsoftSection = `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">
            Microsoft 365
            <button id="ms-connect-btn" onclick="connectMicrosoft()" class="usage-pill primary" style="margin-left:.6rem;cursor:pointer;border:none;text-transform:none;font-weight:600">+ Connect a Microsoft account</button>
          </h3>
          <div id="ms-connect-card"></div>
          ${msCards
            ? `<div class="accounts-grid">${msCards}</div>`
            : `<div class="loading" style="padding:.8rem">${msEmpty}</div>`}
        </div>`;

      let notionCards = '';
      if (notion.configured) {
        notionCards = (notion.databases || []).map(db => {
          const acl = (db.enabledFor && db.enabledFor.length)
            ? db.enabledFor.map(escapeHtml).join(', ')
            : _dimC('no agents enabled');
          return `
          <div class="account-card">
            <div class="account-card-header">
              <div class="account-label">${escapeHtml(db.name)}</div>
              <span style="margin-left:auto" class="usage-pill">database</span>
            </div>
            <div class="account-usage"><label style="color:var(--text-dim);opacity:.7">Enabled for: </label>${acl}</div>
            <div class="card-meta" style="padding:0">
              <div class="meta-item"><label>DB id </label><span>${escapeHtml(db.id.slice(0, 12))}…</span></div>
            </div>
          </div>`;
        }).join('');
      }
      const notionTitle = 'Notion' + (notion.configured && notion.vaultKey ? ` <span style="text-transform:none;font-weight:400">· token <code>${escapeHtml(notion.vaultKey)}</code></span>` : '');
      const fullAccessBanner = (notion.fullAccessAgents && notion.fullAccessAgents.length)
        ? `<div style="margin:0 0 .6rem;font-size:.85rem;color:var(--text-dim)">Full access (all databases): ${notion.fullAccessAgents.map(escapeHtml).join(', ')}</div>`
        : '';
      const notionBody = notionCards
        ? `<div class="accounts-grid">${notionCards}</div>`
        : `<div class="loading" style="padding:.8rem">${notion.configured
            ? 'Notion configured but no databases declared. Add them under <code>notion_workspace.databases:</code>.'
            : 'Notion not configured. See <code>docs/notion-integration.md</code>.'}</div>`;
      const notionSection = `
        <div style="margin-bottom:1.5rem">
          <h3 style="margin:0 0 .6rem;font-size:.95rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em">${notionTitle}</h3>
          ${fullAccessBanner}${notionBody}
        </div>`;

      // Tab-level degraded banner: when every OAuth account (Google +
      // Microsoft) is config-only (no live broker slot) and there's at least
      // one, the broker data is unavailable — surface that ABOVE the sections
      // without blanking the config-only cards.
      const oauth = [...google, ...microsoft];
      const allConfigOnly = oauth.length > 0 && oauth.every(a => a.brokerKnown === false);
      const degradedBanner = allConfigOnly
        ? renderProblem(problemFor('connections-degraded', {}))
        : '';

      // A failed fetch must NOT masquerade as "nothing configured" — lead
      // with an honest banner so the operator knows the empty look is a
      // load failure (auto-retrying), not an absence of accounts.
      const unreachableBanner = data.fetchFailed
        ? renderProblem(problemFor('connections-unreachable', {}))
        : '';

      container.innerHTML = unreachableBanner + degradedBanner + googleSection + microsoftSection + notionSection;
    }

    function renderSchedule(data) {
      const container = document.getElementById('schedule');
      const entries = (data && data.entries) || [];
      const recent = (data && data.recentByAgent) || {};
      const degraded = !!(data && data.degraded);
      const truncated = !!(data && data.truncated);
      // Degraded banner: hostd is unreachable, so this is the base-config-only
      // view (per-agent cascade overrides may be absent). Render it ABOVE the
      // cards — never instead of them — so the operator sees both the
      // incompleteness AND whatever entries we DO have.
      const degradedBanner = degraded
        ? renderProblem(problemFor('schedule-degraded', { reason: data && data.reason }))
        : '';
      const truncatedNote = truncated
        ? '<div style="font-size:.78rem;color:var(--text-dim);margin-bottom:.75rem">(some entries trimmed to fit)</div>'
        : '';
      if (entries.length === 0) {
        // A bare "No schedule entries" is misleading when hostd is just down —
        // show the actionable degraded banner instead.
        container.innerHTML = degraded
          ? degradedBanner
          : '<div class="loading">No <code>schedule:</code> entries in any agent\'s cascade-resolved config.</div>';
        return;
      }
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;
      // Group entries by agent. Agents sorted by name; within an agent the
      // entries keep their cascade-given order (defaults → profile → agent →
      // overlays), which is the order the operator/agent declared them.
      const byAgent = {};
      for (const e of entries) (byAgent[e.agent] ||= []).push(e);

      // One self-contained block per cron: title (or cron expr as fallback
      // heading) + badges, the prompt, then THIS cron's recent fires right
      // below it. Fires are matched to a cron by promptKey — both the entry
      // and each DispatchResult carry the same stable SHA. (Edge: two
      // entries with an identical prompt share a promptKey, so they'd share
      // the same fire list — acceptable; identical prompts are
      // indistinguishable in the audit ledger by design.)
      const renderCron = (e, agentFires) => {
        const hasTitle = typeof e.name === 'string' && e.name.length > 0;
        const heading = hasTitle
          ? `<span style="font-weight:600;color:var(--text)">${escapeHtml(e.name)}</span>`
          : `<span style="color:var(--text-dim)">${escapeHtml(e.cron)}</span>`;
        const badges = []
          .concat(e.kind ? [e.kind] : [])
          .concat(e.model ? [e.model] : [])
          .concat(e.context ? [e.context] : [])
          .map(b => `<span class="chip">${escapeHtml(String(b))}</span>`)
          .join('');
        // Prompt: kind:action entries have no prompt (the action is
        // model-free), so show a muted marker rather than a blank line.
        const promptText = typeof e.prompt === 'string' ? e.prompt : '';
        const promptBlock = promptText
          ? `<div style="margin:.4rem 0 .55rem;color:var(--text);font-size:.84rem" title="${escapeHtml(promptText)}">${escapeHtml(promptText.length > 140 ? promptText.slice(0, 140) + '…' : promptText)}</div>`
          : `<div style="margin:.4rem 0 .55rem">${dim(e.kind === 'action' ? 'model-free action' : '—')}</div>`;
        // Recent fires for THIS cron only — filter the agent's fire list by
        // matching promptKey, newest-first, last 8.
        const fires = agentFires
          .filter(f => f.promptKey === e.promptKey)
          .slice()
          .reverse()
          .slice(0, 8);
        const fireList = fires.length === 0
          ? `<div style="font-size:.78rem">${dim('no recorded fires yet')}</div>`
          : fires.map(f => {
              const ok = f.exitCode === 0;
              const when = escapeHtml(shortTs(new Date(f.startedAt).toISOString()));
              const summary = String(f.outputSummary || '');
              const summaryHtml = summary
                ? ' · <span style="color:var(--text-dim)">' + escapeHtml(summary.length > 70 ? summary.slice(0, 70) + '…' : summary) + '</span>'
                : '';
              return `<div style="font-size:.78rem;line-height:1.55">
                <span class="status-dot ${ok ? 'active' : 'inactive'}" style="display:inline-block;vertical-align:middle;margin-right:.35rem"></span>${when} · ${ok ? 'ok' : 'exit ' + escapeHtml(String(f.exitCode))}${summaryHtml}
              </div>`;
            }).join('');
        return `
          <div style="border:1px solid var(--border);border-radius:8px;padding:.7rem .85rem;margin-bottom:.7rem;background:var(--surface-hover)">
            <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
              ${heading}
              <code style="font-size:.78rem">${escapeHtml(e.cron)}</code>
              ${badges}
            </div>
            ${promptBlock}
            <div style="border-top:1px solid var(--border);padding-top:.5rem">
              <div style="font-size:.72rem;color:var(--text-dim);margin-bottom:.3rem">Recent fires</div>
              ${fireList}
            </div>
          </div>`;
      };

      const cards = Object.keys(byAgent).sort().map(agent => {
        const agentFires = recent[agent] || [];
        const list = byAgent[agent].map(e => renderCron(e, agentFires)).join('');
        return `
        <div class="agent-card" style="margin-bottom:1rem">
          <div class="card-header" style="cursor:default">
            <span class="agent-name">${escapeHtml(agent)}</span>
            <span class="agent-topic">${byAgent[agent].length} schedule entr${byAgent[agent].length === 1 ? 'y' : 'ies'}</span>
          </div>
          <div style="padding:.5rem 1.25rem 1rem">${list}</div>
        </div>`;
      }).join('');
      container.innerHTML = degradedBanner + truncatedNote + cards;
    }

    function renderApprovals(data, grants) {
      const container = document.getElementById('approvals');
      // Two independent sections: the operator's REAL standing capability
      // grants (broker grants DB — the actually-useful one), then the
      // kernel decision ledger (honestly empty on most installs). They
      // degrade independently — one being unreachable never blanks the
      // other.
      container.innerHTML =
        renderStandingGrants(grants) + renderApprovalDecisions(data);
    }

    // Standing capability grants from the vault-broker grants DB — what
    // `switchroom vault grants` lists. write_allow grants are the sensitive
    // ones (highlighted), mirroring the Drive-scope highlight below.
    function renderStandingGrants(grants) {
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;
      const heading = '<h3 style="margin:0 0 0.5rem;font-size:0.95rem">Standing capability grants</h3>';
      if (!grants || grants.reachable === false) {
        return heading +
          renderProblem(problemFor('grants-unreachable', { error: grants && grants.error }));
      }
      const rows = grants.grants || [];
      if (rows.length === 0) {
        return heading +
          '<div class="loading" style="color:var(--text-dim)">No standing capability grants.</div>';
      }
      const now = Date.now();
      const chipList = (keys) => (keys && keys.length)
        ? keys.map(k => `<span class="chip">${escapeHtml(k)}</span>`).join(' ')
        : dim('—');
      const body = rows.map(g => {
        const expired = g.expiresAt != null && g.expiresAt < now;
        const writeCell = (g.writeKeys && g.writeKeys.length)
          ? `<span class="usage-pill primary" title="write grants are the sensitive ones">write</span> ` +
            g.writeKeys.map(k => `<span class="chip">${escapeHtml(k)}</span>`).join(' ')
          : dim('read-only');
        const expiresCell = g.expiresAt == null
          ? dim('never')
          : `<span style="${expired ? 'color:var(--text-dim)' : ''}">${formatTimestamp(g.expiresAt)}${expired ? ' (expired)' : ''}</span>`;
        return `
        <tr>
          <td>${escapeHtml(g.agent || '—')}</td>
          <td>${chipList(g.keys)}</td>
          <td>${writeCell}</td>
          <td>${expiresCell}</td>
          <td>${g.createdAt ? formatTimestamp(g.createdAt) : dim('—')}</td>
          <td>${g.description ? escapeHtml(g.description) : dim('—')}</td>
        </tr>`;
      }).join('');
      return heading + `
        <div style="margin-bottom:0.6rem;font-size:0.8rem;color:var(--text-dim)">
          Read-only view via the vault-broker operator socket — ${rows.length} grant(s). Write grants highlighted.
        </div>
        <div class="accounts-table-wrap">
          <table class="accounts-table">
            <thead><tr>
              <th>Agent</th><th>Keys (read)</th><th>Write</th>
              <th>Expires</th><th>Granted</th><th>Description</th>
            </tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    // Kernel decision ledger (RFC B) — kept as-is. Honestly empty on most
    // installs (the daily Allow/Deny taps don't write it); that's correct.
    function renderApprovalDecisions(data) {
      const dim = (s) => `<span style="color:var(--text-dim)">${escapeHtml(s)}</span>`;
      const heading = '<h3 style="margin:1.25rem 0 0.5rem;font-size:0.95rem">Approval decision ledger</h3>';
      if (!data || data.reachable === false) {
        return heading + renderProblem(approvalsProblem(data && data.error));
      }
      const decisions = data.decisions || [];
      if (decisions.length === 0) {
        return heading + '<div class="loading">No approval decisions recorded yet.</div>';
      }
      const now = Date.now();
      const statusOf = (d) => {
        if (d.revoked_at) return ['revoked', 'inactive'];
        if (d.ttl_expires_at && d.ttl_expires_at < now) return ['expired', 'inactive'];
        return ['active', 'active'];
      };
      const rows = decisions.map(d => {
        const [label, dot] = statusOf(d);
        // Drive write scopes are the headline use of the approval flow —
        // make them visually distinct.
        const isDrive = /(^|:)(doc|drive|gdrive|sheets)/i.test(d.scope || '');
        const scopeCell = isDrive
          ? `<span class="usage-pill primary">${escapeHtml(d.scope)}</span>`
          : escapeHtml(d.scope || '—');
        return `
        <tr>
          <td><span class="status-dot ${dot}" style="display:inline-block;vertical-align:middle"></span> ${escapeHtml(label)}</td>
          <td>${escapeHtml(d.agent_unit || '—')}</td>
          <td>${scopeCell}</td>
          <td>${escapeHtml(d.action || '—')}</td>
          <td>${escapeHtml(d.decision || '—')}</td>
          <td>${d.granted_at ? formatTimestamp(d.granted_at) : dim('—')}</td>
          <td>${d.ttl_expires_at ? formatTimestamp(d.ttl_expires_at) : dim('—')}</td>
          <td title="${d.revoke_reason ? escapeHtml(d.revoke_reason) : ''}">${d.revoked_at ? formatTimestamp(d.revoked_at) : dim('—')}</td>
        </tr>`;
      }).join('');
      return heading + `
        <div style="margin-bottom:0.6rem;font-size:0.8rem;color:var(--text-dim)">
          Read-only view via the kernel operator socket — ${decisions.length} decision(s). Drive scopes highlighted.
        </div>
        <div class="accounts-table-wrap">
          <table class="accounts-table">
            <thead><tr>
              <th>Status</th><th>Agent</th><th>Scope</th><th>Action</th>
              <th>Decision</th><th>Granted</th><th>TTL expires</th><th>Revoked</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function openPromoteModal(label) {
      // RFC-H: there is no per-agent promote. Setting the fleet-active
      // account is a single fleet-wide knob (POST /api/auth/use); the
      // broker fans the new credentials out to every agent's per-agent
      // mirror. Confirm intent, then call.
      const html = `
        <div class="modal-backdrop" id="promote-backdrop">
          <div class="modal">
            <h3>Make <code>${escapeHtml(label)}</code> the fleet-active account</h3>
            <div style="margin-top:0.5rem; font-size:0.85rem;">
              Every agent without a per-agent <code>auth.override</code> will
              switch to <code>${escapeHtml(label)}</code>. The broker fans
              the credentials out immediately; agents pick them up on their
              next turn (no manual restart needed post-RFC-H).
            </div>
            <div class="modal-actions">
              <button class="btn" onclick="closePromoteModal()">Cancel</button>
              <button class="btn btn-restart" onclick="confirmPromote('${escapeHtml(label)}')">Make fleet-active</button>
            </div>
          </div>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function closePromoteModal() {
      const el = document.getElementById('promote-backdrop');
      if (el) el.remove();
    }

    async function confirmPromote(label) {
      closePromoteModal();
      try {
        // RFC-H endpoint. Body carries the label (avoids URL-encoding
        // past the account-label charset). Response: { ok, active, fanned }.
        const res = await fetch(`${API}/api/auth/use`, {
          method: 'POST',
          headers: { ...authHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ account: label }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showToast(`Set fleet-active failed: ${data.error || `HTTP ${res.status}`}`, false);
          return;
        }
        const fanned = data.fanned || [];
        const msg = fanned.length > 0
          ? `Fleet-active is now ${data.active}. Broker fanned to: ${fanned.join(', ')}.`
          : `Fleet-active is now ${data.active}.`;
        showToast(msg, true);
        fetchAccounts();
      } catch (err) {
        showToast(`Set fleet-active failed: ${err.message}`, false);
      }
    }

    function showToast(msg, ok) {
      const el = document.createElement('div');
      el.className = `toast ${ok ? 'ok' : 'err'}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    function formatTimestamp(ms) {
      if (!ms) return '—';
      const d = new Date(ms);
      if (isNaN(d.getTime())) return '—';
      const diff = ms - Date.now();
      const abs = Math.abs(diff);
      const mins = Math.floor(abs / 60000);
      if (mins < 60) return diff < 0 ? `${mins}m ago` : `in ${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return diff < 0 ? `${hrs}h ago` : `in ${hrs}h`;
      const days = Math.floor(hrs / 24);
      return diff < 0 ? `${days}d ago` : `in ${days}d`;
    }

    function toggleDetails(name) {
      if (openDetails.has(name)) {
        openDetails.delete(name);
        render();
      } else {
        openDetails.add(name);
        render();
        if (!agentDetails[name]) fetchAgentDetail(name);
      }
    }

    // Expand/collapse a connection card's scope list in place. Self-contained
    // (no global state / re-render) — just flips the list's [hidden] and the
    // toggle's caret + aria-expanded.
    function toggleScopes(id) {
      const list = document.getElementById(id);
      const toggle = document.getElementById(id + '-t');
      if (!list) return;
      const open = list.hidden;
      list.hidden = !open;
      if (toggle) {
        toggle.setAttribute('aria-expanded', String(open));
        const caret = toggle.querySelector('.scope-caret');
        if (caret) caret.textContent = open ? '▾' : '▸';
      }
    }

    async function toggleLogs(name) {
      if (openLogs.has(name)) {
        openLogs.delete(name);
        unsubscribeLogs(name);
      } else {
        openLogs.add(name);
        // One-shot paint for instant feedback, then subscribe to the
        // hostd-poll live stream (replaces the panel every few seconds).
        await loadLogs(name);
        render();
        subscribeLogs(name);
        return;
      }
      render();
    }

    async function loadLogs(name) {
      const el = document.getElementById(`log-output-${name}`);
      if (!el) return;
      el.textContent = 'Loading...';
      try {
        const res = await fetch(`${API}/api/agents/${encodeURIComponent(name)}/logs?lines=50`, { headers: authHeaders() });
        const data = await res.json();
        el.textContent = data.ok ? (data.logs || '(no output)') : `Error: ${data.error}`;
        el.scrollTop = el.scrollHeight;
      } catch (err) {
        el.textContent = `Failed: ${err.message}`;
      }
    }

    async function agentAction(name, action) {
      try {
        const res = await fetch(`${API}/api/agents/${encodeURIComponent(name)}/${action}`, {
          method: 'POST',
          headers: authHeaders()
        });
        const data = await res.json();
        if (!data.ok) showError(`${action} ${name}: ${data.error}`);
        // Refresh after brief delay to let systemd settle
        setTimeout(fetchAgents, 1000);
      } catch (err) {
        showError(`${action} ${name}: ${err.message}`);
      }
    }

    function connectWebSocket() {
      const wsUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;
      // Browsers can't set Authorization on a WS upgrade, but they CAN set
      // Sec-WebSocket-Protocol. The server already reads the bearer token
      // from that header (extractBearerToken → ["bearer", token]) and
      // ignores any ?token= query param — so ride the subprotocol. No
      // token (Tailscale-identified bind) → no subprotocol → the server
      // falls back to the Tailscale-User-Login header, unchanged.
      ws = TOKEN ? new WebSocket(wsUrl, ['bearer', TOKEN]) : new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'log' && msg.agent) {
            const el = document.getElementById(`log-output-${msg.agent}`);
            if (el && openLogs.has(msg.agent)) {
              // hostd-poll stream sends REPLACE (the latest tail). The
              // legacy docker-follow stream appended; keep both shapes so
              // an old payload (no `replace`) still works.
              if (msg.replace) {
                el.textContent = msg.data || '(no output)';
              } else {
                el.textContent += msg.data;
              }
              el.scrollTop = el.scrollHeight;
            }
          } else if (msg.type === 'log_error' && msg.agent) {
            const el = document.getElementById(`log-output-${msg.agent}`);
            if (el && openLogs.has(msg.agent)) {
              el.textContent = `Error: ${msg.data || 'log stream unavailable'}`;
            }
          }
        } catch {}
      };

      ws.onopen = () => {
        // Re-subscribe any panels that were left open across a reconnect
        // so a dropped socket doesn't leave a permanently-dead log panel.
        for (const name of openLogs) subscribeLogs(name);
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    // Send a {subscribe} for an agent's live-log poll stream, guarded on
    // an OPEN socket (a closed socket re-subscribes via ws.onopen above).
    function subscribeLogs(name) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ type: 'subscribe', agent: name })); } catch {}
      }
    }

    function unsubscribeLogs(name) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try { ws.send(JSON.stringify({ type: 'unsubscribe', agent: name })); } catch {}
      }
    }

    // Init. Summary is the default visible tab; fetchAgents still runs
    // (populates the agents tab + keeps the 10s fleet poll warm + the
    // log WS depends on it). Summary is fetched on init + on tab-switch
    // only — deliberately NOT on the 10s interval (it fans out to
    // system-health etc.; on-demand refresh is enough).
    fetchSummary();
    fetchAgents();
    connectWebSocket();
    // Fleet poll — gated on tab visibility. A phone with the dashboard
    // backgrounded (or a laptop tab the operator switched away from)
    // shouldn't keep hitting the host every 10s; the cache absorbs the
    // cost, but skipping the request entirely is strictly better. The
    // next foregrounded tick refreshes immediately.
    setInterval(() => {
      if (document.visibilityState === 'visible') fetchAgents();
    }, 10000);
  </script>
</body>
</html>
