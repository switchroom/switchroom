<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <title>Approval &amp; grant flow</title>
  <desc>The agent registers a scoped request and ends its turn, then polls for a verdict. A human approves on a Telegram card; a scoped, TTL'd grant is minted. The agent cannot self-approve.</desc>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14171C" flood-opacity="0.18"/></filter>
    <marker id="arrowCord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8302C"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF7EF"/>

  <!-- Accent dots — coords identical to sibling diagram -->
  <circle cx="80" cy="80" r="4" fill="#E8B657" opacity=".55"/>
  <circle cx="1120" cy="80" r="4" fill="#E8B657" opacity=".55"/>
  <circle cx="80" cy="720" r="4" fill="#E8B657" opacity=".55"/>
  <circle cx="1120" cy="720" r="4" fill="#E8B657" opacity=".55"/>
  <circle cx="140" cy="660" r="3" fill="#C8302C" opacity=".5"/>
  <circle cx="1060" cy="140" r="3" fill="#C8302C" opacity=".5"/>

  <!-- Headline -->
  <text x="600" y="95" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#23282F">Privileged action? The agent asks. You approve in Telegram. Scoped, TTL'd, audited.</text>

  <!-- ============ NODE A — agent card (DARK, focal -1.2) ============ -->
  <g transform="rotate(-1.2 225 420)">
    <rect x="90" y="300" width="270" height="240" rx="14" fill="#14171C" stroke="#EDE7D7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="114" y="338" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="700" fill="#FAF7EF">agent · claude</text>
    <line x1="114" y1="352" x2="336" y2="352" stroke="#5A6069" stroke-width="1"/>
    <text x="114" y="388" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#FAF7EF">registers a scoped request</text>
    <text x="114" y="418" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#FAF7EF">ends the turn</text>
    <text x="114" y="448" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#FAF7EF">polls for the verdict</text>
    <text x="114" y="510" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#8A8F98">cannot self-approve</text>
  </g>

  <!-- ============ NODE B — approval kernel card (WHITE, secondary +0.8, center) ============ -->
  <g transform="rotate(0.8 615 405)">
    <rect x="470" y="250" width="290" height="310" rx="14" fill="#FFFFFF" stroke="#EDE7D7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="492" y="288" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#23282F">approval kernel</text>
    <text x="492" y="308" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#5A6069">SQLite decision store · per-agent UDS</text>

    <!-- mini table: agent / scope / action / ttl -->
    <rect x="492" y="324" width="246" height="118" rx="6" fill="#F5F1E8" stroke="#EDE7D7" stroke-width="1"/>
    <line x1="492" y1="352" x2="738" y2="352" stroke="#EDE7D7" stroke-width="1"/>
    <text x="504" y="343" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#5A6069">agent</text>
    <text x="566" y="343" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#5A6069">scope</text>
    <text x="662" y="343" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#5A6069">action</text>
    <text x="712" y="343" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#5A6069">ttl</text>
    <text x="504" y="378" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#23282F">worker</text>
    <text x="504" y="400" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#23282F">doc:gdrive:write</text>
    <text x="504" y="422" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#23282F">edit</text>
    <text x="662" y="422" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8873A">15m</text>

    <text x="492" y="470" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#5A6069">Scoped + TTL'd. One-off allow never</text>
    <text x="492" y="488" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#5A6069">silently becomes forever.</text>
  </g>

  <!-- ============ NODE C — phone (Telegram) (tertiary -0.6) ============ -->
  <g transform="rotate(-0.6 985 420)">
    <rect x="850" y="240" width="270" height="360" rx="26" fill="#FFFFFF" stroke="#EDE7D7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="866" y="262" width="238" height="316" rx="14" fill="#F5F1E8" stroke="#EDE7D7" stroke-width="1"/>
    <circle cx="985" cy="251" r="2.5" fill="#B8BCC3"/>

    <!-- approval card mock -->
    <rect x="882" y="280" width="206" height="282" rx="10" fill="#FFFFFF" stroke="#EDE7D7" stroke-width="1"/>
    <text x="898" y="308" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#23282F">@worker wants to</text>
    <text x="898" y="326" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#23282F">edit jwt.ts</text>

    <!-- 2-line faux diff -->
    <rect x="898" y="340" width="174" height="58" rx="6" fill="#14171C"/>
    <text x="910" y="362" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#C8302C">- const ttl = 0</text>
    <text x="910" y="384" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#4A9B8E">+ const ttl = 900</text>

    <!-- buttons -->
    <rect x="898" y="412" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#4A9B8E" stroke-width="1.5"/>
    <text x="938" y="433" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4A9B8E">Allow</text>
    <rect x="990" y="412" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#C8302C" stroke-width="1.5"/>
    <text x="1030" y="433" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#C8302C">Deny</text>

    <!-- scope chips -->
    <rect x="898" y="462" width="64" height="24" rx="12" fill="#F5F1E8" stroke="#EDE7D7" stroke-width="1"/>
    <text x="930" y="478" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#5A6069">this call</text>
    <rect x="970" y="462" width="58" height="24" rx="12" fill="#F5F1E8" stroke="#EDE7D7" stroke-width="1"/>
    <text x="999" y="478" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#5A6069">ttl 15m</text>
    <rect x="898" y="496" width="60" height="24" rx="12" fill="#F5F1E8" stroke="#EDE7D7" stroke-width="1"/>
    <text x="928" y="512" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#5A6069">always</text>
  </g>

  <!-- ============ FLOW ARROWS (curved cord; routed around card interiors) ============ -->

  <!-- 1  A -> B  (brass: sequence step) — routed below -->
  <path d="M 340 528 C 405 600, 470 600, 540 562" stroke="#C8302C" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrowCord)"/>
  <circle cx="440" cy="596" r="16" fill="#E8B657" stroke="#B8873A" stroke-width="1.5"/>
  <text x="440" y="601" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">1</text>
  <text x="440" y="638" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">register request (scope) → request_id + expires_at</text>

  <!-- 2  B -> C  (cord: push card) — routed above -->
  <path d="M 760 298 C 808 244, 858 244, 870 286" stroke="#C8302C" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrowCord)"/>
  <circle cx="815" cy="245" r="16" fill="#C8302C" stroke="#B8873A" stroke-width="1.5"/>
  <text x="815" y="250" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">2</text>
  <text x="815" y="222" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">push Approve/Deny card: what + why</text>

  <!-- 3  C -> B  (cord: you tap) — routed below -->
  <path d="M 866 548 C 850 612, 772 612, 758 562" stroke="#C8302C" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrowCord)"/>
  <circle cx="812" cy="601" r="16" fill="#C8302C" stroke="#B8873A" stroke-width="1.5"/>
  <text x="812" y="606" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">3</text>
  <text x="812" y="638" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">you tap Allow (or Deny)</text>

  <!-- 4  B -> A  (teal: success/done) — routed above -->
  <path d="M 540 288 C 472 226, 408 226, 348 296" stroke="#C8302C" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrowCord)"/>
  <circle cx="444" cy="230" r="16" fill="#4A9B8E" stroke="#B8873A" stroke-width="1.5"/>
  <text x="444" y="235" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">4</text>
  <text x="444" y="202" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">agent polls request_id → proceeds; clean refusal on deny</text>

</svg>
