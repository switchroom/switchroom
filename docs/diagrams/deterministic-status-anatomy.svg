<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <title>Deterministic status anatomy</title>
  <desc>A Telegram working-status card mock with numbered callouts explaining each part, and a left-side lifecycle state strip showing quiet, working, and idle states. Switchroom is never a black box, never silent, never pinned.</desc>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14171C" flood-opacity="0.18"/></filter>
    <marker id="arrowCord" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C8302C"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#FAF7EF"/>

  <!-- Accent dots (aligned with sibling diagram) -->
  <circle cx="80" cy="80" r="4" fill="#E8B657" opacity="0.55"/>
  <circle cx="1120" cy="80" r="4" fill="#E8B657" opacity="0.55"/>
  <circle cx="80" cy="720" r="4" fill="#E8B657" opacity="0.55"/>
  <circle cx="1120" cy="720" r="4" fill="#E8B657" opacity="0.55"/>
  <circle cx="140" cy="660" r="3" fill="#C8302C" opacity="0.5"/>
  <circle cx="1060" cy="140" r="3" fill="#C8302C" opacity="0.5"/>

  <!-- Headline -->
  <text x="600" y="95" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#23282F">Never a black box. Never silent. Never pinned.</text>

  <!-- Footer -->
  <text x="600" y="735" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" font-style="italic" fill="#5A6069">Deterministic status: you always know the state and what it is waiting on.</text>

  <!-- ===== LEFT: lifecycle state strip (no card, no frame) ===== -->
  <!-- brass primary-flow arrow connecting the three rows top-to-bottom -->
  <path d="M150 290 C 120 360, 120 380, 150 440" fill="none" stroke="#E8B657" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150 480 C 120 540, 120 560, 150 610" fill="none" stroke="#E8B657" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowCord)" opacity="0"/>
  <path d="M150 480 C 120 540, 120 560, 150 615" fill="none" stroke="#E8B657" stroke-width="2.5" stroke-linecap="round"/>
  <!-- arrowheads (brass) at end of each segment -->
  <path d="M142 430 L150 446 L158 430 z" fill="#E8B657"/>
  <path d="M142 605 L150 621 L158 605 z" fill="#E8B657"/>

  <!-- connecting ticks -->
  <line x1="200" y1="300" x2="200" y2="430" stroke="#B8BCC3" stroke-width="1"/>
  <line x1="200" y1="475" x2="200" y2="605" stroke="#B8BCC3" stroke-width="1"/>

  <text x="200" y="285" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">🟡 quiet · no turns yet</text>
  <text x="200" y="465" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">⚙️ working since 2m ago</text>
  <text x="200" y="645" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">🟢 idle · last reply 5m ago</text>

  <!-- ===== CENTERPIECE: dark Telegram message card ===== -->
  <g transform="rotate(-1.2 725 415)">
    <rect x="470" y="210" width="510" height="410" rx="14" fill="#14171C" stroke="#EDE7D7" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- quoted user line with left cord accent bar -->
    <rect x="496" y="240" width="3" height="36" fill="#C8302C"/>
    <text x="512" y="263" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#8A8F98">refactor the auth module to use JWT</text>

    <!-- header row -->
    <text x="496" y="312" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="500" fill="#FAF7EF">⚙️ Working…  ·  00:12</text>

    <!-- tool rows -->
    <text x="512" y="346" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF7EF">✅ Read session.ts</text>
    <text x="512" y="372" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF7EF">✅ Grep "cookie"</text>
    <text x="512" y="398" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#FAF7EF">🔵 Edit jwt.ts  ·  00:04</text>

    <!-- sub-agents block -->
    <text x="496" y="440" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#8A8F98">Sub-agents · 2 running</text>
    <text x="528" y="466" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF7EF">🔵 implement · Edit jwt.ts</text>
    <text x="528" y="492" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF7EF">🔵 test-runner · Bash npm test</text>

    <!-- inline Telegram button bottom-right -->
    <rect x="858" y="556" width="96" height="36" rx="8" fill="#23282F" stroke="#5A6069" stroke-width="1"/>
    <text x="906" y="579" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" fill="#FAF7EF">[ Steer ]</text>
  </g>

  <!-- ===== CALLOUTS ===== -->
  <!-- 1 brass -> quoted user message -->
  <line x1="455" y1="258" x2="380" y2="178" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="455" cy="258" r="16" fill="#E8B657" stroke="#B8873A" stroke-width="1.5"/>
  <text x="455" y="263" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">1</text>
  <text x="372" y="166" text-anchor="end" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Quoted user message — anchors the turn</text>

  <!-- 2 brass -> header -->
  <line x1="455" y1="308" x2="372" y2="350" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="455" cy="308" r="16" fill="#E8B657" stroke="#B8873A" stroke-width="1.5"/>
  <text x="455" y="313" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">2</text>
  <text x="364" y="354" text-anchor="end" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Phase + MM:SS elapsed (formatDuration)</text>

  <!-- 3 teal -> a checkmark row -->
  <line x1="1003" y1="345" x2="1090" y2="300" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="1003" cy="345" r="16" fill="#4A9B8E" stroke="#4A9B8E" stroke-width="1.5"/>
  <text x="1003" y="350" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">3</text>
  <text x="1098" y="290" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Completed step</text>
  <text x="1098" y="308" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">edited in place ~1/sec</text>

  <!-- 4 cord -> the in-flight bold row -->
  <line x1="1003" y1="399" x2="1090" y2="420" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="1003" cy="399" r="16" fill="#C8302C" stroke="#C8302C" stroke-width="1.5"/>
  <text x="1003" y="404" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">4</text>
  <text x="1098" y="412" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">In-flight; args sanitised</text>
  <text x="1098" y="430" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">(basename only, secrets redacted)</text>

  <!-- 5 brass -> sub-agents block -->
  <line x1="1003" y1="455" x2="1090" y2="500" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="1003" cy="455" r="16" fill="#E8B657" stroke="#B8873A" stroke-width="1.5"/>
  <text x="1003" y="460" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">5</text>
  <text x="1098" y="492" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Fleet block — ≤5 live rows</text>
  <text x="1098" y="510" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">then +N more; not a (1/N) label</text>

  <!-- 6 cord -> Steer button -->
  <line x1="945" y1="595" x2="1010" y2="640" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="945" cy="595" r="16" fill="#C8302C" stroke="#C8302C" stroke-width="1.5"/>
  <text x="945" y="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">6</text>
  <text x="1018" y="645" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Redirect a long turn mid-flight, no kill</text>

  <!-- 7 teal -> the state strip -->
  <line x1="280" y1="540" x2="220" y2="478" stroke="#8A8F98" stroke-width="1.4" stroke-dasharray="2 4"/>
  <circle cx="280" cy="540" r="16" fill="#4A9B8E" stroke="#4A9B8E" stroke-width="1.5"/>
  <text x="280" y="545" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FAF7EF">7</text>
  <text x="220" y="595" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">Never silent — every topic is</text>
  <text x="220" y="613" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#23282F">always quiet / working / idle</text>

</svg>
