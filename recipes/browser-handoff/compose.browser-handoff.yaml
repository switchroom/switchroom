# Opt-in recipe: a Camofox browser for the ops agent, with human handoff over
# VNC on loopback only.
#
# Layer it over the starter overlay, from the overlay directory:
#
#   docker compose -f compose.yaml -f compose.sidecars.yaml \
#     -f vendor/hermes-fleet/recipes/browser-handoff/compose.browser-handoff.yaml config
#
# Without this file nothing changes: no browser runs, no agent gets
# CAMOFOX_URL and no VNC port is published.
#
# - ops-browser is the public Fleet Camofox image, pinned by digest. It is the
#   ops agent's own browser: one cookie jar, one profile volume. Every route
#   but /health needs the bearer key (CAMOFOX_ACCESS_KEY), and VNC needs
#   VNC_PASSWORD. Without secrets/ops-browser.env Compose refuses to start it.
# - Only ops joins the internal ops-browser network. Other agents cannot
#   resolve or reach the browser.
# - ops-browser-vnc forwards noVNC to 127.0.0.1 on the host and nowhere else.
#   It is the only service on ops-browser-vnc-ingress, which is not internal
#   because Docker publishes ports only from a non-internal network. Reach it
#   from another machine through an SSH tunnel, never by widening the bind.
# - ops-browser-egress lets the browser load the web. No agent joins it.
#
# Secrets (never in git):
#
#   secrets/ops-browser.env:  CAMOFOX_API_KEY=<key>
#                             CAMOFOX_ACCESS_KEY=<the same key>
#                             VNC_PASSWORD=<viewer password, up to 8 characters>
#   secrets/ops.env:          CAMOFOX_API_KEY=<the same key>

services:
  ops:
    environment:
      CAMOFOX_URL: http://ops-browser:9377
    networks:
      - ops-browser

  ops-browser:
    image: ghcr.io/mekenthompson/hermes-fleet-camofox@sha256:641a2799a156bc2dca6300377f36390d837f31e23ba1d1dd40e903c8c4224c17
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: ./secrets/ops-browser.env
        required: true
    environment:
      CAMOFOX_BIND_HOST: 0.0.0.0
      ENABLE_VNC: "1"
      # noVNC listens on the browser's own networks so the forwarder can reach
      # it; the raw VNC port stays on the container's loopback.
      VNC_BIND: 0.0.0.0
      VNC_RFB_BIND: 127.0.0.1
      # A human at the VNC viewer makes no REST calls, so the upstream idle
      # reapers would close the browser under them. These are the largest
      # values upstream accepts; 0 would not mean "never".
      TAB_INACTIVITY_MS: "2147483647"
      SESSION_TIMEOUT_MS: "2147483647"
      BROWSER_IDLE_TIMEOUT_MS: "2147483647"
      CAMOFOX_PROFILE_DIR: /data/profiles
    volumes:
      - ops-browser-profile:/data/profiles
    networks:
      - ops-browser
      - ops-browser-viewer
      - ops-browser-egress

  ops-browser-vnc:
    image: ghcr.io/mekenthompson/hermes-fleet-tcp-proxy@sha256:1b12d2977e98f83b0a4a69b91d97cec1ca52a71950b78841a8dfb64229a60268
    restart: unless-stopped
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      LISTEN_PORT: "6080"
      TARGET: ops-browser:6080
    ports:
      - "127.0.0.1:${OPS_BROWSER_VNC_PORT:-6080}:6080"
    networks:
      - ops-browser-viewer
      - ops-browser-vnc-ingress

volumes:
  ops-browser-profile:

networks:
  ops-browser:
    internal: true
  ops-browser-viewer:
    internal: true
  ops-browser-vnc-ingress:
    driver: bridge
  ops-browser-egress:
    driver: bridge
